  function laneX(i){ var half = Math.min(W*0.34, H*0.26); return W/2 + (i-1)*half*0.64; }

  function spawnRow(wy){
    var want = s.word[s.at];
    var pool = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    var lanes = [null,null,null];
    var right = rndi(0,2);
    lanes[right] = want;
    /* one decoy in one of the other two lanes; the third stays empty so she can
       always drive straight past instead of being forced into a wrong letter */
    var others = [];
    for(var i=0;i<3;i++) if(i!==right) others.push(i);
    var decoy = others[rndi(0,others.length-1)];
    var c;
    do { c = pool[rndi(0,25)]; } while(c === want);
    lanes[decoy] = c;
    s.rows.push({ wy:wy, letters:lanes, hit:[false,false,false], forIndex:s.at });
  }

  function update(dt,t){
    if(s.flash>0) s.flash -= dt;
    if(s.done){
      s.doneT += dt;
      s.speed = Math.max(0, s.speed-260*U/4*dt);
      s.scroll += s.speed*dt;
      updateParts(dt);
      if(s.doneT>3.0 && Scene.go('cheer',{kind:'letters', word:s.word})){
        G.wordIndex++; saveProgress();
      }
      return;
    }
    s.speed = lerp(s.speed, 40*U, 1-Math.pow(0.002,dt));
    s.scroll += s.speed*dt;

    if(P.down){
      s.hint=0;
      var dx = P.x - s.carX;
      s.carX += clamp(dx,-1,1)*Math.min(Math.abs(dx), 380*U/4*dt);
      s.carVX = lerp(s.carVX, dx*0.02, 0.2);
    } else { s.carVX = lerp(s.carVX,0,0.15); }
    s.carX = clamp(s.carX, U*8, W-U*8);
    s.tilt = lerp(s.tilt, clamp(s.carVX*0.05,-0.28,0.28), 0.18);

    var ahead = s.scroll + H*1.25;
    if(s.rows.length===0 || s.nextRowY < ahead){
      if(s.nextRowY < ahead){ spawnRow(s.nextRowY); s.nextRowY += H*0.62; }
    }

    var grab = U*12;
    for(var i=s.rows.length-1;i>=0;i--){
      var r = s.rows[i];
      var sy = H - (r.wy - s.scroll);
      if(sy > H+U*22){ s.rows.splice(i,1); continue; }
      for(var k=0;k<3;k++){
        if(r.hit[k] || !r.letters[k]) continue;
        var lx = laneX(k);
        if(dist2(lx,sy,s.carX,s.carY) < grab*grab){
          r.hit[k]=true;
          hitLetter(r.letters[k], lx, sy, r);
        }
      }
    }
    updateParts(dt);
  }

  function hitLetter(ch, x, y, row){
    var want = s.word[s.at];
    if(ch===want){
      s.at++; s.flash=0.6;
      Audio2.sfx.pickup(s.at-1);
      addStars(3);
      popText(ch, x, y-U*10, '#ff6fae', U*14);
      burst(x,y,16,'#ffd93d',{kind:'star',up:130});

      /* clear the rest of this row so she can't "miss" it after winning */
      row.hit=[true,true,true];
      if(s.at >= s.word.length){
        s.done=true; s.doneT=0;
        setTimeout(function(){
          Audio2.sfx.happy();
          Voice.say('dn_'+s.word);
        },420);
        for(var k=0;k<30;k++){
          spawnPart({x:rnd(0,W), y:rnd(-H*0.25,0), vx:rnd(-40,40), vy:rnd(70,190), g:140,
            life:rnd(1.6,2.8), r:rnd(U*0.9,U*2.0), col:pick(['#ff77b4','#ffd93d','#b98bff','#7ec8ff']),
            kind:'star', spin:rnd(0,TAU), vs:rnd(-5,5)});
        }
      } else {
        Voice.say(['L_'+ch, 'find', 'L_'+s.word[s.at]]);
      }
    } else {
      Audio2.sfx.boop();
      burst(x,y,7,'rgba(255,255,255,0.85)',{up:60});
    }
  }

  function draw(t){
    drawGrassGround(0);
    /* straight path */
    var half = Math.min(W*0.34, H*0.26);
    ctx.fillStyle=C.path;
    ctx.fillRect(W/2-half, 0, half*2, H);
    ctx.strokeStyle=C.pathDark; ctx.lineWidth=U*1.1;
    ctx.beginPath(); ctx.moveTo(W/2-half,0); ctx.lineTo(W/2-half,H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W/2+half,0); ctx.lineTo(W/2+half,H); ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,0.55)'; ctx.lineWidth=U*0.7; ctx.setLineDash([U*3,U*3]);
    for(var L=0;L<2;L++){
      var lx0 = laneX(L)+ (laneX(L+1)-laneX(L))/2;
      ctx.beginPath(); ctx.moveTo(lx0, -((s.scroll)%(U*6))); ctx.lineTo(lx0,H); ctx.stroke();
    }
    ctx.setLineDash([]);

    /* letter tiles */
    for(var i=0;i<s.rows.length;i++){
      var r=s.rows[i];
      var sy = H - (r.wy - s.scroll);
      if(sy<-U*20 || sy>H+U*20) continue;
      for(var k=0;k<3;k++){
        if(r.hit[k] || !r.letters[k]) continue;
        var lx = laneX(k);
        var want = (r.letters[k]===s.word[s.at]);
        var sz = U*8.5;
        ctx.save();
        ctx.translate(lx,sy);
        var pulse = want? 1+Math.sin(t*6)*0.06 : 1;
        ctx.scale(pulse,pulse);
        ctx.fillStyle='rgba(0,0,0,0.15)';
        rr(-sz*0.9, -sz*0.75, sz*1.8, sz*1.8, sz*0.4); ctx.fill();
        ctx.fillStyle = want? '#fff6a8' : '#ffffff';
        rr(-sz*0.9, -sz*0.9, sz*1.8, sz*1.8, sz*0.4); ctx.fill();
        ctx.strokeStyle = want? '#ffb800' : '#ffb3d9';
        ctx.lineWidth = sz*0.16;
        rr(-sz*0.9, -sz*0.9, sz*1.8, sz*1.8, sz*0.4); ctx.stroke();
        bigText(r.letters[k], 0, 0, sz*1.35, want? '#ff6fae':'#8f6fa8');
        ctx.restore();
      }
    }

    drawParts();
    drawCar(s.carX, s.carY, U*19, t, s.tilt);

    if(s.hint>0 && !P.down){
      var a=0.5+0.5*Math.sin(t*4);
      ctx.save(); ctx.globalAlpha=a;
      ctx.strokeStyle='rgba(255,255,255,0.95)'; ctx.lineWidth=U*0.9;
      circle(s.carX, s.carY+U*15, U*5.5+Math.sin(t*4)*U*1.2); ctx.stroke();
      fillCircle(s.carX, s.carY+U*15, U*3.0, 'rgba(255,255,255,0.75)');
      ctx.restore();
    }

    /* the word across the top */
    var n = s.word.length;
    var cell = Math.min(U*13, (W-U*10)/n);
    var x0 = W/2 - (n-1)*cell/2;
    ctx.save();
    ctx.fillStyle='rgba(255,255,255,0.85)';
    rr(W/2-(n*cell)/2-U*2.5, U*3.5, n*cell+U*5, cell*1.25, cell*0.4); ctx.fill();
    for(var q=0;q<n;q++){
      var cx2 = x0 + q*cell, cy2 = U*3.5+cell*0.63;
      if(q < s.at){
        bigText(s.word[q], cx2, cy2, cell*0.85, '#ff6fae', '#ffffff');
      } else if(q===s.at){
        var bump = 1+Math.sin(t*7)*0.10;
        ctx.save(); ctx.translate(cx2,cy2); ctx.scale(bump,bump);
        bigText(s.word[q], 0,0, cell*0.85, '#ffb800', '#ffffff');
        ctx.restore();
      } else {
        bigText(s.word[q], cx2, cy2, cell*0.85, 'rgba(150,120,160,0.30)');
      }
    }
    ctx.restore();
  }
  return { enter:enter, update:update, draw:draw, onResize:onResize };
})();

/* ================================ GOATS =================================== */
/* Three goats, three personalities, three ways to get a flower back:
     MUNCHY  white and greedy      -- hold out an apple or a pear; she trots over and eats it
     FLUFFY  grey and shy          -- pet her: keep a finger on her back until the hearts come
     PEAK    a mountain goat       -- tap her and she leaps onto the rock, picks the flower
                                      growing up there, and brings it down for you
   Tap any goat and it hops and bleats. Nothing can go wrong. */
function drawFruit(x,y,s,kind,rot){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot||0);
  if(kind==='apple'){
    fillCircle(-s*0.38, s*0.05, s*0.72, '#ff4d5e');
    fillCircle( s*0.38, s*0.05, s*0.72, '#ff4d5e');
    fillCircle(0, s*0.18, s*0.78, '#ff4d5e');
    ctx.fillStyle='#7a4b2a'; rr(-s*0.08,-s*0.95, s*0.16, s*0.50, s*0.08); ctx.fill();
    ctx.fillStyle='#6cc04a';
    ctx.beginPath(); ctx.ellipse(s*0.36,-s*0.78, s*0.36, s*0.17, -0.6, 0,TAU); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.45)';
    ctx.beginPath(); ctx.ellipse(-s*0.42,-s*0.28, s*0.22, s*0.14, -0.6, 0,TAU); ctx.fill();
  } else {
    fillCircle(0, s*0.28, s*0.78, '#c9e26b');
    fillCircle(0,-s*0.42, s*0.50, '#c9e26b');
    ctx.fillStyle='#c9e26b'; rr(-s*0.5,-s*0.42, s*1.0, s*0.7, s*0.3); ctx.fill();
    ctx.fillStyle='#7a4b2a'; rr(-s*0.07,-s*1.15, s*0.14, s*0.45, s*0.07); ctx.fill();
    ctx.fillStyle='#6cc04a';
    ctx.beginPath(); ctx.ellipse(s*0.30,-s*0.98, s*0.32, s*0.15, -0.5, 0,TAU); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.45)';
    ctx.beginPath(); ctx.ellipse(-s*0.32, s*0.05, s*0.20, s*0.14, -0.6, 0,TAU); ctx.fill();
  }
  ctx.restore();
}
var GOAT_LOOK = {
  feed:  { coat:'#f6f3ec', leg:'#e3ded5', horn:'#d9b26a' },
  pet:   { coat:'#d8d3cc', leg:'#c4beb4', horn:'#cfae7a' },

function drawGoat(x,y,s,g,t){
  var kind = g.kind||'feed', L = GOAT_LOOK[kind], hop = g.hop||0;
  var eating = g.st==='eat', picking = g.st==='pick', petted = !!g.petting;
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle='rgba(0,0,0,0.14)';
  ctx.beginPath(); ctx.ellipse(0, s*0.98, s*1.5, s*0.34, 0,0,TAU); ctx.fill();
  ctx.translate(0,hop);
  if(g.dir>0) ctx.scale(-1,1);           /* drawn facing left; flipped to face right */
  var trot = g.moving? Math.sin(t*14+(g.t||0)) : 0;
  var bob  = g.moving? Math.abs(Math.sin(t*14+(g.t||0)))*s*0.10 : 0;
  var legL = kind==='climb'? s*0.92 : s*0.80;
  ctx.translate(0,-bob-(legL-s*0.80));
  /* legs */
  ctx.fillStyle=L.leg;
  rr(-s*0.92, s*0.15, s*0.30, legL+trot*s*0.12, s*0.12); ctx.fill();
  rr(-s*0.40, s*0.15, s*0.30, legL-trot*s*0.12, s*0.12); ctx.fill();
  rr( s*0.25, s*0.15, s*0.30, legL-trot*s*0.12, s*0.12); ctx.fill();
  rr( s*0.72, s*0.15, s*0.30, legL+trot*s*0.12, s*0.12); ctx.fill();
  ctx.fillStyle='#6b5b4a';
  rr(-s*0.92, s*0.02+legL+trot*s*0.12, s*0.30, s*0.16, s*0.06); ctx.fill();
  rr(-s*0.40, s*0.02+legL-trot*s*0.12, s*0.30, s*0.16, s*0.06); ctx.fill();
  rr( s*0.25, s*0.02+legL-trot*s*0.12, s*0.30, s*0.16, s*0.06); ctx.fill();
  rr( s*0.72, s*0.02+legL+trot*s*0.12, s*0.30, s*0.16, s*0.06); ctx.fill();
  /* body */
  ctx.fillStyle=L.coat;
  var bh = kind==='feed'? s*1.32 : s*1.18;                 /* Munchy is round */
  rr(-s*1.22, -s*0.78, s*2.35, bh, s*0.55); ctx.fill();
  if(kind==='pet'){                                         /* Fluffy: a woolly back */
    for(var w=0; w<6; w++) fillCircle(-s*1.0+w*s*0.40, -s*0.78+Math.sin(w*1.7)*s*0.04, s*0.30, L.coat);
  }
  if(kind==='climb'){                                       /* Peak: a white chest */
    ctx.fillStyle='#fbf6ea'; ctx.beginPath(); ctx.ellipse(-s*0.85, -s*0.15, s*0.42, s*0.52, 0.3, 0,TAU); ctx.fill();
  }
  ctx.fillStyle='rgba(0,0,0,0.05)';
  ctx.beginPath(); ctx.ellipse(0, s*0.15, s*0.9, s*0.25, 0,0,TAU); ctx.fill();
  /* tail */
  ctx.fillStyle=L.coat;
  ctx.beginPath(); ctx.moveTo(s*1.05,-s*0.55); ctx.lineTo(s*1.45,-s*1.05+Math.sin(t*9)*s*0.1); ctx.lineTo(s*1.15,-s*0.25); ctx.closePath(); ctx.fill();
  /* neck and head */
  var cy = (eating||picking)? -s*0.50 : (kind==='climb'? -s*1.45 : -s*1.30);
  ctx.beginPath(); ctx.moveTo(-s*1.05,-s*0.75); ctx.lineTo(-s*1.55, cy); ctx.lineTo(-s*1.15, cy+s*0.25); ctx.lineTo(-s*0.7,-s*0.3); ctx.closePath(); ctx.fill();
  var chew = eating? 1+Math.abs(Math.sin(t*16))*0.08 : 1;
  ctx.beginPath(); ctx.ellipse(-s*1.60, cy, s*0.58, s*0.46*chew, 0,0,TAU); ctx.fill();
  if(kind==='pet'){ fillCircle(-s*1.55, cy-s*0.42, s*0.26, L.coat); fillCircle(-s*1.80, cy-s*0.36, s*0.20, L.coat); }
  /* ear */
  ctx.beginPath(); ctx.ellipse(-s*1.28, cy-s*0.22, s*0.32, s*0.14, 0.55, 0,TAU); ctx.fill();
  /* horns: Peak's sweep back, big and curved */
  ctx.strokeStyle=L.horn; ctx.lineCap='round';
  if(kind==='climb'){
    ctx.lineWidth=s*0.20;
    ctx.beginPath(); ctx.moveTo(-s*1.45, cy-s*0.40); ctx.quadraticCurveTo(-s*1.30, cy-s*1.25, -s*0.55, cy-s*1.15); ctx.stroke();
    ctx.lineWidth=s*0.16;
    ctx.beginPath(); ctx.moveTo(-s*1.70, cy-s*0.42); ctx.quadraticCurveTo(-s*1.62, cy-s*1.15, -s*0.95, cy-s*1.20); ctx.stroke();
  } else {
    ctx.lineWidth=s*0.13;
    ctx.beginPath(); ctx.moveTo(-s*1.45, cy-s*0.40); ctx.quadraticCurveTo(-s*1.35, cy-s*0.85, -s*1.05, cy-s*0.95); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-s*1.70, cy-s*0.42); ctx.quadraticCurveTo(-s*1.66, cy-s*0.85, -s*1.40, cy-s*1.00); ctx.stroke();
  }
  /* beard, snout, eye */
  ctx.fillStyle=L.leg;
  ctx.beginPath(); ctx.moveTo(-s*1.75, cy+s*0.38); ctx.lineTo(-s*1.55, cy+s*0.40); ctx.lineTo(-s*1.66, cy+s*0.70); ctx.closePath(); ctx.fill();
  fillCircle(-s*2.05, cy+s*0.12, s*0.17, '#f0b0b8');
  if(petted || g.st==='done' && kind==='pet'){
    ctx.strokeStyle=C.ink; ctx.lineWidth=s*0.07;
    ctx.beginPath(); ctx.arc(-s*1.78, cy-s*0.10, s*0.11, Math.PI+0.3, TAU-0.3); ctx.stroke();   /* happy closed eye */
  } else {
    fillCircle(-s*1.78, cy-s*0.12, s*0.085, C.ink);
    fillCircle(-s*1.75, cy-s*0.15, s*0.03, C.white);
    if(kind==='pet'){ ctx.strokeStyle=C.ink; ctx.lineWidth=s*0.04;               /* lashes */
      ctx.beginPath(); ctx.moveTo(-s*1.86, cy-s*0.20); ctx.lineTo(-s*1.94, cy-s*0.28); ctx.stroke(); }
  }
  if(g.st==='done'){ ctx.strokeStyle=C.ink; ctx.lineWidth=s*0.06; ctx.beginPath(); ctx.arc(-s*1.85, cy+s*0.18, s*0.16, 0.3, Math.PI-0.6); ctx.stroke(); }
  /* accessories */
  if(kind==='feed'){                                        /* Munchy: a red collar and a bell */
    ctx.strokeStyle='#e0353f'; ctx.lineWidth=s*0.14;
    ctx.beginPath(); ctx.moveTo(-s*1.32, cy+s*0.42); ctx.lineTo(-s*0.85, cy+s*0.78); ctx.stroke();
    fillCircle(-s*1.08, cy+s*0.68, s*0.14, '#ffd93d'); fillCircle(-s*1.08, cy+s*0.72, s*0.04, '#a67c00');
  }
  if(kind==='pet'){                                         /* Fluffy: a pink bow */
    ctx.fillStyle='#ff6fae';
    ctx.beginPath(); ctx.ellipse(-s*1.10, cy-s*0.58, s*0.22, s*0.14, -0.5, 0,TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-s*1.42, cy-s*0.66, s*0.22, s*0.14,  0.5, 0,TAU); ctx.fill();
    fillCircle(-s*1.26, cy-s*0.62, s*0.08, '#ffd0e4');
  }
  /* the flower, held in the mouth */
  if(g.flower){
    ctx.strokeStyle='#5fc456'; ctx.lineWidth=s*0.09;
    ctx.beginPath(); ctx.moveTo(-s*2.05, cy+s*0.22); ctx.lineTo(-s*2.45, cy+s*0.05); ctx.stroke();
    drawFlower(-s*2.55, cy-s*0.05, s*0.40, g.flower, Math.sin(t*3+(g.t||0))*0.2, false, 0);
  }
  ctx.restore();
}

var Goats = (function(){

                   st:'run', t:rnd(0,TAU), wait:0, hop:0, hopV:0, moving:true, eatT:0, pet:0 });
    s.goats.push({ kind:'pet',   name:'FLUFFY', x:W+U*40, y:f.y0+(f.y1-f.y0)*0.75, tx:0, ty:0, dir:-1, flower:src[1],
                   st:'run', t:rnd(0,TAU), wait:0, hop:0, hopV:0, moving:true, eatT:0, pet:0 });
    s.goats.push({ kind:'climb', name:'PEAK',   x:r.x-r.w*0.9, y:r.y+U*4, tx:r.x-r.w*0.9, ty:r.y+U*4, dir:1, flower:null,
                   st:'wait', t:rnd(0,TAU), wait:0, hop:0, hopV:0, moving:false, eatT:0, pet:0, leap:0 });
    pickTarget(s.goats[0]); pickTarget(s.goats[1]);
    for(var k=0;k<FRUITS.length;k++) s.fruits.push({ kind:FRUITS[k], x:0,y:0,hx:0,hy:0, held:false, gone:false, onGrass:false, goat:null, ph:rnd(0,TAU) });

  function update(dt,t){

        }
      } else {
        /* the NEAREST goat gets the tap -- Munchy wandering past Peak used to swallow it */
        var gg=null, gbd=1e9;
        for(var j=0;j<s.goats.length;j++){ var gq=s.goats[j], gd2=dist2(P.x,P.y,gq.x,gq.y-U*5);
          if(gq.kind==='climb' && gq.st==='wait' && s.rockFlower &&
             P.x>r.x-r.w*0.7 && P.x<r.x+r.w*0.7 && P.y>r.y-r.h-U*8 && P.y<r.y+U*4) gd2=Math.min(gd2, (U*8)*(U*8));
          if(gd2 < (U*15)*(U*15) && gd2<gbd){ gbd=gd2; gg=gq; } }

          {
            if(gg.kind==='climb' && gg.st==='wait' && s.rockFlower){

      g=s.goats[gi]; g.t+=dt; g.petting=false;

      if(g.st==='eat'){ g.eatT-=dt; g.moving=false; if(g.eatT<=0) finishEat(g); continue; }

      if(g.kind==='pet' && g.flower && P.down && !s.drag && dist2(P.x,P.y,g.x,g.y-U*4) < (U*13)*(U*13)){
        var moved = Math.abs(P.x-P.px)+Math.abs(P.y-P.py) > 0.5;

        if(Math.random()<dt*6) spawnPart({x:g.x+rnd(-U*6,U*6), y:g.y-U*10, vx:rnd(-10,10), vy:rnd(-45,-20), g:-20,
          life:rnd(0.7,1.1), r:U*0.9, col:'#ff6fae', kind:'heart'});

        for(var fi=0;fi<s.fruits.length;fi++){ var fr2=s.fruits[fi];
          if(fr2.gone || (!fr2.held && !fr2.onGrass)) continue;

      }
      if(want){ if(!want.goat) want.goat=g; g.tx=want.x+(g.x<want.x?-U*5:U*5); g.ty=clamp(want.y+U*5, f.y0-U*2, f.y1+U*4); }

    g.addColorStop(0,'#d8d3cc'); g.addColorStop(0.5,'#b9b2a8'); g.addColorStop(1,'#8f877c');
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.moveTo(r.x-r.w*0.55, r.y);
    ctx.quadraticCurveTo(r.x-r.w*0.62, r.y-r.h*0.55, r.x-r.w*0.30, r.y-r.h*0.92);
    ctx.quadraticCurveTo(r.x, r.y-r.h*1.08, r.x+r.w*0.34, r.y-r.h*0.90);
    ctx.quadraticCurveTo(r.x+r.w*0.62, r.y-r.h*0.5, r.x+r.w*0.55, r.y);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.35)';
    ctx.beginPath(); ctx.ellipse(r.x-r.w*0.12, r.y-r.h*0.72, r.w*0.16, r.h*0.10, -0.4, 0,TAU); ctx.fill();
    fillCircle(r.x+r.w*0.30, r.y-r.h*0.35, U*2.2, '#6ccc5e');   /* a tuft of grass */
    fillCircle(r.x-r.w*0.42, r.y-r.h*0.15, U*1.8, '#7ad86b');
    if(s.rockFlower){
      var sway=Math.sin(t*1.6)*0.12;
      ctx.strokeStyle='#4fae4a'; ctx.lineWidth=U*0.9; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(r.x, r.y-r.h*0.95); ctx.quadraticCurveTo(r.x+sway*U*6, r.y-r.h-U*4, r.x+sway*U*10, r.y-r.h-U*8); ctx.stroke();
      drawFlower(r.x+sway*U*10, r.y-r.h-U*8, U*3.6, s.rockFlower, Math.sin(t*0.8)*0.15, false, 0);
      if(Math.random()<0.03) spawnPart({x:r.x+rnd(-U*4,U*4), y:r.y-r.h-U*8, vx:rnd(-15,15), vy:rnd(-40,-15), g:-10, life:0.9, r:U*0.6, col:'#fff3b0', kind:'star', spin:rnd(0,TAU), vs:3});
    }
  }

  function drawMountains(t){
    /* three soft ridges, the nearest darkest, and one tall snowy peak */
    var hz=H*0.36, layers=[
      {col:'#c3cdf0', top:0.16, amp:0.05, k:1.7, ph:0.4},
      {col:'#a3b2e6', top:0.21, amp:0.045, k:2.6, ph:2.1},
      {col:'#8598d6', top:0.27, amp:0.035, k:3.4, ph:4.0}
    ];
    for(var L=0; L<layers.length; L++){ var ly=layers[L];
      ctx.fillStyle=ly.col; ctx.beginPath(); ctx.moveTo(0,hz);
      for(var x=0; x<=W; x+=U*3){ var yy=H*ly.top + Math.sin(x/W*Math.PI*ly.k+ly.ph)*H*ly.amp + Math.sin(x/W*Math.PI*ly.k*2.3+ly.ph)*H*ly.amp*0.35; ctx.lineTo(x,yy); }
      ctx.lineTo(W,hz); ctx.closePath(); ctx.fill(); }
    var px=W*0.62, pt=H*0.10;
    ctx.fillStyle='#93a4dd';
    ctx.beginPath(); ctx.moveTo(px-W*0.20,H*0.28); ctx.lineTo(px,pt); ctx.lineTo(px+W*0.20,H*0.28); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#ffffff';
    ctx.beginPath(); ctx.moveTo(px,pt); ctx.lineTo(px+W*0.075,pt+H*0.065); ctx.lineTo(px+W*0.04,pt+H*0.055); ctx.lineTo(px+W*0.01,pt+H*0.075);
    ctx.lineTo(px-W*0.03,pt+H*0.05); ctx.lineTo(px-W*0.075,pt+H*0.065); ctx.closePath(); ctx.fill();
    /* haze where the hills meet the meadow */
    var g=ctx.createLinearGradient(0,H*0.30,0,hz); g.addColorStop(0,'rgba(223,245,255,0)'); g.addColorStop(1,'rgba(223,245,255,0.7)');
    ctx.fillStyle=g; ctx.fillRect(0,H*0.30,W,hz-H*0.30);
  }
  function drawStream(t){
    /* a wide, slow stream down the left edge, with stepping stones and reeds */
    ctx.fillStyle='#7ec8f5';
    ctx.beginPath();
    ctx.moveTo(-U*2, H*0.37); ctx.quadraticCurveTo(W*0.02, H*0.52, -U*1, H*0.70); ctx.quadraticCurveTo(-U*3, H*0.85, W*0.02, H+U*2);
    ctx.lineTo(W*0.14, H+U*2); ctx.quadraticCurveTo(W*0.09, H*0.84, W*0.115, H*0.70); ctx.quadraticCurveTo(W*0.13, H*0.52, W*0.075, H*0.37);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle='#a9dcff'; ctx.lineWidth=U*0.9; ctx.lineCap='round';
    for(var i=0;i<7;i++){ var k=((t*0.12)+i*0.14)%1, yy=H*(0.40+k*0.58), xx=W*(0.03+0.045*Math.sin(k*9+i)) + W*0.02;
      ctx.save(); ctx.globalAlpha=0.9*Math.sin(k*Math.PI); ctx.beginPath(); ctx.moveTo(xx,yy); ctx.lineTo(xx+U*3.5,yy-U*0.6); ctx.stroke(); ctx.restore(); }
    var stones=[[0.045,0.50],[0.075,0.58],[0.04,0.66],[0.07,0.76],[0.05,0.88]];
    for(var st=0; st<stones.length; st++){ var sx=W*stones[st][0], sy=H*stones[st][1];
      fillCircle(sx, sy+U*0.6, U*2.6, 'rgba(60,110,150,0.35)'); fillCircle(sx, sy, U*2.4, '#cfc9c0'); fillCircle(sx-U*0.7, sy-U*0.7, U*0.9, 'rgba(255,255,255,0.55)'); }
    ctx.strokeStyle='#4fae4a'; ctx.lineWidth=U*0.7;
    for(var r=0;r<5;r++){ var rx=W*0.125+r*U*1.4, ry=H*(0.44+r*0.02), sw=Math.sin(t*1.5+r)*U*0.8;
      ctx.beginPath(); ctx.moveTo(rx,ry+U*6); ctx.quadraticCurveTo(rx+sw, ry+U*2, rx+sw*1.6, ry-U*4); ctx.stroke(); }
  }
  function draw(t){
    drawSky(t, '#dff5ff');
    drawMountains(t);
    drawGrassGround(H*0.36);
    drawStream(t);
    /* fence across the back */
    var fy=H*0.36, i, fr;
    for(var x=-U*2; x<W+U*6; x+=U*7){
      ctx.fillStyle='#fff6fb'; rr(x, fy-U*9, U*3.4, U*11, U*1.0); ctx.fill();
      ctx.fillStyle='#ffe3f0'; rr(x, fy-U*9, U*3.4, U*1.6, U*0.8); ctx.fill();
    }
    ctx.fillStyle='#fff6fb'; ctx.fillRect(0, fy-U*6.5, W, U*1.6); ctx.fillRect(0, fy-U*2.8, W, U*1.6);
    fillCircle(W*0.95, H*0.88, U*4.6, '#6ccc5e'); fillCircle(W*1.0, H*0.89, U*3.5, '#7ad86b');
    var r=rock();
    drawRock(r,t);
    /* Lily, hands up when she is holding fruit out */
    drawGirl(W*0.12, H*0.29, U*4.6, {t:t, bob:true, armUp:!!s.drag});
    for(i=0;i<s.fruits.length;i++){ fr=s.fruits[i]; if(fr.gone||fr.held) continue;
      ctx.save(); ctx.globalAlpha=0.2; ctx.fillStyle='#000';
      ctx.beginPath(); ctx.ellipse(fr.x, fr.y+U*4.5, U*4, U*1.1, 0,0,TAU); ctx.fill(); ctx.restore();
      drawFruit(fr.x, fr.y+(fr.onGrass?0:Math.sin(t*2.4+fr.ph)*U*0.8), U*4.2, fr.kind, fr.onGrass?0.3:Math.sin(t+fr.ph)*0.15); }
    var order=s.goats.slice().sort(function(a,b){ return (a.y+(a.hop||0)*0)-(b.y+(b.hop||0)*0); });
    for(i=0;i<order.length;i++){ var gd=order[i]; drawGoat(gd.x, gd.y, U*6.2, gd, t);
      if(gd.kind==='pet' && gd.pet>0 && gd.flower){            /* petting meter: hearts filling */
        var pw=U*12, ph=U*1.6; ctx.fillStyle='rgba(255,255,255,0.7)'; rr(gd.x-pw/2, gd.y-U*19, pw, ph, ph/2); ctx.fill();
        ctx.fillStyle='#ff6fae'; rr(gd.x-pw/2, gd.y-U*19, pw*clamp(gd.pet/PET_NEED,0,1), ph, ph/2); ctx.fill(); } }
    if(s.drag) drawFruit(s.drag.x, s.drag.y, U*5.0, s.drag.kind, Math.sin(t*3)*0.1);
    for(i=0;i<s.flying.length;i++){ var fl=s.flying[i], k=fl.t, e=1-Math.pow(1-k,2);
      drawFlower(lerp(fl.x0,fl.x1,e), lerp(fl.y0,fl.y1,e)-Math.sin(k*Math.PI)*U*14, U*4.5*(1-0.5*k), fl.col, k*4, false, 0); }
    drawParts();
    /* the basket: three slots that fill as the flowers come back */
    ctx.save();
    ctx.fillStyle='rgba(255,255,255,0.82)'; rr(U*4,U*5,U*26,U*11,U*4.6); ctx.fill();
    ctx.fillStyle='#c98a4b'; rr(U*5.6, U*5+U*11*0.34, U*8, U*11*0.52, U*1.2); ctx.fill();
    ctx.strokeStyle='#a86f38'; ctx.lineWidth=U*0.5; ctx.beginPath(); ctx.arc(U*9.6, U*5+U*11*0.36, U*3.0, Math.PI, TAU); ctx.stroke();
    for(i=0;i<3;i++){ var sl=slot(i);
      if(i<s.got.length) drawFlower(sl.x, sl.y, U*1.7, s.got[i], 0, false, 0);
      else { ctx.strokeStyle='rgba(120,90,120,0.35)'; ctx.lineWidth=U*0.35; circle(sl.x, sl.y, U*1.5); ctx.stroke(); } }
    ctx.restore();
    /* nudges, after a moment of nothing happening */
    var nh=nextHint();
    if(nh && !s.drag && !s.done && s.idle>2.5){
      var a=0.35+0.35*Math.sin(t*4);
      ctx.save(); ctx.globalAlpha=a; ctx.strokeStyle='#fff'; ctx.lineWidth=U*1.2;
      if(nh.kind==='feed'){
        var f0=null; for(i=0;i<s.fruits.length;i++){ if(!s.fruits[i].gone && !s.fruits[i].onGrass){ f0=s.fruits[i]; break; } }
        var anyOnGrass=s.fruits.some(function(q){ return q.onGrass&&!q.gone; });
        if(f0 && !anyOnGrass && nh.x<W){ ctx.setLineDash([U*2.2,U*2.2]);
          ctx.beginPath(); ctx.moveTo(f0.x, f0.y-U*7); ctx.quadraticCurveTo((f0.x+nh.x)/2, (f0.y+nh.y)/2-U*12, nh.x, nh.y+U*2); ctx.stroke(); ctx.setLineDash([]); }
      } else if(nh.kind==='pet'){
        /* a hand-sized circle rubbing back and forth over her back */
        var hx=nh.x+Math.sin(t*5)*U*5, hy=nh.y-U*7;
        circle(hx,hy,U*5.5); ctx.stroke(); fillCircle(hx,hy,U*3,'rgba(255,255,255,0.7)');
      } else {
        circle(nh.x, nh.y-U*6, U*8+Math.sin(t*4)*U*1.2); ctx.stroke(); fillCircle(nh.x, nh.y-U*6, U*3, 'rgba(255,255,255,0.7)');
      }
      ctx.restore();
    }
  }
  return { enter:enter, update:update, draw:draw, onResize:onResize, dbg:function(){ return s; } };
})();

/* ================================ NAP TIME ================================ */
/* The game closes itself after PLAY_MINUTES of play: everyone dances, says
   goodbye, and goes to sleep, and the page stays asleep for NAP_MINUTES even
   if it is reopened. A grown-up can wake it by holding the moon for 4 seconds. */
var Nap = (function(){
  var s=null, stars=[];
  for(var i=0;i<40;i++) stars.push({x:Math.random(), y:Math.random()*0.5, r:rnd(0.5,1.4), ph:rnd(0,TAU)});
  function moon(){ return { x:W*0.80, y:H*0.14, r:U*7.5 }; }
  function enter(data){
    s={ t:0, sleep:!!(data&&data.sleep), hold:0, byeI:0, byeAt:[3.8,5.8,7.8], said2:false,
        byes: PEOPLE.map(function(p){ return p.id; }).sort(function(){ return Math.random()-0.5; }).slice(0,3) };
    if(!napActive()){ G.napUntil = Date.now()+NAP_MINUTES*60000; LS.set('nina_nap_until', String(G.napUntil)); }
    G.playT=0; LS.set('nina_playT','0');
    if(s.sleep){ Audio2.stopMusic(); Voice.stop(); }
    else Voice.say('nap');
  }
  function wake(){
    G.napUntil=0; LS.set('nina_nap_until','0'); G.playT=0;
    Audio2.resume(); Audio2.startMusic(); Audio2.sfx.star();
    Scene.go('title');
  }
  function update(dt,t){
    s.t+=dt; updateParts(dt);
    if(!s.sleep){
      if(s.byeI<3 && s.t>s.byeAt[s.byeI]){ Voice.say('bye_'+s.byes[s.byeI]); s.byeI++; }
      if(!s.said2 && s.t>10.2){ s.said2=true; Voice.say('nap2'); }
      if(s.t<10 && Math.random()<dt*3){
        spawnPart({x:rnd(0,W), y:rnd(0,H*0.5), vx:0, vy:rnd(-10,10), g:0, life:rnd(0.8,1.6), r:rnd(U*0.5,U*1.2),
          col:'#fff3b0', kind:'star', spin:rnd(0,TAU), vs:3});
      }
      if(s.t>14.5){ s.sleep=true; s.t=0; Audio2.stopMusic(); Voice.stop(); }
    } else {
      var m=moon();
      if(P.down && dist2(P.x,P.y,m.x,m.y) < (m.r*1.8)*(m.r*1.8)){ s.hold+=dt; if(s.hold>=4){ s.hold=0; wake(); } }
      else s.hold=0;
    }
  }
  function draw(t){
    var k = s.sleep? 1 : clamp(s.t/12, 0, 0.75);   /* evening deepens into night */
    var g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, s.sleep? '#141538' : '#3b2f7a'); g.addColorStop(0.55, s.sleep? '#2a2560' : '#7a55b0'); g.addColorStop(1, s.sleep? '#3a3170' : '#ffb0c8');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    for(var i=0;i<stars.length;i++){ var st=stars[i];
      ctx.save(); ctx.globalAlpha=(0.35+0.65*k)*(0.6+0.4*Math.sin(t*2+st.ph)); fillCircle(st.x*W, st.y*H, U*st.r, '#fff'); ctx.restore(); }
    var m=moon();
    ctx.save(); ctx.globalAlpha=0.35; fillCircle(m.x,m.y,m.r*1.5,'#fff2b0'); ctx.restore();
    fillCircle(m.x,m.y,m.r,'#fff2b0');
    ctx.strokeStyle=C.ink; ctx.lineWidth=m.r*0.09; ctx.lineCap='round';
    if(s.sleep){ /* closed, smiling */
      ctx.beginPath(); ctx.arc(m.x-m.r*0.32, m.y-m.r*0.10, m.r*0.16, 0.2, Math.PI-0.2); ctx.stroke();
      ctx.beginPath(); ctx.arc(m.x+m.r*0.32, m.y-m.r*0.10, m.r*0.16, 0.2, Math.PI-0.2); ctx.stroke();
    } else {
      fillCircle(m.x-m.r*0.32, m.y-m.r*0.12, m.r*0.10, C.ink); fillCircle(m.x+m.r*0.32, m.y-m.r*0.12, m.r*0.10, C.ink);
    }
    ctx.beginPath(); ctx.arc(m.x, m.y+m.r*0.18, m.r*0.28, 0.3, Math.PI-0.3); ctx.stroke();
    if(s.hold>0){ ctx.save(); ctx.globalAlpha=0.6; ctx.strokeStyle='#fff'; ctx.lineWidth=U*0.8;
      ctx.beginPath(); ctx.arc(m.x,m.y,m.r*1.3,-Math.PI/2,-Math.PI/2+TAU*Math.min(1,s.hold/4)); ctx.stroke(); ctx.restore(); }
    /* the ground, in evening light */
    drawGrassGround(H*0.62);
    ctx.fillStyle='rgba(20,20,70,'+(0.25+0.35*k)+')'; ctx.fillRect(0,H*0.62,W,H*0.38);

    if(!s.sleep){
      /* everyone dances: two rows, arms swapping on the beat */
      var ps=Math.min(W,H)*0.058, wide=W>H*1.15;
      for(var p=0;p<PEOPLE.length;p++){
        var row = wide? 0 : (p<4?0:1), col = wide? p : (p<4? p : p-4), n = wide? 7 : (row===0?4:3);
        var px = W*(0.5+(col-(n-1)/2)*(wide?0.13:0.22)), py = H*(wide?0.60:(row===0?0.60:0.74));
        var beat = Math.floor(t*2+p*0.5)%2===0;
        var jump = Math.abs(Math.sin(t*4+p))*U*2.5;
        ctx.save(); ctx.translate(px, py-jump); ctx.rotate(Math.sin(t*4+p)*0.06);
        drawPerson(0,0,ps,PEOPLE[p],t,beat); ctx.restore();
      }
      var lb=Math.floor(t*2)%2===0;
      drawGirl(W*0.22, H*0.90-Math.abs(Math.sin(t*4))*U*3, U*5.4, {t:t, bob:true, armUp:lb});
      ctx.save(); ctx.translate(W*0.78, H*0.92); ctx.rotate(Math.sin(t*4)*0.08); ctx.scale(0.75,0.75); drawCar(0,0,U*17,t,0); ctx.restore();
      drawParts();
      if(s.t>0.4){
        var pop=Math.min(1,(s.t-0.4)/0.35);
        bigText('NAP TIME!', W/2, H*0.30, U*10*pop, '#ffffff', '#8f5fe0');
        bigText('Bye bye, Nina!', W/2, H*0.30+U*9, U*5.2*pop, '#ffe066', '#8f5fe0');
      }
    } else {
      /* asleep: everyone tucked along the grass, z's drifting up */
      ctx.save(); ctx.globalAlpha=0.6;
      var ps2=Math.min(W,H)*0.05, wide2=W>H*1.15;
      for(var q=0;q<PEOPLE.length;q++){
        var row2 = wide2? 0 : (q<4?0:1), col2 = wide2? q : (q<4? q : q-4), n2 = wide2? 7 : (row2===0?4:3);
        drawPerson(W*(0.5+(col2-(n2-1)/2)*(wide2?0.13:0.22)), H*(wide2?0.66:(row2===0?0.66:0.78)), ps2, PEOPLE[q], 0, false, true);
      }
      drawGirl(W*0.5, H*0.90, U*4.4, {t:0, bob:false, armUp:false, asleep:true});
      ctx.restore();
      for(var z=0;z<3;z++){ var zt=(t*0.5+z*0.33)%1;
        ctx.save(); ctx.globalAlpha=1-zt; bigText('z', W*0.5+U*8+zt*U*10, H*0.86-zt*U*22, U*(4+zt*6), '#ffffff', '#8f5fe0'); ctx.restore(); }
      bigText('NAP TIME', W/2, H*0.32, U*10, '#ffffff', '#8f5fe0');
      bigText('See you after your nap!', W/2, H*0.32+U*9, U*4.4, '#e6ddff', '#5a3f9a');
    }
  }
  return { enter:enter, update:update, draw:draw, onResize:function(){} };
})();

/* =============================== STICKERS ================================= */
var STICKERS = ['flower','can','heart','star','rainbow','butterfly','car','gem','goat','apple'];
function drawSticker(kind,x,y,r,t){
  ctx.save(); ctx.translate(x,y);
  fillCircle(0,0,r,'#ffffff');
  ctx.strokeStyle='#ffd0e4'; ctx.lineWidth=r*0.12; circle(0,0,r*0.98); ctx.stroke();
  if(kind==='flower') drawFlower(0,0,r*0.62,FLOWER_COLORS[0],t*0.4,false,0);
  else if(kind==='can') drawCan(r*0.15,0,r*0.5,-0.3);
  else if(kind==='heart') drawHeart(0,0,r*0.7,'#ff5fa3');
  else if(kind==='star') drawStar(0,0,r*0.75,'#ffd93d',t*0.3);
  else if(kind==='car'){ ctx.save(); ctx.scale(0.62,0.62); drawCar(0,0,r*1.6,t,0); ctx.restore(); }
  else if(kind==='gem') drawGem(0,0,r*0.65,290,t*0.3);
  else if(kind==='goat') drawGoat(r*0.1, r*0.05, r*0.30, {dir:-1, kind:'climb', st:'done', moving:false, hop:0, t:0}, t);
  else if(kind==='apple') drawFruit(0, r*0.05, r*0.48, 'apple', 0);
  else if(kind==='butterfly'){
    drawButterfly(0, 0, r*0.42, '#b98bff', Math.abs(Math.sin(t*6)));
  } else { /* rainbow */
    var cols=['#ff6b6b','#ffa552','#ffd93d','#7ee07e','#7ec8ff','#b98bff'];
    for(var i=0;i<cols.length;i++){
      ctx.strokeStyle=cols[i]; ctx.lineWidth=r*0.13;
      ctx.beginPath(); ctx.arc(0,r*0.42,r*0.78-i*r*0.13,Math.PI,TAU); ctx.stroke();
    }
  }
  ctx.restore();
}

/* ================================ CHEER =================================== */
/* The between-rounds reward. Auto-advances -- a 3-year-old should never be
   stuck on a screen waiting to find a button. */
var Cheer = (function(){
  var s=null, s_newSticker=false;
  var LINES = {
    drive:    'You filled the basket!',
    garden:   'The flowers bloomed!',
    deliver:  'They loved your flowers!',
    letters:  'You spelled a word!',
    goats:    'The goats gave them back!'
  };
  var GARDEN_LINES = ['', 'Little sprouts came up!', 'Your plants got bigger!', 'The flowers bloomed!'];
  function enter(data){
    var kind = (data&&data.kind)||'drive';
    /* hand out the stickers she is missing first, so the album on the title
       screen fills up round by round instead of repeating */
    var missing = STICKERS.filter(function(k){ return G.stickers.indexOf(k)<0; });
    var sticker = missing.length? pick(missing) : pick(STICKERS);
    s_newSticker = missing.length>0;
    G.stickers.push(sticker);
    if(G.stickers.length>40) G.stickers = G.stickers.slice(-40);
    saveProgress();
    var line = LINES[kind] || 'Yay!';
    if(kind==='garden' && data && data.target) line = GARDEN_LINES[data.target];
    s = { kind:kind, sticker:sticker, t:0, line:line, data:data||{} };
    Audio2.sfx.star();
    Voice.say('yay'+rndi(0,3));
    for(var k=0;k<24;k++){
      spawnPart({x:W/2+rnd(-U*10,U*10), y:H*0.42, vx:rnd(-200,200), vy:rnd(-320,-90), g:400,
        life:rnd(1.2,2.0), r:rnd(U*0.8,U*1.8), col:pick(['#ff77b4','#ffd93d','#b98bff','#7ec8ff','#ffffff']),
        kind: Math.random()<0.5?'star':'petal', spin:rnd(0,TAU), vs:rnd(-6,6)});
    }
  }
  function update(dt){
    s.t += dt;
    updateParts(dt);
    if(s.t>0.7 && (P.justDown || s.t>3.6)) Scene.next();
  }
  function draw(t){
    drawSky(t,'#ffe9f4');
    drawGrassGround(H*0.70);
    var pop = s.t<0.45? (s.t/0.45) : 1;
    var overshoot = 1 + Math.max(0, Math.sin(clamp(s.t,0,0.6)/0.6*Math.PI))*0.16;
    var r = Math.min(W,H)*0.20*pop*overshoot;
    ctx.save();
    ctx.translate(W/2, H*0.40);
    ctx.rotate(Math.sin(t*1.6)*0.05);
    /* sunburst */
    ctx.save(); ctx.globalAlpha=0.5;
    for(var i=0;i<14;i++){
      var a=i*TAU/14+t*0.4;
      ctx.fillStyle= i%2? 'rgba(255,255,255,0.55)':'rgba(255,214,236,0.55)';
      ctx.beginPath(); ctx.moveTo(0,0);
      ctx.lineTo(Math.cos(a)*r*3.2, Math.sin(a)*r*3.2);
      ctx.lineTo(Math.cos(a+0.22)*r*3.2, Math.sin(a+0.22)*r*3.2);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    drawSticker(s.sticker,0,0,r,t);
    ctx.restore();

    bigText(s.line, W/2, H*0.66, Math.min(U*7.0, W/(s.line.length*0.56)), '#ffffff', '#ff6fae');

    /* Lily cheering */
    drawGirl(W*0.22, H*0.86, U*5.6, {t:t, bob:true, armUp:true});
    ctx.save(); ctx.translate(W*0.80, H*0.88); ctx.scale(0.8,0.8);
    drawCar(0,0,U*17,t,Math.sin(t*2)*0.06); ctx.restore();

    drawParts();
    /* stars earned */
    drawStarCount();
    if(s_newSticker && s.t>0.5){
      bigText('NEW STICKER!', W/2, H*0.40 + r*1.35, U*4.6, '#ffe066', '#e0498d');
    }
    if(s.t>1.4){
      var a2 = 0.4+0.4*Math.sin(t*4);
      ctx.save(); ctx.globalAlpha=a2;
      bigText('tap!', W/2, H*0.955, U*5, '#ffffff', '#ff9dc7');
      ctx.restore();
    }
  }
  return { enter:enter, update:update, draw:draw, onResize:function(){} };
})();

/* ================================ TITLE =================================== */
/* First screen. Any tap starts the music -- iOS requires a gesture. */
var Title = (function(){
  var s=null;
  function enter(){ s={t:0, pulse:0}; }
  function update(dt){
    s.t+=dt; updateParts(dt);
    if(Math.random()<dt*3){
      spawnPart({x:rnd(0,W), y:-U*3, vx:rnd(-15,15), vy:rnd(25,60), g:8,
        life:rnd(3,5), r:rnd(U*0.8,U*1.6), col:pick(FLOWER_COLORS).hex,
        kind:'petal', spin:rnd(0,TAU), vs:rnd(-2,2)});
    }
    if(P.justDown && s.t>0.35){
      Audio2.init(); Audio2.resume(); Audio2.startMusic();
      Voice.warm(); Voice.say('hi');
      Scene.go(CYCLE[G.roundIndex % CYCLE.length]);
    }
  }
  function draw(t){
    drawSky(t,'#ffd9ec');
    drawGrassGround(H*0.56);
    /* butterflies to fill the sky */
    for(var b=0;b<3;b++){
      var bx = W*(0.16+0.30*b) + Math.cos(t*0.8+b*2)*W*0.09;
      var by = H*(0.40+0.045*(b%2)) + Math.sin(t*1.3+b)*U*3;
      drawButterfly(bx, by, U*3.0, FLOWER_COLORS[(b+2)%FLOWER_COLORS.length].hex,
                    Math.abs(Math.sin(t*7+b*1.7)));
    }
    /* flower border along the ground */
    for(var i=0;i<12;i++){
      var fx = (i+0.5)*W/12;
      drawFlower(fx, H*0.56-U*3 - (i%3)*U*2, U*2.6, FLOWER_COLORS[i%FLOWER_COLORS.length],
                 Math.sin(t+i)*0.2, true, U*5);
    }
    drawParts();

    var titleY = H*0.235;
    var sz = Math.min(U*13, W/7.2);
    ctx.save();
    ctx.translate(W/2, titleY);
    ctx.rotate(Math.sin(t*1.1)*0.02);
    bigText("NINA'S", 0, -sz*0.55, sz, '#ffffff', '#ff5fa3');
    bigText('FLOWER', 0,  sz*0.50, sz*0.95, '#ffe066', '#e0498d');
    bigText('GARDEN', 0,  sz*1.48, sz*0.95, '#b98bff', '#6b3fa0');
    ctx.restore();

    /* the car with Lily driving toward you */
    var cy = H*0.70 + Math.sin(t*1.6)*U*1.4;
    var cx = W/2 + Math.sin(t*0.7)*W*0.10;
    drawCar(cx, cy, U*30, t, Math.sin(t*0.7)*0.10);
    drawGirl(cx - U*26, cy - U*7.6, U*6.0, {t:t, bob:true, armUp:true});

    /* tap prompt */
    var a = 0.55+0.45*Math.sin(t*3.2);
    ctx.save(); ctx.globalAlpha=a;
    ctx.fillStyle='#ffffff';
    rr(W/2-U*24, H*0.855, U*48, U*13, U*6.5); ctx.fill();
    ctx.restore();
    bigText('TAP TO PLAY', W/2, H*0.855+U*6.5, U*6.4, '#ff5fa3');

    /* sticker album: one slot per kind, filled as she earns them */
    var have = {}; for(var sk=0; sk<G.stickers.length; sk++) have[G.stickers[sk]] = true;
    var slotR = Math.min(U*4.2, (W-U*8)/(STICKERS.length*2.3));
    var sx0 = W/2 - (STICKERS.length-1)*slotR*2.3/2, syy = H*0.49;
    ctx.save();
    ctx.fillStyle='rgba(255,255,255,0.55)';
    rr(sx0-slotR*1.5, syy-slotR*1.35, (STICKERS.length-1)*slotR*2.3+slotR*3, slotR*2.7, slotR*1.35); ctx.fill();
    for(var si=0; si<STICKERS.length; si++){
      var sxx = sx0 + si*slotR*2.3;
      if(have[STICKERS[si]]) drawSticker(STICKERS[si], sxx, syy, slotR, t);
      else { ctx.strokeStyle='rgba(224,73,141,0.35)'; ctx.lineWidth=slotR*0.12;
             ctx.setLineDash([slotR*0.3, slotR*0.3]); circle(sxx,syy,slotR*0.9); ctx.stroke(); ctx.setLineDash([]); }
    }
    ctx.restore();

    if(G.best>0){
      drawStar(W*0.5-U*10, H*0.955, U*3.2, '#ffd93d', t*0.4);
      bigText('' + G.best, W*0.5+U*2, H*0.955, U*6, '#ffffff', '#ff9dc7');
    }
    if(LS.blocked){
      bigText('(scores not saved here)', W/2, H*0.995-U*1, U*2.6, 'rgba(255,255,255,0.75)');
    }
  }
  return { enter:enter, update:update, draw:draw, onResize:function(){} };
})();
</script>
<script>
"use strict";
/* ============================ scene manager =============================== */
var SCENES = { title:Title, drive:Drive, garden:Garden, deliver:Deliver, letters:Letters, goats:Goats, nap:Nap, cheer:Cheer };

var Scene = {
  cur: 'title',
  fade: 0,          /* 0 = clear, 1 = fully white */
  pending: null,
  pendingData: null,
  go: function(name, data){
    if(this.pending) return false;          /* already leaving; ignore repeats */
    this.pending = name; this.pendingData = data||null;
    return true;
  },
  next: function(){
    if(this.pending) return false;
    G.roundIndex++;
    saveProgress();
    /* the budget is checked between rounds, so a round is never cut off mid-task */
    if(G.playT >= PLAY_MINUTES*60) return this.go('nap');
    return this.go(CYCLE[G.roundIndex % CYCLE.length]);
  },
  onResize: function(){
    var sc = SCENES[this.cur];
    if(sc && sc.onResize) sc.onResize();
  },
  update: function(dt, t){
    if(this.pending){
      this.fade = Math.min(1, this.fade + dt*3.4);
      if(this.fade >= 1){
        PARTS.length = 0;
        this.cur = this.pending;
        var d = this.pendingData;
        this.pending = null; this.pendingData = null;
        SCENES[this.cur].enter(d);
      }
    } else if(this.fade > 0){
      this.fade = Math.max(0, this.fade - dt*3.0);
    }
    SCENES[this.cur].update(dt, t);
  },
  draw: function(t){
    SCENES[this.cur].draw(t);
    if(this.fade > 0){
      ctx.fillStyle = 'rgba(255,245,250,'+this.fade.toFixed(3)+')';
      ctx.fillRect(0,0,W,H);
    }
  }
};

/* ------------------------------ chrome ----------------------------------- */
function soundBtn(){
  var r = Math.max(24, U*6.0);
  return { x: W - r - U*3, y: r + U*3.5, r: r };
}
function drawSoundBtn(){
  var b = soundBtn();
  ctx.save();
  ctx.globalAlpha = 0.85;
  fillCircle(b.x, b.y, b.r, 'rgba(255,255,255,0.9)');
  ctx.strokeStyle = '#ffb3d9'; ctx.lineWidth = b.r*0.12;
  circle(b.x,b.y,b.r*0.94); ctx.stroke();
  var s = b.r*0.52;
  ctx.fillStyle = '#ff5fa3';
  ctx.beginPath();
  ctx.moveTo(b.x-s*0.85, b.y-s*0.35);
  ctx.lineTo(b.x-s*0.35, b.y-s*0.35);
  ctx.lineTo(b.x+s*0.20, b.y-s*0.95);
  ctx.lineTo(b.x+s*0.20, b.y+s*0.95);
  ctx.lineTo(b.x-s*0.35, b.y+s*0.35);
  ctx.lineTo(b.x-s*0.85, b.y+s*0.35);
  ctx.closePath(); ctx.fill();
  if(Audio2.isMuted()){
    ctx.strokeStyle='#ff5fa3'; ctx.lineWidth=b.r*0.16; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(b.x+s*0.45,b.y-s*0.5); ctx.lineTo(b.x+s*1.05,b.y+s*0.5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(b.x+s*1.05,b.y-s*0.5); ctx.lineTo(b.x+s*0.45,b.y+s*0.5); ctx.stroke();
  } else {
    ctx.strokeStyle='#ff5fa3'; ctx.lineWidth=b.r*0.13; ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(b.x+s*0.30, b.y, s*0.60, -0.9, 0.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(b.x+s*0.30, b.y, s*1.00, -0.9, 0.9); ctx.stroke();
  }
  ctx.restore();
}
function drawStarCount(){
  if(G.stars<=0) return;
  var x = W - U*9, y = H - U*8;
  ctx.save();
  ctx.globalAlpha=0.92;
  drawStar(x, y, U*3.6, '#ffd93d', 0);
  bigText(''+G.stars, x - U*4, y, U*5.6, '#ffffff', '#ff9dc7', 'right');
  ctx.restore();
}

/* ============================== main loop ================================= */
var lastT = 0, gameT = 0, framesDrawn = 0;
window.__fbDrive = false;

function frame(ts){
  if(!window.__fbDrive) requestAnimationFrame(frame);
  framesDrawn++; window.state = Scene.cur;
  if(!lastT) lastT = ts;
  var dt = (ts - lastT)/1000;
  lastT = ts;
  if(!(dt>0)) dt = 0.016;
  dt = Math.min(dt, 0.05);           /* a backgrounded tab must not teleport */
  gameT += dt;

  try{
    /* the sound button is checked before the scene sees the tap */
    if(P.justDown && Scene.cur!=='nap'){
      var b = soundBtn();
      if(dist2(P.x,P.y,b.x,b.y) < (b.r*1.35)*(b.r*1.35)){
        Audio2.setMuted(!Audio2.isMuted());
        if(!Audio2.isMuted()){ Audio2.resume(); Audio2.startMusic(); Audio2.sfx.star(); }
        Voice.setOn(!Audio2.isMuted());
        P.justDown = false;
      }
    }

    if(Scene.cur!=='title' && Scene.cur!=='nap'){
      G.playT += dt; G.saveT += dt;
      if(G.saveT > 4){ G.saveT = 0; LS.set('nina_playT', String(Math.round(G.playT))); LS.set('nina_lastPlay', String(Date.now())); }
      /* a round that drags on well past the budget ends anyway */
      if(G.playT > PLAY_MINUTES*60 + 150 && Scene.cur!=='cheer') Scene.go('nap');
    }
    Scene.update(dt, gameT);
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.clearRect(0,0,W,H);
    Scene.draw(gameT);
    if(Scene.cur!=='nap') drawSoundBtn();
    if(Scene.cur!=='cheer' && Scene.cur!=='title' && Scene.cur!=='nap') drawStarCount();
  }catch(err){
    /* never let one bad frame kill the loop */
    if(!window.__reported){
      window.__reported = true;
      window.dispatchEvent(new ErrorEvent('error',{message:(err&&err.message)||'draw error'}));
    }
  }

  P.justDown = false; P.justUp = false;
  P.px = P.x; P.py = P.y;
}

/* ---- boot ---- */
resize();
if(napActive()) Scene.cur='nap';           /* reopened during the nap: stay asleep */
SCENES[Scene.cur].enter(Scene.cur==='nap'? {sleep:true} : undefined);
requestAnimationFrame(frame);

/* rAF is suspended in Low Power Mode and some webviews -- take over on a timer.
   A page opened from Messages can also start life in a background tab, where
   rAF is legitimately asleep; re-arm the check each time it comes to the front
   so a genuinely broken rAF is still caught on the second look. */
function armFallback(){
  if(window.__fbDrive) return;
  var seen = framesDrawn;
  setTimeout(function(){
    if(window.__fbDrive) return;
    if(framesDrawn > seen || document.visibilityState !== 'visible') return;
    window.__fbDrive = true;
    setInterval(function(){
      if(document.visibilityState === 'visible'){
        frame((window.performance && performance.now)? performance.now() : (gameT*1000+33));
      }
    }, 33);
  }, 900);
}
armFallback();
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'visible') armFallback();
});

/* watchdog: if nothing ever paints, say so on screen instead of showing black */
setTimeout(function(){
  if(framesDrawn > 2 || document.visibilityState !== 'visible') return;
  var el = document.getElementById('errbox');
  if(!el){
    el = document.createElement('div'); el.id='errbox';
    el.setAttribute('style','position:fixed;left:8px;right:8px;bottom:8px;z-index:99999;background:#fff;color:#900;font:14px/1.4 -apple-system,sans-serif;padding:10px;border:3px solid #900;border-radius:10px;white-space:pre-wrap');
    document.body.appendChild(el);
  }
  el.textContent = 'The game did not start.\ncanvas '+cv.width+'x'+cv.height+'  view '+W+'x'+H+'  frames '+framesDrawn+
                   '\nPlease screenshot this and send it to Daddy.';
  el.hidden=false;
}, 2600);
</script>
