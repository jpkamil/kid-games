<script>
/* ---- boot guard: error reporter FIRST so a boot failure is visible ---- */
window.addEventListener('error',function(ev){
  try{
    var el=document.getElementById('errbox');
    if(!el){ el=document.createElement('div'); el.id='errbox';
      el.setAttribute('style','position:fixed;left:8px;right:8px;bottom:8px;z-index:99999;background:#fff;color:#900;font:14px/1.4 -apple-system,sans-serif;padding:10px;border:3px solid #900;border-radius:10px;white-space:pre-wrap');
      (document.body||document.documentElement).appendChild(el); }
    el.textContent='Oops: '+(ev.message||'error')+'\nline '+(ev.lineno||'?')+' col '+(ev.colno||'?');
    el.hidden=false;
  }catch(e){}
});

/* ---- storage shim: Safari THROWS on localStorage inside a cross-site iframe ---- */
var LS=(function(){
  var ok=false, mem={};
  try{ window.localStorage.setItem('__t','1'); window.localStorage.removeItem('__t'); ok=true; }catch(e){}
  return {
    blocked:!ok,
    get:function(k){ try{ return ok?localStorage.getItem(k):(k in mem?mem[k]:null); }catch(e){ return (k in mem)?mem[k]:null; } },
    set:function(k,v){ try{ if(ok){localStorage.setItem(k,String(v));} else {mem[k]=String(v);} }catch(e){ mem[k]=String(v); } }
  };
})();

/* ---- own the viewport even if a host controls <head> ---- */
(function(){
  function meta(n,c){ var m=document.querySelector('meta[name="'+n+'"]');
    if(!m){ m=document.createElement('meta'); m.setAttribute('name',n);
      (document.head||document.documentElement).appendChild(m); }
    m.setAttribute('content',c); }
  meta('viewport','width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover');
  meta('apple-mobile-web-app-capable','yes');
  meta('apple-mobile-web-app-status-bar-style','black-translucent');
  meta('apple-mobile-web-app-title',"Nina's Game");
  meta('theme-color','#ffd9ec');
})();
</script>

   One self-contained file. No network, no accounts, no text to read.
   ========================================================================== */

/* ---------------------------- tiny helpers ------------------------------ */
var TAU = Math.PI*2;
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function rnd(a,b){ return a+Math.random()*(b-a); }
function rndi(a,b){ return Math.floor(rnd(a,b+1)); }
function pick(arr){ return arr[rndi(0,arr.length-1)]; }
function dist2(ax,ay,bx,by){ var dx=ax-bx, dy=ay-by; return dx*dx+dy*dy; }

/* ------------------------------- audio ---------------------------------- */
/* iOS: the AudioContext must be created/resumed inside a user gesture.
   Every call is wrapped -- a dead speaker must never stop the game. */
var Audio2 = (function(){
  var ctx=null, master=null, musicGain=null, sfxGain=null, voiceGain=null;
  var MUSIC_UP = 0.22, MUSIC_DUCK = 0.07;
  var muted = (LS.get('nina_muted')==='1');
  var started=false, musicTimer=null, nextNoteAt=0, step=0;

  function init(){
    if(ctx) return true;
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return false;
      ctx = new AC();
      master = ctx.createGain(); master.gain.value = muted?0:0.9; master.connect(ctx.destination);
      musicGain = ctx.createGain(); musicGain.gain.value = MUSIC_UP; musicGain.connect(master);
      sfxGain = ctx.createGain(); sfxGain.gain.value = 0.55; sfxGain.connect(master);
      voiceGain = ctx.createGain(); voiceGain.gain.value = 1.0; voiceGain.connect(master);
      return true;
    }catch(e){ ctx=null; return false; }
  }
  function resume(){
    try{ if(!init()) return; if(ctx.state==='suspended') ctx.resume(); }catch(e){}
  }
  function setMuted(m){
    muted=m; LS.set('nina_muted', m?'1':'0');
    try{ if(master) master.gain.setTargetAtTime(m?0:0.9, ctx.currentTime, 0.05); }catch(e){}
  }
  function isMuted(){ return muted; }

  /* one soft note */
  function note(freq, when, dur, type, vol, dest){
    try{
      if(!ctx) return;
      var o=ctx.createOscillator(), g=ctx.createGain();
      o.type = type||'sine'; o.frequency.value = freq;
      var v = (vol===undefined?0.5:vol);
      g.gain.setValueAtTime(0.0001, when);
      g.gain.exponentialRampToValueAtTime(v, when+0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, when+dur);
      o.connect(g); g.connect(dest||sfxGain);
      o.start(when); o.stop(when+dur+0.05);
    }catch(e){}
  }
  function noise(when, dur, vol, freq){
    try{
      if(!ctx) return;
      var n = Math.floor(ctx.sampleRate*dur);
      var buf = ctx.createBuffer(1, n, ctx.sampleRate);
      var d = buf.getChannelData(0);
      for(var i=0;i<n;i++){ d[i] = (Math.random()*2-1) * (1-i/n); }
      var src = ctx.createBufferSource(); src.buffer = buf;
      var bp = ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=freq||1400; bp.Q.value=0.9;
      var g = ctx.createGain(); g.gain.value = vol===undefined?0.3:vol;
      src.connect(bp); bp.connect(g); g.connect(sfxGain);
      src.start(when);
    }catch(e){}
  }

  /* ---- sound effects ---- */
  var SFX = {
    pickup: function(n){
      if(!ctx) return; var t=ctx.currentTime;
      var scale=[523.25,587.33,659.25,783.99,880,1046.5];
      var f = scale[Math.min(n||0, scale.length-1)];
      note(f, t, 0.30, 'sine', 0.45);
      note(f*2, t+0.02, 0.20, 'sine', 0.16);
    },
    gem: function(){
      if(!ctx) return; var t=ctx.currentTime;
      note(1318.5,t,0.12,'triangle',0.3); note(1760,t+0.06,0.12,'triangle',0.3); note(2093,t+0.12,0.22,'triangle',0.25);
    },
    candy: function(){
      if(!ctx) return; var t=ctx.currentTime;
      note(880,t,0.10,'square',0.14); note(1174.7,t+0.07,0.16,'square',0.12);
    },
    water: function(){
      if(!ctx) return; var t=ctx.currentTime;
      noise(t,0.18,0.20,rnd(900,1800));
    },
    grow: function(stage){
      if(!ctx) return; var t=ctx.currentTime;
      var base=[392,493.88,659.25][clamp(stage,0,2)];
      note(base,t,0.28,'sine',0.4); note(base*1.5,t+0.08,0.30,'sine',0.22);
    },
    bloom: function(){
      if(!ctx) return; var t=ctx.currentTime;
      [523.25,659.25,783.99,1046.5].forEach(function(f,i){ note(f,t+i*0.07,0.45,'sine',0.34); });
    },
    happy: function(){
      if(!ctx) return; var t=ctx.currentTime;
      [523.25,659.25,783.99,1046.5,1318.5].forEach(function(f,i){
        note(f,t+i*0.09,0.55,'triangle',0.30); note(f*0.5,t+i*0.09,0.55,'sine',0.16); });
    },
    boop: function(){
      if(!ctx) return; var t=ctx.currentTime;
      note(392,t,0.14,'sine',0.22); note(311.13,t+0.09,0.18,'sine',0.18);
    },
    star: function(){
      if(!ctx) return; var t=ctx.currentTime;
      [1046.5,1318.5,1567.98,2093].forEach(function(f,i){ note(f,t+i*0.06,0.35,'sine',0.26); });
    },
    engine: function(){
      if(!ctx) return; var t=ctx.currentTime;
      note(140,t,0.5,'sawtooth',0.05); note(210,t+0.1,0.4,'sawtooth',0.03);
    }
  };

  /* ---- gentle looping music: C major pentatonic lullaby ---- */
  var MEL = [
    72,76,79,76, 74,72,74,-1,  71,74,79,76, 72,-1,-1,-1,
    72,79,84,79, 76,74,72,-1,  69,72,76,74, 72,-1,-1,-1
  ];
  var BASS = [48,-1,55,-1, 53,-1,55,-1, 47,-1,55,-1, 48,-1,-1,-1,
              48,-1,55,-1, 53,-1,57,-1, 45,-1,52,-1, 48,-1,-1,-1];
  function mtof(m){ return 440*Math.pow(2,(m-69)/12); }
  var SPB = 0.30; /* seconds per 8th-note step */

  function schedule(){
    try{
      if(!ctx || muted) { return; }
      var now = ctx.currentTime;
      while(nextNoteAt < now + 0.35){
        var i = step % MEL.length;
        var m = MEL[i];
        if(m>=0){
          note(mtof(m), nextNoteAt, 0.55, 'sine', 0.30, musicGain);
          note(mtof(m+12), nextNoteAt, 0.35, 'triangle', 0.07, musicGain);
        }
        var b = BASS[i];
        if(b>=0){ note(mtof(b), nextNoteAt, 0.65, 'sine', 0.30, musicGain); }
        if(i%4===0){ noise(nextNoteAt, 0.05, 0.035, 6000); }
        nextNoteAt += SPB; step++;
      }
    }catch(e){}
  }
  function startMusic(){
    if(!init()) return;
    resume();
    if(started) return;
    started = true;
    try{ nextNoteAt = ctx.currentTime + 0.1; }catch(e){}
    musicTimer = setInterval(schedule, 120);
  }
  function stopAll(){
    try{ if(ctx && ctx.state==='running') ctx.suspend(); }catch(e){}
  }
  document.addEventListener('visibilitychange', function(){
    try{
      if(document.visibilityState!=='visible'){ stopAll(); }
      else if(started && !muted){ resume(); nextNoteAt = ctx?ctx.currentTime+0.1:0; }
    }catch(e){}
  });

  /* drop the music under the narration so a 3-year-old can hear the words */
  function duck(seconds){
    try{
      if(!ctx || !musicGain) return;
      musicGain.gain.cancelScheduledValues(ctx.currentTime);
      musicGain.gain.setTargetAtTime(MUSIC_DUCK, ctx.currentTime, 0.06);
      musicGain.gain.setTargetAtTime(MUSIC_UP, ctx.currentTime + Math.max(0.2, seconds), 0.35);
    }catch(e){}
  }
  return { init:init, resume:resume, startMusic:startMusic, sfx:SFX, duck:duck,
           setMuted:setMuted, isMuted:isMuted,
           rawCtx:function(){ return ctx; }, voiceDest:function(){ return voiceGain; } };
})();

/* ------------------------------- voice ----------------------------------- */
/* Ms-Rachel-ish narration: names the colour, counts the flowers, says the
   letter.  These are real recorded clips baked into the file -- the browser's
   own speech synthesis sounds robotic on iOS and differs on every device.
   If audio is unavailable for any reason the game simply plays silent. */
var Voice = (function(){
  var bufs = {}, jobs = {}, live = [], epoch = 0;
  var on = (LS.get('nina_voice') !== '0');

  function b64ToBuf(b64){
    var bin = atob(b64), n = bin.length, a = new Uint8Array(n);
    for(var i=0;i<n;i++) a[i] = bin.charCodeAt(i);
    return a.buffer;
  }
  function decode(id){
    if(bufs[id]) return Promise.resolve(bufs[id]);
    if(jobs[id]) return jobs[id];
    var ctx = Audio2.rawCtx();
    if(!ctx || typeof VOICE_CLIPS==='undefined' || !VOICE_CLIPS[id]) return Promise.resolve(null);
    jobs[id] = new Promise(function(res){
      try{
        var ab = b64ToBuf(VOICE_CLIPS[id]);
        var p = ctx.decodeAudioData(ab, function(b){ bufs[id]=b; res(b); }, function(){ res(null); });
        if(p && p.then) p.then(function(b){ bufs[id]=b; res(b); }, function(){ res(null); });
      }catch(e){ res(null); }
    });
    return jobs[id];
  }
  /* warm the cache in the background once the context exists, a few at a time
     so decoding never competes with the first frames */
  function warm(){
    if(typeof VOICE_CLIPS==='undefined' || !Audio2.rawCtx()) return;
    var ids = Object.keys(VOICE_CLIPS), i = 0;
    (function step(){
      var n = 0;
      while(i < ids.length && n < 6){ decode(ids[i++]); n++; }
      if(i < ids.length) setTimeout(step, 120);
    })();
  }
  function stop(){
    for(var i=0;i<live.length;i++){ try{ live[i].stop(); }catch(e){} }
    live.length = 0;
  }
  function say(ids, gap){
    if(!on) return;
    var ctx = Audio2.rawCtx();
    if(!ctx) return;
    if(typeof ids === 'string') ids = [ids];
    var mine = ++epoch;
    stop();
    try{
      Promise.all(ids.map(decode)).then(function(bs){
        if(mine !== epoch) return;
        var t = ctx.currentTime + 0.04, total = 0;
        for(var i=0;i<bs.length;i++){
          var b = bs[i]; if(!b) continue;
          var src = ctx.createBufferSource();
          src.buffer = b; src.connect(Audio2.voiceDest() || ctx.destination);
          src.start(t); live.push(src);
          var step2 = b.duration + (gap===undefined?0.10:gap);
          t += step2; total += step2;
        }
        if(total > 0) Audio2.duck(total);
      });
    }catch(e){}
  }
  return {
    say: say, warm: warm, stop: stop,
    isOn: function(){ return on; },
    setOn: function(v){ on = v; LS.set('nina_voice', v?'1':'0'); if(!v) stop(); }
  };
})();
</script>
<script>
"use strict";
/* --------------------------- canvas + sizing ----------------------------- */
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var W=0, H=0, DPR=1, U=4;   /* U = layout unit, ~1% of the short side */

function resize(){
  W = Math.max(1, window.innerWidth  || document.documentElement.clientWidth  || 320);
  H = Math.max(1, window.innerHeight || document.documentElement.clientHeight || 480);
  DPR = Math.min(2, window.devicePixelRatio || 1);   /* DPR-3 buys nothing */
  cv.width  = Math.round(W*DPR);
  cv.height = Math.round(H*DPR);
  cv.style.width  = W+'px';                          /* CSS size too, or Safari */
  cv.style.height = H+'px';                          /* uses the attribute size */
  ctx.setTransform(DPR,0,0,DPR,0,0);
  U = Math.min(W,H)/100;
  if(typeof Scene!=='undefined' && Scene.onResize) Scene.onResize();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize,180); });

/* ------------------------------- input ----------------------------------- */
/* One finger, anywhere. Touch = the whole control scheme. */
var P = { down:false, x:0, y:0, px:0, py:0, justDown:false, justUp:false, id:null };

function setPos(e){
  var r = cv.getBoundingClientRect();
  P.x = e.clientX - r.left;
  P.y = e.clientY - r.top;
}
function onDown(e){
  if(P.down) return;
  P.id = e.pointerId; P.down = true; P.justDown = true;
  setPos(e); P.px=P.x; P.py=P.y;
  Audio2.resume();
  try{ cv.setPointerCapture(e.pointerId); }catch(err){}
}
function onMove(e){ if(!P.down || (P.id!==null && e.pointerId!==P.id)) return; setPos(e); }
function onUp(e){
  if(P.id!==null && e.pointerId!==P.id) return;
  P.down = false; P.justUp = true; P.id = null;
}
cv.addEventListener('pointerdown', onDown);
cv.addEventListener('pointermove', onMove);
window.addEventListener('pointerup', onUp);
window.addEventListener('pointercancel', onUp);
/* stop Safari scrolling / rubber-banding; passive:false or preventDefault is ignored */
cv.addEventListener('touchstart', function(e){ e.preventDefault(); }, {passive:false});
cv.addEventListener('touchmove',  function(e){ e.preventDefault(); }, {passive:false});
document.addEventListener('gesturestart', function(e){ e.preventDefault(); }, {passive:false});
document.addEventListener('dblclick', function(e){ e.preventDefault(); }, {passive:false});

/* ----------------------------- palette ----------------------------------- */
var C = {
  sky1:'#bfe9ff', sky2:'#e8f7ff',
  grass1:'#93dc7c', grass2:'#7ecb66',
  path:'#e6d3b3', pathDark:'#d6c09c',
  pink:'#ff6fae', pinkDark:'#e0498d', pinkLight:'#ffa8cd',
  skin:'#ffd9b8', hair:'#7b4a24', hairDark:'#5e3418',
  white:'#ffffff', ink:'#4a3a52', sun:'#ffe66d'
};
var FLOWER_COLORS = [
  {name:'pink',   hex:'#ff77b4', dark:'#e04f95'},
  {name:'yellow', hex:'#ffd93d', dark:'#e8b800'},
  {name:'purple', hex:'#b98bff', dark:'#8f5fe0'},
  {name:'red',    hex:'#ff6b6b', dark:'#e04545'},
  {name:'blue',   hex:'#7ec8ff', dark:'#4aa3e0'},
  {name:'orange', hex:'#ffa552', dark:'#e88320'},
  {name:'white',  hex:'#ffffff', dark:'#d8d8e8'}
];

/* --------------------------- draw primitives ------------------------------ */
function rr(x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function circle(x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.closePath(); }
function fillCircle(x,y,r,col){ ctx.fillStyle=col; circle(x,y,r); ctx.fill(); }

/* a flower: petals + centre, optional stem. size = petal radius */
function drawFlower(x,y,size,col,rot,withStem,stemH){
  ctx.save(); ctx.translate(x,y);
  if(withStem){
    ctx.strokeStyle='#4fae4a'; ctx.lineWidth=Math.max(2,size*0.28); ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(size*0.3,stemH*0.5,0,stemH); ctx.stroke();
    ctx.fillStyle='#5fc456';
    ctx.beginPath(); ctx.ellipse(size*0.7, stemH*0.55, size*0.62, size*0.32, -0.5, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-size*0.7, stemH*0.75, size*0.55, size*0.28, 0.5, 0, TAU); ctx.fill();
  }
  ctx.rotate(rot||0);
  for(var i=0;i<6;i++){
    var a = i*TAU/6;
    ctx.fillStyle = col.hex;
    ctx.beginPath();
    ctx.ellipse(Math.cos(a)*size*0.82, Math.sin(a)*size*0.82, size*0.62, size*0.46, a, 0, TAU);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath();
    ctx.ellipse(Math.cos(a)*size*0.95, Math.sin(a)*size*0.95, size*0.28, size*0.20, a, 0, TAU);
    ctx.fill();
  }
  fillCircle(0,0,size*0.5,'#ffe066');
  fillCircle(-size*0.12,-size*0.12,size*0.22,'#fff3b0');
  ctx.restore();
}

function drawGem(x,y,size,hue,spin){
  ctx.save(); ctx.translate(x,y); ctx.rotate(spin||0);
  var g = ctx.createLinearGradient(-size,-size,size,size);
  g.addColorStop(0,'hsl('+hue+',100%,86%)');
  g.addColorStop(0.5,'hsl('+hue+',95%,66%)');
  g.addColorStop(1,'hsl('+hue+',90%,48%)');
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.moveTo(0,-size); ctx.lineTo(size*0.86,-size*0.2);
  ctx.lineTo(0,size); ctx.lineTo(-size*0.86,-size*0.2);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.85)'; ctx.lineWidth=Math.max(1.5,size*0.13); ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.7)';
  ctx.beginPath(); ctx.moveTo(-size*0.2,-size*0.6); ctx.lineTo(size*0.12,-size*0.55);
  ctx.lineTo(-size*0.05,-size*0.1); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawCandy(x,y,size,hue,spin){
  ctx.save(); ctx.translate(x,y); ctx.rotate(spin||0);
  ctx.fillStyle='hsl('+hue+',90%,70%)';
  ctx.beginPath(); ctx.moveTo(-size*1.7,-size*0.75); ctx.lineTo(-size*0.85,0); ctx.lineTo(-size*1.7,size*0.75); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(size*1.7,-size*0.75); ctx.lineTo(size*0.85,0); ctx.lineTo(size*1.7,size*0.75); ctx.closePath(); ctx.fill();
  fillCircle(0,0,size,'hsl('+hue+',95%,62%)');
  ctx.strokeStyle='rgba(255,255,255,0.9)'; ctx.lineWidth=Math.max(1.5,size*0.22); ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(0,0,size*0.55,-1.2,0.6); ctx.stroke();
  ctx.restore();
}

function drawStar(x,y,r,col,spin){
  ctx.save(); ctx.translate(x,y); ctx.rotate(spin||0);
  ctx.fillStyle=col||'#ffd93d'; ctx.beginPath();
  for(var i=0;i<10;i++){
    var a = -Math.PI/2 + i*Math.PI/5;
    var rad = (i%2===0)? r : r*0.45;
    if(i===0) ctx.moveTo(Math.cos(a)*rad, Math.sin(a)*rad);
    else ctx.lineTo(Math.cos(a)*rad, Math.sin(a)*rad);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawButterfly(x,y,sz,col,flap){
  ctx.save(); ctx.translate(x,y);
  for(var side=-1; side<=1; side+=2){
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.ellipse(side*sz*1.00, -sz*0.35, sz*0.80*flap+sz*0.46, sz*0.72, side*-0.32, 0, TAU);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(side*sz*0.86,  sz*0.48, sz*0.55*flap+sz*0.32, sz*0.50, side*0.34, 0, TAU);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.beginPath();
    ctx.ellipse(side*sz*1.12, -sz*0.42, sz*0.30*flap+sz*0.16, sz*0.24, side*-0.32, 0, TAU);
    ctx.fill();
  }
  ctx.fillStyle = C.ink;
  rr(-sz*0.15, -sz*0.78, sz*0.30, sz*1.65, sz*0.15); ctx.fill();
  ctx.strokeStyle = C.ink; ctx.lineWidth = Math.max(1, sz*0.09); ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-sz*0.08,-sz*0.72); ctx.lineTo(-sz*0.45,-sz*1.18); ctx.stroke();
  ctx.beginPath(); ctx.moveTo( sz*0.08,-sz*0.72); ctx.lineTo( sz*0.45,-sz*1.18); ctx.stroke();
  ctx.restore();
}

function drawHeart(x,y,s,col){
  ctx.save(); ctx.translate(x,y); ctx.fillStyle=col||C.pink;
  ctx.beginPath();
  ctx.moveTo(0,s*0.85);
  ctx.bezierCurveTo(-s*1.4,-s*0.2,-s*0.55,-s*1.1,0,-s*0.35);
  ctx.bezierCurveTo(s*0.55,-s*1.1,s*1.4,-s*0.2,0,s*0.85);
  ctx.closePath(); ctx.fill(); ctx.restore();
}

/* ------------------------------ the girl ---------------------------------- */
/* Lily: long brown hair. size = head radius. */
function drawGirl(x,y,size,opt){
  opt = opt||{};
  var t = opt.t||0;
  ctx.save(); ctx.translate(x,y);
  if(opt.flip) ctx.scale(-1,1);
  var bob = opt.bob? Math.sin(t*5)*size*0.06 : 0;
  ctx.translate(0,bob);

  var bodyTop = size*0.85;
  /* long hair behind */
  ctx.fillStyle=C.hairDark;
  ctx.beginPath();
  ctx.ellipse(0, size*0.9, size*1.25, size*1.75, 0, 0, TAU);
  ctx.fill();

  if(!opt.noBody){
    /* dress */
    ctx.fillStyle = opt.dress || C.pink;
    ctx.beginPath();
    ctx.moveTo(-size*0.55, bodyTop);
    ctx.lineTo(size*0.55, bodyTop);
    ctx.lineTo(size*1.15, bodyTop+size*1.7);
    ctx.lineTo(-size*1.15, bodyTop+size*1.7);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.35)';
    ctx.beginPath(); ctx.ellipse(0, bodyTop+size*1.6, size*1.1, size*0.28, 0,0,TAU); ctx.fill();
    /* legs */
    ctx.fillStyle=C.skin;
    rr(-size*0.55, bodyTop+size*1.6, size*0.4, size*0.85, size*0.2); ctx.fill();
    rr( size*0.15, bodyTop+size*1.6, size*0.4, size*0.85, size*0.2); ctx.fill();
    /* shoes */
    ctx.fillStyle='#ff4f95';
    rr(-size*0.66, bodyTop+size*2.32, size*0.62, size*0.32, size*0.15); ctx.fill();
    rr( size*0.06, bodyTop+size*2.32, size*0.62, size*0.32, size*0.15); ctx.fill();
  }

  /* head */
  fillCircle(0,0,size,C.skin);
  /* hair front: fringe + side sweeps */
  ctx.fillStyle=C.hair;
  ctx.beginPath();
  ctx.arc(0,0,size*1.04, Math.PI*1.02, Math.PI*1.98);
  ctx.quadraticCurveTo(size*0.4,-size*0.32, 0,-size*0.18);
  ctx.quadraticCurveTo(-size*0.4,-size*0.32, -size*1.02,-size*0.15);
  ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-size*0.95, size*0.45, size*0.34, size*1.05, 0.12, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse( size*0.95, size*0.45, size*0.34, size*1.05,-0.12, 0, TAU); ctx.fill();
  /* hair bow */
  ctx.fillStyle=opt.bow||'#ff4f95';
  ctx.beginPath(); ctx.ellipse(-size*0.78,-size*0.62, size*0.34, size*0.24, -0.6, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-size*1.12,-size*0.86, size*0.30, size*0.21, -0.6, 0, TAU); ctx.fill();
  fillCircle(-size*0.95,-size*0.74, size*0.13, '#ffd0e4');

  /* face */
  var blink = (Math.sin(t*1.7+1.1)>0.965);
  ctx.fillStyle=C.ink;
  if(blink){
    ctx.lineWidth=size*0.09; ctx.strokeStyle=C.ink; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-size*0.48,-size*0.06); ctx.lineTo(-size*0.18,-size*0.06); ctx.stroke();
    ctx.beginPath(); ctx.moveTo( size*0.18,-size*0.06); ctx.lineTo( size*0.48,-size*0.06); ctx.stroke();
  } else {
    fillCircle(-size*0.33,-size*0.08,size*0.15,C.ink);
    fillCircle( size*0.33,-size*0.08,size*0.15,C.ink);
    fillCircle(-size*0.28,-size*0.14,size*0.06,C.white);
    fillCircle( size*0.38,-size*0.14,size*0.06,C.white);
  }
  fillCircle(-size*0.58, size*0.22, size*0.16, 'rgba(255,140,180,0.5)');
  fillCircle( size*0.58, size*0.22, size*0.16, 'rgba(255,140,180,0.5)');
  ctx.strokeStyle=C.ink; ctx.lineWidth=size*0.10; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(0,size*0.18,size*0.34, 0.35, Math.PI-0.35); ctx.stroke();

  /* arms go on last -- drawn any earlier and the long hair hides them */
  if(!opt.noBody){
    var armA = opt.armUp? -1.0 : 0.30;
    var sx0 = size*0.62, sy0 = bodyTop+size*0.22, len = size*1.30;
    var ex = Math.cos(armA)*len, ey = Math.sin(armA)*len;
    ctx.strokeStyle=C.skin; ctx.lineWidth=size*0.30; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-sx0, sy0); ctx.lineTo(-sx0-ex, sy0+ey); ctx.stroke();
    ctx.beginPath(); ctx.moveTo( sx0, sy0); ctx.lineTo( sx0+ex, sy0+ey); ctx.stroke();
    fillCircle(-sx0-ex, sy0+ey, size*0.20, C.skin);
    fillCircle( sx0+ex, sy0+ey, size*0.20, C.skin);
  }
  ctx.restore();
}

/* ------------------------------ the car ----------------------------------- */
function drawCar(x,y,w,t,tilt){
  var h = w*0.82;
  ctx.save(); ctx.translate(x,y); ctx.rotate(tilt||0);

  /* shadow */
  ctx.fillStyle='rgba(0,0,0,0.16)';
  ctx.beginPath(); ctx.ellipse(0, h*0.52, w*0.48, h*0.15, 0,0,TAU); ctx.fill();

  /* wheels */
  ctx.fillStyle='#4a3a52';
  rr(-w*0.55, -h*0.30, w*0.16, h*0.30, w*0.06); ctx.fill();
  rr( w*0.39, -h*0.30, w*0.16, h*0.30, w*0.06); ctx.fill();
  rr(-w*0.55,  h*0.05, w*0.16, h*0.30, w*0.06); ctx.fill();
  rr( w*0.39,  h*0.05, w*0.16, h*0.30, w*0.06); ctx.fill();

  /* body */
  var g = ctx.createLinearGradient(-w/2,-h/2,w/2,h/2);
  g.addColorStop(0, C.pinkLight); g.addColorStop(0.55, C.pink); g.addColorStop(1, C.pinkDark);
  ctx.fillStyle=g;
  rr(-w*0.44,-h*0.50, w*0.88, h, w*0.24); ctx.fill();

  /* windshield (top-down: a rounded band) */
  ctx.fillStyle='rgba(190,240,255,0.95)';
  rr(-w*0.32,-h*0.36, w*0.64, h*0.26, w*0.10); ctx.fill();
  ctx.fillStyle='rgba(160,225,255,0.85)';
  rr(-w*0.30, h*0.12, w*0.60, h*0.22, w*0.09); ctx.fill();

  /* seat: Lily's head pops out of the middle */
  ctx.fillStyle='rgba(255,255,255,0.5)';
  rr(-w*0.30,-h*0.06, w*0.60, h*0.16, w*0.07); ctx.fill();

  /* headlights */
  fillCircle(-w*0.28,-h*0.455, w*0.075, '#fffbe0');
  fillCircle( w*0.28,-h*0.455, w*0.075, '#fffbe0');
  /* tail lights */
  fillCircle(-w*0.28, h*0.455, w*0.06, '#ff3b6b');
  fillCircle( w*0.28, h*0.455, w*0.06, '#ff3b6b');

  /* a heart on the hood */
  drawHeart(0,-h*0.19, w*0.085, 'rgba(255,255,255,0.8)');

  /* driver */
  drawGirl(0, h*0.02, w*0.155, {noBody:true, t:t});

  /* flower basket strapped on the back */
  ctx.fillStyle='#c98a4b';
  rr(-w*0.17, h*0.30, w*0.34, h*0.20, w*0.05); ctx.fill();
  ctx.strokeStyle='#a86f38'; ctx.lineWidth=Math.max(1,w*0.015);
  ctx.beginPath(); ctx.moveTo(-w*0.17,h*0.37); ctx.lineTo(w*0.17,h*0.37); ctx.stroke();
  ctx.restore();
}

/* ---------------------------- the people ---------------------------------- */
/* Recipients: mum, dad, grandma, teacher, the brothers, a friend.  Trousers or a
   dress, never a dress by default -- the old version put Daddy in a skirt. */
function drawPerson(x,y,size,kind,t,happy){
  ctx.save(); ctx.translate(x,y);
  ctx.translate(0, Math.sin(t*3)*size*0.05);
  if(kind.shorter) ctx.translate(0, size*0.22);

  var S       = kind.skin || C.skin;
  var bodyTop = size*0.85;
  var hipY    = bodyTop + size*1.05;
  var footY   = bodyTop + size*2.50;   /* same for trousers and dresses, so the
                                          delivery scene can stand anyone on the grass */

  /* ---- hair behind the head ---- */
  ctx.fillStyle = kind.hairDark || kind.hair;
  if(kind.longHair){
    ctx.beginPath(); ctx.ellipse(0, size*0.90, size*1.20, size*1.70, 0,0,TAU); ctx.fill();
  } else if(kind.bob){
    ctx.beginPath(); ctx.ellipse(0, size*0.22, size*1.16, size*1.12, 0,0,TAU); ctx.fill();
  } else {
    ctx.beginPath(); ctx.ellipse(0, size*0.10, size*1.10, size*1.02, 0,0,TAU); ctx.fill();
  }

  /* ---- body ---- */
  if(kind.pants){
    ctx.fillStyle = kind.pants;
    rr(-size*0.70, hipY, size*0.62, size*1.45, size*0.16); ctx.fill();
    rr( size*0.08, hipY, size*0.62, size*1.45, size*0.16); ctx.fill();
    ctx.fillStyle = kind.shirt;
    rr(-size*0.78, bodyTop, size*1.56, size*1.30, size*0.24); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.beginPath();
    ctx.moveTo(-size*0.30, bodyTop); ctx.lineTo(size*0.30, bodyTop);
    ctx.lineTo(0, bodyTop+size*0.40); ctx.closePath(); ctx.fill();
    if(kind.belt){
      ctx.fillStyle = kind.belt;
      rr(-size*0.74, hipY-size*0.14, size*1.48, size*0.24, size*0.09); ctx.fill();
    }
  } else {
    ctx.fillStyle = kind.dress;
    ctx.beginPath();
    ctx.moveTo(-size*0.62, bodyTop); ctx.lineTo(size*0.62, bodyTop);
    ctx.lineTo(size*1.25, bodyTop+size*1.90); ctx.lineTo(-size*1.25, bodyTop+size*1.90);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    ctx.beginPath(); ctx.ellipse(0, bodyTop+size*1.80, size*1.10, size*0.26, 0,0,TAU); ctx.fill();
    if(kind.cardigan){
      /* an open cardigan with buttons down the front */
      ctx.fillStyle = kind.cardigan;
      ctx.beginPath();
      ctx.moveTo(-size*0.66, bodyTop-size*0.04); ctx.lineTo(-size*0.16, bodyTop-size*0.04);
      ctx.lineTo(-size*0.34, bodyTop+size*1.55); ctx.lineTo(-size*1.02, bodyTop+size*1.55);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo( size*0.66, bodyTop-size*0.04); ctx.lineTo( size*0.16, bodyTop-size*0.04);
      ctx.lineTo( size*0.34, bodyTop+size*1.55); ctx.lineTo( size*1.02, bodyTop+size*1.55);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = kind.buttons || '#e6c9f2';
      for(var bt=0; bt<3; bt++) fillCircle(0, bodyTop+size*(0.34+bt*0.42), size*0.09, kind.buttons);
    }
    if(kind.belt){
      ctx.fillStyle = kind.belt;
      rr(-size*0.86, bodyTop+size*0.80, size*1.72, size*0.22, size*0.09); ctx.fill();
      fillCircle(0, bodyTop+size*0.91, size*0.13, 'rgba(255,255,255,0.75)');
    }
    if(kind.apron){
      ctx.fillStyle='rgba(255,255,255,0.6)';
      ctx.beginPath();
      ctx.moveTo(-size*0.34,bodyTop+size*0.10); ctx.lineTo(size*0.34,bodyTop+size*0.10);
      ctx.lineTo(size*0.72,bodyTop+size*1.80); ctx.lineTo(-size*0.72,bodyTop+size*1.80);
      ctx.closePath(); ctx.fill();
    }
    /* bare legs under the hem */
    ctx.fillStyle = S;
    rr(-size*0.60, bodyTop+size*1.80, size*0.42, size*0.80, size*0.20); ctx.fill();
    rr( size*0.18, bodyTop+size*1.80, size*0.42, size*0.80, size*0.20); ctx.fill();
  }
  if(kind.collar){
    ctx.fillStyle = kind.collar;
    ctx.beginPath(); ctx.ellipse(-size*0.26, bodyTop+size*0.06, size*0.30, size*0.16, -0.5,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse( size*0.26, bodyTop+size*0.06, size*0.30, size*0.16,  0.5,0,TAU); ctx.fill();
  }

  /* ---- shoes ---- */
  ctx.fillStyle = kind.shoe || '#6b5b95';
  rr(-size*0.72, footY, size*0.66, size*0.32, size*0.15); ctx.fill();
  rr( size*0.06, footY, size*0.66, size*0.32, size*0.15); ctx.fill();

  /* ---- head ---- */
  fillCircle(0,0,size,S);
  ctx.fillStyle = kind.hair;
  ctx.beginPath();
  ctx.arc(0,0,size*1.05, Math.PI*1.0, Math.PI*2.0);
  ctx.quadraticCurveTo(0,-size*0.28, -size*1.05, -size*0.05);
  ctx.closePath(); ctx.fill();
  if(kind.bob){
    /* two soft lengths framing the jaw -- clearly shorter than Nina's */
    ctx.beginPath(); ctx.ellipse(-size*0.98, size*0.22, size*0.32, size*0.72, 0.10,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse( size*0.98, size*0.22, size*0.32, size*0.72,-0.10,0,TAU); ctx.fill();
  }
  if(kind.bun){ fillCircle(0,-size*1.15,size*0.45,kind.hair); }
  if(kind.curls){
    /* soft grey curls around the hairline */
    for(var cu=0; cu<7; cu++){
      var ca = Math.PI*1.06 + cu*(Math.PI*0.88/6);
      fillCircle(Math.cos(ca)*size*1.00, Math.sin(ca)*size*1.00, size*0.26, kind.hair);
    }
  }
  if(kind.pigtails){ fillCircle(-size*1.05,-size*0.05,size*0.42,kind.hair); fillCircle(size*1.05,-size*0.05,size*0.42,kind.hair); }
  if(kind.cap){
    ctx.fillStyle=kind.cap; ctx.beginPath(); ctx.arc(0,-size*0.10,size*1.04,Math.PI,TAU); ctx.fill();
    rr(-size*1.10,-size*0.18,size*2.20,size*0.20,size*0.10); ctx.fill();
    rr(-size*1.30,-size*0.20,size*1.00,size*0.22,size*0.11); ctx.fill();
  }

  /* ---- face ---- */
  fillCircle(-size*0.33,-size*0.06,size*0.14,C.ink);
  fillCircle( size*0.33,-size*0.06,size*0.14,C.ink);
  fillCircle(-size*0.28,-size*0.12,size*0.055,C.white);
  fillCircle( size*0.38,-size*0.12,size*0.055,C.white);
  if(kind.glasses){
    ctx.strokeStyle='#5a4a62'; ctx.lineWidth=size*0.07;
    circle(-size*0.33,-size*0.06,size*0.28); ctx.stroke();
    circle( size*0.33,-size*0.06,size*0.28); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-size*0.05,-size*0.06); ctx.lineTo(size*0.05,-size*0.06); ctx.stroke();
  }
  fillCircle(-size*0.60, size*0.22, size*0.15, 'rgba(255,140,180,0.45)');
  fillCircle( size*0.60, size*0.22, size*0.15, 'rgba(255,140,180,0.45)');
  ctx.strokeStyle=C.ink; ctx.lineWidth=size*0.10; ctx.lineCap='round';
  ctx.beginPath();
  if(happy) ctx.arc(0,size*0.14,size*0.40, 0.25, Math.PI-0.25);
  else      ctx.arc(0,size*0.16,size*0.30, 0.45, Math.PI-0.45);
  ctx.stroke();

  /* ---- accessories that sit in front of the hair ---- */
  if(kind.earring){
    for(var e=-1;e<=1;e+=2){
      var exx = e*size*1.02;
      fillCircle(exx, size*0.30, size*0.07, '#f0b429');
      ctx.strokeStyle='#f0b429'; ctx.lineWidth=size*0.05;
      ctx.beginPath(); ctx.moveTo(exx, size*0.32); ctx.lineTo(exx, size*0.52); ctx.stroke();
      drawHeart(exx, size*0.70, size*0.26, kind.earring);
      ctx.fillStyle='rgba(255,255,255,0.55)';
      ctx.beginPath(); ctx.ellipse(exx-size*0.08, size*0.60, size*0.07, size*0.05, -0.5,0,TAU); ctx.fill();
    }
  }
  if(kind.necklace){
    for(var p=0;p<7;p++){
      var na = Math.PI*0.30 + p*(Math.PI*0.40/6);
      var nx = Math.cos(na)*size*1.02, ny = size*0.30 + Math.sin(na)*size*0.92;
      fillCircle(nx, ny, size*0.105, 'rgba(120,95,130,0.35)');
      fillCircle(nx, ny, size*0.085, kind.necklace);
      fillCircle(nx-size*0.025, ny-size*0.025, size*0.032, 'rgba(255,255,255,0.9)');
    }
  }

  /* ---- arms last, or the hair swallows them ---- */
  var armA = happy? -0.95 : -0.45;
  var asx = size*0.72, asy = bodyTop+size*0.30, alen = size*1.15;
  var aex = Math.cos(armA)*alen, aey = Math.sin(armA)*alen;
  ctx.strokeStyle = kind.pants? kind.shirt : (kind.cardigan || S);
  ctx.lineWidth = size*0.32; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-asx,asy); ctx.lineTo(-asx-aex*0.55, asy+aey*0.55); ctx.stroke();
  ctx.beginPath(); ctx.moveTo( asx,asy); ctx.lineTo( asx+aex*0.55, asy+aey*0.55); ctx.stroke();
  ctx.strokeStyle = S; ctx.lineWidth = size*0.28;
  ctx.beginPath(); ctx.moveTo(-asx-aex*0.5, asy+aey*0.5); ctx.lineTo(-asx-aex, asy+aey); ctx.stroke();
  ctx.beginPath(); ctx.moveTo( asx+aex*0.5, asy+aey*0.5); ctx.lineTo( asx+aex, asy+aey); ctx.stroke();
  fillCircle(-asx-aex, asy+aey, size*0.20, S);
  fillCircle( asx+aex, asy+aey, size*0.20, S);
  ctx.restore();
}

/* -------------------------- watering can ---------------------------------- */
function drawCan(x,y,size,tip){
  ctx.save(); ctx.translate(x,y); ctx.rotate(tip||0);
  ctx.fillStyle='rgba(0,0,0,0.12)';
  ctx.beginPath(); ctx.ellipse(0,size*0.95,size*0.9,size*0.2,0,0,TAU); ctx.fill();
  var g = ctx.createLinearGradient(-size,-size,size,size);
  g.addColorStop(0,'#ffb3d9'); g.addColorStop(1,'#ff5fa3');
  ctx.fillStyle=g;
  rr(-size*0.65,-size*0.55, size*1.3, size*1.45, size*0.28); ctx.fill();
  /* spout */
  ctx.strokeStyle='#ff5fa3'; ctx.lineWidth=size*0.30; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-size*0.55,size*0.25); ctx.lineTo(-size*1.35,-size*0.30); ctx.stroke();
  ctx.fillStyle='#ffa8cd';
  ctx.beginPath(); ctx.ellipse(-size*1.45,-size*0.36,size*0.30,size*0.22,-0.6,0,TAU); ctx.fill();
  /* handle */
  ctx.strokeStyle='#ff8cc0'; ctx.lineWidth=size*0.20;
  ctx.beginPath(); ctx.arc(size*0.05,-size*0.6,size*0.55,Math.PI*1.05,Math.PI*1.95); ctx.stroke();
  /* a flower painted on the can */
  drawFlower(size*0.08,size*0.25,size*0.30,FLOWER_COLORS[1],0.3,false,0);
  ctx.restore();
}

/* -------------------------- particle system -------------------------------- */
/* Physics lives in update(), never in draw(): if drawing is skipped the array
   must still be pruned. Hard cap regardless. */
var PARTS = [];
var PART_MAX = 220;
function spawnPart(o){
  if(PARTS.length >= PART_MAX) PARTS.shift();
  PARTS.push({ x:o.x, y:o.y, vx:o.vx||0, vy:o.vy||0, g:(o.g===undefined?600:o.g),
    life:o.life||1, age:0, r:o.r||4, col:o.col||'#fff', kind:o.kind||'dot',
    spin:o.spin||0, vs:o.vs||0 });
}
function burst(x,y,n,col,opt){
  opt=opt||{};
  for(var i=0;i<n;i++){
    var a = rnd(0,TAU), sp = rnd(opt.min||60, opt.max||260)*U/4;
    spawnPart({ x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - (opt.up||0),
      g:opt.g===undefined?520:opt.g, life:rnd(0.5,1.1), r:rnd(U*0.5,U*1.3),
      col: (typeof col==='function')?col():col, kind:opt.kind||'dot',
      spin:rnd(0,TAU), vs:rnd(-6,6) });
  }
}
function updateParts(dt){
  for(var i=PARTS.length-1;i>=0;i--){
    var p=PARTS[i];
    p.age += dt;
    if(p.age>=p.life){ PARTS.splice(i,1); continue; }
    p.vy += p.g*dt;
    p.x += p.vx*dt; p.y += p.vy*dt; p.spin += p.vs*dt;
    if(p.y > H+80) { PARTS.splice(i,1); }
  }
}
function drawParts(){
  for(var i=0;i<PARTS.length;i++){
    var p=PARTS[i], k=1-p.age/p.life;
    ctx.globalAlpha = clamp(k*1.4,0,1);
    if(p.kind==='star'){ drawStar(p.x,p.y,p.r*1.6,p.col,p.spin); }
    else if(p.kind==='heart'){ drawHeart(p.x,p.y,p.r*1.4,p.col); }
    else if(p.kind==='petal'){
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.spin); ctx.fillStyle=p.col;
      ctx.beginPath(); ctx.ellipse(0,0,p.r*1.5,p.r*0.8,0,0,TAU); ctx.fill(); ctx.restore();
    }
    else if(p.kind==='drop'){
      ctx.fillStyle=p.col; ctx.beginPath();
      ctx.ellipse(p.x,p.y,p.r*0.55,p.r*1.1,0,0,TAU); ctx.fill();
    }
    else { fillCircle(p.x,p.y,p.r,p.col); }
  }
  ctx.globalAlpha=1;
}
</script>
<script>
"use strict";
/* ============================== game state ================================ */
var G = {
  basket: [],            /* flower colours picked this drive */
  bouquet: [],           /* flowers waiting to be delivered */
  stars: parseInt(LS.get('nina_stars')||'0',10) || 0,
  best:  parseInt(LS.get('nina_best')||'0',10)  || 0,
  stickers: (LS.get('nina_stickers')||'').split(',').filter(Boolean),
  roundIndex: parseInt(LS.get('nina_round')||'0',10) || 0,
  garden: null,          /* [{stage, col}] x4 -- survives between visits */
  wordIndex: parseInt(LS.get('nina_word')||'0',10) || 0,
  personIndex: parseInt(LS.get('nina_person')||'0',10) || 0
};
function addStars(n){
  G.stars += n;
  if(G.stars > G.best){ G.best = G.stars; LS.set('nina_best', G.best); }
  LS.set('nina_stars', G.stars);
}
/* The garden grows one step per visit, so it has to outlive the round. */
function loadGarden(){
  var raw = (LS.get('nina_garden')||'').split(',').filter(function(x){ return x.length; });
  var g = [], i;
  for(i=0;i<4;i++){
    var parts = (raw[i]||'').split(':');
    var st = parseInt(parts[0],10), ci = parseInt(parts[1],10);
    g.push({ stage: (st>=0 && st<=3)? st : 0,
             col: FLOWER_COLORS[(ci>=0 && ci<FLOWER_COLORS.length)? ci : rndi(0,FLOWER_COLORS.length-1)] });
  }
  return g;
}
function saveGarden(){
  if(!G.garden) return;
  LS.set('nina_garden', G.garden.map(function(p){
    return p.stage + ':' + FLOWER_COLORS.indexOf(p.col);
  }).join(','));
}
function resetGarden(){
  G.garden = [];
  for(var i=0;i<4;i++) G.garden.push({ stage:0, col: FLOWER_COLORS[rndi(0,FLOWER_COLORS.length-1)] });
  saveGarden();
}
function saveProgress(){
  LS.set('nina_round', G.roundIndex);
  LS.set('nina_word', G.wordIndex);
  LS.set('nina_person', G.personIndex);
  LS.set('nina_stickers', G.stickers.join(','));
}

var PEOPLE = [
  /* Mummy: shorter hair than Nina, her own outfit, heart earrings -- she used to
