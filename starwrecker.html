<title>Star Wrecker v0.3</title>
<script>
/* The host owns <head>, so establish the mobile viewport before first layout. */
(function(){
  function meta(n,c){var m=document.querySelector('meta[name="'+n+'"]');
    if(!m){m=document.createElement('meta');m.setAttribute('name',n);
      (document.head||document.documentElement).appendChild(m);}
    m.setAttribute('content',c);}
  meta('viewport','width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover');
  meta('apple-mobile-web-app-capable','yes');
  meta('mobile-web-app-capable','yes');
  meta('apple-mobile-web-app-status-bar-style','black-translucent');
  meta('apple-mobile-web-app-title','Star Wrecker 2');
  meta('theme-color','#05060f');
  meta('color-scheme','dark');
})();
</script>
<script>
/* Safari blocks localStorage inside cross-site iframes and THROWS on access.
   Reading it unguarded at script top level killed the whole bundle. Everything
   goes through this shim, which silently falls back to memory. */
var LS=(function(){
  var ok=false, mem={};
  try{ window.localStorage.setItem('__sw','1'); window.localStorage.removeItem('__sw'); ok=true; }catch(e){ ok=false; }
  return {
    blocked:!ok,
    get:function(k){ try{ return ok?window.localStorage.getItem(k):(k in mem?mem[k]:null); }
                     catch(e){ return (k in mem)?mem[k]:null; } },
    set:function(k,v){ try{ if(ok) window.localStorage.setItem(k,String(v)); else mem[k]=String(v); }
                       catch(e){ mem[k]=String(v); } },
    del:function(k){ try{ if(ok) window.localStorage.removeItem(k); else delete mem[k]; }
                     catch(e){ delete mem[k]; } }
  };
})();
/* Register before any other script so even a boot-time failure is visible. */
window.__swErr=null;
window.addEventListener('error',function(ev){
  if(window.__swErr) return;
  window.__swErr=(ev.message||'error')+' @line '+(ev.lineno||'?');
  try{
    var v=document.getElementById('veil'), c=document.getElementById('veilCard');
    if(!v||!c) return;
    c.innerHTML='<h2>Something broke</h2>'+
      '<p class="small">Screenshot this and send it to Dad:</p>'+
      '<div class="scroll" style="word-break:break-word;font-family:monospace;font-size:11px">'+
      String(window.__swErr).replace(/</g,'&lt;')+'</div>';
    v.hidden=false;
  }catch(_){}
});
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Fredoka:wght@400;500;600;700&family=Roboto+Mono:wght@500;700&display=swap">

<style>
:root{
  --void:#05060f; --void2:#0c1024; --panel:#141a35; --edge:#243063;
  --chalk:#eef1ff; --dim:#8f9ac4;
  --accent:#ff8a2b; --accent2:#8b5cf6; --glow:#ffc46b;
  --hot:#ff4d6d; --cool:#43e8ff; --good:#5fe39a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:var(--void); color:var(--chalk);
  font-family:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none;
  overscroll-behavior:none; touch-action:none;
}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;background:var(--void);
  touch-action:none}

/* ---------------- HUD ---------------- */
.hud{position:fixed;inset:0;pointer-events:none;z-index:2;
  padding:calc(10px + env(safe-area-inset-top,0px)) 12px calc(10px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;justify-content:space-between}
.hud-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.hud-bot{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}

.score{font-family:'Roboto Mono',monospace;font-variant-numeric:tabular-nums;
  font-size:clamp(22px,6.4vw,30px);font-weight:700;line-height:1;letter-spacing:-.5px;
  text-shadow:0 2px 10px rgba(0,0,0,.9)}
.scorelbl{font-size:9.5px;letter-spacing:.19em;text-transform:uppercase;color:var(--dim);margin-bottom:3px}
.combo{font-family:'Luckiest Guy',cursive;font-size:clamp(15px,4.6vw,20px);color:var(--glow);
  line-height:1;margin-top:5px;opacity:0;transform:translateY(-4px);transition:.18s;
  text-shadow:0 0 12px var(--accent)}
.combo.on{opacity:1;transform:none}
.combo.pop{animation:cpop .26s}
@keyframes cpop{0%{transform:scale(1)}45%{transform:scale(1.3)}100%{transform:scale(1)}}

.wave{text-align:right}
.wavenum{font-family:'Luckiest Guy',cursive;font-size:clamp(15px,4.4vw,19px);line-height:1;
  text-shadow:0 2px 8px rgba(0,0,0,.9)}
.wavelbl{font-size:9.5px;letter-spacing:.19em;text-transform:uppercase;color:var(--dim)}
.btns{display:flex;gap:7px;margin-top:8px;pointer-events:auto}
.ibtn{width:38px;height:38px;border-radius:11px;border:1.5px solid var(--edge);
  background:rgba(12,16,36,.82);color:var(--dim);font-size:15px;font-family:inherit;
  cursor:pointer;display:grid;place-items:center;transition:.15s;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.ibtn:hover,.ibtn:focus-visible{color:var(--chalk);border-color:var(--accent);outline:none}

/* lives + weapon */
.lives{display:flex;gap:5px;align-items:center}
.pip{width:15px;height:17px;background:var(--cool);opacity:.92;
  -webkit-clip-path:polygon(50% 0,100% 78%,72% 100%,28% 100%,0 78%);clip-path:polygon(50% 0,100% 78%,72% 100%,28% 100%,0 78%);
  filter:drop-shadow(0 0 5px var(--cool))}
.pip.spent{background:var(--edge);filter:none;opacity:.5}
.wep{-webkit-appearance:none;appearance:none;cursor:pointer;min-height:44px;touch-action:manipulation;background:rgba(8,12,28,.55);border:1.5px solid var(--edge);border-radius:11px;padding:7px 11px;display:inline-flex;align-items:center;gap:5px;font-family:inherit;-webkit-tap-highlight-color:transparent;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-top:6px}
.wep:active{transform:scale(.94)}
/* v0.3 hull meter: the ship gets a health bar too, not just the bosses */
.hull{width:clamp(96px,31vw,138px);margin-top:7px}
.hull .lb{font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-bottom:3px}
.hull .trk{height:10px;background:rgba(6,8,20,.85);border:1.5px solid var(--edge);
  border-radius:99px;overflow:hidden}
.hull .fl{height:100%;width:100%;border-radius:99px;transition:width .16s;
  background:linear-gradient(90deg,var(--good),var(--cool))}
.hull.low .fl{background:linear-gradient(90deg,#ffb347,var(--accent))}
.hull.crit .fl{background:linear-gradient(90deg,var(--hot),var(--accent));
  animation:hullcrit .7s ease-in-out infinite}
@keyframes hullcrit{0%,100%{opacity:1}50%{opacity:.4}}
.hull.bump{animation:hullbump .24s}
@keyframes hullbump{0%{transform:none}30%{transform:translateX(-5px) scale(1.07)}
  62%{transform:translateX(5px)}100%{transform:none}}
.wep b{color:var(--cool);font-weight:700;letter-spacing:.1em}

/* overdrive */
.od{pointer-events:auto;width:clamp(66px,19vw,86px);height:clamp(66px,19vw,86px);
  border-radius:50%;border:2.5px solid var(--edge);background:rgba(12,16,36,.8);
  position:relative;cursor:pointer;display:grid;place-items:center;
  font-family:'Luckiest Guy',cursive;font-size:11px;letter-spacing:.5px;color:var(--dim);
  transition:.18s;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);overflow:hidden}
.od .fillbar{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,var(--accent2),var(--accent));
  opacity:.5;transition:height .18s}
.od span{position:relative;z-index:1;text-align:center;line-height:1.15}
.od.ready{border-color:var(--glow);color:#0b0a16;animation:odready 1.15s ease-in-out infinite}
.od.ready .fillbar{opacity:1;background:linear-gradient(180deg,var(--glow),var(--accent))}
@keyframes odready{0%,100%{box-shadow:0 0 0 0 rgba(255,196,107,.55)}
  70%{box-shadow:0 0 0 15px rgba(255,196,107,0)}}

/* boss bar */
.bossbar{position:fixed;left:12px;right:12px;top:calc(94px + env(safe-area-inset-top,0px));z-index:3;
  opacity:0;transition:.3s;pointer-events:none}
.bossbar.on{opacity:1}
.bossbar .nm{font-family:'Luckiest Guy',cursive;font-size:12px;text-align:center;margin-bottom:4px;
  color:var(--glow);text-shadow:0 2px 8px #000;text-wrap:balance}
.bossbar .trk{height:9px;background:rgba(6,8,20,.85);border:1.5px solid var(--edge);border-radius:99px;overflow:hidden}
.bossbar .fl{height:100%;background:linear-gradient(90deg,var(--accent2),var(--hot));
  transition:width .22s;border-radius:99px}

/* banner */
.banner{position:fixed;left:0;right:0;top:38%;z-index:3;text-align:center;pointer-events:none;
  font-family:'Luckiest Guy',cursive;font-size:clamp(26px,9vw,44px);color:var(--glow);
  text-shadow:0 0 26px var(--accent),0 4px 0 rgba(0,0,0,.6);opacity:0}
.banner.show{animation:bann 1.5s ease-out}
@keyframes bann{0%{opacity:0;transform:scale(.6)}18%{opacity:1;transform:scale(1.05)}
  75%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.1)}}

/* ---------------- overlays ---------------- */
.veil{position:fixed;inset:0;z-index:10;background:rgba(4,5,14,.9);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  display:flex;align-items:flex-start;justify-content:center;
  padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(18px + env(safe-area-inset-bottom,0px));
  overflow-y:auto;-webkit-overflow-scrolling:touch}
.veil[hidden]{display:none}
.card{background:var(--void2);border:1.5px solid var(--edge);border-radius:20px;padding:22px 20px;
  max-width:400px;width:100%;text-align:center;margin:auto 0;display:flex;flex-direction:column;gap:13px;
  box-shadow:0 20px 50px rgba(0,0,0,.7);animation:rise .32s cubic-bezier(.3,1.2,.5,1)}
@keyframes rise{0%{transform:translateY(16px);opacity:0}100%{transform:none;opacity:1}}
.card h1{font-family:'Luckiest Guy',cursive;font-size:clamp(32px,10vw,46px);line-height:.95;
  font-weight:400;color:var(--accent);text-shadow:0 0 30px rgba(255,138,43,.45);letter-spacing:1px}
.card h2{font-family:'Luckiest Guy',cursive;font-size:clamp(22px,7vw,30px);color:var(--accent);
  font-weight:400;line-height:1.05;text-wrap:balance}
.card p{font-size:14.5px;line-height:1.5;text-wrap:balance}
.card p.small{font-size:12.5px;color:var(--dim)}
.tag{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
.big{background:var(--accent);color:#150c04;border:none;border-radius:13px;padding:15px;
  font-family:'Luckiest Guy',cursive;font-size:clamp(17px,5vw,21px);letter-spacing:.6px;
  cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.5);transition:.12s}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.5)}
.ghost{background:var(--panel);color:var(--dim);border:1.5px solid var(--edge);border-radius:13px;
  padding:12px;font-family:inherit;font-size:14px;cursor:pointer;transition:.14s}
.ghost:hover,.ghost:focus-visible{color:var(--chalk);border-color:var(--accent);outline:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--void);border:1.5px solid var(--edge);border-radius:12px;padding:10px 5px}
.stat .v{font-family:'Roboto Mono',monospace;font-variant-numeric:tabular-nums;font-size:19px;
  font-weight:700;color:var(--glow);line-height:1.2}
.stat .k{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-top:3px}
.scroll{background:var(--void);border:1.5px solid var(--edge);border-radius:13px;padding:13px;
  text-align:left;font-size:13px;line-height:1.55}
.scroll .lbl{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);
  display:block;margin-bottom:5px;font-weight:600}
.veil ul{text-align:left;font-size:13.5px;line-height:1.55;padding-left:18px;display:flex;
  flex-direction:column;gap:6px}
.veil ul b{color:var(--glow)}
.seasons{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.seasons button{background:var(--void);border:1.5px solid var(--edge);color:var(--chalk);
  border-radius:10px;padding:8px 6px;font-family:inherit;font-size:12px;cursor:pointer;transition:.14s}
.seasons button:hover,.seasons button[aria-pressed="true"]{border-color:var(--accent);color:var(--glow)}

/* ---------------- THE TINKER DECK ---------------- */
.deckhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.knob{background:var(--void);border:1.5px solid var(--edge);border-radius:14px;
  padding:11px 11px 9px;text-align:left;display:flex;flex-direction:column;gap:7px}
.knob.flag{border-color:var(--accent);box-shadow:0 0 0 1px rgba(255,138,43,.25)}
.knobtop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.knobtop code{font-family:'Roboto Mono',ui-monospace,monospace;font-size:11.5px;
  color:var(--cool);letter-spacing:.02em;word-break:break-all}
.kv{font-family:'Roboto Mono',ui-monospace,monospace;font-size:15px;font-weight:700;
  color:var(--glow);white-space:nowrap}
.kv small{font-size:9.5px;color:var(--dim);font-weight:400;margin-left:3px}
.kbar{height:6px;background:rgba(6,8,20,.9);border-radius:99px;overflow:hidden}
.kbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));
  border-radius:99px;transition:width .12s}
.knote{font-size:11.5px;color:var(--dim);line-height:1.4}
.krow{display:flex;gap:6px}
.kbtn{flex:1;min-height:44px;border-radius:11px;border:1.5px solid var(--edge);
  background:var(--panel);color:var(--chalk);font-family:'Roboto Mono',ui-monospace,monospace;
  font-size:14px;font-weight:700;cursor:pointer;touch-action:manipulation;
  -webkit-tap-highlight-color:transparent}
.kbtn:active{transform:translateY(2px);border-color:var(--accent)}
.ksrc{font-family:'Roboto Mono',ui-monospace,monospace;font-size:10.5px;line-height:1.5;
  color:#a9ffd0;background:#04060f;border:1px solid var(--edge);border-radius:9px;
  padding:8px 9px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  white-space:pre-wrap;overflow-wrap:break-word}
.ksrc b{color:var(--glow);font-weight:700}
.ksrc i{color:#6e7ba6;font-style:normal}
.deckwrap{display:flex;flex-direction:column;gap:9px}
.deckfoot{position:sticky;bottom:0;background:var(--void2);
  padding:9px 0 calc(4px + env(safe-area-inset-bottom,0px));
  display:flex;gap:8px;margin-top:2px;box-shadow:0 -12px 16px -6px var(--void2)}
.deckfoot .ghost,.deckfoot .big{flex:1;margin:0;display:grid;place-items:center;min-height:52px}
.deckfoot .ghost{font-size:12.5px;line-height:1.25}
.bosspick{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.bosspick button{min-height:44px;background:var(--void);border:1.5px solid var(--edge);
  color:var(--chalk);border-radius:11px;padding:8px 6px;font-family:inherit;font-size:11.5px;
  cursor:pointer;touch-action:manipulation}
.bosspick button[aria-pressed="true"]{border-color:var(--accent);color:var(--glow)}
.xplain{background:var(--void);border:1.5px solid var(--accent);border-radius:13px;
  padding:11px;text-align:left;font-size:12.5px;line-height:1.55;display:flex;
  flex-direction:column;gap:9px}
.xplain h3{font-family:'Luckiest Guy',cursive;font-weight:400;font-size:17px;color:var(--accent);
  letter-spacing:.5px}
.xbtn{background:var(--panel);border:1.5px dashed var(--accent);color:var(--glow);
  border-radius:11px;min-height:44px;padding:10px;font-family:inherit;font-size:12.5px;
  cursor:pointer;touch-action:manipulation}

@media (prefers-reduced-motion:reduce){
  .od.ready,.banner.show,.combo.pop,.hull.bump,.hull.crit .fl{animation:none}
}
</style>

<canvas id="game"></canvas>

<div class="hud" id="hud">
  <div class="hud-top">
    <div>
      <div class="scorelbl">Score</div>
      <div class="score" id="score">0</div>
      <div class="combo" id="combo">x1</div>
    </div>
    <div class="wave">
      <div class="wavelbl">Wave</div>
      <div class="wavenum" id="wave">1</div>
      <div class="btns">
        <button class="ibtn" id="soundBtn" aria-label="Sound">&#9835;</button>
        <button class="ibtn" id="pauseBtn" aria-label="Pause">&#10073;&#10073;</button>
      </div>

  </div>
  <div class="hud-bot">
    <div>
      <div class="lives" id="lives"></div>

</div>

<div class="bossbar" id="bossbar">

</div>

<div class="banner" id="banner"></div>
<div class="veil" id="veil" hidden><div class="card" id="veilCard"></div></div>

<script>
"use strict";

/* ============ eyes + mouth helpers (shared creature grammar) ============ */
function eyes(cx1,cx2,cy,r,ink){
  return `<g class="blink" style="transform-origin:${cx1}px ${cy}px">
    <ellipse cx="${cx1}" cy="${cy}" rx="${r}" ry="${r*1.08}" fill="#fff"/>
    <ellipse cx="${cx2}" cy="${cy}" rx="${r}" ry="${r*1.08}" fill="#fff"/>
    <circle cx="${cx1+1.5}" cy="${cy+1}" r="${r*0.45}" fill="${ink}"/>
    <circle cx="${cx2+1.5}" cy="${cy+1}" r="${r*0.45}" fill="${ink}"/>
  </g>`;
}
const grin = (d,ink)=>`<path d="${d}" fill="${ink}"/>`;

/* ============ seasons ============ */
const THEMES = {
  halloween:{
    label:'Halloween',
    ammo:['\ud83c\udf83','\ud83c\udf6c','\ud83e\udd87'],
    music:{root:57,scale:[0,2,3,5,7,8,10],tempo:108,wave:'square',vol:.035,mel:[0,2,3,2,5,null,4,3,0,2,3,4,3,2,0,null],bass:[0,5,3,4]}, accent:'#ff8a2b', accent2:'#8b5cf6', glow:'#ffc46b',
    tile:'#f6e9cf', bossName:'The Pumpkin Warlock',
    fall:'leaf', fallColors:['#ff8a2b','#c2410c','#8b5cf6','#eab308'],
    taunts:['I have been rotting on this porch for a MONTH. I am extremely crabby.',
      'Fear me! I am 96% seeds!','My hat is pointy AND enchanted. Two problems for you.',
      'You smell like a kid who has candy. Hand it over.',
      'I once scared a scarecrow. The scarecrow was fine, but still.'],
    attacks:['flings a fistful of pumpkin guts','casts SPOOKY WIGGLE','throws a rotten gourd',
      'shrieks in an unnecessarily high voice','summons one (1) mildly upset bat'],
    art:()=>`
      <ellipse cx="100" cy="118" rx="62" ry="47" fill="#e8721a"/>
      <path d="M62 82q10 36 0 71M138 82q-10 36 0 71M84 76q-5 42 0 82M116 76q5 42 0 82"
        stroke="#c2540c" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M96 74q-3-20 6-26t14 4q-7 4-9 9t1 13z" fill="#4d7c2a"/>
      <path d="M52 78 100 26l48 52z" fill="#6d28d9"/>
      <path d="M100 26q4 16-6 24" stroke="#a78bfa" stroke-width="4" fill="none" stroke-linecap="round"/>
      <ellipse cx="100" cy="80" rx="54" ry="9" fill="#5b21b6"/>
      ${eyes(80,120,108,12,'#2a1206')}
      ${grin('M70 133q30 26 60 0q-9 3-13-4q-6 8-12 0q-5 8-11 1q-5 6-12 3z','#2a1206')}`
  },
  thanksgiving:{
    label:'Thanksgiving',
    ammo:['\ud83c\udf57','\ud83e\udd67','\ud83c\udf3d'],
    music:{root:53,scale:[0,2,4,5,7,9,11],tempo:96,wave:'triangle',vol:.04,mel:[0,2,4,2,5,4,2,0,4,5,7,5,4,2,0,null],bass:[0,3,4,0]}, accent:'#e08a3c', accent2:'#b8465a', glow:'#f5c06b',
    tile:'#f7ecd6', bossName:'Sir Gobblesworth, Enormous Turkey',
    fall:'leaf', fallColors:['#e08a3c','#b8465a','#a16207','#7c3f12'],
    taunts:['Gobble. That was a threat.','I am the size of a beanbag chair and I know it.',
      'Nobody puts gravy on a WIZARD.','I have been fattened up all year. For THIS. For battle.',
      'You want seconds? Fight me for them.'],
    attacks:['unleashes a devastating GOBBLE','hurls a scalding ladle of gravy',
      'fluffs menacingly','drops a brick of stuffing on your foot','waddles at you with intent'],

/* Hanukkah begins the evening before the first full day; 8 days each. */
const HANUKKAH = {2025:[12,14],2026:[12,4],2027:[12,24],2028:[12,12],2029:[12,1],
                  2030:[12,20],2031:[12,9],2032:[11,27],2033:[12,16],2034:[12,6],2035:[12,25]};

function seasonFor(d){
  const y=d.getFullYear(), m=d.getMonth()+1, day=d.getDate();
  const h=HANUKKAH[y];
  if(h){
    const start=new Date(y,h[0]-1,h[1]), end=new Date(y,h[0]-1,h[1]+8);
    if(d>=start && d<end) return 'hanukkah';
  }
  if(m===10) return 'halloween';
  if(m===11) return 'thanksgiving';
  if(m===12) return day<=25 ? 'christmas' : 'newyear';
  if(m===1) return day<=5 ? 'newyear' : 'winter';
  if(m===2) return 'winter';
  if(m>=3 && m<=5) return 'spring';
  if(m===6||m===7) return 'summer';
  if(m===8) return day<=24 ? 'summer' : 'school';
  return 'school';
}

<script>
/* ============ sound ============ */
let AC=null;
/* 2 = music + effects, 1 = effects only, 0 = silent */
let audioMode = (LS.get('sw_audio')!==null) ? +LS.get('sw_audio') : 2;
let soundOn = audioMode>0;
function ctx(){
  AC = AC || new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended') AC.resume();
  return AC;
}
function beep(freq,dur,type='square',vol=.08,slide=0){
  if(!soundOn) return;
  try{
    ctx();
    const o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime;
    o.type=type; o.frequency.setValueAtTime(freq,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide),t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur+.02);
  }catch(e){}
}

/* A small tracker: melody (with a delay echo), a walking bass, and a drum kit.
   Everything runs through a master low-pass so the square waves aren't piercing. */
const midi = n => 440*Math.pow(2,(n-69)/12);
let MU=null, muTimer=null, muStep=0, muNext=0, BUS=null, NOISE=null;

function bus(){
  if(BUS) return BUS;
  const c=ctx();
  const lp=c.createBiquadFilter(); lp.type='lowpass';
  lp.frequency.value=2600; lp.Q.value=.6;
  const g=c.createGain(); g.gain.value=.9;
  lp.connect(g); g.connect(c.destination);
  BUS={lp,g,inp:lp};
  return BUS;
}

  if(NOISE) return NOISE;
  const c=ctx(), n=c.sampleRate*.5, b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  NOISE=b; return NOISE;
}
function tone(freq,at,dur,wave,vol,detune){
  const c=ctx(), o=c.createOscillator(), g=c.createGain();
  o.type=wave; o.frequency.setValueAtTime(freq,at);
  if(detune) o.detune.setValueAtTime(detune,at);
  g.gain.setValueAtTime(0,at);
  g.gain.linearRampToValueAtTime(vol,at+.012);
  g.gain.exponentialRampToValueAtTime(.0001,at+dur);
  o.connect(g); g.connect(bus().inp);
  o.start(at); o.stop(at+dur+.04);
}
function hit(at,type,vol){
  const c=ctx();
  if(type==='kick'){
    const o=c.createOscillator(), g=c.createGain();
    o.type='sine'; o.frequency.setValueAtTime(132,at);
    o.frequency.exponentialRampToValueAtTime(42,at+.11);
    g.gain.setValueAtTime(vol,at); g.gain.exponentialRampToValueAtTime(.0001,at+.17);
    o.connect(g); g.connect(bus().inp); o.start(at); o.stop(at+.2);
    return;
  }
  const s=c.createBufferSource(); s.buffer=noiseBuf();
  const f=c.createBiquadFilter(), g=c.createGain();
  if(type==='hat'){ f.type='highpass'; f.frequency.value=7200; g.gain.setValueAtTime(vol,at);
    g.gain.exponentialRampToValueAtTime(.0001,at+.045); }
  else { f.type='bandpass'; f.frequency.value=1900; f.Q.value=.8;
    g.gain.setValueAtTime(vol,at); g.gain.exponentialRampToValueAtTime(.0001,at+.13); }
  s.connect(f); f.connect(g); g.connect(bus().inp);
  s.start(at); s.stop(at+.2);
}
function degree(m,d){
  const L=m.scale.length, oct=Math.floor(d/L);
  return m.root + m.scale[((d%L)+L)%L] + 12*oct;
}
function tick(){
  if(!MU || audioMode<2) return;
  try{
  const c=ctx(), beat=60/MU.tempo/2, swing=beat*0.14;
  while(muNext < c.currentTime + 0.4){
    const s=muStep%16, bar=Math.floor(muStep/16)%4, at=muNext + (s%2 ? swing : 0);
    const v=MU.vol;

    /* melody, doubled an octave up very quietly, plus a dotted echo */
    const d=MU.mel[s];
    if(d!==null && d!==undefined){
      const f=midi(degree(MU,d));
      tone(f, at, beat*1.3, MU.wave, v, -4);
      tone(f*2, at, beat*0.7, 'triangle', v*.28, 5);
      tone(f, at+beat*1.5, beat*0.9, 'triangle', v*.22);   // echo
    }
    /* bass: root on the beat, fifth on the off-beat -- gives it a walk */
    if(s%4===0) tone(midi(degree(MU,MU.bass[bar])-24), at, beat*1.6, 'triangle', v*1.5);
    else if(s%4===2) tone(midi(degree(MU,MU.bass[bar]+4)-24), at, beat*.9, 'triangle', v*.85);

    /* drums */
    if(s===0||s===6||s===8) hit(at,'kick',v*4.6);
    if(s===4||s===12)       hit(at,'snare',v*2.1);
    if(s%2===0)             hit(at,'hat',v*(s%4===0?1.5:0.95));

    muNext += beat; muStep++;
  }
  }catch(e){ stopMusic(); }
}
function startMusic(){
  if(audioMode<2 || !MU) return;
  stopMusic(true);
  try{ muStep=0; muNext=ctx().currentTime+0.15; }catch(e){ return; }
  tick(); muTimer=setInterval(tick,110);
}
function stopMusic(keep){ if(muTimer){ clearInterval(muTimer); muTimer=null; } if(!keep){ muStep=0; } }
let booting=true;   /* notes scheduled into a suspended context at boot all dump out on the first tap */
function setMusic(cfg){ MU=cfg; if(audioMode>=2 && !booting) startMusic(); }

   about +4% health and +2% speed per wave, capped, so wave 20 is a real step up from
   wave 5 without turning into a wall. */
function foeScale(){ return {hp:1+Math.min(1.6,wave*0.04),
                             spd:(1+Math.min(0.55,wave*0.02))*ENEMY_SPEED}; }
function spawnFoe(type,x){
  const SC=foeScale();
  const d=FOE[type];
  const hp=Math.max(1,Math.round(d.hp*SC.hp));
  foes.push({type,x,y:-40,r:d.r,hp,max:hp,sc:Math.round(d.sc*SC.hp),size:d.size,spdMul:SC.spd,
    bx:x, ph:Math.random()*6.283, t:0, st:d.shoot?rnd(0.6,d.shoot):0, mini:!!d.mini,
    glyph:pick(T.ammo), sprite:(calcMode?'calc':null), hit:0, held:false});
}
function updateFoes(dt){
  for(let i=foes.length-1;i>=0;i--){
    const f=foes[i], d=FOE[f.type];
    f.t+=dt; if(f.hit>0) f.hit-=dt;
    if(f.leaving){ f.held=false; f.y+=170*dt; }   /* retreating: drift off the bottom, no more parking */
    else switch(f.type){
      case 'drifter': f.y+=(d.spd*(f.spdMul||1))*dt; f.x=f.bx+Math.sin(f.t*1.9+f.ph)*48; break;
      case 'rusher':  f.y+=(d.spd*(f.spdMul||1))*dt; f.x+=Math.sin(f.t*4+f.ph)*22*dt;    break;
      case 'weaver':  f.y+=(d.spd*(f.spdMul||1))*dt; f.x=f.bx+Math.sin(f.t*2.4+f.ph)*72;
                      f.y+=Math.sin(f.t*3.1)*26*dt; break;
      case 'turret':
      case 'brute': {
        const stop=H*d.halt;
        if(f.y<stop) f.y+=(d.spd*(f.spdMul||1))*dt; else { f.held=true; f.x=f.bx+Math.sin(f.t*0.85+f.ph)*84; }
        break; }
      case 'elite': {                       // mini-boss: slides in, then prowls across the top
        const stop=H*d.halt;
        if(f.y<stop) f.y+=(d.spd*(f.spdMul||1))*dt;
        else { f.held=true; f.x=f.bx+Math.sin(f.t*0.7+f.ph)*Math.min(140,W*0.34);
               f.y=stop+Math.sin(f.t*1.4)*16; }
        break; }
    }
    f.x=clamp(f.x,26,W-26);
    if(d.shoot && (f.held||f.type==='weaver') && state==='playing'){
      f.st-=dt;
      if(f.st<=0){ f.st=d.shoot*rnd(0.8,1.25)*Math.max(0.42,1-wave*0.024); foeShoot(f); }
    }
    if(f.y>H+60){ foes.splice(i,1); continue; }
    if(f.hp<=0){ killFoe(f,i); }
  }
}
function foeShoot(f){
  if(f.mini){                               // three-shot aimed burst, the annoying cannon
    const aim=Math.atan2(P.y-f.y,P.x-f.x), sp=1+Math.min(0.45,wave*0.015);
    for(let k=-1;k<=1;k++)
      ebul.push({x:f.x,y:f.y+16,vx:Math.cos(aim+k*0.17)*230*sp,vy:Math.sin(aim+k*0.17)*230*sp,r:6});
    sfx.pop(); return;
  }

  const a=Math.atan2(P.y-f.y,P.x-f.x);
  const sp=1+Math.min(0.45,wave*0.015);          // bullets get nastier deeper in
  if(f.type==='brute'){
    for(let k=-1;k<=1;k++)
      ebul.push({x:f.x,y:f.y,vx:Math.cos(a+k*0.26)*190*sp,vy:Math.sin(a+k*0.26)*190*sp,r:6});
  } else {
    ebul.push({x:f.x,y:f.y,vx:Math.cos(a)*205*sp,vy:Math.sin(a)*205*sp,r:5});
  }
  sfx.pop();
}
function drawFoes(){
  for(const f of foes){
    g.save(); g.translate(f.x,f.y);
    const s=f.hit>0 ? 1.22 : 1;
    g.scale(s,s);
    if(f.hit>0){ g.shadowColor='#fff'; g.shadowBlur=22; }
    else { g.shadowColor=T.accent2; g.shadowBlur=11; }
    if(f.sprite==='calc'){
      g.rotate(Math.sin(f.t*3.1+f.ph)*0.24);
      drawCalc(0,0,f.size*0.86);
    } else {
      g.font=f.size+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",serif';
      g.textAlign='center'; g.textBaseline='middle';
      g.fillText(f.glyph,0,0);
    }
    g.restore(); g.shadowBlur=0;
    if(f.max>2){
      const w=f.size*0.9, hp=clamp(f.hp/f.max,0,1);
      g.fillStyle='rgba(0,0,0,.55)'; g.fillRect(f.x-w/2,f.y+f.size*0.58,w,3.5);
      g.fillStyle=hp>0.4?T.glow:'#ff4d6d'; g.fillRect(f.x-w/2,f.y+f.size*0.58,w*hp,3.5);
    }
  }
}
function killFoe(f,i){
  foes.splice(i,1);
  burst(f.x,f.y,Math.min(24,10+f.size/3),T.glow,230,0.6);
  burst(f.x,f.y,6,'#fff',150,0.3);
  sfx.boom(); shake=Math.min(shake+3.5,11);
  if(f.mini){ banner(pick(SMALLBOOMS)); sfx.bonk(); }
  combo++; runKills++; bumpCombo(); addScore(f.sc);   /* multiplier first, so the kill that earns x5 gets x5 */
  floatText(f.x,f.y-14,'+'+Math.round(f.sc*mult),f.mini?'#ffd07a':T.glow);
  od=Math.min(100,od+(f.max>2?7:3.2));
  rollDrop(f.x,f.y,f.max);
}
</script>

<script>
"use strict";
/* ================= drops ================= */
const DROP={w:{c:'#43e8ff',t:'W'},s:{c:'#5fe39a',t:'S'},star:{c:'#ffc46b',t:'*'},
            life:{c:'#ff4d6d',t:'+'},rep:{c:'#9be36f',t:'H'}};
function rollDrop(x,y,tough){
  const r=Math.random();
  let k=null;
  /* v0.3: H repairs the hull. It shows up more often when you actually need it. */
  const hurtBonus = hull<HULL_MAX*0.6 ? 0.10 : 0;
  if(tough>2){ if(r<0.24) k='w'; else if(r<0.40) k='s'; else if(r<0.54+hurtBonus) k='rep';
               else if(r<0.86) k='star'; else if(r<0.875) k='life'; }
  else { if(r<0.036) k='w'; else if(r<0.070) k='s'; else if(r<0.125+hurtBonus) k='rep';
         else if(r<0.26) k='star'; }
  if(k) drops.push({x,y,k,vy:74,t:0,r:15});
}
function updateDrops(dt){
  for(let i=drops.length-1;i>=0;i--){
    const d=drops[i]; d.t+=dt; d.y+=d.vy*dt; d.x+=Math.sin(d.t*2.6)*26*dt;
    /* ---- THE MAGNET ----  (Tinker Deck explainer #1 quotes these five lines) */
    const dx=P.x-d.x, dy=P.y-d.y, dist=Math.hypot(dx,dy);
    if(dist>0.5 && dist<MAGNET_RADIUS){                  /* dist 0 made NaN, and a NaN drop never got collected */
      d.x += dx/dist * MAGNET_PULL * dt;
      d.y += dy/dist * MAGNET_PULL * dt;
    }
    if(dist<d.r+P.r+9){ takeDrop(d); drops.splice(i,1); continue; }
    if(d.y>H+30) drops.splice(i,1);
  }
}
function drawDrops(){
  for(const d of drops){
    const c=DROP[d.k].c, pulse=1+Math.sin(d.t*7)*0.12;
    g.save(); g.translate(d.x,d.y); g.scale(pulse,pulse);
    g.shadowColor=c; g.shadowBlur=16;
    g.strokeStyle=c; g.lineWidth=2.2;
    g.beginPath(); g.arc(0,0,12,0,6.283); g.stroke();
    g.fillStyle='rgba(5,6,15,.75)'; g.fill();
    g.shadowBlur=0; g.fillStyle=c;
    g.font='700 15px "Fredoka",sans-serif'; g.textAlign='center'; g.textBaseline='middle';
    g.fillText(DROP[d.k].t,0,1);
    g.restore();
  }
}
function takeDrop(d){
  if(d.k==='w'){
    if(tier<4){ tier++; sfx.power(); banner('WEAPON UP'); }
    else if(!gunUnlockNext()){ addScore(250); sfx.pick(); }   /* past tier IV a W unlocks the next gun */
    updHUD();
  } else if(d.k==='s'){ shield=shieldMax+SHIELD_BONUS; sfx.power();
    banner(shield>1?('SHIELD x'+shield):'SHIELD UP'); }
  else if(d.k==='rep'){
    if(hull>=HULL_MAX){ addScore(90); sfx.pick(); }
    else { hull=Math.min(HULL_MAX,hull+45); sfx.power(); banner('PATCHED UP!'); bumpHull(); }
    updHUD();
  }
  else if(d.k==='star'){ addScore(60); od=Math.min(100,od+9); sfx.pick(); }
  else if(d.k==='life'){ lives=Math.min(4,lives+1); hull=HULL_MAX; sfx.power();
    banner('EXTRA SHIP!'); updHUD(); }
  burst(d.x,d.y,10,DROP[d.k].c,170,0.4);
}

/* ================= player weapons ================= */
function shoot(){
  const y=P.y-20, G=GUNS[gun], w=TIERS[tier-1];
  const dmg=w.dmg*G.dmg;
  const mk=(x,vx,vy,extra)=>bullets.push(Object.assign({x,y,vx,vy,r:4,dmg,col:G.c},extra||{}));
  if(G.id==='cannon'){
    if(tier===1) mk(P.x,0,-620);
    else if(tier===2){ mk(P.x-8,0,-640); mk(P.x+8,0,-640); }
    else if(tier===3){ mk(P.x,0,-660); mk(P.x-7,-165*SHOT_SPREAD,-620); mk(P.x+7,165*SHOT_SPREAD,-620); }
    else { mk(P.x,0,-700); mk(P.x-9,-90*SHOT_SPREAD,-680); mk(P.x+9,90*SHOT_SPREAD,-680); }
    sfx.shot();
  } else if(G.id==='scatter'){
    const n=3+2*(tier-1);                              // ALWAYS ODD: there must be a centre shot
    for(let i=0;i<n;i++){ const a=-Math.PI/2+(i-(n-1)/2)*0.10*SHOT_SPREAD;
      mk(P.x,Math.cos(a)*540,Math.sin(a)*540); }
    sfx.shot();
  } else if(G.id==='lance'){
    mk(P.x,0,-980,{pierce:true,r:3});
    if(tier>=3){ mk(P.x-11,0,-980,{pierce:true,r:3}); mk(P.x+11,0,-980,{pierce:true,r:3}); }
    sfx.laser();
  } else if(G.id==='seeker'){
    const n=tier>=3?2:1;
    for(let i=0;i<n;i++) mk(P.x+(i?12:-12)*(n-1),rnd(-70,70),-380,{home:1,r:5});
    sfx.pop();
  } else {                                             // ricochet
    const nb=2+tier;                                  // more bounces per tier; extra wide shots at III+
    mk(P.x,0,-620,{bounce:nb,r:5});                   // centre shot at EVERY tier
    mk(P.x-6,-90,-560,{bounce:nb,r:5});
    mk(P.x+6, 90,-560,{bounce:nb,r:5});
    if(tier>=3){ mk(P.x-14,-210,-500,{bounce:nb,r:5}); mk(P.x+14,210,-500,{bounce:nb,r:5}); }
    sfx.shot();
  }
}
function drawBullets(){
  for(const b of bullets){
    g.save(); g.translate(b.x,b.y);
    g.shadowColor=b.col||T.glow; g.shadowBlur=13;
    g.fillStyle=b.col||'#fff5dd';
    if(b.pierce){ g.fillRect(-2.2,-13,4.4,20); }
    else { g.beginPath(); g.ellipse(0,0,3.1,7.4,0,0,6.283); g.fill(); }
    g.restore(); g.shadowBlur=0;
  }
  for(const b of ebul){
    if(b.calc){
      g.save(); g.translate(b.x,b.y); g.rotate(b.rot||0);
      g.shadowColor='#ffd24a'; g.shadowBlur=12;
      drawCalc(0,0,26);
      g.restore(); g.shadowBlur=0; continue;
    }
    g.save(); g.translate(b.x,b.y);
    g.shadowColor='#ff4d6d'; g.shadowBlur=13;
    g.fillStyle='#ffd0da';
    g.beginPath(); g.arc(0,0,b.r,0,6.283); g.fill();
    g.fillStyle='#ff4d6d';
    g.beginPath(); g.arc(0,0,b.r*0.55,0,6.283); g.fill();
    g.restore(); g.shadowBlur=0;
  }
}

/* ================= boss ================= */
/* ===== v0.2 BOSS ROSTER =====
   Four bosses on a rotation, drawn on the canvas so no artwork has to load.
   Each has its own attack set and they get meaner as the waves climb.
   Wave 5 octopus -> 10 zombie cop -> 15 the lunchlady -> 20 the seasonal monster
   -> 25 the Professor. Same five, same order as v0.2. */
let bolts=[];                                   // telegraphed lightning columns

function bossFor(w){
  /* THE BOSS LIST. The game does not know any boss by name -- it just reads this
     array in order. Add one to the list and it joins the rotation. */
  if(NEXT_BOSS>=0 && NEXT_BOSS<ROSTER.length) return ROSTER[NEXT_BOSS];
  const n=Math.floor(w/5);                      // 1,2,3,4,5...
  return ROSTER[(n-1)%ROSTER.length];
}

const OCTO={
  id:'octo', name:'Zap, the Electric Space Octopus', hpMul:1.0, tint:'#7cf0ff', hitR:98,
  draw(b){
    const t=b.t, mad=b.phase>=3;
    g.shadowBlur=0;
    // ---- eight tentacles, tapered, curling, with suckers ----
    // v0.3: as he takes damage they come OFF, in this order, and the stump shows.
    const GONE=[7,0,4];
    for(let i=0;i<8;i++){
      const lost=GONE.indexOf(i)>=0 && GONE.indexOf(i)<(b.broken||0);
      const base=-1.15+i*0.33, curl=Math.sin(t*2.6+i*0.85)*0.6;
      if(lost){                                  // a sad little ragged stump
        g.save(); g.rotate(base);
        g.strokeStyle='#6d3fd6'; g.lineCap='round'; g.lineWidth=17;
        g.beginPath(); g.moveTo(0,30); g.lineTo(0,44); g.stroke();
        g.fillStyle='#9be36f';
        g.beginPath(); g.arc(0,46,7+Math.sin(t*6+i)*1.5,0,6.283); g.fill();
        g.restore(); continue;
      }
      g.save(); g.rotate(base);
      g.lineCap='round';
      let px=0, py=30;
      for(let seg=0;seg<4;seg++){
        const nx=Math.sin(curl*(seg+1))*(seg+1)*14, ny=30+(seg+1)*23;
        g.strokeStyle=seg%2?'#6d3fd6':'#7b4ae0'; g.lineWidth=17-seg*3.4;
        g.beginPath(); g.moveTo(px,py);
        g.quadraticCurveTo(Math.sin(curl*(seg+0.5))*(seg+0.5)*14, py+11, nx, ny);
        g.stroke();
        g.fillStyle='#c9a7ff';                                   // suckers
        g.beginPath(); g.arc(nx*0.72,py+11,Math.max(1.6,3.6-seg*0.7),0,6.283); g.fill();
        px=nx; py=ny;
      }
      g.restore();
    }
    // ---- bulbous alien head ----
    g.fillStyle='#7c4ddb'; g.strokeStyle='#341a6e'; g.lineWidth=4.5;
    g.beginPath(); g.ellipse(0,-14,62,56,0,0,6.283); g.fill(); g.stroke();
    g.fillStyle='rgba(255,255,255,.14)';
    g.beginPath(); g.ellipse(-20,-38,28,14,-0.42,0,6.283); g.fill();
    // three little head-nubs, because aliens
    g.fillStyle='#6d3fd6';
    for(let i=-1;i<=1;i++){ g.beginPath();
      g.ellipse(i*26,-66+Math.abs(i)*7,7,12+Math.sin(t*4+i)*2,i*0.3,0,6.283); g.fill(); g.stroke(); }
    // ---- giant bulging eyes ----
    const lx=clamp((P.x-b.x)/30,-9,9), ly=clamp((P.y-b.y)/55,-7,7);
    for(const sx of [-1,1]){
      g.fillStyle='#fdfdff'; g.strokeStyle='#341a6e'; g.lineWidth=4;
      g.beginPath(); g.ellipse(sx*25,-22,21,24,0,0,6.283); g.fill(); g.stroke();
      g.fillStyle=mad?'#ffe14d':'#ffd24a';                       // alien iris
      g.beginPath(); g.arc(sx*25+lx,-22+ly,11,0,6.283); g.fill();
      g.fillStyle='#0b0f22';                                     // slit pupil
      g.beginPath(); g.ellipse(sx*25+lx,-22+ly,4,9,0,0,6.283); g.fill();
      g.fillStyle='rgba(255,255,255,.85)';
      g.beginPath(); g.arc(sx*25+lx-4,-27+ly,3.2,0,6.283); g.fill();
    }
    // ---- angry brows: lower and steeper when he is furious ----
    g.strokeStyle='#2a1560'; g.lineWidth=7; g.lineCap='round';
    const bw=mad?0.62:0.40, drop=mad?4:0;
    for(const sx of [-1,1]){
      g.beginPath();
      g.moveTo(sx*9,-44+drop);
      g.lineTo(sx*44,-44+drop+Math.sin(bw)*26*(sx>0?1:1)*0.9);
      g.stroke();
    }
    // ---- big toothy grin ----
    g.save();
    g.beginPath(); g.ellipse(0,14,34,mad?21:16,0,0,6.283); g.clip();
    g.fillStyle='#2b0f3d'; g.fillRect(-40,-10,80,60);
    g.fillStyle='#fffaf0';
    for(let i=0;i<7;i++){                                        // upper fangs
      const x=-30+i*10;
      g.beginPath(); g.moveTo(x,-4); g.lineTo(x+10,-4); g.lineTo(x+5,10+(i%2)*4); g.closePath(); g.fill();
    }
    for(let i=0;i<6;i++){                                        // lower fangs
      const x=-26+i*10;
      g.beginPath(); g.moveTo(x,40); g.lineTo(x+10,40); g.lineTo(x+5,26-(i%2)*4); g.closePath(); g.fill();
    }
    g.fillStyle='#e0568f';                                       // tongue
    g.beginPath(); g.ellipse(0,26+Math.sin(t*6)*2,13,7,0,0,6.283); g.fill();
    g.restore();
    g.strokeStyle='#341a6e'; g.lineWidth=4;
    g.beginPath(); g.ellipse(0,14,34,mad?21:16,0,0,6.283); g.stroke();
    // ---- electric crackle around him ----
    g.strokeStyle='#7cf0ff'; g.lineWidth=3.5; g.shadowColor='#7cf0ff'; g.shadowBlur=16;
    for(let i=0;i<4;i++){
      const a=t*5+i*1.57, r0=60, r1=r0+18+Math.sin(t*9+i)*8;
      g.beginPath(); g.moveTo(Math.cos(a)*r0,Math.sin(a)*r0*0.9-14);
      g.lineTo(Math.cos(a+0.13)*((r0+r1)/2),Math.sin(a+0.13)*((r0+r1)/2)*0.9-14);
      g.lineTo(Math.cos(a)*r1,Math.sin(a)*r1*0.9-14); g.stroke();
    }
    g.shadowBlur=0; g.lineCap='butt';
  },
  fire(b,aim){
    if(b.phase>=2 && Math.random()<0.55){        // lightning columns: warn, then strike
      strike(b.phase===3?3:2, 0.85, 36);
      banner('LIGHTNING! MOVE!'); sfx.warn(); return;
    }
    const n=b.phase===3?14:10;
    for(let i=0;i<n;i++){ const a=i/n*6.283+b.t;
      ebul.push({x:b.x,y:b.y,vx:Math.cos(a)*(150+b.phase*22),vy:Math.sin(a)*(150+b.phase*22),r:6}); }
    sfx.pop();
  }
};

const COP={
  id:'cop', name:'Officer Grumbles, Zombie School Cop', hpMul:1.25, tint:'#7bdc7b', hitR:76,
  draw(b){
    const t=b.t;
    g.fillStyle='#2b3a6b'; g.strokeStyle='#16224a'; g.lineWidth=4;   // body
    g.beginPath(); g.roundRect(-46,6,92,66,14); g.fill(); g.stroke();
    g.fillStyle='#7bdc7b';                                            // head
    g.beginPath(); g.arc(0,-26,40,0,6.283); g.fill(); g.stroke();
    const br=b.broken||0;
    g.save(); g.rotate(br*0.13);                                      // v0.3: hat slides off
    g.fillStyle='#1d2a55';                                            // hat
    g.beginPath(); g.roundRect(-44,-70,88,24,8); g.fill(); g.stroke();
    g.beginPath(); g.roundRect(-52,-50,104,12,6); g.fill(); g.stroke();
    if(br<2){ g.fillStyle='#ffd24a'; g.beginPath();                   // badge (falls off at 2)
      for(let i=0;i<5;i++){ const a=-Math.PI/2+i*1.2566;
        g.lineTo(Math.cos(a)*11,-60+Math.sin(a)*11); g.lineTo(Math.cos(a+0.63)*5,-60+Math.sin(a+0.63)*5); }
      g.closePath(); g.fill(); }
    g.restore();
    g.fillStyle='#fff'; g.beginPath(); g.arc(-14,-28,11,0,6.283); g.arc(14,-28,11,0,6.283); g.fill();
    g.fillStyle='#c22'; g.beginPath();
    g.arc(-14+Math.sin(t*2)*3,-28,5,0,6.283); g.arc(14+Math.sin(t*2)*3,-28,5,0,6.283); g.fill();
    if(br>=3){                                                        // one eye goes swirly
      g.strokeStyle='#c22'; g.lineWidth=2.4; g.beginPath();
      for(let k=0;k<26;k++){ const a=k*0.42, rr=k*0.36;
        g.lineTo(-14+Math.cos(a+t*6)*rr,-28+Math.sin(a+t*6)*rr); }
      g.stroke();
    }
    if(br>=1){ g.fillStyle='#f0d9a8'; g.save(); g.rotate(0.5);        // a plaster on the chin
      g.fillRect(-6,4,26,9); g.restore(); }
    g.strokeStyle='#0b0f22'; g.lineWidth=3;                            // grumpy mouth
    g.beginPath(); g.arc(0,-4,16,3.6,5.8); g.stroke();
  },
  fire(b,aim){
    if(b.phase>=2 && Math.random()<0.4){ banner('DETENTION'); for(let i=0;i<3;i++) spawnFoe('rusher',rnd(60,W-60)); sfx.warn(); return; }
    if(b.phase===3 && Math.random()<0.45){       // whistle shockwave: a ring with one gap to slip through
      const gap=Math.random()*6.283;
      for(let i=0;i<22;i++){ const a=i/22*6.283;
        if(Math.abs(((a-gap+Math.PI)%6.283)-Math.PI)<0.5) continue;
        ebul.push({x:b.x,y:b.y,vx:Math.cos(a)*205,vy:Math.sin(a)*205,r:7}); }
      banner('WHISTLE!'); sfx.warn(); return;
    }

/* ============================================================================
   v0.3 -- THE PROFESSOR'S POP QUIZ
   Professor Von Homework already had a POP QUIZ attack in v0.2; in v0.3 it is an
   actual quiz. He is not mean about maths -- he LOVES it, unbearably, and that is
   the whole joke. He fires long division, he flings calculators, and the one thing
   that can hurt him is an answer so silly his brain gives up.
   ========================================================================== */
const QUIZ=[
  {q:'144 \u00f7 12', a:'12', silly:['A BURRITO','12 SOCKS','ORANGE']},
  {q:'96 \u00f7 8',   a:'12', silly:['A BURP','BANANA','SIX CATS']},
  {q:'81 \u00f7 9',   a:'9',  silly:['ELEVENTY','A SANDWICH','PURPLE']},
  {q:'150 \u00f7 5',  a:'30', silly:['A LOT','LOTS OF FLIES','SPAGHETTI']},
  {q:'72 \u00f7 6',   a:'12', silly:['FISH','A HUNDRED DOGS','WEDNESDAY']},
  {q:'63 \u00f7 7',   a:'9',  silly:['NINE PICKLES','A SNEEZE','TOAST']},
  {q:'100 \u00f7 4',  a:'25', silly:['CHEESE','A BIG ONE','25 FEET']},
  {q:'56 \u00f7 8',   a:'7',  silly:['GRAPES','BLUE','ONE PIZZA']},
  {q:'132 \u00f7 11', a:'12', silly:['A GYM SOCK','MOOSE','TWELVETY']},
  {q:'45 \u00f7 5',   a:'9',  silly:['NINE? NO. SOUP.','HONK','A LITTLE GUY']}
];

/* where the answer bubbles sit: below the boss, above the ship, on any screen */
function quizBase(){ return clamp(H*0.44, 200, Math.max(210,H-215)); }
function ansFont(){ return '700 '+Math.max(12,Math.min(18,Math.round(W/23)))+'px "Fredoka",system-ui,sans-serif'; }

function popQuiz(){
  const Q=pick(QUIZ);
  const near=String(Math.max(1,(+Q.a)+pick([1,-1,2,-2,3])));
  const opts=[{t:Q.a,k:'right'},{t:near,k:'near'},{t:pick(Q.silly),k:'silly'}];
  for(let i=opts.length-1;i>0;i--){                       // shuffle the rows
    const j=Math.floor(Math.random()*(i+1)), tmp=opts[i]; opts[i]=opts[j]; opts[j]=tmp; }
  answers=[]; quizQ=Q.q+' = ?';
  const base=quizBase();
  g.font=ansFont();
  for(let i=0;i<opts.length;i++){
    const w=Math.min(W-26, Math.max(70, g.measureText(opts[i].t).width+34));
    answers.push({x:clamp(rnd(w/2+10,W-w/2-10),w/2+10,Math.max(w/2+10,W-w/2-10)),
                  y:base+i*54, w:w, h:38, vx:(i%2?1:-1)*rnd(30,60),
                  t:0, life:11.5, txt:opts[i].t, k:opts[i].k});
  }
  if(boss) boss.atk=3.4;
  banner('POP QUIZ!!'); sfx.warn();
}
function updAnswers(dt){
  if(!answers.length) return;
  for(let i=answers.length-1;i>=0;i--){
    const a=answers[i]; a.t+=dt; a.life-=dt; a.x+=a.vx*dt;
    if(a.x-a.w/2<8){ a.x=8+a.w/2; a.vx=Math.abs(a.vx); }
    if(a.x+a.w/2>W-8){ a.x=W-8-a.w/2; a.vx=-Math.abs(a.vx); }
    if(a.life<=0) answers.splice(i,1);
  }
  if(!answers.length && quizQ){ quizQ=''; banner('NOBODY ANSWERED!'); }
}
function drawAnswers(){
  if(!answers.length) return;
  g.textAlign='center'; g.textBaseline='middle';
  if(quizQ){                                             // the question, on its own pill
    const base=quizBase();
    g.font='800 '+Math.max(17,Math.min(27,Math.round(W/14)))+'px "Fredoka",system-ui,sans-serif';
    const qw=Math.min(W-18, g.measureText(quizQ).width+40);
    g.fillStyle='rgba(6,8,22,.94)'; g.strokeStyle=T.glow; g.lineWidth=2.5;
    g.beginPath(); g.roundRect(W/2-qw/2, base-74, qw, 50, 14); g.fill(); g.stroke();
    g.fillStyle=T.glow; g.fillText(quizQ, W/2, base-59);
    g.font='700 10.5px "Fredoka",system-ui,sans-serif'; g.fillStyle='#9fb0d8';
    g.fillText('SHOOT THE SILLIEST ANSWER!', W/2, base-38);
  }
  g.font=ansFont();
  for(const a of answers){
    g.save(); g.translate(a.x, a.y+Math.sin(a.t*4)*3.5); g.rotate(Math.sin(a.t*2.2)*0.055);
    g.shadowColor='#ffd24a'; g.shadowBlur=12;
    g.fillStyle='rgba(8,12,30,.93)'; g.strokeStyle='#ffd24a'; g.lineWidth=2.5;
    g.beginPath(); g.roundRect(-a.w/2,-a.h/2,a.w,a.h,12); g.fill(); g.stroke();
    g.shadowBlur=0; g.fillStyle='#fff5dd';
    g.fillText(a.txt,0,1);
    g.restore();
  }
  g.textAlign='left'; g.textBaseline='alphabetic'; g.shadowBlur=0;
}
function hitAnswer(j,x,y){
  const a=answers[j];
  if(a.k==='silly'){
    burst(x,y,26,'#ffd24a',300,0.8); burst(x,y,14,'#fff',200,0.5);
    answers=[]; quizQ='';
    if(boss){
      boss.hp-=boss.max*0.17; boss.hit=0.32; boss.stun=2.3; boss.warn=0;
      shake=22; flashT=0.28; sfx.wrongo(); ebul.length=0;
      banner(pick(['THAT IS NOT A NUMBER!','DOES NOT COMPUTE!','KA-BLOOEY!','MY BRAIN!']));
      addScore(300);
      if(boss.hp<=0) killBoss();
    }
  } else {
    answers.splice(j,1);
    burst(x,y,8,'#8f9fb8',150,0.35); sfx.beepboop();
    banner(a.k==='right' ? 'CORRECT! I LOVE THAT!' : 'CLOSE! NOT SILLY THOUGH!');
  }
}
