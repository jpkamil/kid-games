/* ============================================================================
   v0.3 -- BOSSES FALL APART, AND THE BITS ARE DANGEROUS
   Every quarter of its health a boss loses a piece of itself. The piece is a real
   object on the field: it hangs in the air flashing for half a second (the
   telegraph), then falls. Touch it and it hurts. SHOOT it and it pops for points.
   That last part matters -- a hazard you can fight back against is fun, one you
   can only run from is homework.
   ========================================================================== */
const DEBRIS_CAP=12;
function shed(kind,x,y,vx,r,hp){
  if(!DEBRIS_ON) return;
  if(debris.length>=DEBRIS_CAP) debris.shift();
  debris.push({kind,x:clamp(x,26,Math.max(27,W-26)),y,vx,vy:0,gr:rnd(55,95),
    rot:rnd(0,6.283),spin:rnd(-2.2,2.2),r,hp,max:hp,t:0,warn:0.55,life:13});
}
function bossBreak(b){
  const id=(b.def&&b.def.id)||'theme';
  shake=Math.max(shake,16); flashT=0.18;
  if(id==='octo'){
    banner('A TENTACLE FELL OFF!'); sfx.rip();
    shed('tentacle', b.x+rnd(-60,60), b.y+40, rnd(-60,60), 22, 5);
  } else if(id==='cop'){
    banner('MOVE ALONG! MOVE ALONG!'); sfx.rip();
    shed('barricade', b.x+rnd(-70,70), b.y+30, rnd(-50,50), 26, 6);
  } else if(id==='lunch'){
    banner('MYSTERY MEATLOAF!'); sfx.rip();
    shed('meatloaf', b.x+rnd(-70,70), b.y+30, rnd(-45,45), 21, 5);
  } else if(id==='prof'){
    banner('HE GAVE HIMSELF AN A+!'); sfx.rip();
    for(let i=0;i<2;i++) shed('worksheet', b.x+rnd(-80,80), b.y+30, rnd(-70,70), 18, 3);
  } else {
    banner('A BIT FELL OFF!'); sfx.rip();
    shed('chunk', b.x+rnd(-60,60), b.y+30, rnd(-55,55), 20, 5);
  }
}
function updDebris(dt){
  for(let i=debris.length-1;i>=0;i--){
    const d=debris[i]; d.t+=dt;
    if(d.warn>0){ d.warn-=dt; continue; }          // hangs in the air first: telegraph
    d.life-=dt; d.rot+=d.spin*dt;
    d.vy=Math.min(d.vy+d.gr*dt,235);
    d.x+=d.vx*dt; d.y+=d.vy*dt;
    if(d.x<d.r){ d.x=d.r; d.vx=Math.abs(d.vx); }
    if(d.x>W-d.r){ d.x=W-d.r; d.vx=-Math.abs(d.vx); }
    if(state==='playing' && P.inv<=0 && Math.hypot(d.x-P.x,d.y-P.y)<d.r+P.r*0.8){
      hurt(22, d.kind==='tentacle'?'FLOOMP!':d.kind==='meatloaf'?'SPLORT!':'WHACK!');
      d.hp=0;
    }
    if(d.hp<=0 || d.life<=0 || d.y>H+70){
      if(d.hp<=0 && d.life>0){ burst(d.x,d.y,16,T.glow,240,0.6); sfx.pop(); addScore(45); }
      debris.splice(i,1);
    }
  }
}
function drawDebris(){
  for(const d of debris){
    g.save(); g.translate(d.x,d.y);
    if(d.warn>0){                                   // the telegraph: flash in place
      const p=Math.abs(Math.sin(d.warn*24));
      g.globalAlpha=0.35+p*0.5;
      g.strokeStyle='#ff4d6d'; g.lineWidth=3;
      g.beginPath(); g.arc(0,0,d.r+8+p*10,0,6.283); g.stroke();
      g.globalAlpha=0.5+p*0.5;
    }
    g.rotate(d.rot);
    if(d.kind==='tentacle'){
      g.strokeStyle='#7b4ae0'; g.lineCap='round'; g.lineWidth=13;
      g.beginPath(); g.moveTo(-20,-10);
      g.quadraticCurveTo(0,10+Math.sin(d.t*6)*8, 20,-8); g.stroke();
      g.fillStyle='#c9a7ff';
      for(let k=-1;k<=1;k++){ g.beginPath(); g.arc(k*13,2,3.2,0,6.283); g.fill(); }
      g.fillStyle='#9be36f';                        // a little goo on the torn end
      g.beginPath(); g.arc(-22,-11,5,0,6.283); g.fill();
    } else if(d.kind==='barricade'){
      g.fillStyle='#f5f1e6'; g.strokeStyle='#3a3f52'; g.lineWidth=2.5;
      g.beginPath(); g.roundRect(-26,-8,52,16,4); g.fill(); g.stroke();
      g.fillStyle='#e0533c';
      for(let k=0;k<3;k++){ g.save(); g.translate(-18+k*18,0); g.rotate(0.6);
        g.fillRect(-4,-11,8,22); g.restore(); }
    } else if(d.kind==='meatloaf'){
      g.fillStyle='#8a7a52'; g.strokeStyle='#5d5133'; g.lineWidth=3;
      g.beginPath(); g.roundRect(-21,-13,42,26,7); g.fill(); g.stroke();
      g.fillStyle='#a7e05a';
      g.beginPath(); g.ellipse(-6,-3,6,4,0.3,0,6.283); g.fill();
      g.beginPath(); g.ellipse(8,4,5,3.5,-0.2,0,6.283); g.fill();
      g.strokeStyle='#a7e05a'; g.lineWidth=2.5; g.globalAlpha*=.8;
      for(let k=-1;k<=1;k++){ g.beginPath();
        g.moveTo(k*10,-15); g.quadraticCurveTo(k*10+5,-22,k*10,-29); g.stroke(); }
    } else if(d.kind==='worksheet'){
      g.fillStyle='#f6f8fd'; g.strokeStyle='#b9c4d8'; g.lineWidth=2;
      g.beginPath(); g.roundRect(-15,-19,30,38,3); g.fill(); g.stroke();
      g.strokeStyle='#c9d3e5'; g.lineWidth=1.6;
      for(let k=0;k<5;k++){ g.beginPath(); g.moveTo(-10,-12+k*7); g.lineTo(10,-12+k*7); g.stroke(); }
      /* v0.3 TONE FIX: this used to be a big red X. A worksheet that falls out of a
         teacher and then hurts you, with a big red X on it, is a joke about bad
         grades -- which is exactly the joke we are not making. So instead: the
         Professor grades his OWN homework, and he gives himself top marks. */
      g.fillStyle='#e0533c'; g.font='800 17px ui-monospace,monospace';
      g.textAlign='center'; g.textBaseline='middle';
      g.fillText('A+',-1,1);
      g.textAlign='left'; g.textBaseline='alphabetic';
      g.fillStyle='#ffd24a';                                    // and a gold star sticker
      g.beginPath();
      for(let k=0;k<5;k++){ const a=-Math.PI/2+k*1.2566;
        g.lineTo(8+Math.cos(a)*5.5,-13+Math.sin(a)*5.5);
        g.lineTo(8+Math.cos(a+0.63)*2.4,-13+Math.sin(a+0.63)*2.4); }
      g.closePath(); g.fill();
    } else {
      g.fillStyle=T.accent; g.strokeStyle='#0b0f22'; g.lineWidth=3;
      g.beginPath(); g.arc(0,0,17,0,6.283); g.fill(); g.stroke();
      g.fillStyle='#0b0f22';
      g.beginPath(); g.arc(-5,-3,2.6,0,6.283); g.arc(5,-3,2.6,0,6.283); g.fill();
    }
    g.restore(); g.globalAlpha=1; g.lineCap='butt';
  }
  /* health pips on the tougher bits, so it is obvious they can be shot */
  for(const d of debris){
    if(d.warn>0 || d.hp>=d.max) continue;
    const w=d.r*1.8, f=clamp(d.hp/d.max,0,1);
    g.fillStyle='rgba(0,0,0,.55)'; g.fillRect(d.x-w/2,d.y+d.r+5,w,3.5);
    g.fillStyle=T.glow; g.fillRect(d.x-w/2,d.y+d.r+5,w*f,3.5);
  }
}

const ROSTER=[OCTO,PROF,COP,LUNCH,THEMEBOSS];   /* the Professor's POP QUIZ is the best bit; wave 10, not 25 */

/* ---- lightning columns: warn where, then strike. Always dodgeable. ---- */
/* ============================================================================
   v0.3 FIX -- THE LIGHTNING ACTUALLY AIMS AT YOU NOW
   The columns used to land at rnd(20, W-20): pure chance, nothing to do with where
   the ship was. Measured headlessly with the ship parked dead centre and never
   dodging for 104 seconds: 2 lightning hits out of 22 total. So the one telegraphed
   dodge in the whole game almost never had anything to dodge, which is why it read
   as "the lightning does nothing".
   Now the FIRST column is aimed at the lane you are standing in -- which is what
   "A glowing blue column means lightning is about to hit that lane. Move." always
   promised. The rest stay random, so it is a warning and not a guaranteed tag, and
   the telegraph is still a very slow 0.7-0.85s.
   ========================================================================== */
function strike(n,warn,w){
  const lo=12, hi=Math.max(13,W-12);
  bolts.push({x:clamp(P.x+rnd(-6,6),lo,hi), warn:warn, live:0, w:w});
  for(let i=1;i<n;i++)                       // the others are still luck of the draw,
    bolts.push({x:rnd(20,Math.max(21,W-20)), // staggered so they do not all crack at once
                warn:warn+rnd(0,0.14), live:0, w:w});
}
function updBolts(dt){
  for(let i=bolts.length-1;i>=0;i--){
    const L=bolts[i];
    if(L.warn>0){ L.warn-=dt; if(L.warn<=0){ L.live=0.34; sfx.zap(); shake=Math.max(shake,10); } }
    else if(L.live>0){
      L.live-=dt;
      if(state==='playing' && Math.abs(P.x-L.x)<L.w*0.5-P.r*0.25 && P.inv<=0) hurt(26,'ZAAAP!');
    } else bolts.splice(i,1);
  }
}
function drawBolts(){
  for(const L of bolts){
    if(L.warn>0){
      g.globalAlpha=0.20+Math.abs(Math.sin(L.warn*26))*0.30;
      g.fillStyle='#7cf0ff'; g.fillRect(L.x-L.w*0.5,0,L.w,H); g.globalAlpha=1;
    } else if(L.live>0){
      g.save(); g.shadowColor='#7cf0ff'; g.shadowBlur=26;
      /* v0.3: the white bolt is drawn to match the damage window, so if it looks
         like it touched you, it did. It used to wander wider than it could hurt. */
      g.strokeStyle='#eafcff'; g.lineWidth=L.w*0.62; g.globalAlpha=clamp(L.live*3,0,1);
      g.beginPath(); let y=0,x=L.x; g.moveTo(x,y);
      while(y<H){ y+=26; x=L.x+rnd(-5,5); g.lineTo(x,y); }
      g.stroke(); g.restore(); g.globalAlpha=1;
    }
  }
}

function spawnBoss(){
  const tough=1+Math.floor(wave/5);
  const D=bossFor(wave);
  const base=(150+wave*22)*D.hpMul*BOSS_HP;
  boss={hp:base, max:base, x:W/2, y:-120, ty:H*0.20,
        t:0, atk:1.6, warn:0, phase:1, hit:0, stun:0, broken:0,
        dir:Math.random()<.5?-1:1, tough, def:D};
  bolts=[]; answers=[]; quizQ=''; debris=[];
  /* the Professor brings his own hazard: calculators, not seasonal snacks */
  calcMode=(D.id==='prof');
  if(calcMode) for(const f of foes) f.sprite='calc';
  const nm=D.name||T.bossName;
  $('bossbar').classList.add('on'); $('bossName').textContent=nm;
  banner('!! '+nm.toUpperCase()+' !!'); sfx.warn();
}
function updateBoss(dt){
  const b=boss; b.t+=dt; if(b.hit>0) b.hit-=dt;
  if(b.y<b.ty){ b.y+=110*dt; return; }
  const ratio=b.hp/b.max;
  b.phase = ratio>0.62?1 : ratio>0.3?2 : 3;
  /* v0.3: every quarter of its health, a piece falls off */
  const stage = ratio>0.75?0 : ratio>0.5?1 : ratio>0.25?2 : 3;
  if(stage>b.broken){ b.broken=stage; bossBreak(b); }
  if(b.broken>0 && Math.random()<0.30)          // it smokes now, visibly
    parts.push({x:b.x+rnd(-46,46), y:b.y+rnd(-30,30), vx:rnd(-16,16), vy:rnd(-46,-18),
      life:0.9, max:0.9, col:'#6b7590', r:rnd(2.4,5)});
  if(b.stun>0){                                   // brain overload: he just spins
    b.stun-=dt; b.warn=0;
    b.x=clamp(b.x+Math.sin(b.t*17)*70*dt,110,Math.max(111,W-110));
    b.y=b.ty+Math.sin(b.t*9)*12;
    if(b.stun<=0) b.atk=1.5;
    return;
  }
  const spd=(b.phase===3?128:b.phase===2?98:74);
  b.x+=b.dir*spd*dt;
  if(b.x<110){ b.x=110; b.dir=1; } if(b.x>W-110){ b.x=W-110; b.dir=-1; }
  b.y=b.ty+Math.sin(b.t*1.2)*18;

  if(b.warn>0){
    b.warn-=dt;
    if(b.warn<=0) bossFire();
    return;
  }
  b.atk-=dt;
  if(b.atk<=0){
    const ramp=Math.max(0.6,1-wave*0.012);          // fires faster the deeper you get
    b.atk = (b.phase===3?1.15 : b.phase===2?1.5 : 1.95)*ramp;
    b.warn=0.42; sfx.warn();
  }
}
function bossFire(){
  const b=boss, aim=Math.atan2(P.y-b.y,P.x-b.x);
  (b.def||THEMEBOSS).fire(b,aim);
}
function drawBoss(){
  const b=boss, D=b.def||THEMEBOSS;
  g.save(); g.translate(b.x,b.y);
  const wob=1+Math.sin(b.t*2.2)*0.02;
  g.scale(wob,wob);
  if(b.warn>0 && Math.floor(b.warn*18)%2===0){ g.shadowColor='#fff'; g.shadowBlur=34; }
  else { g.shadowColor=D.tint||T.accent2; g.shadowBlur=20; }
  g.lineJoin='round';
  /* v0.3: a damaged boss limps */
  if(b.broken>0) g.rotate(Math.sin(b.t*4.5)*0.018*b.broken);
  D.draw(b);
  /* v0.3 CONTACT TELEGRAPH: get near enough to be hit and the danger ring shows up */
  const R=D.hitR||74, near=Math.hypot(b.x-P.x,(b.y-P.y)*0.86);
  if(near<R+90 && state==='playing'){
    g.save(); g.shadowBlur=0;
    g.globalAlpha=clamp((R+90-near)/110,0,1)*(0.30+Math.abs(Math.sin(b.t*7))*0.35);
    g.strokeStyle='#ff4d6d'; g.lineWidth=3; g.setLineDash([9,9]);
    g.beginPath(); g.ellipse(0,0,R,R/0.86,0,0,6.283); g.stroke();
    g.setLineDash([]); g.restore(); g.globalAlpha=1;
  }
  if(b.hit>0 && D.id!=='theme'){
    g.globalAlpha=clamp(b.hit*3.5,0,0.6); g.fillStyle='#fff';
    g.beginPath(); g.arc(0,-6,74,0,6.283); g.fill(); g.globalAlpha=1;
  }
  g.restore(); g.shadowBlur=0;
  g.textAlign='left';
}
function killBoss(){
  const b=boss, gen=runGen;
  for(let i=0;i<7;i++) setTimeout(()=>{
    if((state!=='playing'&&state!=='over')||gen!==runGen) return;
    burst(b.x+rnd(-60,60),b.y+rnd(-50,50),16,pick([T.glow,T.accent,'#fff']),300,0.85);
  },i*95);
  sfx.bigboom(); shake=26; flashT=0.3;
  addScore(700+wave*90);
  boss=null; bolts=[]; answers=[]; quizQ=''; calcMode=false; debris=[];
  $('bossbar').classList.remove('on');
  banner(pick(BOOMS));
  if(shieldMax<3){ shieldMax++; shield=shieldMax+SHIELD_BONUS;
    setTimeout(()=>{ if(gen===runGen) banner('SHIELD UPGRADE x'+shield); },900); }
  if(!gunUnlockNext()) addScore(400);
  od=Math.min(100,od+30);
}
</script>

<script>
"use strict";
/* ================= waves ================= */
function startWave(n){
  wave=n; updHUD(); spawnQ=[]; spawnT=0; waveAge=0;
  if(n%5===0){ banner('WAVE '+n); bossPending=1.15; return; }
  let budget=5+n*3.7+Math.max(0,n-10)*1.6, tAcc=Math.max(0.28,0.5-n*0.006);
  const unlock=[['drifter',1],['rusher',2],['weaver',3],['turret',5],['brute',7]];
  const pool=unlock.filter(u=>n>=u[1]).map(u=>u[0]);
  let guard=0;
  while(budget>0.8 && guard++<80){
    const t=pick(pool), c=FOE[t].cost;
    if(c>budget) continue;
    budget-=c;
    spawnQ.push({type:t,at:tAcc,x:rnd(48,W-48)});
    tAcc+=rnd(0.26,0.72);
  }
  if(n>=6 && n%5!==0){
    const minis=n>=12?2:1;
    for(let i=0;i<minis;i++) spawnQ.push({type:'elite',at:1.6+i*3.4+rnd(0,1.2),x:rnd(70,W-70)});
  }
  spawnQ.sort((a,b)=>a.at-b.at);        // elites were appended after the budget entries
  banner('WAVE '+n);
}
function pumpWave(dt){
  if(bossPending>0){                      // boss inbound: hold the wave open
    bossPending-=dt;
    if(bossPending<=0 && !boss) spawnBoss();
    return;
  }
  spawnT+=dt;
  while(spawnQ.length && spawnQ[0].at<=spawnT){
    const s=spawnQ.shift(); spawnFoe(s.type,s.x);
  }
  if(!spawnQ.length && foes.length && !boss){
    waveAge+=dt;
    if(waveAge>45){                        // nothing but parked foes for 45s: let them leave
      for(const f of foes) f.leaving=true;
      if(waveAge>60){ foes.length=0; banner('THEY RETREATED'); waveAge=0; }
    }
  } else waveAge=0;
  if(!spawnQ.length && !foes.length && !boss){
    waveClearT-=dt;
    if(waveClearT<=0){ waveClearT=1.6; startWave(wave+1); }
  } else waveClearT=1.6;
}

/* ================= scoring ================= */
function addScore(v){ score+=Math.round(v*mult); updHUD(); }
let runGen=0, comboFlash=0, comboFlashTxt='';
function bumpCombo(){
  const before=mult;
  mult = combo>=70?5 : combo>=40?4 : combo>=20?3 : combo>=8?2 : 1;
  const el=$('combo');
  el.textContent='x'+mult+(mult>1?'  '+combo+' chain':'');
  el.classList.toggle('on',mult>1);
  if(mult>before){
    el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
    comboFlash=1.1; comboFlashTxt='x'+mult+' COMBO!';   /* on the canvas, where he is looking */
  }
}

/* ================= damage ================= */
function hurt(dmg,word){
  if(P.inv>0||state!=='playing') return;
  dmg=dmg||22;
  combo=0; bumpCombo();
  burst(P.x,P.y,20,'#ff4d6d',250,0.62);
  shake=Math.max(shake,15); sfx.ouch();
  P.inv=1.15; hitFlash=0.32;                 // every hit now LOOKS and SOUNDS like a hit
  if(shield>0){
    shield--; sfx.pick(); burst(P.x,P.y,16,'#5fe39a',210,0.5);
    banner(shield>0?('SHIELD HELD! '+shield+' LEFT'):'SHIELD DOWN!');
    P.inv=Math.max(P.inv,0.95); return;
  }
  hull-=dmg; updHUD(); bumpHull();
  if(hull>0){ banner(word||pick(HITWORDS)); return; }
  /* hull gone: that costs a ship, and knocks the gun down a tier */
  hull=HULL_MAX; lives--; tier=Math.max(1,tier-1);
  P.inv=2.0; flashT=0.3; shake=22; sfx.boom(); updHUD();
  if(lives<0) gameOver(); else banner('SHIP LOST! KA-BLAMMO!');
}

/* ================= overdrive ================= */
function nova(){
  if(od<100||state!=='playing') return;
  od=0; updOD(); sfx.nova(); shake=24; flashT=0.34;
  hitstop=0.12; rings.push({x:P.x,y:P.y,r:14,t:0});   /* a beat of freeze, then a shockwave */
  P.inv=Math.max(P.inv,1.25); ebul.length=0;
  for(const f of foes){ f.hp-=6; f.hit=0.22; }
  if(boss){ boss.hp-=60; boss.hit=0.3; if(boss.hp<=0) killBoss(); }
  for(let i=0;i<44;i++){ const a=i/44*6.283;
    parts.push({x:P.x,y:P.y,vx:Math.cos(a)*rnd(250,470),vy:Math.sin(a)*rnd(250,470),
      life:0.85,max:0.85,col:i%2?T.glow:'#fff',r:rnd(2,4.7)}); }
  banner(pick(['OVERDRIVE!','ZAAAAP!','KA-POW!','FWOOOSH!']));
}

/* ================= collisions ================= */
function collide(dt){
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    if(b.bcd>0) b.bcd-=dt;
    if(b.home){                                        // seekers steer to the nearest target
      let tx=null,ty=null,bd=1e9;
      if(boss&&boss.y>0){ tx=boss.x; ty=boss.y; bd=Math.hypot(b.x-tx,b.y-ty); }
      for(const f of foes){ const d=Math.hypot(b.x-f.x,b.y-f.y); if(d<bd){ bd=d; tx=f.x; ty=f.y; } }
      if(tx!==null){
        const want=Math.atan2(ty-b.y,tx-b.x), cur=Math.atan2(b.vy,b.vx);
        let d=want-cur; while(d>Math.PI)d-=6.283; while(d<-Math.PI)d+=6.283;
        const a=cur+clamp(d,-3.4*dt,3.4*dt), sp=Math.hypot(b.vx,b.vy)+260*dt;
        b.vx=Math.cos(a)*Math.min(sp,760); b.vy=Math.sin(a)*Math.min(sp,760);
      }
      if(Math.random()<0.5) burst(b.x,b.y,1,b.col||'#b9f5a0',40,0.18);
    }
    b.x+=b.vx*dt; b.y+=b.vy*dt;
    if(b.bounce>0){                                    // ricochet off the side walls
      if(b.x<6){ b.x=6; b.vx=Math.abs(b.vx); b.bounce--; sfx.tap(); }
      else if(b.x>W-6){ b.x=W-6; b.vx=-Math.abs(b.vx); b.bounce--; sfx.tap(); }
    }
    let gone=false;
    if(boss && boss.y>0 && Math.hypot(b.x-boss.x,b.y-boss.y)<64){
      if(!b.pierce || !(b.bcd>0)){                 // a pierce bullet may not re-hit every frame
        boss.hp-=b.dmg*1.6; boss.hit=0.12;
        burst(b.x,b.y,3,'#fff',110,0.2);
        if(b.pierce) b.bcd=0.12;
      }
      if(!b.pierce) gone=true;
      if(boss.hp<=0){ killBoss(); }
    }
    if(!gone && debris.length){
      for(let j=0;j<debris.length;j++){
        const d=debris[j];
        if(d.warn>0) continue;
        if(Math.hypot(b.x-d.x,b.y-d.y)<d.r+b.r){
          if(b.pierce){ if(!b.seen) b.seen=[]; if(b.seen.indexOf(d)>=0) continue; b.seen.push(d); }
          d.hp-=b.dmg; burst(b.x,b.y,3,T.glow,120,0.2);
          if(!b.pierce) gone=true;
          break;
        }
      }
    }
    if(!gone && answers.length){
      for(let j=answers.length-1;j>=0;j--){
        const a=answers[j];
        if(Math.abs(b.x-a.x)<a.w/2+b.r && Math.abs(b.y-a.y)<a.h/2+b.r){
          hitAnswer(j,b.x,b.y);
          if(!b.pierce) gone=true;
          break;
        }
      }
    }
    if(!gone){
      for(let j=0;j<foes.length;j++){
        const f=foes[j];
        if(Math.hypot(b.x-f.x,b.y-f.y)<f.r+b.r){
          if(b.pierce){                      // one hit per target, ever
            if(!b.seen) b.seen=[];
            if(b.seen.indexOf(f)>=0) continue;
            b.seen.push(f);
          }
          f.hp-=b.dmg; f.hit=0.11;
          burst(b.x,b.y,3,T.glow,120,0.2);
          if(!b.pierce) gone=true;
          break;
        }
      }
    }
    if(gone||b.y<-30||b.y>H+40||b.x<-40||b.x>W+40) bullets.splice(i,1);
  }
  for(let i=ebul.length-1;i>=0;i--){
    const b=ebul[i];
    b.x+=b.vx*dt; b.y+=b.vy*dt;
    if(b.spin) b.rot=(b.rot||0)+b.spin*dt;
    if(b.y<-50||b.y>H+50||b.x<-50||b.x>W+50){ ebul.splice(i,1); continue; }
    if(P.inv<=0 && Math.hypot(b.x-P.x,b.y-P.y)<b.r+P.r){
      ebul.splice(i,1); hurt(b.calc?22:20, b.calc?'BEEP! BONK!':null); }
  }
  if(P.inv<=0){
    for(const f of foes){
      if(Math.hypot(f.x-P.x,f.y-P.y)<f.r+P.r){ f.hp-=3; f.hit=0.15; hurt(20,'SMACK!'); break; }
    }
    /* v0.3 CONTACT DAMAGE. Each boss carries its own reach, so the octopus's
       tentacles can actually catch you instead of passing through. Telegraphed by
       the red ring drawn in drawBoss() whenever you get near it. */
    if(boss && boss.y>0){
      const R=(boss.def&&boss.def.hitR)||74;
      const dx=boss.x-P.x, dy=(boss.y-P.y)*0.86;
      if(Math.hypot(dx,dy)<R+P.r*0.4) hurt(18, boss.def&&boss.def.id==='octo'?'SLAP! A TENTACLE!':'THUD!');
    }
  }
}

/* ================= HUD ================= */
function updHUD(){
  $('score').textContent=money(score);
  $('wave').textContent=wave;
  const w=TIERS[tier-1], G=GUNS[gun], many=unlocked.filter(Boolean).length>1;
  /* updHUD runs on every point scored; rebuild the weapon chip and the life pips only when they change */
  const sig=tier+'/'+gun+'/'+lives+'/'+(many?1:0);
  if(sig!==updHUD._sig){
    updHUD._sig=sig;
    $('wep').innerHTML=G.n+' <b>'+w.r+'</b>'+(many?' <span style="opacity:.55">\u21bb</span>':'');
    $('wep').style.color=G.c;
    let h='';
    for(let i=0;i<clamp(lives+1,0,6);i++) h+='<div class="pip"></div>';
    $('lives').innerHTML=h;
  }
  const frac=clamp(hull/HULL_MAX,0,1), hb=$('hull');
  $('hullFill').style.width=(frac*100)+'%';
  hb.classList.toggle('low', frac<=0.55 && frac>0.28);
  hb.classList.toggle('crit', frac<=0.28);
}
function bumpHull(){
  const hb=$('hull');
  hb.classList.remove('bump'); void hb.offsetWidth; hb.classList.add('bump');
}
function updOD(){
  /* called every frame; touching the DOM only when the number moves */
  const v=Math.round(od), ready=od>=100;
  if(updOD._v===v && updOD._r===ready) return;
  updOD._v=v; updOD._r=ready;
  $('odFill').style.height=v+'%';
  $('od').classList.toggle('ready',ready);
  $('odTxt').innerHTML = ready ? 'FIRE!' : 'OVER<br>DRIVE';
}
function banner(t){
  const el=$('banner'); el.textContent=t;
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
}
</script>


<script>
"use strict";
/* ============================================================================
   THE TINKER DECK
   A kid taps + and a real global variable changes. That is the entire trick, and
   it is not a trick: every knob below names a variable that the game reads on the
   very next frame, and every code box quotes the real line from this file.

   Two rules kept it safe to hand to a 10-year-old:
     1. Every value is CLAMPED. Silly is allowed (a magnet that vacuums the whole
        screen is funny); broken is not (a fire rate of zero is not).
     2. There is always a big obvious PUT IT ALL BACK button.
   No eval, no text boxes, no way to type something the game cannot survive.
   ========================================================================== */
const KNOBS=[
 {k:'MAGNET_RADIUS', d:105, min:0, max:900, step:15, unit:'px', flag:true,
  note:'How close a pickup has to be before it flies to you. Crank it to 900 and the whole screen comes running.',
  src:'<i>// in updateDrops()</i>\nif (dist &lt; <b>MAGNET_RADIUS</b>) {\n  d.x += dx / dist * MAGNET_PULL * dt;\n  d.y += dy / dist * MAGNET_PULL * dt;\n}'},
 {k:'MAGNET_PULL', d:185, min:0, max:1200, step:20, unit:'px/sec', flag:true,
  note:'How FAST a pickup flies once it decides to come and get you.',
  src:'d.x += dx / dist * <b>MAGNET_PULL</b> * dt;'},
 {k:'FIRE_RATE', d:1, min:0.35, max:3, step:0.05, unit:'x',
  note:'Bigger number, more bullets. Your gun does not need a tap -- it just goes.',
  src:'P.fire = TIERS[tier-1].cd * (GUNS[gun].cd/0.165) / <b>FIRE_RATE</b>;'},
 {k:'SHOT_SPREAD', d:1, min:0.2, max:3, step:0.1, unit:'x',
  note:'How wide your shots fan out. 0.2 is a laser beam, 3 is a sneeze.',
  src:'<i>// in shoot(), the Scatter gun</i>\nconst a = -Math.PI/2 + (i-(n-1)/2) * 0.10 * <b>SHOT_SPREAD</b>;'},
 {k:'SHIELD_BONUS', d:0, min:0, max:4, step:1, unit:'layers',
  note:'Extra shield layers on every S you grab. Each layer eats one whole hit.',
  src:'shield = shieldMax + <b>SHIELD_BONUS</b>;'},
 {k:'HULL_MAX', d:100, min:50, max:300, step:10, unit:'hull',
  note:'How much one ship can take before you lose it. Most hits cost about 20.',
  src:'hull -= dmg;\nif (hull &lt;= 0) { hull = <b>HULL_MAX</b>; lives--; }'},
 {k:'SHIP_SPEED', d:13, min:6, max:30, step:1, unit:'',
  note:'How fast the ship catches up to your finger. Low = floaty, high = twitchy.',
  src:'const k = Math.min(1, dt * <b>SHIP_SPEED</b>);\nP.x += (P.tx - P.x) * k;'},
 {k:'ENEMY_SPEED', d:1, min:0.3, max:2, step:0.05, unit:'x',
  note:'Speed of everything trying to squash you.',
  src:'spd: (1 + Math.min(0.55, wave*0.02)) * <b>ENEMY_SPEED</b>'},
 {k:'BOSS_HP', d:1, min:0.25, max:2.5, step:0.05, unit:'x',
  note:'How chunky the bosses are. 0.25 makes them cream puffs.',
  src:'const base = (150 + wave*22) * D.hpMul * <b>BOSS_HP</b>;'},
 {k:'DEBRIS_ON', d:1, min:0, max:1, step:1, unit:'0=off 1=on',
  note:'Do bosses drop dangerous bits of themselves when you hurt them?',
  src:'function shed(kind, x, y, ...) {\n  if (!<b>DEBRIS_ON</b>) return;   <i>// nothing falls off</i>\n  ...\n}'}
];
const KMAP={}; for(const K of KNOBS) KMAP[K.k]=K;

function kround(K,v){
  v=Math.round(v/K.step)*K.step;
  v=Math.min(K.max,Math.max(K.min,v));
  return Math.abs(v-Math.round(v))<1e-9 ? Math.round(v) : +v.toFixed(2);
}
function kget(k){ const v=window[k]; return (typeof v==='number' && isFinite(v)) ? v : KMAP[k].d; }
function kset(k,v){
  const K=KMAP[k];
  window[k]=kround(K,v);
  if(k==='HULL_MAX' && typeof hull==='number') hull=Math.min(hull,HULL_MAX);
  saveTune();
}
function tuneDefaults(){ for(const K of KNOBS) window[K.k]=K.d; NEXT_BOSS=-1;
  if(typeof hull==='number') hull=Math.min(hull,HULL_MAX); saveTune(); }
function saveTune(){
  try{
    const o={NEXT_BOSS:NEXT_BOSS};
    for(const K of KNOBS) o[K.k]=kget(K.k);
    LS.set('sw_tune',JSON.stringify(o));
  }catch(e){}
}
function loadTune(){
  try{
    const raw=LS.get('sw_tune'); if(!raw) return;
    const o=JSON.parse(raw); if(!o||typeof o!=='object') return;
    for(const K of KNOBS) if(typeof o[K.k]==='number' && isFinite(o[K.k])) window[K.k]=kround(K,o[K.k]);
    if(typeof o.NEXT_BOSS==='number') NEXT_BOSS=Math.max(-1,Math.min(4,Math.round(o.NEXT_BOSS)));
  }catch(e){ /* corrupt or blocked storage: just play with the defaults */ }
}

function bossLabel(i){
  const D=ROSTER[i];
  return (D && D.name) ? D.name.split(',')[0] : 'The seasonal monster';
}
function knobHTML(K){
  const v=kget(K.k), pct=((v-K.min)/(K.max-K.min))*100;
  return `<div class="knob${K.flag?' flag':''}">
    <div class="knobtop"><code>${K.k}</code>
      <span class="kv" id="kv_${K.k}">${v}<small>${K.unit}</small></span></div>
    <div class="kbar"><i id="kb_${K.k}" style="width:${clamp(pct,0,100)}%"></i></div>
    <div class="knote">${K.note}</div>
    <div class="krow">
      <button class="kbtn" data-k="${K.k}" data-d="-8">&laquo;</button>
      <button class="kbtn" data-k="${K.k}" data-d="-1">&minus;</button>
      <button class="kbtn" data-k="${K.k}" data-d="1">+</button>
      <button class="kbtn" data-k="${K.k}" data-d="8">&raquo;</button>
    </div>
    <pre class="ksrc">${K.src}</pre>
  </div>`;
}
function paintKnob(k){
  const K=KMAP[k], v=kget(k);
  const el=$('kv_'+k); if(el) el.innerHTML=v+'<small>'+K.unit+'</small>';
  const b=$('kb_'+k); if(b) b.style.width=clamp(((v-K.min)/(K.max-K.min))*100,0,100)+'%';
}

let deckFrom='menu';
function tinker(from){
  if(from) deckFrom=from;
  showCard(`<div class="tag">Secret engineering panel</div>
    <h2>THE TINKER DECK</h2>
    <p class="small">These are <b>real variables in the real game</b>. Change one and the
      very next frame does what you said. Nothing here can break it &mdash; every number
      is fenced in, and <b>PUT IT ALL BACK</b> undoes the lot.</p>
    <button class="xbtn" id="xMag">&#9733; How does the MAGNET work?</button>
    <button class="xbtn" id="xBoss">How does the game pick a BOSS?</button>
    <button class="xbtn" id="xGun">What even IS a weapon?</button>
    <button class="xbtn" id="xShip">How does the ship follow my finger?</button>
    <div class="deckhead"><span class="tag">Boss coming up next</span></div>
    <div class="bosspick" id="bossPick">
      <button data-b="-1" aria-pressed="${NEXT_BOSS<0}">Take turns (normal)</button>
      ${ROSTER.map((d,i)=>`<button data-b="${i}" aria-pressed="${NEXT_BOSS===i}">${bossLabel(i)}</button>`).join('')}
    </div>
    <div class="deckhead"><span class="tag">Knobs</span></div>
    <div class="deckwrap" id="deckWrap">${KNOBS.map(knobHTML).join('')}</div>
    <div class="deckfoot">
      <button class="ghost" id="resetTune">Put it all<br>back to normal</button>
      <button class="big" id="deckDone">${deckFrom==='pause'?'BACK TO<br>THE FIGHT':'DONE'}</button>
    </div>`);

  $('deckWrap').addEventListener('click',function(e){
    const b=e.target.closest('button[data-k]'); if(!b) return;
    const k=b.dataset.k, K=KMAP[k];
    kset(k, kget(k) + K.step*(+b.dataset.d));
    paintKnob(k); sfx.tap();
    if(k==='HULL_MAX'||k==='SHIELD_BONUS') updHUD();
  });
  $('bossPick').addEventListener('click',function(e){
    const b=e.target.closest('button[data-b]'); if(!b) return;
    NEXT_BOSS=+b.dataset.b; saveTune(); sfx.tap();
    [].forEach.call($('bossPick').children,function(c){
      c.setAttribute('aria-pressed', (+c.dataset.b===NEXT_BOSS)?'true':'false'); });
  });
  $('resetTune').onclick=function(){
    tuneDefaults(); sfx.power(); updHUD(); tinker();
  };
  $('deckDone').onclick=function(){
    if(deckFrom==='pause' && state==='paused') resume(); else menu();
  };
  $('xMag').onclick=()=>explain('magnet');
  $('xBoss').onclick=()=>explain('boss');
  $('xGun').onclick=()=>explain('gun');
  $('xShip').onclick=()=>explain('ship');
}

const XPLAIN={
magnet:{h:'THE MAGNET',b:`
  <p>Every pickup asks the same question about sixty times a second:
     <b>how far away is the ship, and which way is it?</b></p>
  <pre class="ksrc">const dx = P.x - d.x;   <i>// the left/right gap</i>
const dy = P.y - d.y;   <i>// the up/down gap</i>
const dist = Math.hypot(dx, dy);</pre>
  <p><b>dx</b> and <b>dy</b> together are a <b>vector</b> &mdash; an arrow pointing from the
     pickup to your ship. <code>Math.hypot</code> is just the length of that arrow.</p>
  <pre class="ksrc">if (dist &lt; <b>MAGNET_RADIUS</b>) {
  d.x += dx / dist * <b>MAGNET_PULL</b> * dt;
  d.y += dy / dist * <b>MAGNET_PULL</b> * dt;
}</pre>
  <p>Dividing by <code>dist</code> is the sneaky bit. It squashes the arrow down to
     length 1: it keeps the <b>direction</b> and throws away the <b>distance</b>.
     Then <code>MAGNET_PULL</code> says how fast to travel in that direction, and
     <code>dt</code> &mdash; the time since the last frame &mdash; keeps it smooth on a fast
     iPad and a slow one.</p>
  <p>Leave the divide out and far-away pickups would rocket at you while close ones
     crawled, because a longer arrow means bigger numbers.</p>
  <p class="small"><b>Go and try it:</b> set <code>MAGNET_RADIUS</code> to 900. The whole
     screen comes to you like an extremely obedient dog.</p>`},
boss:{h:'HOW A BOSS GETS PICKED',b:`
  <p>The game does not know a single boss by name. It knows one <b>list</b>:</p>
  <pre class="ksrc">const ROSTER = [OCTO, COP, LUNCH, THEMEBOSS, PROF];</pre>
  <p>and one tiny bit of counting:</p>
  <pre class="ksrc">function bossFor(w) {
  const n = Math.floor(w / 5);      <i>// wave 5 -&gt; 1, wave 10 -&gt; 2 ...</i>
  return ROSTER[(n - 1) % ROSTER.length];
}</pre>
  <p>That <code>%</code> is the <b>remainder</b>. When the count runs off the end of the
     list it wraps back to the front, so the bosses take turns forever without anybody
     writing "and then go back to the octopus".</p>
  <p>Which means: <b>add one more thing to that list and the game grows a new boss.</b>
     Nothing else has to change. That is the whole point of a list.</p>`},
gun:{h:'WHAT EVEN IS A WEAPON?',b:`
  <p>A weapon is not code. It is just an <b>object</b> &mdash; a bag of labelled numbers:</p>
  <pre class="ksrc">const GUNS = [
  {id:'cannon',  n:'Cannon',   cd:0.165, dmg:1,   c:'#fff5dd'},
  {id:'scatter', n:'Scatter',  cd:0.30,  dmg:0.8, c:'#ffd07a'},
  {id:'lance',   n:'Lance',    cd:0.115, dmg:1.3, c:'#c9f6ff'},
  {id:'seeker',  n:'Seeker',   cd:0.42,  dmg:1.6, c:'#b9f5a0'},
  {id:'ricochet',n:'Ricochet', cd:0.24,  dmg:1.1, c:'#f7a8ff'}
];</pre>
  <p><code>cd</code> is the <b>cooldown</b>: seconds of waiting between shots, so a
     <i>smaller</i> number is a <i>faster</i> gun. <code>dmg</code> is how hard one bullet
     hits. <code>c</code> is literally just the colour.</p>
  <p>The Seeker is slow (0.42) but hits hard (1.6). The Lance is fast (0.115) and
     pierces. Nobody wrote a whole new program for either one &mdash; somebody added a
     line to a list and picked some numbers.</p>
  <p class="small"><b>Try it:</b> turn <code>FIRE_RATE</code> up and every gun in that
     list gets faster at once, because they all read from the same place.</p>`},
ship:{h:'HOW THE SHIP FOLLOWS YOUR FINGER',b:`
  <p>The ship never teleports to your finger. It walks a <i>fraction</i> of the way there,
     every frame:</p>
  <pre class="ksrc">const k = Math.min(1, dt * <b>SHIP_SPEED</b>);
P.x += (P.tx - P.x) * k;   <i>// P.tx is where your finger is</i>
P.y += (P.ty - P.y) * k;</pre>
  <p><code>(P.tx - P.x)</code> is the gap. Multiply the gap by a small <code>k</code> and
     you close a slice of it &mdash; then next frame the gap is smaller, so you move less.
     It glides in and settles instead of snapping. Programmers call this
     <b>lerping</b>, which is short for "linear interpolation" and sounds like a burp.</p>
  <p class="small"><b>Try it:</b> <code>SHIP_SPEED</code> at 6 feels like flying a bathtub.
     At 30 the ship is glued to your thumb.</p>`}
};
function explain(id){
  const X=XPLAIN[id];
  showCard(`<div class="tag">How this works</div>
    <div class="xplain"><h3>${X.h}</h3>${X.b}</div>
    <button class="big" id="xBack">BACK TO THE DECK</button>`);
  $('xBack').onclick=()=>tinker();
}
</script>

<script>
"use strict";
/* ================= input ================= */
const keys={};
let dragging=false;
function pointAt(e){
  const r=cv.getBoundingClientRect();
  P.tx=e.clientX-r.left;
  P.ty=e.clientY-r.top-58;        // ship rides above the finger so it stays visible
}
cv.addEventListener('pointerdown',e=>{ if(state!=='playing')return;
  dragging=true;
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}    // throws on some embedded webviews
  pointAt(e); e.preventDefault(); });
cv.addEventListener('pointermove',e=>{ if(dragging&&state==='playing'){ pointAt(e); e.preventDefault(); } });
cv.addEventListener('pointerup',e=>{ dragging=false; });
cv.addEventListener('pointercancel',()=>{ dragging=false; });
/* Fallback for webviews where pointer events misbehave inside an iframe. */
function touchAt(e){ if(state!=='playing'||!e.touches||!e.touches.length) return;
  pointAt(e.touches[0]); e.preventDefault(); }
cv.addEventListener('touchstart',touchAt,{passive:false});
cv.addEventListener('touchmove',touchAt,{passive:false});
addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;
  if(e.key===' '){ e.preventDefault(); nova(); }
  if(e.key==='p'||e.key==='Escape'){ state==='playing'?pause():(state==='paused'&&resume()); }
});
addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });
addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; });
$('od').addEventListener('click',nova);
$('wep').addEventListener('click',function(e){ e.preventDefault(); e.stopPropagation(); cycleGun(); });
$('wep').addEventListener('touchstart',function(e){ e.preventDefault(); e.stopPropagation(); cycleGun(); },{passive:false});
$('pauseBtn').addEventListener('click',()=>{ state==='playing'?pause():(state==='paused'&&resume()); });

/* ================= loop ================= */
function update(dt){
  P.t+=dt;
  if(P.inv>0) P.inv-=dt;
  const kl=keys['arrowleft']||keys['a'], kr=keys['arrowright']||keys['d'],
        ku=keys['arrowup']||keys['w'],   kd=keys['arrowdown']||keys['s'];
  if(kl||kr||ku||kd){
    const v=430*dt;
    P.tx=P.x+((kr?1:0)-(kl?1:0))*v*4; P.ty=P.y+((kd?1:0)-(ku?1:0))*v*4;
  }
  P.tx=clamp(P.tx,20,W-20); P.ty=clamp(P.ty,70,H-30);
  const k=Math.min(1,dt*SHIP_SPEED);
  const px=P.x;
  P.x+=(P.tx-P.x)*k; P.y+=(P.ty-P.y)*k;
  P.thrust=clamp(Math.abs(P.x-px)*0.06,0,1);

  P.fire-=dt;
  if(P.fire<=0){ P.fire=TIERS[tier-1].cd*(GUNS[gun].cd/0.165)/FIRE_RATE; shoot(); }

  pumpWave(dt);
  updateFoes(dt);
  if(boss){
    updateBoss(dt);
    updBolts(dt);
    const bf=Math.round(clamp(boss.hp/boss.max*100,0,100)*2)/2;
    if(bf!==lastBossFill){ lastBossFill=bf; $('bossFill').style.width=bf+'%'; }
  }
  updateDrops(dt);
  updDebris(dt);
  updAnswers(dt);
  collide(dt);
  updateParts(dt);
  od=Math.min(100,od); updOD();
  if(shake>0) shake=Math.max(0,shake-dt*44);
  if(flashT>0) flashT-=dt;
  if(hitFlash>0) hitFlash-=dt;
}
function draw(dt){
  g.clearRect(0,0,W,H);
  g.fillStyle=BG||'#05060f'; g.fillRect(0,0,W,H);

  g.save();
  if(shake>0.2) g.translate(rnd(-shake,shake)*0.5,rnd(-shake,shake)*0.5);
  drawStars(dt);
  drawDrops();
  drawBolts();
  if(boss) drawBoss();
  drawDebris();
  drawFoes();
  drawAnswers();
  drawBullets();
  if(state!=='over') drawShip(P,dt);
  drawParts();
  g.restore();

  if(comboFlash>0){
    comboFlash-=dt;
    const k=clamp(comboFlash/1.1,0,1), sc=1+Math.max(0,k-0.82)*7;
    g.save(); g.globalAlpha=Math.min(1,k*2.5); g.translate(W/2,H*0.30); g.scale(sc,sc);
    g.font='900 '+Math.round(Math.min(46,W/8))+'px "Fredoka",system-ui,sans-serif';
    g.textAlign='center'; g.textBaseline='middle'; g.lineJoin='round';
    g.lineWidth=7; g.strokeStyle='rgba(0,0,0,.8)'; g.strokeText(comboFlashTxt,0,0);
    g.fillStyle=T.glow; g.fillText(comboFlashTxt,0,0);
    g.restore();
  }
  if(flashT>0){ g.fillStyle='rgba(255,255,255,'+clamp(flashT*1.5,0,0.5)+')'; g.fillRect(0,0,W,H); }
  /* v0.3: a red rim on every hit, so a hit always LOOKS like a hit */
  if(hitFlash>0){
    const a=clamp(hitFlash*2.0,0,0.6);
    const rg=g.createRadialGradient(W/2,H/2,Math.min(W,H)*0.26,W/2,H/2,Math.max(W,H)*0.66);
    rg.addColorStop(0,'rgba(255,40,80,0)'); rg.addColorStop(1,'rgba(255,40,80,'+a+')');
    g.fillStyle=rg; g.fillRect(0,0,W,H);
  }
}
let framesDrawn=0;
function frame(ts){
  if(!window.__fbDrive) requestAnimationFrame(frame);
  framesDrawn++;
  let dt=clamp((ts-last)/1000,0,0.042)||0.016; last=ts;
  if(hitstop>0){ hitstop-=dt; dt*=0.15; }            /* overdrive hit-stop */
  if(state==='playing') update(dt);
  draw(dt);
}

/* ================= flow ================= */
function newRun(){
  hideCard(); runGen++;
  bullets=[];foes=[];ebul=[];drops=[];parts=[];debris=[]; floats=[]; rings=[]; hitstop=0; comboFlash=0; lastBossFill=-1;
  boss=null; $('bossbar').classList.remove('on');
  score=0; combo=0; mult=1; od=0; lives=3; tier=1; shield=0; runKills=0;
  gun=0; unlocked=[true,false,false,false,false]; bolts=[]; shieldMax=1;
  answers=[]; quizQ=''; calcMode=false; debris=[]; hull=HULL_MAX; hitFlash=0;
  wave=0; waveClearT=1.6; spawnQ=[]; spawnT=0; shake=0; flashT=0; bossPending=0;
  P=newShip(); seedStars();
  bumpCombo(); updHUD(); updOD();
  state='playing'; last=performance.now();
  if(audioMode>=2) startMusic();
  startWave(1);
}
function pause(){
  if(state!=='playing') return;
  state='paused'; stopMusic();
  showCard(`<div class="tag">Paused</div>
    <h2>Take a breath</h2>
    <div class="stats">
      <div class="stat"><div class="v">${money(score)}</div><div class="k">Score</div></div>
      <div class="stat"><div class="v">${wave}</div><div class="k">Wave</div></div>
      <div class="stat"><div class="v">x${mult}</div><div class="k">Combo</div></div>
    </div>
    <button class="big" id="resBtn">RESUME</button>
    <button class="ghost" id="tinkBtn2">&#128295; The Tinker Deck</button>
    <button class="ghost" id="muteBtn">Music &amp; sound</button>
    <button class="ghost" id="quitBtn">Quit to title</button>`);
  $('resBtn').onclick=resume;
  $('tinkBtn2').onclick=()=>tinker('pause');
  $('muteBtn').onclick=()=>{ cycleAudio(); $('muteBtn').textContent=audioLabel(); };
  $('muteBtn').textContent=audioLabel();
  $('quitBtn').onclick=()=>{ state='menu'; stopMusic(); menu(); };
}
function resume(){
  if(state!=='paused') return;
  hideCard(); state='playing'; last=performance.now();
  if(audioMode>=2) startMusic();
}
function gameOver(){
  state='over'; stopMusic(); sfx.lose();
  burst(P.x,P.y,40,'#ff4d6d',340,1); shake=22; flashT=0.3;
  const best=score>SV.hi;
  SV.hi=Math.max(SV.hi,score); SV.bw=Math.max(SV.bw,wave);
  SV.kills=SV.kills+runKills; SV.runs=SV.runs+1;
  const joke=Math.random()<0.5;
  setTimeout(()=>{
    showCard(`<div class="tag">${best?'New personal best':'Run over'}</div>
      <h2>${best?'BEST RUN YET!':'Ship down'}</h2>
      <div class="stats">
        <div class="stat"><div class="v">${money(score)}</div><div class="k">Score</div></div>
        <div class="stat"><div class="v">${wave}</div><div class="k">Wave</div></div>
        <div class="stat"><div class="v">${runKills}</div><div class="k">Wrecked</div></div>
      </div>
      <p class="small">Best ever: <b style="color:var(--glow)">${money(SV.hi)}</b> &nbsp;&middot;&nbsp; furthest wave ${SV.bw}</p>
      <div class="scroll"><span class="lbl">${joke?'Joke from the ship computer':'Transmission from deep space'}</span>${joke?pick(JOKES):pick(FACTS)}</div>
      <button class="big" id="againBtn">FLY AGAIN</button>
      <button class="ghost" id="titleBtn">Title screen</button>`);
    $('againBtn').onclick=newRun;
    $('titleBtn').onclick=()=>{ state='menu'; menu(); };
  },900);
}

/* ================= screens ================= */
function showCard(h){ $('veilCard').innerHTML=h; $('veil').hidden=false; $('hud').style.opacity=0.25; }
function hideCard(){ $('veil').hidden=true; $('hud').style.opacity=1; }
function audioLabel(){ return ['Sound: off','Sound: effects only','Sound: music + effects'][audioMode]; }
function cycleAudio(){
  audioMode=(audioMode+1)%3; soundOn=audioMode>0;
  LS.set('sw_audio',audioMode);
  paintSound();
  if(audioMode>=2 && state==='playing') setMusic(T.music); else stopMusic();
  if(soundOn) sfx.tap();
}
function paintSound(){
  const b=$('soundBtn');
  b.innerHTML=['&#128263;','&#9834;','&#9835;'][audioMode];
  b.title=audioLabel(); b.setAttribute('aria-label',audioLabel());
  b.style.color=audioMode?'var(--accent)':'var(--dim)';
}
$('soundBtn').addEventListener('click',cycleAudio);

function menu(){
  hideCard();
  showCard(`<h1>STAR<br>WRECKER</h1>
    <p class="small">Drag to fly. You shoot automatically. Tap your weapon to swap it.
      Wreck the flies, the socks and the smell. KA-BLAMMO!</p>
    <div class="stats">
      <div class="stat"><div class="v">${money(SV.hi)}</div><div class="k">Best score</div></div>
      <div class="stat"><div class="v">${SV.bw}</div><div class="k">Best wave</div></div>
      <div class="stat"><div class="v">${money(SV.kills)}</div><div class="k">Total wrecked</div></div>
    </div>
    <button class="big" id="playBtn">PLAY</button>
    <button class="ghost" id="howBtn">How to play</button>
    <button class="ghost" id="tinkBtn">&#128295; The Tinker Deck &mdash; change the code</button>
    <button class="ghost" id="seasonBtn">Season: ${T.label}</button>`);
  $('playBtn').onclick=newRun;
  $('howBtn').onclick=how;
  $('tinkBtn').onclick=()=>tinker('menu');
  $('seasonBtn').onclick=seasons;
}
function how(){
  showCard(`<h2>How to fly</h2>
    <ul>
      <li><b>Drag anywhere</b> to move. Your ship rides just above your finger so you can see it.</li>
      <li>You <b>fire automatically</b>. Never tap to shoot.</li>
      <li>Grab <b>W</b> to upgrade your gun, <b>S</b> for a shield, <b>&#42;</b> for overdrive fuel.</li>
      <li>Your <b>hull</b> is the little bar next to your ships, bottom left. A hit takes a bite
        out of it instead of costing you a whole ship &mdash; that is about <b>five</b> mistakes
        per ship. Lose the hull and you lose a ship <i>and</i> a weapon tier.</li>
      <li>A <b>shield</b> eats one whole hit and the hull never even feels it. Grab <b>H</b> to
        <b>patch the hull back up</b> &mdash; it turns up more often once you're banged up.</li>
      <li><b>Do not touch a boss.</b> When a red dashed ring appears around it, you're close
        enough to get thumped. The octopus has a very long reach.</li>
      <li>Hurt a boss enough and <b>bits fall off it</b> &mdash; a tentacle, a barricade, a
        meatloaf. They hang in the air flashing red for half a second, then drop.
        Dodge them, or <b>shoot them</b> for points.</li>
      <li>Kills without getting hit build a <b>combo</b> &mdash; up to <b>x5 score</b>. Getting hit resets it.</li>
      <li>When <b>OVERDRIVE</b> lights up, tap it: everything on screen takes a hit and all enemy
        fire is wiped. Save it for the boss.</li>
      <li>Every <b>5th wave</b> is a boss, and they take turns: the <b>Electric Space Octopus</b>, <b>Professor Von Homework</b>, <b>Officer Grumbles</b> the zombie school cop, <b>Lunchlady Gorgonzola</b>, then the seasonal monster. Each changes its attack as its health drops.</li>
      <li>The Professor throws <b>calculators</b> at you and yells <b>POP QUIZ!!</b> Three answers float
        past. Shoot the <b>silliest</b> one &mdash; a right answer only makes him happier, but an answer
        like <b>A BURRITO</b> overloads his brain and he spins in circles going
        <b>DOES NOT COMPUTE</b>. That is when you hit him.</li>
      <li>Beat a boss and you <b>unlock a new gun</b>. Tap the weapon name at the bottom left to <b>swap</b> between the ones you have &mdash; Cannon, Scatter, Lance, Seeker, Ricochet.</li>
      <li>A glowing blue column means <b>lightning is about to hit that lane</b>. Move.</li>
    </ul>
    <p class="small">Keyboard: arrows or WASD to fly, space for overdrive, P to pause.</p>
    <button class="big" id="backBtn">GOT IT</button>`);
  $('backBtn').onclick=menu;
}
function seasons(){
  const cur=SV.over||seasonFor(new Date());
  showCard(`<h2>Pick a sky</h2>
    <p class="small">It follows the calendar on its own. This just lets you jump ahead.</p>
    <div class="seasons" id="pickWrap">
      ${Object.entries(THEMES).map(([k,v])=>
        `<button data-k="${k}" aria-pressed="${k===cur}">${v.label}</button>`).join('')}
    </div>
    <button class="ghost" id="autoBtn">Back to today's sky</button>
    <button class="big" id="backBtn">DONE</button>`);
  $('pickWrap').onclick=e=>{
    const b=e.target.closest('button[data-k]'); if(!b) return;
    SV.over=b.dataset.k; applyTheme(b.dataset.k); seasons();
  };
  $('autoBtn').onclick=()=>{ SV.over=''; applyTheme(seasonFor(new Date())); seasons(); };
  $('backBtn').onclick=menu;
}

/* pause when the phone or tab goes away, so nothing runs unseen */
document.addEventListener('visibilitychange',()=>{ if(document.hidden && state==='playing') pause(); });

/* ================= boot ================= */
resize(); 
loadTune();
applyTheme(SV.over||seasonFor(new Date()));
booting=false;
P=newShip(); seedStars(); updHUD(); updOD(); bumpCombo(); paintSound();
menu();
requestAnimationFrame(frame);
/* iOS Low Power Mode (and some embedded webviews) suspend requestAnimationFrame outright.
   If not a single frame lands while the page is visible, drive the loop from a timer instead. */
window.__fbDrive=false;
setTimeout(function(){
  if(framesDrawn>0 || document.visibilityState!=='visible') return;
  window.__fbDrive=true;
  setInterval(function(){ if(document.visibilityState==='visible') frame(performance.now()); },33);
},900);
/* A blank screen tells us nothing; if no frame ever painted, report the state. */
setTimeout(function(){
  /* rAF is paused in a hidden tab -- that is normal, not a failure. */
  if(framesDrawn>2 || window.__swErr || document.visibilityState!=='visible') return;
  try{
    document.getElementById('veilCard').innerHTML=
      '<h2>Display trouble</h2><p class="small">Screenshot this for Dad:</p>'+
      '<div class="scroll" style="font-family:monospace;font-size:11px">'+
      'frames='+framesDrawn+' canvas='+W+'x'+H+' dpr='+DPR+
      '<br>window='+window.innerWidth+'x'+window.innerHeight+
      '<br>storage blocked='+LS.blocked+' state='+state+
      '<br>ctx='+(!!g)+' theme='+tKey+'</div>';
    document.getElementById('veil').hidden=false;
  }catch(_){}
},2500);
</script>
