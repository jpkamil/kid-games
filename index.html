<script>
/* The host owns <head>, so establish the mobile viewport before first layout. */
(function(){
  function meta(n,c){var m=document.querySelector('meta[name="'+n+'"]');
    if(!m){m=document.createElement('meta');m.setAttribute('name',n);
      (document.head||document.documentElement).appendChild(m);}
    m.setAttribute('content',c);}
  meta('viewport','width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover');
  meta('apple-mobile-web-app-capable','yes');
  meta('mobile-web-app-capable','yes');
  meta('apple-mobile-web-app-status-bar-style','black-translucent');
  meta('apple-mobile-web-app-title','Star Wrecker');
  meta('theme-color','#05060f');
  meta('color-scheme','dark');
})();
</script>
<script>
/* Safari blocks localStorage inside cross-site iframes and THROWS on access.
   Reading it unguarded at script top level killed the whole bundle. Everything
   goes through this shim, which silently falls back to memory. */
var LS=(function(){
  var ok=false, mem={};
  try{ window.localStorage.setItem('__sw','1'); window.localStorage.removeItem('__sw'); ok=true; }catch(e){ ok=false; }
  return {
    blocked:!ok,
    get:function(k){ try{ return ok?window.localStorage.getItem(k):(k in mem?mem[k]:null); }
                     catch(e){ return (k in mem)?mem[k]:null; } },
    set:function(k,v){ try{ if(ok) window.localStorage.setItem(k,String(v)); else mem[k]=String(v); }
                       catch(e){ mem[k]=String(v); } },
    del:function(k){ try{ if(ok) window.localStorage.removeItem(k); else delete mem[k]; }
                     catch(e){ delete mem[k]; } }
  };
})();
/* Register before any other script so even a boot-time failure is visible. */
window.__swErr=null;
window.addEventListener('error',function(ev){
  if(window.__swErr) return;
  window.__swErr=(ev.message||'error')+' @line '+(ev.lineno||'?');
  try{
    var v=document.getElementById('veil'), c=document.getElementById('veilCard');
    if(!v||!c) return;
    c.innerHTML='<h2>Something broke</h2>'+
      '<p class="small">Screenshot this and send it to Dad:</p>'+
      '<div class="scroll" style="word-break:break-word;font-family:monospace;font-size:11px">'+
      String(window.__swErr).replace(/</g,'&lt;')+'</div>';
    v.hidden=false;
  }catch(_){}
});
</script>

<style>
:root{
  --void:#05060f; --void2:#0c1024; --panel:#141a35; --edge:#243063;
  --chalk:#eef1ff; --dim:#8f9ac4;
  --accent:#ff8a2b; --accent2:#8b5cf6; --glow:#ffc46b;
  --hot:#ff4d6d; --cool:#43e8ff; --good:#5fe39a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:var(--void); color:var(--chalk);
  font-family:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none;
  overscroll-behavior:none; touch-action:none;
}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;background:var(--void);
  touch-action:none}

/* ---------------- HUD ---------------- */
.hud{position:fixed;inset:0;pointer-events:none;z-index:2;
  padding:calc(10px + env(safe-area-inset-top,0px)) 12px calc(10px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;justify-content:space-between}
.hud-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.hud-bot{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}

.score{font-family:'Roboto Mono',monospace;font-variant-numeric:tabular-nums;
  font-size:clamp(22px,6.4vw,30px);font-weight:700;line-height:1;letter-spacing:-.5px;
  text-shadow:0 2px 10px rgba(0,0,0,.9)}
.scorelbl{font-size:9.5px;letter-spacing:.19em;text-transform:uppercase;color:var(--dim);margin-bottom:3px}
.combo{font-family:'Luckiest Guy',cursive;font-size:clamp(15px,4.6vw,20px);color:var(--glow);
  line-height:1;margin-top:5px;opacity:0;transform:translateY(-4px);transition:.18s;
  text-shadow:0 0 12px var(--accent)}
.combo.on{opacity:1;transform:none}
.combo.pop{animation:cpop .26s}
@keyframes cpop{0%{transform:scale(1)}45%{transform:scale(1.3)}100%{transform:scale(1)}}

.wave{text-align:right}
.wavenum{font-family:'Luckiest Guy',cursive;font-size:clamp(15px,4.4vw,19px);line-height:1;
  text-shadow:0 2px 8px rgba(0,0,0,.9)}
.wavelbl{font-size:9.5px;letter-spacing:.19em;text-transform:uppercase;color:var(--dim)}
.btns{display:flex;gap:7px;margin-top:8px;pointer-events:auto}
.ibtn{width:38px;height:38px;border-radius:11px;border:1.5px solid var(--edge);
  background:rgba(12,16,36,.82);color:var(--dim);font-size:15px;font-family:inherit;
  cursor:pointer;display:grid;place-items:center;transition:.15s;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.ibtn:hover,.ibtn:focus-visible{color:var(--chalk);border-color:var(--accent);outline:none}

/* lives + weapon */
.lives{display:flex;gap:5px;align-items:center}
.pip{width:15px;height:17px;background:var(--cool);opacity:.92;
  -webkit-clip-path:polygon(50% 0,100% 78%,72% 100%,28% 100%,0 78%);clip-path:polygon(50% 0,100% 78%,72% 100%,28% 100%,0 78%);
  filter:drop-shadow(0 0 5px var(--cool))}
.pip.spent{background:var(--edge);filter:none;opacity:.5}
.wep{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-top:6px}
.wep b{color:var(--cool);font-weight:700;letter-spacing:.1em}

/* overdrive */
.od{pointer-events:auto;width:clamp(66px,19vw,86px);height:clamp(66px,19vw,86px);
  border-radius:50%;border:2.5px solid var(--edge);background:rgba(12,16,36,.8);
  position:relative;cursor:pointer;display:grid;place-items:center;
  font-family:'Luckiest Guy',cursive;font-size:11px;letter-spacing:.5px;color:var(--dim);
  transition:.18s;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);overflow:hidden}
.od .fillbar{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,var(--accent2),var(--accent));
  opacity:.5;transition:height .18s}
.od span{position:relative;z-index:1;text-align:center;line-height:1.15}
.od.ready{border-color:var(--glow);color:#0b0a16;animation:odready 1.15s ease-in-out infinite}
.od.ready .fillbar{opacity:1;background:linear-gradient(180deg,var(--glow),var(--accent))}
@keyframes odready{0%,100%{box-shadow:0 0 0 0 rgba(255,196,107,.55)}
  70%{box-shadow:0 0 0 15px rgba(255,196,107,0)}}

/* boss bar */
.bossbar{position:fixed;left:12px;right:12px;top:calc(94px + env(safe-area-inset-top,0px));z-index:3;
  opacity:0;transition:.3s;pointer-events:none}
.bossbar.on{opacity:1}
.bossbar .nm{font-family:'Luckiest Guy',cursive;font-size:12px;text-align:center;margin-bottom:4px;
  color:var(--glow);text-shadow:0 2px 8px #000;text-wrap:balance}
.bossbar .trk{height:9px;background:rgba(6,8,20,.85);border:1.5px solid var(--edge);border-radius:99px;overflow:hidden}
.bossbar .fl{height:100%;background:linear-gradient(90deg,var(--accent2),var(--hot));
  transition:width .22s;border-radius:99px}

/* banner */
.banner{position:fixed;left:0;right:0;top:38%;z-index:3;text-align:center;pointer-events:none;
  font-family:'Luckiest Guy',cursive;font-size:clamp(26px,9vw,44px);color:var(--glow);
  text-shadow:0 0 26px var(--accent),0 4px 0 rgba(0,0,0,.6);opacity:0}
.banner.show{animation:bann 1.5s ease-out}
@keyframes bann{0%{opacity:0;transform:scale(.6)}18%{opacity:1;transform:scale(1.05)}
  75%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.1)}}

/* ---------------- overlays ---------------- */
.veil{position:fixed;inset:0;z-index:10;background:rgba(4,5,14,.9);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  display:grid;place-items:center;padding:18px;overflow-y:auto}
.veil[hidden]{display:none}
.card{background:var(--void2);border:1.5px solid var(--edge);border-radius:20px;padding:22px 20px;
  max-width:400px;width:100%;text-align:center;display:flex;flex-direction:column;gap:13px;
  box-shadow:0 20px 50px rgba(0,0,0,.7);animation:rise .32s cubic-bezier(.3,1.2,.5,1)}
@keyframes rise{0%{transform:translateY(16px);opacity:0}100%{transform:none;opacity:1}}
.card h1{font-family:'Luckiest Guy',cursive;font-size:clamp(32px,10vw,46px);line-height:.95;
  font-weight:400;color:var(--accent);text-shadow:0 0 30px rgba(255,138,43,.45);letter-spacing:1px}
.card h2{font-family:'Luckiest Guy',cursive;font-size:clamp(22px,7vw,30px);color:var(--accent);
  font-weight:400;line-height:1.05;text-wrap:balance}
.card p{font-size:14.5px;line-height:1.5;text-wrap:balance}
.card p.small{font-size:12.5px;color:var(--dim)}
.tag{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
.big{background:var(--accent);color:#150c04;border:none;border-radius:13px;padding:15px;
  font-family:'Luckiest Guy',cursive;font-size:clamp(17px,5vw,21px);letter-spacing:.6px;
  cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.5);transition:.12s}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.5)}
.ghost{background:var(--panel);color:var(--dim);border:1.5px solid var(--edge);border-radius:13px;
  padding:12px;font-family:inherit;font-size:14px;cursor:pointer;transition:.14s}
.ghost:hover,.ghost:focus-visible{color:var(--chalk);border-color:var(--accent);outline:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--void);border:1.5px solid var(--edge);border-radius:12px;padding:10px 5px}
.stat .v{font-family:'Roboto Mono',monospace;font-variant-numeric:tabular-nums;font-size:19px;
  font-weight:700;color:var(--glow);line-height:1.2}
.stat .k{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-top:3px}
.scroll{background:var(--void);border:1.5px solid var(--edge);border-radius:13px;padding:13px;
  text-align:left;font-size:13px;line-height:1.55}
.scroll .lbl{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);
  display:block;margin-bottom:5px;font-weight:600}
.veil ul{text-align:left;font-size:13.5px;line-height:1.55;padding-left:18px;display:flex;
  flex-direction:column;gap:6px}
.veil ul b{color:var(--glow)}
.seasons{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.seasons button{background:var(--void);border:1.5px solid var(--edge);color:var(--chalk);
  border-radius:10px;padding:8px 6px;font-family:inherit;font-size:12px;cursor:pointer;transition:.14s}
.seasons button:hover,.seasons button[aria-pressed="true"]{border-color:var(--accent);color:var(--glow)}

@media (prefers-reduced-motion:reduce){
  .od.ready,.banner.show,.combo.pop{animation:none}
}
</style>

/* Hanukkah begins the evening before the first full day; 8 days each. */
const HANUKKAH = {2025:[12,14],2026:[12,4],2027:[12,24],2028:[12,12],2029:[12,1],
                  2030:[12,20],2031:[12,9],2032:[11,27],2033:[12,16],2034:[12,6],2035:[12,25]};

function seasonFor(d){
  const y=d.getFullYear(), m=d.getMonth()+1, day=d.getDate();
  const h=HANUKKAH[y];
  if(h){
    const start=new Date(y,h[0]-1,h[1]), end=new Date(y,h[0]-1,h[1]+8);
    if(d>=start && d<end) return 'hanukkah';
  }
  if(m===10) return 'halloween';
  if(m===11) return 'thanksgiving';
  if(m===12) return day<=25 ? 'christmas' : 'newyear';
  if(m===1) return day<=5 ? 'newyear' : 'winter';
  if(m===2) return 'winter';
  if(m>=3 && m<=5) return 'spring';
  if(m===6||m===7) return 'summer';
  if(m===8) return day<=24 ? 'summer' : 'school';
  return 'school';
}

<script>
/* ============ sound ============ */
let AC=null;
/* 2 = music + effects, 1 = effects only, 0 = silent */
let audioMode = (LS.get('sw_audio')!==null) ? +LS.get('sw_audio') : 2;
let soundOn = audioMode>0;
function ctx(){
  AC = AC || new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended') AC.resume();
  return AC;
}
function beep(freq,dur,type='square',vol=.08,slide=0){
  if(!soundOn) return;
  try{
    ctx();
    const o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime;
    o.type=type; o.frequency.setValueAtTime(freq,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide),t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur+.02);
  }catch(e){}
}
const sfx={
  tap:()=>beep(620,.05,'square',.05),
  shot:()=>beep(880,.045,'square',.022,-380),
  laser:()=>beep(1250,.06,'sawtooth',.022,-620),
  pop:()=>beep(320,.11,'square',.05,-190),
  boom:()=>{beep(150,.3,'sawtooth',.075,-110); beep(70,.36,'sine',.09,-30);},
  bigboom:()=>{[0,70,150].forEach((d,i)=>setTimeout(()=>beep(190-i*45,.42,'sawtooth',.1,-140),d));
               beep(55,.6,'sine',.11,-22);},
  pick:()=>{[660,990].forEach((f,i)=>setTimeout(()=>beep(f,.1,'triangle',.07),i*60));},
  power:()=>{[523,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.13,'square',.07),i*55));},
  ouch:()=>{beep(190,.3,'sawtooth',.09,-140); beep(90,.34,'triangle',.08,-40);},
  nova:()=>{[1400,1000,700,480,320].forEach((f,i)=>setTimeout(()=>beep(f,.3,'sawtooth',.085,-180),i*55));
            setTimeout(()=>beep(60,.7,'sine',.12,-20),60);},
  warn:()=>{[440,440].forEach((f,i)=>setTimeout(()=>beep(f,.16,'square',.06),i*220));},
  win:()=>{[523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>beep(f,.22,'triangle',.09),i*110));},
  lose:()=>{[400,340,280,200].forEach((f,i)=>setTimeout(()=>beep(f,.3,'sine',.075),i*170));}
};

/* ============ seasonal chiptune ============ */
/* A small tracker: melody (with a delay echo), a walking bass, and a drum kit.
   Everything runs through a master low-pass so the square waves aren't piercing. */
const midi = n => 440*Math.pow(2,(n-69)/12);
let MU=null, muTimer=null, muStep=0, muNext=0, BUS=null, NOISE=null;

function bus(){
  if(BUS) return BUS;
  const c=ctx();
  const lp=c.createBiquadFilter(); lp.type='lowpass';
  lp.frequency.value=2600; lp.Q.value=.6;
  const g=c.createGain(); g.gain.value=.9;
  lp.connect(g); g.connect(c.destination);
  BUS={lp,g,inp:lp};
  return BUS;
}
function noiseBuf(){
  if(NOISE) return NOISE;
  const c=ctx(), n=c.sampleRate*.5, b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  NOISE=b; return NOISE;
}
function tone(freq,at,dur,wave,vol,detune){
  const c=ctx(), o=c.createOscillator(), g=c.createGain();
  o.type=wave; o.frequency.setValueAtTime(freq,at);
  if(detune) o.detune.setValueAtTime(detune,at);
  g.gain.setValueAtTime(0,at);
  g.gain.linearRampToValueAtTime(vol,at+.012);
  g.gain.exponentialRampToValueAtTime(.0001,at+dur);
  o.connect(g); g.connect(bus().inp);
  o.start(at); o.stop(at+dur+.04);
}
function hit(at,type,vol){
  const c=ctx();
  if(type==='kick'){
    const o=c.createOscillator(), g=c.createGain();
    o.type='sine'; o.frequency.setValueAtTime(132,at);
    o.frequency.exponentialRampToValueAtTime(42,at+.11);
    g.gain.setValueAtTime(vol,at); g.gain.exponentialRampToValueAtTime(.0001,at+.17);
    o.connect(g); g.connect(bus().inp); o.start(at); o.stop(at+.2);
    return;
  }
  const s=c.createBufferSource(); s.buffer=noiseBuf();
  const f=c.createBiquadFilter(), g=c.createGain();
  if(type==='hat'){ f.type='highpass'; f.frequency.value=7200; g.gain.setValueAtTime(vol,at);
    g.gain.exponentialRampToValueAtTime(.0001,at+.045); }
  else { f.type='bandpass'; f.frequency.value=1900; f.Q.value=.8;
    g.gain.setValueAtTime(vol,at); g.gain.exponentialRampToValueAtTime(.0001,at+.13); }
  s.connect(f); f.connect(g); g.connect(bus().inp);
  s.start(at); s.stop(at+.2);
}
function degree(m,d){
  const L=m.scale.length, oct=Math.floor(d/L);
  return m.root + m.scale[((d%L)+L)%L] + 12*oct;
}
function tick(){
  if(!MU || audioMode<2) return;
  try{
  const c=ctx(), beat=60/MU.tempo/2, swing=beat*0.14;
  while(muNext < c.currentTime + 0.4){
    const s=muStep%16, bar=Math.floor(muStep/16)%4, at=muNext + (s%2 ? swing : 0);
    const v=MU.vol;

    /* melody, doubled an octave up very quietly, plus a dotted echo */
    const d=MU.mel[s];
    if(d!==null && d!==undefined){
      const f=midi(degree(MU,d));
      tone(f, at, beat*1.3, MU.wave, v, -4);
      tone(f*2, at, beat*0.7, 'triangle', v*.28, 5);
      tone(f, at+beat*1.5, beat*0.9, 'triangle', v*.22);   // echo
    }
    /* bass: root on the beat, fifth on the off-beat -- gives it a walk */
    if(s%4===0) tone(midi(degree(MU,MU.bass[bar])-24), at, beat*1.6, 'triangle', v*1.5);
    else if(s%4===2) tone(midi(degree(MU,MU.bass[bar]+4)-24), at, beat*.9, 'triangle', v*.85);

    /* drums */
    if(s===0||s===6||s===8) hit(at,'kick',v*4.6);
    if(s===4||s===12)       hit(at,'snare',v*2.1);
    if(s%2===0)             hit(at,'hat',v*(s%4===0?1.5:0.95));

    muNext += beat; muStep++;
  }
  }catch(e){ stopMusic(); }
}
function startMusic(){
  if(audioMode<2 || !MU) return;
  stopMusic(true);
  try{ muStep=0; muNext=ctx().currentTime+0.15; }catch(e){ return; }
  tick(); muTimer=setInterval(tick,110);
}
function stopMusic(keep){ if(muTimer){ clearInterval(muTimer); muTimer=null; } if(!keep){ muStep=0; } }
function setMusic(cfg){ MU=cfg; if(audioMode>=2) startMusic(); }


</script>

function resize(){

     container, position:fixed stops meaning "the screen" and clientWidth goes wrong. */
  W=Math.round(window.innerWidth||document.documentElement.clientWidth||cv.clientWidth||360);
  H=Math.round(window.innerHeight||document.documentElement.clientHeight||cv.clientHeight||640);
  cv.style.width=W+'px'; cv.style.height=H+'px';

  if(P) P.y=clamp(P.y,60,H-40);
}

 'A year on Pluto lasts 248 Earth years. It has not finished one orbit since it was discovered.',
 'Neutron stars can spin 600 times per second.',
 'If you could fly a plane to Pluto, the trip would take more than 800 years.',
 'The universe has no center. Every point is moving away from every other point.',
 'Mars has seasons, polar ice caps, and dust storms that swallow the entire planet.'
];

/* ================= game state ================= */
let T,tKey,bossImg=null,bossReady=false;
let P=null, bullets=[], foes=[], ebul=[], drops=[], parts=[], stars=[];
let boss=null, wave=1, score=0, combo=0, mult=1, od=0, lives=3, tier=1, shield=0;
let spawnQ=[], spawnT=0, state='menu', shake=0, flashT=0, last=0, runKills=0, waveClearT=0;
let bossPending=0;

const TIERS=[
  {n:'Cannon',r:'I',  cd:0.165,dmg:1},    /*  6 dps */
  {n:'Twin',  r:'II', cd:0.175,dmg:1},    /* 11 dps */
  {n:'Spread',r:'III',cd:0.185,dmg:1},    /* 16 dps, but the outer shots often miss */
  {n:'Lance', r:'IV', cd:0.115,dmg:1.3}   /* 34 dps, pierces */
];

/* ================= theme ================= */
function applyTheme(k){
  tKey=k; T=THEMES[k];
  const r=document.documentElement.style;
  r.setProperty('--accent',T.accent); r.setProperty('--accent2',T.accent2);
  r.setProperty('--glow',T.glow);
  $('bossName').textContent=T.bossName;
  bossReady=false;
  const svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 170" width="380" height="323">'
            +T.art()+'</svg>';
  bossImg=new Image();
  bossImg.onload=()=>{bossReady=true;};
  bossImg.onerror=()=>{bossReady=false;};
  bossImg.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  setMusic(T.music);
}

/* ================= starfield ================= */
function seedStars(){
  stars=[];
  for(let i=0;i<130;i++) stars.push({
    x:Math.random()*W, y:Math.random()*H,
    z:Math.random(),                       // depth -> speed + size
    tw:Math.random()*6.28
  });
}
function drawStars(dt){
  for(const s of stars){
    s.y += (14+s.z*130)*dt;
    if(s.y>H){ s.y=-4; s.x=Math.random()*W; }
    s.tw+=dt*3;
    const a=(0.22+s.z*0.55)*(0.72+Math.sin(s.tw)*0.28);
    const r=0.5+s.z*1.7;
    g.globalAlpha=a; g.fillStyle= s.z>0.82 ? T.glow : '#cfe0ff';
    g.beginPath(); g.arc(s.x,s.y,r,0,6.283); g.fill();
  }
  g.globalAlpha=1;
}

/* ================= particles ================= */
const PART_CAP=420;
function burst(x,y,n,col,spd,life){
  if(reduced) n=Math.min(n,5);
  if(parts.length>PART_CAP) return;
  for(let i=0;i<n;i++){
    const a=Math.random()*6.283, v=rnd(spd*0.35,spd);
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,
      life:rnd(life*0.55,life),max:life,col,r:rnd(1.6,3.6)});
  }
}
/* physics lives in update() so particles can never pile up when drawing is skipped */
function updateParts(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.965; p.vy*=0.965; p.vy+=40*dt;
    p.life-=dt;
    if(p.life<=0) parts.splice(i,1);
  }
  if(parts.length>PART_CAP) parts.splice(0,parts.length-PART_CAP);
}
function drawParts(){
  for(const p of parts){
    g.globalAlpha=clamp(p.life/p.max,0,1);
    g.fillStyle=p.col;
    g.beginPath(); g.arc(p.x,p.y,p.r,0,6.283); g.fill();
  }
  g.globalAlpha=1;
}
</script>

<script>
"use strict";
/* ================= the ship ================= */
function newShip(){
  return {x:W/2, y:H-130, tx:W/2, ty:H-130, r:11, inv:0, fire:0, t:0, thrust:0};
}
function drawShip(p,dt){
  const blink = p.inv>0 && Math.floor(p.inv*14)%2===0;
  g.save(); g.translate(p.x,p.y);
  if(blink) g.globalAlpha=0.35;

  const f=7+Math.sin(p.t*32)*3.4+p.thrust*7;
  const fg=g.createLinearGradient(0,10,0,16+f);
  fg.addColorStop(0,'rgba(120,240,255,.95)'); fg.addColorStop(1,'rgba(120,240,255,0)');
  g.fillStyle=fg;
  g.beginPath(); g.moveTo(-5.5,10); g.lineTo(0,15+f); g.lineTo(5.5,10); g.closePath(); g.fill();

  g.fillStyle='#dfe8ff';
  g.beginPath();
  g.moveTo(0,-19); g.lineTo(6.5,-3); g.lineTo(13,10); g.lineTo(5,7.5);
  g.lineTo(0,12); g.lineTo(-5,7.5); g.lineTo(-13,10); g.lineTo(-6.5,-3);
  g.closePath(); g.fill();
  g.fillStyle=T.accent;
  g.beginPath(); g.moveTo(0,-19); g.lineTo(3.4,-4); g.lineTo(-3.4,-4); g.closePath(); g.fill();
  g.fillStyle='#43e8ff';
  g.beginPath(); g.ellipse(0,-3,3,4.6,0,0,6.283); g.fill();
  g.globalAlpha=(blink?0.2:0.55); g.fillStyle='#43e8ff';
  g.beginPath(); g.ellipse(0,-3,5.4,7.4,0,0,6.283); g.fill();
  g.globalAlpha=1;

  if(shield>0){
    g.strokeStyle='rgba(95,227,154,'+(0.45+Math.sin(p.t*9)*0.22)+')';
    g.lineWidth=2.2; g.beginPath(); g.arc(0,-2,23,0,6.283); g.stroke();
  }
  g.restore(); g.globalAlpha=1;
}

/* ================= enemies ================= */
const FOE={
  drifter:{hp:1, r:15, sc:10, spd:74,  size:27, cost:1},
  rusher :{hp:1, r:14, sc:16, spd:245, size:25, cost:1.2},
  weaver :{hp:2, r:17, sc:26, spd:88,  size:31, cost:2,   shoot:2.3},
  turret :{hp:4, r:21, sc:48, spd:52,  size:37, cost:3.5, shoot:1.55, halt:0.30},
  brute  :{hp:9, r:29, sc:95, spd:40,  size:53, cost:7,   shoot:2.7,  halt:0.22}
};
function spawnFoe(type,x){
  const d=FOE[type];
  foes.push({type,x,y:-40,r:d.r,hp:d.hp,max:d.hp,sc:d.sc,size:d.size,
    bx:x, ph:Math.random()*6.283, t:0, st:d.shoot?rnd(0.6,d.shoot):0,
    glyph:pick(T.ammo), hit:0, held:false});
}
function updateFoes(dt){
  for(let i=foes.length-1;i>=0;i--){
    const f=foes[i], d=FOE[f.type];
    f.t+=dt; if(f.hit>0) f.hit-=dt;
    switch(f.type){
      case 'drifter': f.y+=d.spd*dt; f.x=f.bx+Math.sin(f.t*1.9+f.ph)*48; break;
      case 'rusher':  f.y+=d.spd*dt; f.x+=Math.sin(f.t*4+f.ph)*22*dt;    break;
      case 'weaver':  f.y+=d.spd*dt; f.x=f.bx+Math.sin(f.t*2.4+f.ph)*72;
                      f.y+=Math.sin(f.t*3.1)*26*dt; break;
      case 'turret':
      case 'brute': {
        const stop=H*d.halt;
        if(f.y<stop) f.y+=d.spd*dt; else { f.held=true; f.x=f.bx+Math.sin(f.t*0.85+f.ph)*84; }
        break; }
    }
    f.x=clamp(f.x,26,W-26);
    if(d.shoot && (f.held||f.type==='weaver') && state==='playing'){
      f.st-=dt;
      if(f.st<=0){ f.st=d.shoot*rnd(0.8,1.25)*Math.max(0.42,1-wave*0.024); foeShoot(f); }
    }
    if(f.y>H+60){ foes.splice(i,1); continue; }
    if(f.hp<=0){ killFoe(f,i); }
  }
}
function foeShoot(f){
  const a=Math.atan2(P.y-f.y,P.x-f.x);
  const sp=1+Math.min(0.45,wave*0.015);          // bullets get nastier deeper in
  if(f.type==='brute'){
    for(let k=-1;k<=1;k++)
      ebul.push({x:f.x,y:f.y,vx:Math.cos(a+k*0.26)*190*sp,vy:Math.sin(a+k*0.26)*190*sp,r:6});
  } else {
    ebul.push({x:f.x,y:f.y,vx:Math.cos(a)*205*sp,vy:Math.sin(a)*205*sp,r:5});
  }
  sfx.pop();
}
function drawFoes(){
  for(const f of foes){
    g.save(); g.translate(f.x,f.y);
    const s=f.hit>0 ? 1.22 : 1;
    g.scale(s,s);
    if(f.hit>0){ g.shadowColor='#fff'; g.shadowBlur=22; }
    else { g.shadowColor=T.accent2; g.shadowBlur=11; }
    g.font=f.size+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",serif';
    g.textAlign='center'; g.textBaseline='middle';
    g.fillText(f.glyph,0,0);
    g.restore(); g.shadowBlur=0;
    if(f.max>2){
      const w=f.size*0.9, hp=clamp(f.hp/f.max,0,1);
      g.fillStyle='rgba(0,0,0,.55)'; g.fillRect(f.x-w/2,f.y+f.size*0.58,w,3.5);
      g.fillStyle=hp>0.4?T.glow:'#ff4d6d'; g.fillRect(f.x-w/2,f.y+f.size*0.58,w*hp,3.5);
    }
  }
}
function killFoe(f,i){
  foes.splice(i,1);
  burst(f.x,f.y,Math.min(24,10+f.size/3),T.glow,230,0.6);
  burst(f.x,f.y,6,'#fff',150,0.3);
  sfx.boom(); shake=Math.min(shake+3.5,11);
  addScore(f.sc); combo++; runKills++; bumpCombo();
  od=Math.min(100,od+(f.max>2?7:3.2));
  rollDrop(f.x,f.y,f.max);
}
</script>

<script>
"use strict";
/* ================= drops ================= */
const DROP={w:{c:'#43e8ff',t:'W'},s:{c:'#5fe39a',t:'S'},star:{c:'#ffc46b',t:'*'},life:{c:'#ff4d6d',t:'+'}};
function rollDrop(x,y,tough){
  const r=Math.random();
  let k=null;
  if(tough>2){ if(r<0.26) k='w'; else if(r<0.44) k='s'; else if(r<0.82) k='star'; else if(r<0.835) k='life'; }
  else { if(r<0.038) k='w'; else if(r<0.075) k='s'; else if(r<0.22) k='star'; }
  if(k) drops.push({x,y,k,vy:74,t:0,r:15});
}
function updateDrops(dt){
  for(let i=drops.length-1;i>=0;i--){
    const d=drops[i]; d.t+=dt; d.y+=d.vy*dt; d.x+=Math.sin(d.t*2.6)*26*dt;
    /* gentle magnet so a near miss still counts */
    const dx=P.x-d.x, dy=P.y-d.y, dist=Math.hypot(dx,dy);
    if(dist<105){ d.x+=dx/dist*185*dt; d.y+=dy/dist*185*dt; }
    if(dist<d.r+P.r+9){ takeDrop(d); drops.splice(i,1); continue; }
    if(d.y>H+30) drops.splice(i,1);
  }
}
function drawDrops(){
  for(const d of drops){
    const c=DROP[d.k].c, pulse=1+Math.sin(d.t*7)*0.12;
    g.save(); g.translate(d.x,d.y); g.scale(pulse,pulse);
    g.shadowColor=c; g.shadowBlur=16;
    g.strokeStyle=c; g.lineWidth=2.2;
    g.beginPath(); g.arc(0,0,12,0,6.283); g.stroke();
    g.fillStyle='rgba(5,6,15,.75)'; g.fill();
    g.shadowBlur=0; g.fillStyle=c;
    g.font='700 15px "Fredoka",sans-serif'; g.textAlign='center'; g.textBaseline='middle';
    g.fillText(DROP[d.k].t,0,1);
    g.restore();
  }
}
function takeDrop(d){
  if(d.k==='w'){
    if(tier<4){ tier++; sfx.power(); banner('WEAPON UP'); } else { addScore(250); sfx.pick(); }
    updHUD();
  } else if(d.k==='s'){ shield=1; sfx.power(); }
  else if(d.k==='star'){ addScore(60); od=Math.min(100,od+9); sfx.pick(); }
  else if(d.k==='life'){ lives=Math.min(4,lives+1); sfx.power(); banner('EXTRA LIFE'); updHUD(); }
  burst(d.x,d.y,10,DROP[d.k].c,170,0.4);
}

/* ================= player weapons ================= */
function shoot(){
  const w=TIERS[tier-1], y=P.y-20;
  const mk=(x,vx,vy)=>bullets.push({x,y,vx,vy,r:4,dmg:w.dmg,pierce:tier===4});
  if(tier===1) mk(P.x,0,-620);
  else if(tier===2){ mk(P.x-8,0,-640); mk(P.x+8,0,-640); }
  else if(tier===3){ mk(P.x,0,-660); mk(P.x-7,-165,-620); mk(P.x+7,165,-620); }
  else { mk(P.x-9,0,-780); mk(P.x+9,0,-780); mk(P.x,0,-820); }
  tier===4?sfx.laser():sfx.shot();
}
function drawBullets(){
  for(const b of bullets){
    g.save(); g.translate(b.x,b.y);
    g.shadowColor=tier===4?'#43e8ff':T.glow; g.shadowBlur=13;
    g.fillStyle=tier===4?'#c9f6ff':'#fff5dd';
    if(tier===4){ g.fillRect(-2.2,-13,4.4,20); }
    else { g.beginPath(); g.ellipse(0,0,3.1,7.4,0,0,6.283); g.fill(); }
    g.restore(); g.shadowBlur=0;
  }
  for(const b of ebul){
    g.save(); g.translate(b.x,b.y);
    g.shadowColor='#ff4d6d'; g.shadowBlur=13;
    g.fillStyle='#ffd0da';
    g.beginPath(); g.arc(0,0,b.r,0,6.283); g.fill();
    g.fillStyle='#ff4d6d';
    g.beginPath(); g.arc(0,0,b.r*0.55,0,6.283); g.fill();
    g.restore(); g.shadowBlur=0;
  }
}

/* ================= boss ================= */
function spawnBoss(){
  const tough=1+Math.floor(wave/5);
  boss={hp:150+wave*22, max:150+wave*22, x:W/2, y:-120, ty:H*0.20,
        t:0, atk:1.6, warn:0, phase:1, hit:0, dir:Math.random()<.5?-1:1, tough};
  $('bossbar').classList.add('on'); $('bossName').textContent=T.bossName;
  banner('!! '+T.bossName.toUpperCase()+' !!'); sfx.warn();
}
function updateBoss(dt){
  const b=boss; b.t+=dt; if(b.hit>0) b.hit-=dt;
  if(b.y<b.ty){ b.y+=110*dt; return; }
  const ratio=b.hp/b.max;
  b.phase = ratio>0.62?1 : ratio>0.3?2 : 3;
  const spd=(b.phase===3?128:b.phase===2?98:74);
  b.x+=b.dir*spd*dt;
  if(b.x<110){ b.x=110; b.dir=1; } if(b.x>W-110){ b.x=W-110; b.dir=-1; }
  b.y=b.ty+Math.sin(b.t*1.2)*18;

  if(b.warn>0){
    b.warn-=dt;
    if(b.warn<=0) bossFire();
    return;
  }
  b.atk-=dt;
  if(b.atk<=0){
    b.atk = b.phase===3?1.15 : b.phase===2?1.5 : 1.95;
    b.warn=0.42; sfx.warn();
  }
}
function bossFire(){
  const b=boss, aim=Math.atan2(P.y-b.y,P.x-b.x);
  if(b.phase===1){
    for(let i=0;i<12;i++){ const a=i/12*6.283+b.t;
      ebul.push({x:b.x,y:b.y,vx:Math.cos(a)*172,vy:Math.sin(a)*172,r:6}); }
  } else if(b.phase===2){
    if(Math.random()<0.45){
      for(let i=0;i<2;i++) spawnFoe('rusher',rnd(60,W-60));
      banner('INCOMING');
    } else {
      for(let k=-2;k<=2;k++)
        ebul.push({x:b.x,y:b.y,vx:Math.cos(aim+k*0.2)*215,vy:Math.sin(aim+k*0.2)*215,r:6});
    }
  } else {
    for(let i=0;i<16;i++){ const a=i/16*6.283+b.t*1.7;
      ebul.push({x:b.x,y:b.y,vx:Math.cos(a)*195,vy:Math.sin(a)*195,r:6}); }
    for(let k=-1;k<=1;k++)
      ebul.push({x:b.x,y:b.y,vx:Math.cos(aim+k*0.16)*260,vy:Math.sin(aim+k*0.16)*260,r:7});
  }
  sfx.pop();
}
function drawBoss(){
  const b=boss;
  g.save(); g.translate(b.x,b.y);
  const wob=1+Math.sin(b.t*2.2)*0.02;
  g.scale(wob,wob);
  if(b.warn>0 && Math.floor(b.warn*18)%2===0){ g.shadowColor='#fff'; g.shadowBlur=34; }
  else { g.shadowColor=T.accent2; g.shadowBlur=20; }
  if(bossReady && bossImg){
    g.drawImage(bossImg,-95,-81,190,162);
    if(b.hit>0){ g.globalCompositeOperation='lighter'; g.globalAlpha=clamp(b.hit*4,0,0.75);
      g.drawImage(bossImg,-95,-81,190,162);
      g.globalCompositeOperation='source-over'; g.globalAlpha=1; }
  } else {
    g.fillStyle=T.accent; g.beginPath(); g.arc(0,0,58,0,6.283); g.fill();
  }
  g.restore(); g.shadowBlur=0;
}
function killBoss(){
  const b=boss;
  for(let i=0;i<7;i++) setTimeout(()=>{
    if(state!=='playing'&&state!=='over') return;
    burst(b.x+rnd(-60,60),b.y+rnd(-50,50),16,pick([T.glow,T.accent,'#fff']),300,0.85);
  },i*95);
  sfx.bigboom(); shake=26; flashT=0.3;
  addScore(700+wave*90);
  boss=null; $('bossbar').classList.remove('on');
  banner('WRECKED!');
  od=Math.min(100,od+30);
}
</script>

<script>
"use strict";
/* ================= waves ================= */
function startWave(n){
  wave=n; updHUD(); spawnQ=[]; spawnT=0;
  if(n%5===0){ banner('WAVE '+n); bossPending=1.15; return; }
  let budget=5+n*3.7, tAcc=0.5;
  const unlock=[['drifter',1],['rusher',2],['weaver',3],['turret',5],['brute',7]];
  const pool=unlock.filter(u=>n>=u[1]).map(u=>u[0]);
  let guard=0;
  while(budget>0.8 && guard++<80){
    const t=pick(pool), c=FOE[t].cost;
    if(c>budget) continue;
    budget-=c;
    spawnQ.push({type:t,at:tAcc,x:rnd(48,W-48)});
    tAcc+=rnd(0.26,0.72);
  }
  banner('WAVE '+n);
}
function pumpWave(dt){
  if(bossPending>0){                      // boss inbound: hold the wave open
    bossPending-=dt;
    if(bossPending<=0 && !boss) spawnBoss();
    return;
  }
  spawnT+=dt;
  while(spawnQ.length && spawnQ[0].at<=spawnT){
    const s=spawnQ.shift(); spawnFoe(s.type,s.x);
  }
  if(!spawnQ.length && !foes.length && !boss){
    waveClearT-=dt;
    if(waveClearT<=0){ waveClearT=1.6; startWave(wave+1); }
  } else waveClearT=1.6;
}

/* ================= scoring ================= */
function addScore(v){ score+=Math.round(v*mult); updHUD(); }
function bumpCombo(){
  const before=mult;
  mult = combo>=70?5 : combo>=40?4 : combo>=20?3 : combo>=8?2 : 1;
  const el=$('combo');
  el.textContent='x'+mult+(mult>1?'  '+combo+' chain':'');
  el.classList.toggle('on',mult>1);
  if(mult>before){ el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
}

/* ================= damage ================= */
function hurt(){
  if(P.inv>0||state!=='playing') return;
  combo=0; bumpCombo();
  burst(P.x,P.y,20,'#ff4d6d',250,0.62);
  shake=16; sfx.ouch(); P.inv=1.25;
  if(shield>0){ shield=0; banner('SHIELD DOWN'); return; }
  if(tier>1){ tier--; updHUD(); banner('WEAPON DOWN'); return; }
  lives--; updHUD(); flashT=0.26;
  if(lives<0) gameOver(); else banner('SHIP LOST');
}

/* ================= overdrive ================= */
function nova(){
  if(od<100||state!=='playing') return;
  od=0; updOD(); sfx.nova(); shake=24; flashT=0.34;
  P.inv=Math.max(P.inv,1.25); ebul.length=0;
  for(const f of foes){ f.hp-=6; f.hit=0.22; }
  if(boss){ boss.hp-=60; boss.hit=0.3; if(boss.hp<=0) killBoss(); }
  for(let i=0;i<44;i++){ const a=i/44*6.283;
    parts.push({x:P.x,y:P.y,vx:Math.cos(a)*rnd(250,470),vy:Math.sin(a)*rnd(250,470),
      life:0.85,max:0.85,col:i%2?T.glow:'#fff',r:rnd(2,4.7)}); }
  banner('OVERDRIVE');
}

/* ================= collisions ================= */
function collide(dt){
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.x+=b.vx*dt; b.y+=b.vy*dt;
    let gone=false;
    if(boss && boss.y>0 && Math.hypot(b.x-boss.x,b.y-boss.y)<64){
      boss.hp-=b.dmg*1.6; boss.hit=0.12;
      burst(b.x,b.y,3,'#fff',110,0.2);
      if(!b.pierce) gone=true;
      if(boss.hp<=0){ killBoss(); }
    }
    if(!gone){
      for(let j=0;j<foes.length;j++){
        const f=foes[j];
        if(Math.hypot(b.x-f.x,b.y-f.y)<f.r+b.r){
          f.hp-=b.dmg; f.hit=0.11;
          burst(b.x,b.y,3,T.glow,120,0.2);
          if(!b.pierce) gone=true;
          break;
        }
      }
    }
    if(gone||b.y<-30||b.x<-40||b.x>W+40) bullets.splice(i,1);
  }
  for(let i=ebul.length-1;i>=0;i--){
    const b=ebul[i];
    b.x+=b.vx*dt; b.y+=b.vy*dt;
    if(b.y<-50||b.y>H+50||b.x<-50||b.x>W+50){ ebul.splice(i,1); continue; }
    if(P.inv<=0 && Math.hypot(b.x-P.x,b.y-P.y)<b.r+P.r){ ebul.splice(i,1); hurt(); }
  }
  if(P.inv<=0){
    for(const f of foes){
      if(Math.hypot(f.x-P.x,f.y-P.y)<f.r+P.r){ f.hp-=3; f.hit=0.15; hurt(); break; }
    }
    if(boss && boss.y>0 && Math.hypot(boss.x-P.x,boss.y-P.y)<70) hurt();
  }
}

/* ================= HUD ================= */
function updHUD(){
  $('score').textContent=money(score);
  $('wave').textContent=wave;
  const w=TIERS[tier-1];
  $('wep').innerHTML=w.n+' <b>'+w.r+'</b>';
  let h='';
  for(let i=0;i<Math.max(lives+1,0);i++) h+='<div class="pip"></div>';
  $('lives').innerHTML=h;
}
function updOD(){
  $('odFill').style.height=od+'%';
  $('od').classList.toggle('ready',od>=100);
  $('odTxt').innerHTML = od>=100 ? 'FIRE!' : 'OVER<br>DRIVE';
}
function banner(t){
  const el=$('banner'); el.textContent=t;
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
}
</script>

<script>
"use strict";
/* ================= input ================= */
const keys={};
let dragging=false;
function pointAt(e){
  const r=cv.getBoundingClientRect();
  P.tx=e.clientX-r.left;
  P.ty=e.clientY-r.top-58;        // ship rides above the finger so it stays visible
}
cv.addEventListener('pointerdown',e=>{ if(state!=='playing')return;
  dragging=true;
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}    // throws on some embedded webviews
  pointAt(e); e.preventDefault(); });
cv.addEventListener('pointermove',e=>{ if(dragging&&state==='playing'){ pointAt(e); e.preventDefault(); } });
cv.addEventListener('pointerup',e=>{ dragging=false; });
cv.addEventListener('pointercancel',()=>{ dragging=false; });
/* Fallback for webviews where pointer events misbehave inside an iframe. */
function touchAt(e){ if(state!=='playing'||!e.touches||!e.touches.length) return;
  pointAt(e.touches[0]); e.preventDefault(); }
cv.addEventListener('touchstart',touchAt,{passive:false});
cv.addEventListener('touchmove',touchAt,{passive:false});
addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;
  if(e.key===' '){ e.preventDefault(); nova(); }
  if(e.key==='p'||e.key==='Escape'){ state==='playing'?pause():(state==='paused'&&resume()); }
});
addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });
$('od').addEventListener('click',nova);
$('pauseBtn').addEventListener('click',()=>{ state==='playing'?pause():(state==='paused'&&resume()); });

/* ================= loop ================= */
function update(dt){
  P.t+=dt;
  if(P.inv>0) P.inv-=dt;
  const kl=keys['arrowleft']||keys['a'], kr=keys['arrowright']||keys['d'],
        ku=keys['arrowup']||keys['w'],   kd=keys['arrowdown']||keys['s'];
  if(kl||kr||ku||kd){
    const v=430*dt;
    P.tx=P.x+((kr?1:0)-(kl?1:0))*v*4; P.ty=P.y+((kd?1:0)-(ku?1:0))*v*4;
  }
  P.tx=clamp(P.tx,20,W-20); P.ty=clamp(P.ty,70,H-30);
  const k=Math.min(1,dt*13);
  const px=P.x;
  P.x+=(P.tx-P.x)*k; P.y+=(P.ty-P.y)*k;
  P.thrust=clamp(Math.abs(P.x-px)*0.06,0,1);

  P.fire-=dt;
  if(P.fire<=0){ P.fire=TIERS[tier-1].cd; shoot(); }

  pumpWave(dt);
  updateFoes(dt);
  if(boss){
    updateBoss(dt);
    $('bossFill').style.width=clamp(boss.hp/boss.max*100,0,100)+'%';
  }
  updateDrops(dt);
  collide(dt);
  updateParts(dt);
  od=Math.min(100,od); updOD();
  if(shake>0) shake=Math.max(0,shake-dt*44);
  if(flashT>0) flashT-=dt;
}
function draw(dt){
  g.clearRect(0,0,W,H);
  const grd=g.createLinearGradient(0,0,0,H);
  grd.addColorStop(0,'#080b1c'); grd.addColorStop(0.55,'#05060f'); grd.addColorStop(1,'#0a0716');
  g.fillStyle=grd; g.fillRect(0,0,W,H);

  g.save();
  if(shake>0.2) g.translate(rnd(-shake,shake)*0.5,rnd(-shake,shake)*0.5);
  drawStars(dt);
  drawDrops();
  if(boss) drawBoss();
  drawFoes();
  drawBullets();
  if(state!=='over') drawShip(P,dt);
  drawParts();
  g.restore();

  if(flashT>0){ g.fillStyle='rgba(255,255,255,'+clamp(flashT*1.5,0,0.5)+')'; g.fillRect(0,0,W,H); }
}
let framesDrawn=0;
function frame(ts){
  if(!window.__fbDrive) requestAnimationFrame(frame);
  framesDrawn++;
  const dt=Math.min(0.042,(ts-last)/1000)||0.016; last=ts;
  if(state==='playing') update(dt);
  draw(dt);
}

/* ================= flow ================= */
function newRun(){
  hideCard();
  bullets=[];foes=[];ebul=[];drops=[];parts=[];
  boss=null; $('bossbar').classList.remove('on');
  score=0; combo=0; mult=1; od=0; lives=3; tier=1; shield=0; runKills=0;
  wave=0; waveClearT=1.6; spawnQ=[]; spawnT=0; shake=0; flashT=0; bossPending=0;
  P=newShip(); seedStars();
  bumpCombo(); updHUD(); updOD();
  state='playing'; last=performance.now();
  if(audioMode>=2) startMusic();
  startWave(1);
}
function pause(){
  if(state!=='playing') return;
  state='paused'; stopMusic();
  showCard(`<div class="tag">Paused</div>
    <h2>Take a breath</h2>
    <div class="stats">
      <div class="stat"><div class="v">${money(score)}</div><div class="k">Score</div></div>
      <div class="stat"><div class="v">${wave}</div><div class="k">Wave</div></div>
      <div class="stat"><div class="v">x${mult}</div><div class="k">Combo</div></div>
    </div>
    <button class="big" id="resBtn">RESUME</button>
    <button class="ghost" id="muteBtn">Music &amp; sound</button>
    <button class="ghost" id="quitBtn">Quit to title</button>`);
  $('resBtn').onclick=resume;
  $('muteBtn').onclick=()=>{ cycleAudio(); $('muteBtn').textContent=audioLabel(); };
  $('muteBtn').textContent=audioLabel();
  $('quitBtn').onclick=()=>{ state='menu'; stopMusic(); menu(); };
}
function resume(){
  if(state!=='paused') return;
  hideCard(); state='playing'; last=performance.now();
  if(audioMode>=2) startMusic();
}
function gameOver(){
  state='over'; stopMusic(); sfx.lose();
  burst(P.x,P.y,40,'#ff4d6d',340,1); shake=22; flashT=0.3;
  const best=score>SV.hi;
  SV.hi=Math.max(SV.hi,score); SV.bw=Math.max(SV.bw,wave);
  SV.kills=SV.kills+runKills; SV.runs=SV.runs+1;
  setTimeout(()=>{
    showCard(`<div class="tag">${best?'New personal best':'Run over'}</div>
      <h2>${best?'BEST RUN YET!':'Ship down'}</h2>
      <div class="stats">
        <div class="stat"><div class="v">${money(score)}</div><div class="k">Score</div></div>
        <div class="stat"><div class="v">${wave}</div><div class="k">Wave</div></div>
        <div class="stat"><div class="v">${runKills}</div><div class="k">Wrecked</div></div>
      </div>
      <p class="small">Best ever: <b style="color:var(--glow)">${money(SV.hi)}</b> &nbsp;&middot;&nbsp; furthest wave ${SV.bw}</p>
      <div class="scroll"><span class="lbl">Transmission from deep space</span>${pick(FACTS)}</div>
      <button class="big" id="againBtn">FLY AGAIN</button>
      <button class="ghost" id="titleBtn">Title screen</button>`);
    $('againBtn').onclick=newRun;
    $('titleBtn').onclick=()=>{ state='menu'; menu(); };
  },900);
}

/* ================= screens ================= */
function showCard(h){ $('veilCard').innerHTML=h; $('veil').hidden=false; $('hud').style.opacity=0.25; }
function hideCard(){ $('veil').hidden=true; $('hud').style.opacity=1; }
function audioLabel(){ return ['Sound: off','Sound: effects only','Sound: music + effects'][audioMode]; }
function cycleAudio(){
  audioMode=(audioMode+1)%3; soundOn=audioMode>0;
  LS.set('sw_audio',audioMode);
  paintSound();
  if(audioMode>=2 && state==='playing') setMusic(T.music); else stopMusic();
  if(soundOn) sfx.tap();
}
function paintSound(){
  const b=$('soundBtn');
  b.innerHTML=['&#128263;','&#9834;','&#9835;'][audioMode];
  b.title=audioLabel(); b.setAttribute('aria-label',audioLabel());
  b.style.color=audioMode?'var(--accent)':'var(--dim)';
}
$('soundBtn').addEventListener('click',cycleAudio);

function menu(){
  hideCard();
  showCard(`<h1>STAR<br>WRECKER</h1>
    <p class="small">Drag to fly. You shoot automatically. Wreck everything.</p>
    <div class="stats">
      <div class="stat"><div class="v">${money(SV.hi)}</div><div class="k">Best score</div></div>
      <div class="stat"><div class="v">${SV.bw}</div><div class="k">Best wave</div></div>
      <div class="stat"><div class="v">${money(SV.kills)}</div><div class="k">Total wrecked</div></div>
    </div>
    <button class="big" id="playBtn">PLAY</button>
    <button class="ghost" id="howBtn">How to play</button>
    <button class="ghost" id="seasonBtn">Season: ${T.label}</button>`);
  $('playBtn').onclick=newRun;
  $('howBtn').onclick=how;
  $('seasonBtn').onclick=seasons;
}
function how(){
  showCard(`<h2>How to fly</h2>
    <ul>
      <li><b>Drag anywhere</b> to move. Your ship rides just above your finger so you can see it.</li>
      <li>You <b>fire automatically</b>. Never tap to shoot.</li>
      <li>Grab <b>W</b> to upgrade your gun, <b>S</b> for a shield, <b>&#42;</b> for overdrive fuel.</li>
      <li>Getting hit <b>knocks your weapon down a tier</b> instead of killing you. You only lose a
        ship if you're already at Cannon I.</li>
      <li>Kills without getting hit build a <b>combo</b> &mdash; up to <b>x5 score</b>. Getting hit resets it.</li>
      <li>When <b>OVERDRIVE</b> lights up, tap it: everything on screen takes a hit and all enemy
        fire is wiped. Save it for the boss.</li>
      <li>Every <b>5th wave</b> is a boss. It changes its attack pattern as its health drops.</li>
    </ul>
    <p class="small">Keyboard: arrows or WASD to fly, space for overdrive, P to pause.</p>
    <button class="big" id="backBtn">GOT IT</button>`);
  $('backBtn').onclick=menu;
}
function seasons(){
  const cur=SV.over||seasonFor(new Date());
  showCard(`<h2>Pick a sky</h2>
    <p class="small">It follows the calendar on its own. This just lets you jump ahead.</p>
    <div class="seasons" id="pickWrap">
      ${Object.entries(THEMES).map(([k,v])=>
        `<button data-k="${k}" aria-pressed="${k===cur}">${v.label}</button>`).join('')}
    </div>
    <button class="ghost" id="autoBtn">Back to today's sky</button>
    <button class="big" id="backBtn">DONE</button>`);
  $('pickWrap').onclick=e=>{
    const b=e.target.closest('button[data-k]'); if(!b) return;
    SV.over=b.dataset.k; applyTheme(b.dataset.k); seasons();
  };
  $('autoBtn').onclick=()=>{ SV.over=''; applyTheme(seasonFor(new Date())); seasons(); };
  $('backBtn').onclick=menu;
}

/* pause when the phone or tab goes away, so nothing runs unseen */
document.addEventListener('visibilitychange',()=>{ if(document.hidden && state==='playing') pause(); });

/* ================= boot ================= */
resize(); 
applyTheme(SV.over||seasonFor(new Date()));
stopMusic();
P=newShip(); seedStars(); updHUD(); updOD(); bumpCombo(); paintSound();
menu();
requestAnimationFrame(frame);
/* iOS Low Power Mode (and some embedded webviews) suspend requestAnimationFrame outright.
   If not a single frame lands while the page is visible, drive the loop from a timer instead. */
window.__fbDrive=false;
setTimeout(function(){
  if(framesDrawn>0 || document.visibilityState!=='visible') return;
  window.__fbDrive=true;
  setInterval(function(){ if(document.visibilityState==='visible') frame(performance.now()); },33);
},900);
/* A blank screen tells us nothing; if no frame ever painted, report the state. */
setTimeout(function(){
  /* rAF is paused in a hidden tab -- that is normal, not a failure. */
  if(framesDrawn>2 || window.__swErr || document.visibilityState!=='visible') return;
  try{
    document.getElementById('veilCard').innerHTML=
      '<h2>Display trouble</h2><p class="small">Screenshot this for Dad:</p>'+
      '<div class="scroll" style="font-family:monospace;font-size:11px">'+
      'frames='+framesDrawn+' canvas='+W+'x'+H+' dpr='+DPR+
      '<br>window='+window.innerWidth+'x'+window.innerHeight+
      '<br>storage blocked='+LS.blocked+' state='+state+
      '<br>ctx='+(!!g)+' theme='+tKey+'</div>';
    document.getElementById('veil').hidden=false;
  }catch(_){}
},2500);
</script>
