<script>
/* Safari throws on localStorage inside cross-site iframes; route everything through a shim. */
var LS=(function(){
  var ok=false, mem={};
  try{ window.localStorage.setItem('__ss','1'); window.localStorage.removeItem('__ss'); ok=true; }catch(e){ ok=false; }
  return {
    blocked:!ok,
    get:function(k){ try{ return ok?window.localStorage.getItem(k):(k in mem?mem[k]:null); }
                     catch(e){ return (k in mem)?mem[k]:null; } },
    set:function(k,v){ try{ if(ok) window.localStorage.setItem(k,String(v)); else mem[k]=String(v); }
                       catch(e){ mem[k]=String(v); } },
    del:function(k){ try{ if(ok) window.localStorage.removeItem(k); else delete mem[k]; }
                     catch(e){ delete mem[k]; } }
  };
})();
</script>
<script>
/* The page host owns <head>, so set up the mobile viewport ourselves before layout.
   Without this iOS renders at 980px wide and the whole game looks zoomed out. */
(function(){
  function meta(name,content,attr){
    var sel='meta['+(attr||'name')+'="'+name+'"]', m=document.querySelector(sel);
    if(!m){ m=document.createElement('meta'); m.setAttribute(attr||'name',name);
            (document.head||document.documentElement).appendChild(m); }
    m.setAttribute('content',content);
  }
  meta('viewport','width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover');
  meta('apple-mobile-web-app-capable','yes');          // full-screen when saved to home screen
  meta('mobile-web-app-capable','yes');
  meta('apple-mobile-web-app-status-bar-style','black-translucent');
  meta('apple-mobile-web-app-title','Spellslinger');
  meta('theme-color','#17121f');
  meta('color-scheme','dark');
})();
</script>
<title>Spellslinger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --ink:#17121f; --ink2:#221a2e; --ink3:#2e2440;
  --chalk:#efe6f5; --dim:#9d90ad;
  --accent:#ff8a2b; --accent2:#8b5cf6; --glow:#ffb35c;
  --good:#5fd08a; --bad:#f2657a;
  --tile:#f4ecd8; --tileInk:#2a2035;
  --r:14px;
  --sp:clamp(6px,1.4vh,12px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--ink);
  color:var(--chalk);
  font-family:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;
  overscroll-behavior:none;
}
#sky{position:fixed;left:0;top:0;width:100%;height:100%;z-index:0;pointer-events:none}
#wrap{
  position:relative;z-index:1;
  height:100dvh;max-width:min(600px,100%);margin:0 auto;
  display:flex;flex-direction:column;
  padding:calc(var(--sp) + env(safe-area-inset-top,0px)) 14px calc(var(--sp) + env(safe-area-inset-bottom,0px));
  gap:var(--sp);
}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:0 0 auto}
.brand{font-family:'Luckiest Guy',cursive;font-size:clamp(17px,4.6vw,22px);letter-spacing:.4px;
  color:var(--accent);text-shadow:0 2px 0 rgba(0,0,0,.45);line-height:1}
.season{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-top:2px}
.iconbtn{background:var(--ink2);border:1.5px solid var(--ink3);color:var(--dim);
  width:36px;height:36px;border-radius:11px;font-size:15px;cursor:pointer;display:grid;place-items:center;
  font-family:inherit;transition:.15s}
.iconbtn:hover,.iconbtn:focus-visible{color:var(--chalk);border-color:var(--accent)}
.iconrow{display:flex;gap:7px}

/* ---------- boss ---------- */
.stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--sp)}
.bossname{font-family:'Luckiest Guy',cursive;font-size:clamp(15px,4.4vw,21px);text-align:center;
  text-wrap:balance;line-height:1.15;color:var(--chalk);text-shadow:0 2px 0 rgba(0,0,0,.5)}
.bosswrap{flex:1 1 auto;min-height:0;display:grid;place-items:center;width:100%;position:relative;padding:2px 0}
#boss{width:100%;height:100%;max-width:min(88vw,340px);overflow:visible;
  animation:bob 3.4s ease-in-out infinite;transform-origin:50% 90%}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-9px) rotate(1deg)}}
#boss.hurt{animation:shake .34s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-11px) rotate(-4deg)}
  45%{transform:translateX(9px) rotate(4deg)}70%{transform:translateX(-5px)}}
#boss.gone{transition:.7s cubic-bezier(.4,0,.6,1);transform:translateY(46px) scale(.35) rotate(22deg);opacity:0;animation:none}
.blink{animation:blink 4.6s infinite}
@keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}

/* ---------- hp bars ---------- */
.bars{display:flex;flex-direction:column;gap:6px;width:100%;flex:0 0 auto}
.bar{display:flex;align-items:center;gap:9px}
.bar .who{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);width:56px;flex:0 0 auto}
.track{flex:1;height:15px;background:var(--ink2);border-radius:99px;overflow:hidden;
  border:1.5px solid var(--ink3);position:relative}
.fill{height:100%;border-radius:99px;transition:width .45s cubic-bezier(.3,1.3,.5,1)}
.fill.foe{background:linear-gradient(90deg,var(--accent2),var(--accent))}
.fill.hero{background:linear-gradient(90deg,#3f9f6e,var(--good))}
.bar .num{font-family:'Roboto Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;
  font-size:12px;font-weight:700;color:var(--dim);width:60px;text-align:right;flex:0 0 auto}

/* ---------- speech ---------- */
.ribbon{flex:0 0 auto;min-height:46px;display:grid;place-items:center;padding:8px 12px;
  background:var(--ink2);border:1.5px solid var(--ink3);border-radius:var(--r);
  text-align:center;font-size:clamp(13px,3.5vw,15px);line-height:1.35;text-wrap:balance;color:var(--chalk)}
.ribbon b{color:var(--glow);font-weight:700}
.ribbon.pop{animation:pop .3s}
@keyframes pop{0%{transform:scale(.94)}55%{transform:scale(1.035)}100%{transform:scale(1)}}

/* ---------- spell line ---------- */
.spellzone{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:5px}
.spell{min-height:50px;display:flex;gap:5px;align-items:center;justify-content:center;flex-wrap:wrap}
.spell:empty::after{content:'tap letters to build a spell';font-size:12.5px;color:var(--dim);letter-spacing:.02em}
.dmg{font-family:'Roboto Mono',monospace;font-variant-numeric:tabular-nums;font-size:12.5px;
  font-weight:700;letter-spacing:.06em;min-height:17px;color:var(--dim);transition:.18s}
.dmg.live{color:var(--good)}
.dmg.mega{color:var(--glow)}

/* ---------- tiles ---------- */
.rack{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.tile{
  position:relative;height:clamp(46px,8.4vh,78px);border:none;border-radius:12px;
  background:var(--tile);color:var(--tileInk);
  font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(20px,6.4vw,28px);
  text-transform:uppercase;cursor:pointer;
  box-shadow:0 4px 0 rgba(0,0,0,.42);
  transition:transform .11s,box-shadow .11s,opacity .16s;
  display:grid;place-items:center;line-height:1;
}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.42)}
.tile:focus-visible{outline:3px solid var(--glow);outline-offset:2px}
.tile .pts{position:absolute;right:6px;bottom:5px;font-family:'Roboto Mono',monospace;
  font-size:10.5px;font-weight:700;opacity:.6}
.tile.used{opacity:.2;pointer-events:none;box-shadow:none;transform:translateY(3px)}
.tile.fresh{animation:drop .3s cubic-bezier(.3,1.5,.5,1)}
@keyframes drop{0%{transform:translateY(-16px) scale(.8);opacity:0}100%{transform:none;opacity:1}}
.spell .tile{width:clamp(30px,8.4vw,38px);height:clamp(30px,8.4vw,38px);font-size:clamp(16px,4.6vw,20px);
  box-shadow:0 3px 0 rgba(0,0,0,.42);background:var(--glow);color:var(--ink)}
.spell .tile .pts{display:none}

/* ---------- buttons ---------- */
.actions{flex:0 0 auto;display:grid;grid-template-columns:auto 1fr auto;gap:7px}
.btn{border:none;border-radius:12px;font-family:'Fredoka',sans-serif;font-weight:600;
  cursor:pointer;padding:12px 15px;font-size:14px;transition:.14s;box-shadow:0 3px 0 rgba(0,0,0,.4)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.4)}
.btn:focus-visible{outline:3px solid var(--glow);outline-offset:2px}
.btn.ghost{background:var(--ink2);color:var(--dim);border:1.5px solid var(--ink3);box-shadow:none}
.btn.ghost:active{transform:translateY(1px)}
.btn.cast{background:var(--accent);color:#1b1220;font-family:'Luckiest Guy',cursive;
  font-size:clamp(15px,4.4vw,18px);letter-spacing:.5px}
.btn.cast[disabled]{background:var(--ink3);color:var(--dim);cursor:default;box-shadow:0 3px 0 rgba(0,0,0,.3)}

/* ---------- floating damage ---------- */
.floater{position:absolute;left:50%;top:34%;transform:translateX(-50%);pointer-events:none;
  font-family:'Luckiest Guy',cursive;font-size:38px;color:var(--glow);
  text-shadow:0 3px 0 rgba(0,0,0,.55);animation:float 1.05s ease-out forwards;z-index:5}
@keyframes float{0%{opacity:0;transform:translate(-50%,10px) scale(.5)}
  22%{opacity:1;transform:translate(-50%,-8px) scale(1.18)}
  100%{opacity:0;transform:translate(-50%,-72px) scale(1)}}

/* ---------- the spell in flight: a comet that bursts into fruit ---------- */
.orb{position:absolute;left:0;top:0;width:clamp(20px,5.4vw,27px);height:clamp(20px,5.4vw,27px);
  margin:-13px 0 0 -13px;border-radius:50%;pointer-events:none;z-index:7;will-change:transform;
  background:radial-gradient(circle at 36% 32%, #fff 0%, var(--glow) 34%, var(--accent) 68%,
    rgba(0,0,0,0) 71%);
  box-shadow:0 0 13px 3px var(--glow), 0 0 30px 9px var(--accent)}
.trail{position:absolute;left:0;top:0;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;
  border-radius:50%;pointer-events:none;z-index:6;
  background:radial-gradient(circle, var(--glow) 0%, rgba(0,0,0,0) 68%);
  animation:trailfade .44s ease-out forwards}
@keyframes trailfade{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(.2)}}
.flash{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;
  pointer-events:none;z-index:7;background:#fff;animation:flash .22s ease-out forwards}
@keyframes flash{0%{transform:scale(.5);opacity:.95}100%{transform:scale(4.2);opacity:0}}
/* the orb turns into a rotten something and splats down the monster's face */
.pulp{position:absolute;left:0;top:0;font-size:clamp(30px,8.6vw,44px);line-height:1;
  pointer-events:none;z-index:6;filter:drop-shadow(0 3px 5px rgba(0,0,0,.55));
  animation:pulp .85s cubic-bezier(.2,1.3,.4,1) forwards}
@keyframes pulp{
  0%{transform:translate(-50%,-50%) scale(.2) rotate(-20deg);opacity:0}
  16%{transform:translate(-50%,-50%) scale(1.55,.68) rotate(7deg);opacity:1}
  36%{transform:translate(-50%,-50%) scale(.9,1.16) rotate(-5deg);opacity:1}
  58%{transform:translate(-50%,-42%) scale(1.08,.88) rotate(4deg);opacity:1}
  100%{transform:translate(-50%,26%) scale(.86,.74) rotate(12deg);opacity:0}}
.splat{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;
  border:3px solid var(--glow);pointer-events:none;z-index:5;animation:ring .45s ease-out forwards}
@keyframes ring{0%{transform:scale(.35);opacity:1}100%{transform:scale(6.5);opacity:0}}
.spark{position:absolute;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;
  background:var(--glow);pointer-events:none;z-index:5;animation:spark .52s ease-out forwards}
@keyframes spark{0%{transform:translate(0,0) scale(1);opacity:1}
  100%{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
#wrap.quake{animation:quake .42s}
@keyframes quake{0%,100%{transform:translate(0,0)}
  15%{transform:translate(-7px,4px)}35%{transform:translate(6px,-5px)}
  55%{transform:translate(-5px,-3px)}78%{transform:translate(4px,3px)}}

/* ---------- overlay ---------- */
.veil{position:fixed;inset:0;z-index:20;background:rgba(12,8,20,.9);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);
  display:grid;place-items:center;padding:20px;overflow-y:auto}
.veil[hidden]{display:none}
.card{background:var(--ink2);border:1.5px solid var(--ink3);border-radius:20px;
  padding:22px 20px;max-width:400px;width:100%;text-align:center;
  display:flex;flex-direction:column;gap:13px;box-shadow:0 18px 44px rgba(0,0,0,.55);
  animation:rise .34s cubic-bezier(.3,1.2,.5,1)}
@keyframes rise{0%{transform:translateY(16px);opacity:0}100%{transform:none;opacity:1}}
.card h2{font-family:'Luckiest Guy',cursive;font-size:clamp(23px,7vw,32px);color:var(--accent);
  line-height:1.1;text-wrap:balance;font-weight:400}
.card p{font-size:14.5px;line-height:1.5;text-wrap:balance}
.card p.small{font-size:13px;color:var(--dim)}
.scroll{background:var(--ink);border:1.5px solid var(--ink3);border-radius:var(--r);padding:14px;
  text-align:left;font-size:13.5px;line-height:1.55}
.scroll .lbl{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);
  display:block;margin-bottom:5px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--ink);border:1.5px solid var(--ink3);border-radius:11px;padding:9px 5px}
.stat .v{font-family:'Roboto Mono',monospace;font-variant-numeric:tabular-nums;
  font-size:19px;font-weight:700;color:var(--glow);line-height:1.2}
.stat .k{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-top:2px}
.seasons{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.seasons button{background:var(--ink);border:1.5px solid var(--ink3);color:var(--chalk);
  border-radius:11px;padding:9px 7px;font-family:inherit;font-size:12.5px;cursor:pointer;transition:.14s}
.seasons button:hover,.seasons button:focus-visible{border-color:var(--accent);color:var(--glow)}
.seasons button[aria-pressed="true"]{border-color:var(--accent);background:var(--ink3);color:var(--glow)}
.veil ul{text-align:left;font-size:13.5px;line-height:1.6;padding-left:19px;display:flex;
  flex-direction:column;gap:5px}
.veil ul b{color:var(--glow)}

@keyframes waveBye{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(24deg)}}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  #sky{display:none}
}
@media (max-height:620px){ .bossname{display:none} }
@media (min-width:700px){
  #boss{max-width:min(66vw,470px)}
  .brand{font-size:24px}
  .ribbon{font-size:16px;min-height:54px}
}
</style>

}

/* Hanukkah begins the evening before the first full day; 8 days each. */
const HANUKKAH = {2025:[12,14],2026:[12,4],2027:[12,24],2028:[12,12],2029:[12,1],
                  2030:[12,20],2031:[12,9],2032:[11,27],2033:[12,16],2034:[12,6],2035:[12,25]};

function seasonFor(d){
  const y=d.getFullYear(), m=d.getMonth()+1, day=d.getDate();
  const h=HANUKKAH[y];
  if(h){
    const start=new Date(y,h[0]-1,h[1]), end=new Date(y,h[0]-1,h[1]+8);
    if(d>=start && d<end) return 'hanukkah';
  }
  if(m===10) return 'halloween';
  if(m===11) return 'thanksgiving';
  if(m===12) return day<=25 ? 'christmas' : 'newyear';
  if(m===1) return day<=5 ? 'newyear' : 'winter';
  if(m===2) return 'winter';
  if(m>=3 && m<=5) return 'spring';
  if(m===6||m===7) return 'summer';
  if(m===8) return day<=24 ? 'summer' : 'school';
  return 'school';
}

<script>
"use strict";

/* ============ dictionary (prefix-delta decoded) ============ */
const DICT = new Set();
(function(){
  const raw = document.getElementById('wordblob').textContent;
  let prev='';
  for(const line of raw.split('\n')){
    if(!line) continue;
    const n=+line[0], w=prev.slice(0,n)+line.slice(1);
    DICT.add(w); prev=w;
  }
  document.getElementById('wordblob').remove();
})();

/* Webster's 1934 has no plurals or past tenses, so peel suffixes back to the stem. */
function isWord(w){
  if(w.length<3) return false;
  if(DICT.has(w)) return true;
  const t=[], L=w.length, cut=(n,add='')=>t.push(w.slice(0,L-n)+add);
  if(L>4 && w.endsWith('ies')) cut(3,'y');
  if(L>4 && w.endsWith('ied')) cut(3,'y');
  if(L>4 && w.endsWith('ier')) cut(3,'y');
  if(L>5 && w.endsWith('iest')) cut(4,'y');
  if(L>4 && w.endsWith('es')) { cut(2); cut(1); }
  if(L>3 && w.endsWith('s') && !w.endsWith('ss')) cut(1);
  if(L>4 && w.endsWith('ed')) { cut(2); cut(1); cut(2,'e'); }
  if(L>5 && w.endsWith('ing')) { cut(3); cut(3,'e'); }
  if(L>4 && w.endsWith('er')) { cut(2); cut(1); }
  if(L>5 && w.endsWith('est')) { cut(3); cut(2); }
  for(const s of t){
    if(DICT.has(s)) return true;
    // running -> run, hopped -> hop
    if(s.length>2 && s[s.length-1]===s[s.length-2] && DICT.has(s.slice(0,-1))) return true;
  }
  return false;
}

/* ============ sound ============ */
let AC=null;
/* 2 = music + effects, 1 = effects only, 0 = silent */
let audioMode = (LS.get('ss_audio')!==null) ? +LS.get('ss_audio') : 2;
let soundOn = audioMode>0;
function ctx(){
  AC = AC || new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended') AC.resume();
  return AC;
}
function beep(freq,dur,type='square',vol=.08,slide=0){
  if(!soundOn) return;
  try{
    ctx();
    const o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime;
    o.type=type; o.frequency.setValueAtTime(freq,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide),t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur+.02);
  }catch(e){}
}
const sfx={
  tap:()=>beep(620,.05,'square',.05),
  back:()=>beep(300,.05,'square',.04),
  hit:d=>beep(180+d*4,.22,'sawtooth',.09,-90),
  mega:()=>{[440,660,880,1320].forEach((f,i)=>setTimeout(()=>beep(f,.16,'square',.08),i*70));},
  whoosh:()=>beep(300,.19,'sine',.045,520),
  nope:()=>beep(150,.16,'sine',.06,-50),
  ouch:()=>beep(120,.2,'triangle',.07,-40),
  win:()=>{[523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>beep(f,.22,'triangle',.09),i*110));},
  lose:()=>{[400,340,280,200].forEach((f,i)=>setTimeout(()=>beep(f,.26,'sine',.07),i*150));}
};

/* ============ seasonal chiptune ============ */
/* A small tracker: melody (with a delay echo), a walking bass, and a drum kit.
   Everything runs through a master low-pass so the square waves aren't piercing. */
const midi = n => 440*Math.pow(2,(n-69)/12);
let MU=null, muTimer=null, muStep=0, muNext=0, BUS=null, NOISE=null;

function bus(){
  if(BUS) return BUS;
  const c=ctx();
  const lp=c.createBiquadFilter(); lp.type='lowpass';
  lp.frequency.value=2600; lp.Q.value=.6;
  const g=c.createGain(); g.gain.value=.9;
  lp.connect(g); g.connect(c.destination);
  BUS={lp,g,inp:lp};
  return BUS;
}
function noiseBuf(){
  if(NOISE) return NOISE;
  const c=ctx(), n=c.sampleRate*.5, b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  NOISE=b; return NOISE;
}
function tone(freq,at,dur,wave,vol,detune){
  const c=ctx(), o=c.createOscillator(), g=c.createGain();
  o.type=wave; o.frequency.setValueAtTime(freq,at);
  if(detune) o.detune.setValueAtTime(detune,at);
  g.gain.setValueAtTime(0,at);
  g.gain.linearRampToValueAtTime(vol,at+.012);
  g.gain.exponentialRampToValueAtTime(.0001,at+dur);
  o.connect(g); g.connect(bus().inp);
  o.start(at); o.stop(at+dur+.04);
}
function hit(at,type,vol){
  const c=ctx();
  if(type==='kick'){
    const o=c.createOscillator(), g=c.createGain();
    o.type='sine'; o.frequency.setValueAtTime(132,at);
    o.frequency.exponentialRampToValueAtTime(42,at+.11);
    g.gain.setValueAtTime(vol,at); g.gain.exponentialRampToValueAtTime(.0001,at+.17);
    o.connect(g); g.connect(bus().inp); o.start(at); o.stop(at+.2);
    return;
  }
  const s=c.createBufferSource(); s.buffer=noiseBuf();
  const f=c.createBiquadFilter(), g=c.createGain();
  if(type==='hat'){ f.type='highpass'; f.frequency.value=7200; g.gain.setValueAtTime(vol,at);
    g.gain.exponentialRampToValueAtTime(.0001,at+.045); }
  else { f.type='bandpass'; f.frequency.value=1900; f.Q.value=.8;
    g.gain.setValueAtTime(vol,at); g.gain.exponentialRampToValueAtTime(.0001,at+.13); }
  s.connect(f); f.connect(g); g.connect(bus().inp);
  s.start(at); s.stop(at+.2);
}
function degree(m,d){
  const L=m.scale.length, oct=Math.floor(d/L);
  return m.root + m.scale[((d%L)+L)%L] + 12*oct;
}
function tick(){
  if(!MU || audioMode<2) return;
  try{
  const c=ctx(), beat=60/MU.tempo/2, swing=beat*0.14;
  while(muNext < c.currentTime + 0.4){
    const s=muStep%16, bar=Math.floor(muStep/16)%4, at=muNext + (s%2 ? swing : 0);
    const v=MU.vol;

    /* melody, doubled an octave up very quietly, plus a dotted echo */
    const d=MU.mel[s];
    if(d!==null && d!==undefined){
      const f=midi(degree(MU,d));
      tone(f, at, beat*1.3, MU.wave, v, -4);
      tone(f*2, at, beat*0.7, 'triangle', v*.28, 5);
      tone(f, at+beat*1.5, beat*0.9, 'triangle', v*.22);   // echo
    }
    /* bass: root on the beat, fifth on the off-beat -- gives it a walk */
    if(s%4===0) tone(midi(degree(MU,MU.bass[bar])-24), at, beat*1.6, 'triangle', v*1.5);
    else if(s%4===2) tone(midi(degree(MU,MU.bass[bar]+4)-24), at, beat*.9, 'triangle', v*.85);

    /* drums */
    if(s===0||s===6||s===8) hit(at,'kick',v*4.6);
    if(s===4||s===12)       hit(at,'snare',v*2.1);
    if(s%2===0)             hit(at,'hat',v*(s%4===0?1.5:0.95));

    muNext += beat; muStep++;
  }
  }catch(e){ stopMusic(); }
}
function startMusic(){
  if(audioMode<2 || !MU) return;
  stopMusic(true);
  try{ muStep=0; muNext=ctx().currentTime+0.15; }catch(e){ return; }
  tick(); muTimer=setInterval(tick,110);
}
function stopMusic(keep){ if(muTimer){ clearInterval(muTimer); muTimer=null; } if(!keep){ muStep=0; } }
function setMusic(cfg){ MU=cfg; if(audioMode>=2) startMusic(); }

/* ============ falling sky ============ */
const sky=document.getElementById('sky'), sctx=sky.getContext('2d');
let bits=[], skyKind='snow', skyCols=['#fff'], reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
function sizeSky(){ var DP=Math.min(devicePixelRatio||1,2);
  sky.width=Math.round(innerWidth*DP); sky.height=Math.round(innerHeight*DP);
  sky.style.width=innerWidth+'px'; sky.style.height=innerHeight+'px';
  sctx.setTransform(DP,0,0,DP,0,0); }
addEventListener('resize',sizeSky); sizeSky();
function seedSky(){
  const n = skyKind==='confetti'?70:46;
  bits=Array.from({length:n},()=>({
    x:Math.random()*innerWidth, y:Math.random()*innerHeight,
    s:3+Math.random()*7, vy:.25+Math.random()*.9, vx:(Math.random()-.5)*.5,
    r:Math.random()*6.28, vr:(Math.random()-.5)*.06, c:pick(skyCols), o:.2+Math.random()*.4 }));
}
var skyFrames=0;
function drawSky(){
  skyFrames++;
  sctx.clearRect(0,0,innerWidth,innerHeight);
  for(const b of bits){
    b.y+=b.vy; b.x+=b.vx+Math.sin(b.y/48)*.35; b.r+=b.vr;
    if(b.y>innerHeight+14){ b.y=-14; b.x=Math.random()*innerWidth; }
    sctx.save(); sctx.translate(b.x,b.y); sctx.rotate(b.r);
    sctx.globalAlpha=b.o; sctx.fillStyle=b.c;
    if(skyKind==='snow'||skyKind==='bubble'||skyKind==='spark'){
      sctx.beginPath(); sctx.arc(0,0,b.s/2,0,6.28); sctx.fill();
    } else if(skyKind==='confetti'||skyKind==='paper'){
      sctx.fillRect(-b.s/2,-b.s/3,b.s,b.s/1.6);
    } else { /* leaf / petal */
      sctx.beginPath(); sctx.ellipse(0,0,b.s/1.5,b.s/3.2,0,0,6.28); sctx.fill();
    }
    sctx.restore();
  }
  if(!window.__fbDrive) requestAnimationFrame(drawSky);
}
if(!reduced){
  requestAnimationFrame(drawSky);
  /* Same rAF-suspension guard as the shooter: fall back to a timer if nothing ticks. */
  window.__fbDrive=false;
  setTimeout(function(){
    if(skyFrames>0 || document.visibilityState!=='visible') return;
    window.__fbDrive=true;
    setInterval(function(){ if(document.visibilityState==='visible') drawSky(); },40);
  },900);
}
</script>

<script>
"use strict";

/* ============ persistent state ============ */
const S={
  get wins(){return +(LS.get('ss_wins')||0)},
  set wins(v){LS.set('ss_wins',v)},
  get best(){return LS.get('ss_best')||''},
  set best(v){LS.set('ss_best',v)},
  get bestDmg(){return +(LS.get('ss_bestdmg')||0)},
  set bestDmg(v){LS.set('ss_bestdmg',v)},
  get over(){return LS.get('ss_season')||''},
  set over(v){v?LS.set('ss_season',v):LS.del('ss_season')}
};

const $=id=>document.getElementById(id);
const bounty=()=>S.wins*30000000 + S.bestDmg*1000000;
const money=n=>n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,',');
const rackEl=$('rack'), spellEl=$('spell'), ribbonEl=$('ribbon'), dmgEl=$('dmg'),
      castBtn=$('castBtn'), bossEl=$('boss'), veil=$('veil'), veilCard=$('veilCard');

let T, tKey, rack=[], spell=[], foeHP=0, foeMax=0, heroHP=100, heroMax=100,
    level=0, battleBest={w:'',d:0}, busy=false;

/* ============ theme ============ */
function applyTheme(key){
  tKey=key; T=THEMES[key];
  const r=document.documentElement.style;
  r.setProperty('--accent',T.accent); r.setProperty('--accent2',T.accent2);
  r.setProperty('--glow',T.glow); r.setProperty('--tile',T.tile);
  $('seasonLabel').textContent=T.label;
  $('bossName').textContent=T.bossName;
  bossEl.innerHTML=T.art();
  skyKind=T.fall; skyCols=T.fallColors; seedSky();
  setMusic(T.music);
}

/* ============ battle ============ */
function newBattle(){
  level=Math.min(S.wins,12);
  foeMax=150+level*12; foeHP=foeMax;
  heroMax=100+level*12; heroHP=heroMax;
  battleBest={w:'',d:0};
  spell=[]; rack=Array.from({length:8},()=>drawLetter([]));
  fixVowels();
  bossEl.classList.remove('gone');
  busy=false;
  renderRack(true); renderSpell(); renderBars();
  say(pick(T.taunts));
}
function drawLetter(){ return pick(BAG); }
function fixVowels(){
  let v=rack.filter(c=>VOWELS.has(c)).length;
  while(v<3){ const i=rack.findIndex(c=>!VOWELS.has(c)); rack[i]=pick(['a','e','i','o','u']); v++; }
  while(v>5){ const i=rack.findIndex(c=>VOWELS.has(c)); rack[i]=pick('nrstldcmpbg'.split('')); v--; }
}

function say(html,pop=true){
  ribbonEl.innerHTML=html;
  if(pop){ ribbonEl.classList.remove('pop'); void ribbonEl.offsetWidth; ribbonEl.classList.add('pop'); }
}

function renderBars(){
  $('foeFill').style.width=Math.max(0,foeHP/foeMax*100)+'%';
  $('heroFill').style.width=Math.max(0,heroHP/heroMax*100)+'%';
  $('foeNum').textContent=Math.max(0,foeHP)+'/'+foeMax;
  $('heroNum').textContent=Math.max(0,heroHP)+'/'+heroMax;
}

function renderRack(fresh=false){
  rackEl.innerHTML='';
  rack.forEach((c,i)=>{
    const b=document.createElement('button');
    b.className='tile'+(spell.includes(i)?' used':'')+(fresh?' fresh':'');
    b.innerHTML=c.toUpperCase()+'<span class="pts">'+VAL[c]+'</span>';
    b.setAttribute('aria-label','Letter '+c.toUpperCase());
    if(fresh) b.style.animationDelay=(i*28)+'ms';
    b.onclick=()=>addLetter(i);
    rackEl.appendChild(b);
  });
}
function renderSpell(){
  spellEl.innerHTML='';
  spell.forEach((idx,pos)=>{
    const b=document.createElement('button');
    b.className='tile'; b.textContent=rack[idx].toUpperCase();
    b.setAttribute('aria-label','Remove '+rack[idx].toUpperCase());
    b.onclick=()=>{ spell.splice(pos,1); sfx.back(); renderRack(); renderSpell(); };
    spellEl.appendChild(b);
  });
  const w=word();
  const ok=w.length>=3 && isWord(w);
  castBtn.disabled=!ok||busy;
  if(ok){
    const d=damageOf(w), mega=w.length>=7;
    dmgEl.textContent=(mega?'\u2605 MEGASPELL \u2014 ':'')+d+' damage';
    dmgEl.className='dmg '+(mega?'mega':'live');
  } else {
    dmgEl.textContent=w.length?w.length+' letters':'';
    dmgEl.className='dmg';
  }
}
const word=()=>spell.map(i=>rack[i]).join('');

function addLetter(i){
  if(busy||spell.includes(i)||spell.length>=9) return;
  spell.push(i); sfx.tap(); renderRack(); renderSpell();
}

/* Angry-Birds-style lob: the spell arcs up out of the tile rack and smacks the monster. */
function launch(n,onHit){
  const wrap=document.querySelector('.bosswrap');
  if(reduced || !wrap){ onHit(); return; }
  const wr=wrap.getBoundingClientRect(), br=bossEl.getBoundingClientRect();
  const tx=br.left-wr.left+br.width/2, ty=br.top-wr.top+br.height*0.5;
  const sx=wr.width/2, sy=wr.height+34;
  for(let i=0;i<n;i++) setTimeout(()=>fly(wrap,sx,sy,tx,ty,i===n-1?onHit:null),i*120);
}
function fly(wrap,sx,sy,tx,ty,done){
  const orb=document.createElement('div');
  orb.className='orb'; wrap.appendChild(orb);
  const dur=470+Math.random()*90, t0=performance.now();
  const cx=(sx+tx)/2+(Math.random()-.5)*70,
        cy=Math.min(sy,ty)-135-Math.random()*70,
        jx=(Math.random()-.5)*36, jy=(Math.random()-.5)*30,
        ex=tx+jx, ey=ty+jy;
  let frame=0, landed=false;
  sfx.whoosh();
  /* rAF is paused in backgrounded tabs. Land the shot exactly once, whichever
     gets there first, so a mid-throw app switch can never freeze the turn. */
  function land(){
    if(landed) return; landed=true;
    clearTimeout(guard);
    orb.remove(); impact(wrap,ex,ey);
    if(done) done();
  }
  const guard=setTimeout(land, dur+450);
  (function step(now){
    if(landed) return;
    const pr=Math.min(1,(now-t0)/dur), q=1-pr;
    const x=q*q*sx+2*q*pr*cx+pr*pr*ex, y=q*q*sy+2*q*pr*cy+pr*pr*ey;
    orb.style.transform=`translate(${x}px,${y}px)`;
    if((frame++ & 1)===0) trail(wrap,x,y);          // comet tail
    if(pr<1) requestAnimationFrame(step); else land();
  })(t0);
}
function trail(wrap,x,y){
  const t=document.createElement('div');
  t.className='trail'; t.style.transform=`translate(${x}px,${y}px)`;
  wrap.appendChild(t); setTimeout(()=>t.remove(),460);
}
/* the orb pops in a white flash and becomes a rotten something that slides down the monster */
function impact(wrap,x,y){
  const f=document.createElement('div');
  f.className='flash'; f.style.left=x+'px'; f.style.top=y+'px';
  wrap.appendChild(f); setTimeout(()=>f.remove(),240);

  const pulp=document.createElement('div');
  pulp.className='pulp'; pulp.textContent=pick(T.ammo||['\u2b50']);
  pulp.style.left=x+'px'; pulp.style.top=y+'px';
  wrap.appendChild(pulp); setTimeout(()=>pulp.remove(),880);

  splat(wrap,x,y);
}
function splat(wrap,x,y){
  const r=document.createElement('div');
  r.className='splat'; r.style.left=x+'px'; r.style.top=y+'px';
  wrap.appendChild(r); setTimeout(()=>r.remove(),480);
  for(let i=0;i<7;i++){
    const s=document.createElement('div'), a=Math.random()*6.283, dd=28+Math.random()*46;
    s.className='spark'; s.style.left=x+'px'; s.style.top=y+'px';
    s.style.setProperty('--dx',(Math.cos(a)*dd).toFixed(1)+'px');
    s.style.setProperty('--dy',(Math.sin(a)*dd).toFixed(1)+'px');
    wrap.appendChild(s); setTimeout(()=>s.remove(),540);
  }
}
function quake(){
  const w=document.getElementById('wrap');
  w.classList.remove('quake'); void w.offsetWidth; w.classList.add('quake');
  setTimeout(()=>w.classList.remove('quake'),450);
}

function floater(txt){
  const el=document.createElement('div');
  el.className='floater'; el.textContent=txt;
  document.querySelector('.bosswrap').appendChild(el);
  setTimeout(()=>el.remove(),1100);
}

function cast(){
  const w=word();
  if(w.length<3){ sfx.nope(); say('Spells need at least <b>3 letters</b>.'); return; }
  if(isBye(w)){ sadFarewell(); return; }
  if(!isWord(w)){
    sfx.nope();
    say(`<b>${w.toUpperCase()}</b> fizzles out. That is not in the spellbook \u2014 try another!`);
    spell=[]; renderRack(); renderSpell(); return;
  }
  busy=true;
  const d=damageOf(w), mega=w.length>=7, gross=GROSS.has(w);
  if(d>battleBest.d) battleBest={w,d};
  if(d>S.bestDmg){ S.bestDmg=d; S.best=w; }

  let msg;
  if(gross) msg=`<b>${w.toUpperCase()}</b> for ${d}! The monster is genuinely disgusted. Extra effective.`;
  else if(mega) msg=`\u2605 <b>${w.toUpperCase()}</b> \u2014 a ${w.length}-letter MEGASPELL for ${d} damage! You also recover 8 health.`;
  else if(w.length>=6) msg=`<b>${w.toUpperCase()}</b> lands for ${d}. Big word. Big boom.`;
  else if(d>=20) msg=`<b>${w.toUpperCase()}</b> for ${d} \u2014 those are expensive letters!`;
  else msg=`<b>${w.toUpperCase()}</b> hits for ${d} damage.`;
  say(`<b>${w.toUpperCase()}</b> is away...`);

  // burn the used tiles, deal fresh ones while the shot is in the air
  const used=[...spell].sort((a,b)=>a-b);
  used.forEach(i=>{ rack[i]=drawLetter(); });
  spell=[]; fixVowels();
  renderRack(true); renderSpell();

  const shots = w.length>=7 ? 4 : (w.length>=5 ? 2 : 1);
  launch(shots,()=>{
    foeHP-=d;
    if(mega) heroHP=Math.min(heroMax,heroHP+8);
    bossEl.classList.remove('hurt'); void bossEl.offsetWidth; bossEl.classList.add('hurt');
    floater('-'+d);
    mega?sfx.mega():sfx.hit(d);
    if(mega||d>=45) quake();
    renderBars(); say(msg);
    setTimeout(()=>{
      if(foeHP<=0){ victory(); return; }
      bossTurn();
    },820);
  });
}

function bossTurn(){
  const dmg=Math.max(3,Math.round(4+level*1.2+Math.random()*5));
  heroHP-=dmg;
  sfx.ouch(); renderBars();
  const act=pick(T.attacks);
  if(heroHP<=0){ setTimeout(defeat,600); say(`The monster ${act} for <b>${dmg}</b>\u2026`); return; }
  say(`The monster ${act} \u2014 <b>${dmg}</b> damage to you. Your turn!`);
  busy=false; renderSpell();
}

function mixTiles(){
  if(busy) return;
  busy=true; spell=[];
  rack=Array.from({length:8},()=>drawLetter()); fixVowels();
  renderRack(true); renderSpell();
  say('You shake up the letters \u2014 but the monster gets a free swing!');
  setTimeout(bossTurn,700);
}

/* ============ endings ============ */
/* A very bad word: no damage, no points, no reward. The monster is just sad and goes home. */
function sadFarewell(){
  busy=true; spell=[]; renderRack(); renderSpell();
  try{ stopMusic(); }catch(e){}
  sfx.nope();
  const svg=bossEl;
  svg.insertAdjacentHTML('beforeend',
    '<g id="sadOverlay">'+
    '<path d="M78 84 L92 90" stroke="#1c1220" stroke-width="4" stroke-linecap="round"/>'+
    '<path d="M122 84 L108 90" stroke="#1c1220" stroke-width="4" stroke-linecap="round"/>'+
    '<path d="M82 138 q18 -16 36 0" stroke="#1c1220" stroke-width="5" fill="none" stroke-linecap="round"/>'+
    '<ellipse cx="84" cy="112" rx="4" ry="7" fill="#5aa9e6" opacity=".9"/>'+
    '<g id="waveHand"><text x="163" y="86" font-size="34" text-anchor="middle">'+
    '\uD83D\uDC4B</text></g></g>');
  const hand=svg.querySelector('#waveHand');
  if(hand){ hand.style.transformOrigin='163px 92px';
    hand.style.animation='waveBye 0.7s ease-in-out 4'; }
  svg.style.animation='none';
  setTimeout(()=>{ svg.classList.add('gone'); },2600);
  say('The monster heard that. It does not want to play any more.');
  setTimeout(()=>{
    showCard(`
      <h2>The monster went home</h2>
      <p>${esc(T.bossName)} gave a little wave and left. That word was too mean, so the
         spell did nothing &mdash; no damage, no points.</p>
      <p class="small">Every other word in the whole dictionary still works. Even the gross ones.</p>
      <p class="small" style="opacity:.75">Refresh the page when you want a new monster.</p>`);
  },3000);
}

function victory(){
  busy=true;
  bossEl.classList.add('gone');
  sfx.win();
  S.wins=S.wins+1;
  const fact=pick(FACTS);
  showCard(`
    <h2>You beat ${esc(T.bossName)}!</h2>
    <div class="stats">
      <div class="stat"><div class="v">${S.wins}</div><div class="k">Monsters</div></div>
      <div class="stat"><div class="v">${battleBest.d}</div><div class="k">Best hit</div></div>
      <div class="stat"><div class="v">${battleBest.w.length||0}</div><div class="k">Longest</div></div>
    </div>
    <p class="small">Strongest spell this fight: <b style="color:var(--glow)">${esc(battleBest.w.toUpperCase()||'-')}</b></p>
    <div class="scroll" style="text-align:center">
      <span class="lbl">Wanted \u2014 dead or alive</span>
      <div style="font-family:'Luckiest Guy',cursive;font-size:26px;color:var(--glow);line-height:1.2">
        ${money(bounty())}</div>
      <div style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-top:3px">
        your bounty just went up</div>
    </div>
    <div class="scroll"><span class="lbl">Treasure from the monster's pockets</span>${esc(fact)}</div>
    <button class="btn cast" id="againBtn">NEXT MONSTER \u2192</button>
    <p class="small">The next one has more health. Obviously.</p>`);
  $('againBtn').onclick=()=>{ hideCard(); newBattle(); };
}
function defeat(){
  busy=true; sfx.lose();
  showCard(`
    <h2>Knocked out!</h2>
    <p>${esc(T.bossName)} got you this time. Your best spell was
      <b style="color:var(--glow)">${esc(battleBest.w.toUpperCase()||'\u2014')}</b> for ${battleBest.d}.</p>
    <p class="small">Tip: longer words hit <i>way</i> harder. A 7-letter spell does about four times
      the damage of a 4-letter one \u2014 and heals you.</p>
    <button class="btn cast" id="againBtn">GO AGAIN</button>`);
  $('againBtn').onclick=()=>{ hideCard(); newBattle(); };
}

/* ============ overlays ============ */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function showCard(html){ veilCard.innerHTML=html; veil.hidden=false; }
function hideCard(){ veil.hidden=true; }
veil.addEventListener('click',e=>{ if(e.target===veil && !veilCard.querySelector('#againBtn')) hideCard(); });

$('helpBtn').onclick=()=>showCard(`
  <h2>How to Spellsling</h2>
  <ul>
    <li>Tap letters to build a <b>real word</b>. Tap a letter in your spell to take it back.</li>
    <li>Hit <b>CAST</b> to blast the monster.</li>
    <li><b>Longer words hit harder.</b> Much harder. 7+ letters is a <b>MEGASPELL</b> \u2014 huge damage,
      and it heals you.</li>
    <li>Rare letters are worth more. The little number on each tile is its power.</li>
    <li><b>Mix</b> deals you new letters, but the monster gets a free hit. Use it when you're stuck.</li>
    <li>Beat a monster and it drops something strange and true. Read it \u2014 some of them are riddles.</li>
  </ul>
  <p class="small">The monster changes with the calendar all by itself. Come back in a different
    month and someone new will be waiting.</p>
  <button class="btn cast" onclick="hideCard()">GOT IT</button>`);

$('menuBtn').onclick=()=>{
  const cur=S.over||seasonFor(new Date());
  showCard(`
    <h2>Your Spellbook</h2>
    <div class="stats">
      <div class="stat"><div class="v">${S.wins}</div><div class="k">Monsters beaten</div></div>
      <div class="stat"><div class="v">${S.bestDmg}</div><div class="k">Best hit ever</div></div>
      <div class="stat"><div class="v">${S.best.length||0}</div><div class="k">Longest ever</div></div>
    </div>
    <div class="scroll" style="text-align:center">
      <span class="lbl">Wanted \u2014 dead or alive</span>
      <div style="font-family:'Luckiest Guy',cursive;font-size:26px;color:var(--glow);line-height:1.2">
        ${money(bounty())}</div>
    </div>
    ${S.best?`<p class="small">Your greatest spell of all time:
      <b style="color:var(--glow)">${esc(S.best.toUpperCase())}</b></p>`:''}
    <div class="scroll">
      <span class="lbl">Summon a season</span>
      <div class="seasons" id="seasonPick">
        ${Object.entries(THEMES).map(([k,v])=>
          `<button data-k="${k}" aria-pressed="${k===cur}">${esc(v.label)}</button>`).join('')}
      </div>
    </div>
    <button class="btn ghost" id="autoBtn">Back to today's season</button>
    <button class="btn cast" onclick="hideCard()">CLOSE</button>`);
  $('seasonPick').onclick=e=>{
    const b=e.target.closest('button[data-k]'); if(!b) return;
    S.over=b.dataset.k; applyTheme(b.dataset.k); hideCard(); newBattle();
  };
  $('autoBtn').onclick=()=>{ S.over=''; applyTheme(seasonFor(new Date())); hideCard(); newBattle(); };
};

function paintSound(){
  const b=$('soundBtn');
  b.textContent=['\ud83d\udd07','\u266a','\u266b'][audioMode];
  b.title=['Sound off','Effects only','Music and effects'][audioMode];
  b.setAttribute('aria-label',b.title);
  b.style.color=audioMode?'var(--accent)':'var(--dim)';
}
$('soundBtn').onclick=()=>{
  audioMode=(audioMode+1)%3; soundOn=audioMode>0;
  LS.set('ss_audio',audioMode);
  paintSound();
  if(audioMode>=2){ setMusic(T.music); } else { stopMusic(); }
  if(soundOn) sfx.tap();
};
paintSound();

/* browsers only allow audio after a real tap, so kick it off on the first one */
let audioReady=false;
function wakeAudio(){
  if(audioReady) return; audioReady=true;
  if(audioMode>=2) setMusic(T.music);
}
['pointerdown','keydown'].forEach(e=>addEventListener(e,wakeAudio,{once:true}));
document.addEventListener('visibilitychange',()=>{
  if(document.hidden) stopMusic(); else if(audioMode>=2&&audioReady) startMusic();
});

castBtn.onclick=cast;
$('clearBtn').onclick=()=>{ if(busy)return; spell=[]; sfx.back(); renderRack(); renderSpell(); };
$('mixBtn').onclick=mixTiles;

/* physical keyboard, for when he's on a laptop */
addEventListener('keydown',e=>{
  if(!veil.hidden || busy) return;
  if(e.key==='Enter'){ if(!castBtn.disabled) cast(); return; }
  if(e.key==='Backspace'){ e.preventDefault(); if(spell.length){ spell.pop(); sfx.back(); renderRack(); renderSpell(); } return; }
  const c=e.key.toLowerCase();
  if(c.length===1 && c>='a' && c<='z'){
    const i=rack.findIndex((L,i)=>L===c && !spell.includes(i));
    if(i>=0) addLetter(i);
  }
});

/* ============ go ============ */
applyTheme(S.over||seasonFor(new Date()));
newBattle();
if(!LS.get('ss_seen')){ LS.set('ss_seen','1'); $('helpBtn').onclick(); }
</script>
