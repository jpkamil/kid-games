/* ---- characters ----------------------------------------------------------*/
function shadow(x,y,r){ ctx.fillStyle='rgba(0,0,0,.17)'; ctx.beginPath(); ctx.ellipse(x,y+r*.86,r*.86,r*.36,0,0,TAU); ctx.fill(); }

/* ===========================================================================
   CHARACTER STYLE -- one grammar for the whole cast.
   Flat fills, one dark ink line round every shape, heads far too big for the
   bodies, and big white eyes with small pupils. Everything from here down is
   built out of these helpers so the cast looks like it comes from one show.
   The style borrows the GRAMMAR of the flat, thick-outlined, big-head cartoon
   tradition -- construction from simple geometry, no shading, no gradients --
   rather than any particular show's characters.
   ========================================================================= */
var INK='#231a33';
function ink(w){ ctx.strokeStyle=INK; ctx.lineWidth=w||2.6;
  ctx.lineJoin='round'; ctx.lineCap='round'; ctx.stroke(); }
function disc(x,y,r,fill,w){ ctx.beginPath(); ctx.arc(x,y,r,0,TAU);
  ctx.fillStyle=fill; ctx.fill(); ink(w); }
function slab(x,y,w2,h,rad,fill,w){ rr(ctx,x,y,w2,h,rad);
  ctx.fillStyle=fill; ctx.fill(); ink(w); }
function poly(pts,fill,w){ ctx.beginPath(); ctx.moveTo(pts[0],pts[1]);
  for(var i=2;i<pts.length;i+=2) ctx.lineTo(pts[i],pts[i+1]);
  ctx.closePath(); ctx.fillStyle=fill; ctx.fill(); ink(w); }
function halfDisc(x,y,r,a0,a1,fill,w){ ctx.beginPath(); ctx.arc(x,y,r,a0,a1);
  ctx.closePath(); ctx.fillStyle=fill; ctx.fill(); ink(w); }
/* The one feature every character shares: big white eyes, small pupils. */
function eyes(cx,cy,sp,er,pr,look){
  disc(cx-sp,cy,er,'#fff',1.8); disc(cx+sp,cy,er,'#fff',1.8);
  ctx.fillStyle=INK; ctx.beginPath();
  ctx.arc(cx-sp+look*(er-pr),cy,pr,0,TAU);
  ctx.arc(cx+sp+look*(er-pr),cy,pr,0,TAU); ctx.fill();
}
/* A heavy upper lid. This does more to age a face than anything but the hair. */
function hoodedLids(cx,cy,sp,er,skin){
  ctx.save();
  ctx.beginPath(); ctx.arc(cx-sp,cy,er,0,TAU); ctx.arc(cx+sp,cy,er,0,TAU);
  ctx.clip();
  ctx.fillStyle=skin;
  ctx.fillRect(cx-sp-er-1,cy-er-1,(sp+er)*2+2,er*0.92);
  ctx.restore();
  ctx.strokeStyle=INK; ctx.lineWidth=1.8; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(cx-sp-er*0.95,cy-er*0.08); ctx.lineTo(cx-sp+er*0.95,cy-er*0.08);
  ctx.moveTo(cx+sp-er*0.95,cy-er*0.08); ctx.lineTo(cx+sp+er*0.95,cy-er*0.08);
  ctx.stroke();
}

function drawPlayer(){
  var bob=Math.sin(P.walk)*2.2;
  shadow(P.x,P.y,P.r);
  if(P.iframe>0&&Math.floor(P.iframe*16)%2===0) ctx.globalAlpha=.45;
  if(P.buff.rampage>0){
    var pu=.5+Math.sin(W.time*11)*.5;
    ctx.fillStyle='rgba(140,227,79,'+(.20+pu*.18)+')';
    ctx.beginPath(); ctx.arc(P.x,P.y,P.r+13+pu*5,0,TAU); ctx.fill();
  }
  if(P.dashing>0){ ctx.fillStyle='rgba(75,200,255,.35)';
    ctx.beginPath(); ctx.arc(P.x-P.vx*.03,P.y-P.vy*.03,P.r,0,TAU); ctx.fill(); }

  var x=P.x, y=P.y, f=P.face, R=11;         /* R is the head; everything scales off it */
  var hy=y-13+bob;                          /* head centre */
  var dress=P.up.shirt?'#ff7ab0':'#4bc8ff';
  var lw=Math.sin(P.walk)*4.5;

  /* legs: stubby, thick, ink only */
  ctx.strokeStyle=INK; ctx.lineWidth=4.6; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(x-4,y+6); ctx.lineTo(x-4+lw,y+15);
  ctx.moveTo(x+4,y+6); ctx.lineTo(x+4-lw,y+15); ctx.stroke();
  /* shoes */
  disc(x-4+lw,y+16,2.6,'#2b2b3a',1.6); disc(x+4-lw,y+16,2.6,'#2b2b3a',1.6);

  /* the dress: a wedge, shoulders in, hem out */
  poly([x-8,y-6, x+8,y-6, x+13,y+8, x-13,y+8],dress,2.8);
  ctx.fillStyle='rgba(255,255,255,.28)'; rr(ctx,x-8.5,y-1,17,3,1.5); ctx.fill();
  if(P.up.shirt){ ctx.fillStyle='#ffe066';
    for(var b=0;b<3;b++){ ctx.beginPath(); ctx.arc(x-5+b*5,y+3.5,1.9,0,TAU); ctx.fill(); } }

  /* arms, one swinging forward */
  ctx.strokeStyle=INK; ctx.lineWidth=3.6;
  ctx.beginPath();
  ctx.moveTo(x-8,y-4); ctx.lineTo(x-11-lw*.6,y+2);
  ctx.moveTo(x+8,y-4); ctx.lineTo(x+11+lw*.6,y+2); ctx.stroke();
  disc(x-11-lw*.6,y+3,2.4,'#ffd9b0',1.6); disc(x+11+lw*.6,y+3,2.4,'#ffd9b0',1.6);

  /* head, too big on purpose */
  disc(x,hy,R,'#ffd9b0',2.8);
  /* hair: a cap over the top, plus a ponytail on the trailing side */
  ctx.save();
  ctx.beginPath(); ctx.arc(x,hy,R,0,TAU); ctx.clip();
  ctx.fillStyle='#6b4326';
  ctx.beginPath(); ctx.arc(x,hy-2.2,R,Math.PI,TAU); ctx.fill();
  ctx.fillRect(x-R,hy-R,R*2,R*0.55);
  ctx.restore();
  ctx.beginPath(); ctx.arc(x,hy,R,0,TAU); ink(2.8);
  disc(x-f*10.5,hy-1+Math.sin(P.walk)*1.5,4.4,'#6b4326',2.4);

  /* face */
  eyes(x,hy+0.5,4.3,3.5,1.7,f);
  ctx.strokeStyle=INK; ctx.lineWidth=1.9; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(x,hy+4.4,3,0.18*Math.PI,0.82*Math.PI); ctx.stroke();

  if(!P.up.wig){ /* her cap */
    slab(x-R-0.5,hy-R-1.5,R*2+1,5.5,2.5,'#ff5c8a',2.4);
    slab(x+(f>0?2:-11),hy-R+1,9,3.6,1.8,'#ff5c8a',2.2);
  } else {       /* the disguise wig */
    disc(x,hy-3,R+1.5,'#e8e4f2',2.6);
    disc(x-9.5,hy-1,4.6,'#e8e4f2',2.2); disc(x+9.5,hy-1,4.6,'#e8e4f2',2.2);
  }

  /* the bag of groceries */
  if(P.cart.length){
    slab(x+f*13-6,y-3,13,15,2.5,'#d9c39a',2.4);
    ctx.fillStyle='#b9a077'; rr(ctx,x+f*13-6,y-3,13,4,1.5); ctx.fill();
    ctx.fillStyle=INK; ctx.font='700 9px "Roboto Mono",monospace'; ctx.textAlign='center';
    ctx.fillText(String(P.cart.length),x+f*13+.5,y+8);
  }
  ctx.globalAlpha=1;
}

function drawFoe(f,i){
  if(f.ejected){
    ctx.save(); ctx.translate(f.x,f.y); ctx.rotate(f.ang);
    ctx.globalAlpha=clamp(1.3-f.ejected,0,1);
    disc(0,0,f.r,'#4bc8ff',2.6);
    ctx.fillStyle=INK; ctx.font='700 11px Fredoka,sans-serif'; ctx.textAlign='center';
    ctx.fillText('BYE',0,4);
    ctx.restore(); ctx.globalAlpha=1; return;
  }
  var scared=P.buff.rampage>0;
  var bob=Math.sin(f.walk)*2.2;
  var x=f.x, y=f.y;
  shadow(x,y,f.r);
  /* vision cone while patrolling */
  if(!scared&&(f.t==='guard'||f.t==='nurse')&&f.stun<=0){
    var alert=f.see>(P.up.shirt?.9:.45);
    ctx.fillStyle=alert?'rgba(255,77,94,.14)':'rgba(255,207,61,.10)';
    ctx.beginPath(); ctx.moveTo(x,y);
    ctx.arc(x,y,f.vis,f.ang-f.cone,f.ang+f.cone); ctx.closePath(); ctx.fill();
  }

  var zom=f.t==='zomcop', nur=f.t==='nurse';
  var body = scared?'#4b6bd8' : (zom?'#7fae5c':(nur?'#eef3fb':'#2f3d78'));
  var skin = scared?'#cfe0ff' : (zom?'#a8cf86':'#ffd9b0');
  var R=11, hy=y-17+bob;
  var lw=Math.sin(f.walk)*5;

  /* legs */
  ctx.strokeStyle=INK; ctx.lineWidth=4.6; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(x-4,y+6); ctx.lineTo(x-4+lw,y+15);
  ctx.moveTo(x+4,y+6); ctx.lineTo(x+4-lw,y+15); ctx.stroke();
  disc(x-4+lw,y+16,2.6,'#2b2b3a',1.6); disc(x+4-lw,y+16,2.6,'#2b2b3a',1.6);
  /* uniform */
  slab(x-11,y-8,22,16,5,body,2.8);
  if(!nur){ /* a belt and a badge */
    ctx.fillStyle=INK; ctx.fillRect(x-11,y+2,22,3);
    ctx.fillStyle='#ffcf3d'; ctx.beginPath(); ctx.arc(x-6,y-3,2.2,0,TAU); ctx.fill();
  } else {  /* a red cross on the tunic */
    ctx.fillStyle='#ff4d5e';
    ctx.fillRect(x-1.4,y-5,2.8,8); ctx.fillRect(x-4.4,y-2.4,8.8,2.8);
  }
  /* arms */
  ctx.strokeStyle=INK; ctx.lineWidth=3.6;
  ctx.beginPath();
  ctx.moveTo(x-10,y-5); ctx.lineTo(x-14-lw*.4,y+1);
  ctx.moveTo(x+10,y-5); ctx.lineTo(x+14+lw*.4,y+1); ctx.stroke();
  disc(x-14.5-lw*.4,y+2,2.4,skin,1.6);

  /* head */
  disc(x,hy,R,skin,2.8);
  if(scared){
    eyes(x,hy+0.5,4.3,4.2,1.5,0);
    ctx.strokeStyle=INK; ctx.lineWidth=1.8; ctx.beginPath();
    for(var k=0;k<4;k++){ ctx.moveTo(x-5+k*3.3,hy+6.5); ctx.lineTo(x-3.4+k*3.3,hy+4.9); }
    ctx.stroke();
  } else if(nur){
    eyes(x,hy+0.5,4.3,3.6,1.7,0);
    /* a flat, unimpressed mouth */
    ctx.strokeStyle=INK; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(x-3.4,hy+6); ctx.lineTo(x+3.4,hy+6); ctx.stroke();
    /* nurse cap */
    slab(x-8.5,hy-R-3,17,6,2,'#fff',2.4);
    ctx.fillStyle='#ff4d5e';
    ctx.fillRect(x-1.1,hy-R-2.2,2.2,4.4); ctx.fillRect(x-3.2,hy-R-1.1,6.4,2.2);
  } else {
    /* aviators: one dark bar across the face, which is the whole character */
    slab(x-8.4,hy-2.6,16.8,6.4,2.6,'#1a1526',2.2);
    ctx.fillStyle='rgba(255,255,255,.35)';
    ctx.fillRect(x-6.6,hy-1.6,3.2,1.5); ctx.fillRect(x+1.4,hy-1.6,3.2,1.5);
    /* a moustache he is very proud of */
    ctx.fillStyle=zom?'#5c7a44':'#4a3b2a';
    rr(ctx,x-5.6,hy+4.4,11.2,3.4,1.7); ctx.fill(); ink(1.6);
    /* the hat */
    slab(x-R-0.8,hy-R-1,R*2+1.6,5.6,2.4,zom?'#4f6b3a':'#1c2555',2.4);
    slab(x-7.5,hy-R-6,15,5.6,2.4,zom?'#4f6b3a':'#1c2555',2.4);
    ctx.fillStyle='#ffcf3d'; ctx.beginPath(); ctx.arc(x,hy-R-3.2,1.9,0,TAU); ctx.fill();
  }

  /* the taser, held out in front of him */
  if(!scared&&f.stun<=0){
    var hx=x+Math.cos(f.ang)*13, hyy=y+Math.sin(f.ang)*13+bob*.3;
    ctx.save(); ctx.translate(hx,hyy); ctx.rotate(f.ang);
    slab(-5,-3.2,10.5,6.4,2,'#2b2b3a',2);
    ctx.fillStyle='#f5c542'; rr(ctx,4.6,-1.8,3.6,3.6,1.2); ctx.fill();
    if(f.see>0.15){
      var ph=W.time*26+f.walk;
      ctx.strokeStyle='#9fe8ff'; ctx.lineWidth=1.6; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(8.5,0);
      ctx.lineTo(11.5,Math.sin(ph)*2.4); ctx.lineTo(14.5,Math.sin(ph*1.7)*-2.6);
      ctx.stroke();
    }
    ctx.restore();
  }

  if(f.stun>0){
    ctx.fillStyle='#ffcf3d'; ctx.font='700 13px Fredoka,sans-serif'; ctx.textAlign='center';
    var st=['\u2726','\u2727'][Math.floor(W.time*8)%2];
    ctx.fillText(st+' '+st,x,hy-R-9);
  } else if(!scared&&f.see>0.15){
    ctx.fillStyle=f.see>(P.up.shirt?.9:.45)?'#ff4d5e':'#ffcf3d';
    ctx.font='700 17px Fredoka,sans-serif'; ctx.textAlign='center';
    ctx.fillText(f.see>(P.up.shirt?.9:.45)?'!':'?',x,hy-R-8);
  }
}

function drawSenior(s){
  var bob=Math.sin(s.wob)*1.6;
  var x=s.x, y=s.y, R=11;              /* every number below is a multiple of R */
  var W1=0.22*R, W2=0.13*R;            /* silhouette weight / interior weight */
  shadow(x,y,s.r+4);

  /* ---- the cart, rotated to where he is driving -------------------------
     The canopy is the whole ballgame: a golf cart is a flat roof floating on
     four skinny posts over open sides. Stroked and NOT filled, so you still
     see the driver through it -- and drawn before him, so his head breaks the
     roofline. A broken contour is what stops this reading as a blob in a box. */
  ctx.save(); ctx.translate(x,y); ctx.rotate(s.ang);
  /* wheels, conspicuously too small, poking well past the tub */
  ctx.fillStyle='#241f38';
  rr(ctx,-1.94*R,-1.48*R,0.85*R,0.60*R,0.25*R); ctx.fill();
  rr(ctx,-1.94*R, 0.88*R,0.85*R,0.60*R,0.25*R); ctx.fill();
  rr(ctx, 1.09*R,-1.48*R,0.85*R,0.60*R,0.25*R); ctx.fill();
  rr(ctx, 1.09*R, 0.88*R,0.85*R,0.60*R,0.25*R); ctx.fill();
  /* the tub, darker than the floor so it is not a pale smear on pale grass */
  slab(-1.70*R,-1.10*R,3.40*R,2.20*R,0.45*R,s.cart||'#ded6c4',W1);
  /* seeing down into it is the "no doors" cue */
  ctx.fillStyle='#b9ae99'; rr(ctx,-1.44*R,-0.84*R,2.88*R,1.68*R,0.30*R); ctx.fill();
  /* bag rack at the back, bench across the middle */
  slab(-1.74*R,-0.56*R,0.48*R,1.12*R,0.14*R,'#3a3357',W2);
  slab(-1.00*R,-0.80*R,0.58*R,1.60*R,0.20*R,'#8a8170',W2);
  ctx.strokeStyle=INK; ctx.lineWidth=W2;
  ctx.beginPath(); ctx.arc(0.95*R,0,0.34*R,0,TAU); ctx.stroke();
  /* Every one of them has had the left indicator on since about 1997.
     Nobody in this building is going to mention it. */
  disc(1.55*R,-1.02*R,0.22*R,(Math.floor(W.time*1.7+s.wob)%2===0)?'#ffa62b':'#6d5c3e',1.5);
  /* the four roof posts, then the roof itself */
  ctx.fillStyle=INK;
  ctx.fillRect(-1.73*R,-1.15*R,0.26*R,0.26*R); ctx.fillRect(-1.73*R,0.89*R,0.26*R,0.26*R);
  ctx.fillRect( 1.47*R,-1.15*R,0.26*R,0.26*R); ctx.fillRect( 1.47*R,0.89*R,0.26*R,0.26*R);
  rr(ctx,-1.86*R,-1.26*R,3.72*R,2.52*R,0.50*R); ink(W1);
  ctx.restore();

  /* ---- the resident, facing you, head over the roofline ----------------- */
  var HY=y-1.28*R;
  var hair=s.hair||'wave', cardi=s.cardi||'#7d4aa8';
  /* sloped shoulders, set low, no neck -- he sinks into his own cardigan */
  slab(x-0.86*R,HY+0.34*R,1.72*R,1.26*R,0.46*R,cardi,W1);
  /* the jowl goes on BEFORE the head so the two fuse into one bottom-heavy
     silhouette. A clean circle reads as a child; a weighted chin reads as old. */
  ctx.beginPath(); ctx.ellipse(x,HY+0.54*R,0.72*R,0.50*R,0,0,TAU);
  ctx.fillStyle='#f0c391'; ctx.fill(); ink(W1);
  disc(x-0.98*R,HY+0.10*R,0.26*R,'#f0c391',W2);
  disc(x+0.98*R,HY+0.10*R,0.26*R,'#f0c391',W2);
  disc(x,HY,R,'#f0c391',W1);
  /* WHITE HAIR AS AN OUTLINED MASS -- the loudest "old" cue there is, and it
     only works if a dark line separates it from the pale world behind. */
  if(hair==='bald'){
    disc(x-0.94*R,HY-0.20*R,0.42*R,'#fff',W1);
    disc(x+0.94*R,HY-0.20*R,0.42*R,'#fff',W1);
    halfDisc(x,HY-0.10*R,1.06*R,0.84*Math.PI,1.16*Math.PI,'#fff',W1);
  } else {
    halfDisc(x,HY-0.18*R,1.14*R,Math.PI,TAU,'#fff',W1);
    disc(x-0.92*R,HY-0.26*R,0.40*R,'#fff',W1);
    disc(x+0.92*R,HY-0.26*R,0.40*R,'#fff',W1);
    if(hair==='bun') disc(x,HY-1.34*R,0.42*R,'#fff',W1);
  }
  /* One heavy brow shelf, not two hairs. It sits on skin, above the lenses. */
  ctx.strokeStyle='#efe9f6'; ctx.lineWidth=0.17*R; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(x-0.60*R,HY-0.30*R); ctx.lineTo(x-0.10*R,HY-0.24*R);
  ctx.moveTo(x+0.10*R,HY-0.24*R); ctx.lineTo(x+0.60*R,HY-0.30*R); ctx.stroke();
  /* THE EYES ARE THE GLASSES. At a face this small a lens ring and an eye white
     fight for the same pixels and both lose, so one shape does both jobs: a
     white disc with a heavy dark rim reads as spectacles and as an eye. */
  disc(x-0.37*R,HY+0.02*R,0.33*R,'#fff',0.15*R);
  disc(x+0.37*R,HY+0.02*R,0.33*R,'#fff',0.15*R);
  ctx.strokeStyle=INK; ctx.lineWidth=W2;
  ctx.beginPath(); ctx.moveTo(x-0.08*R,HY+0.02*R); ctx.lineTo(x+0.08*R,HY+0.02*R);
  ctx.moveTo(x-0.70*R,HY-0.02*R); ctx.lineTo(x-1.00*R,HY+0.06*R);
  ctx.moveTo(x+0.70*R,HY-0.02*R); ctx.lineTo(x+1.00*R,HY+0.06*R); ctx.stroke();
  ctx.fillStyle=INK;
  ctx.beginPath(); ctx.arc(x-0.37*R,HY+0.03*R,0.12*R,0,TAU);
  ctx.arc(x+0.37*R,HY+0.03*R,0.12*R,0,TAU); ctx.fill();
  /* the entire mouth vocabulary available at this size */
  ctx.fillStyle=INK;
  rr(ctx,x-0.26*R,HY+0.66*R,0.52*R,0.16*R,0.08*R); ctx.fill();

  /* what he is holding out for. Sized so it never outshouts his head. */
  if(s.st==='wander'||s.st==='toLure'){
    var by=y-3.9*R+Math.sin(W.time*3+s.wob)*2.5;
    slab(x-0.95*R,by-0.80*R,1.90*R,1.60*R,0.55*R,'#fff',W2);
    ctx.fillStyle='#fff'; ctx.beginPath();
    ctx.moveTo(x-3.4,by+0.80*R); ctx.lineTo(x,by+1.34*R); ctx.lineTo(x+3.4,by+0.80*R); ctx.fill();
    em(ctx,LURE_E[s.want],x,by,0.92*R);
  }
  if(s.say>0&&s.txt){
    ctx.font='700 11px Fredoka,sans-serif'; ctx.textAlign='center';
    var tw=ctx.measureText(s.txt).width+14;
    slab(x-tw/2,y-5.6*R,tw,19,8,'#fff4e6',2);
    ctx.fillStyle=INK; ctx.fillText(s.txt,x,y-5.6*R+13.5);
  }
}

function drawGerald(){
  var g=W.gerald; if(!g) return;
  g.bob+=1/60;
  var t=W.time;
  shadow(g.x,g.y,22);
  var dancing=g.dance>0;
  var hop=dancing?Math.abs(Math.sin(t*11))*13:Math.sin(g.bob*1.6)*1.5;
  var lean=dancing?Math.sin(t*9)*.35:(g.mad>0?-.3:0);
  /* 0..1 through a cane swing, or -1 when he is not swinging one */
  var sw=g.swing>0?1-g.swing/SWING_T:-1;
  if(sw>=0){
    /* up on his toes for the windup, then his whole body goes into it */
    if(sw<SW_UP){      hop+=es(sw/SW_UP)*4;              lean=lerp(0,-.38,es(sw/SW_UP)); }
    else if(sw<SW_DN){ hop+=lerp(4,-2,es((sw-SW_UP)/(SW_DN-SW_UP)));
                       lean=lerp(-.38,.32,es((sw-SW_UP)/(SW_DN-SW_UP))); }
    else {             hop+=lerp(-2,0,es((sw-SW_DN)/(1-SW_DN)));
                       lean=lerp(.32,0,es((sw-SW_DN)/(1-SW_DN))); }
  }
  /* the walker, abandoned when the music takes him */
  ctx.strokeStyle='#9aa3c0'; ctx.lineWidth=4; ctx.lineCap='round';
  var wx=g.x+(dancing?26:0), wy=g.y+(dancing?4:0);
  ctx.beginPath();
  ctx.moveTo(wx-14,wy+16); ctx.lineTo(wx-14,wy-10); ctx.lineTo(wx+14,wy-10); ctx.lineTo(wx+14,wy+16);
  ctx.moveTo(wx-14,wy+2); ctx.lineTo(wx+14,wy+2); ctx.stroke();

  ctx.save(); ctx.translate(g.x,g.y-hop); ctx.rotate(lean);
  /* legs, kicking if dancing */
  ctx.strokeStyle='#3b3358'; ctx.lineWidth=5;
  var k=dancing?Math.sin(t*11)*9:0;
  ctx.beginPath(); ctx.moveTo(-5,6); ctx.lineTo(-5+k,20); ctx.moveTo(5,6); ctx.lineTo(5-k,20); ctx.stroke();
  /* cardigan */
  ctx.fillStyle=dancing?'#ff5c8a':'#b0793f'; rr(ctx,-14,-12,28,22,7); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.2)'; rr(ctx,-4,-12,8,22,3); ctx.fill();
  /* head */
  ctx.fillStyle='#ffd9b0'; ctx.beginPath(); ctx.arc(0,-22,11,0,TAU); ctx.fill();
  ctx.fillStyle='#e8e4f2'; ctx.beginPath(); ctx.arc(-8,-26,4.4,0,TAU); ctx.arc(8,-26,4.4,0,TAU); ctx.fill();
  ctx.fillStyle='#231a3d';
  if(g.mad>0){ ctx.fillRect(-6,-24,4.6,2.4); ctx.fillRect(1.4,-24,4.6,2.4); }
  else { ctx.beginPath(); ctx.arc(-3.4,-23,1.7,0,TAU); ctx.arc(3.4,-23,1.7,0,TAU); ctx.fill(); }
  ctx.strokeStyle='#231a3d'; ctx.lineWidth=1.8; ctx.beginPath();
  if(dancing) ctx.arc(0,-17,4.6,0,Math.PI);
  else if(g.mad>0) ctx.arc(0,-14,4.6,Math.PI,TAU);
  else { ctx.moveTo(-4,-16); ctx.lineTo(4,-16); }
  ctx.stroke();
  /* The cane. It is a policy, so it has to look like one: he winds it up over
     his head, brings it down fast, then lets it settle. Charlotte's note was
     that it never looked like he actually hit her -- it was only a screen
     shake and a sound, and he never moved. */
  var ca;
  if(sw>=0){
    if(sw<SW_UP)      ca=lerp(0.35,-2.35,es(sw/SW_UP));
    else if(sw<SW_DN) ca=lerp(-2.35,1.25,es((sw-SW_UP)/(SW_DN-SW_UP)));
    else              ca=lerp(1.25,0.35,es((sw-SW_DN)/(1-SW_DN)));
  }
  else ca=dancing?Math.sin(t*11)*1.5-0.7:(g.mad>0?-1.35+Math.sin(t*26)*.5:0.35);
  /* the arc the tip cut through the air, while it is coming down */
  if(sw>=SW_UP&&sw<SW_DN+.10){
    ctx.save(); ctx.translate(13,-6);
    ctx.strokeStyle='rgba(255,255,255,.45)'; ctx.lineWidth=3; ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(0,0,27,-2.35+Math.PI/2,ca+Math.PI/2); ctx.stroke();
    ctx.restore();
  }
  ctx.save(); ctx.translate(13,-6); ctx.rotate(ca);
  ctx.strokeStyle='#6b4423'; ctx.lineWidth=4.5; ctx.beginPath();
  ctx.moveTo(0,0); ctx.lineTo(0,26); ctx.stroke();
  ctx.beginPath(); ctx.arc(4.5,0,4.5,Math.PI,TAU); ctx.stroke();
  ctx.restore();
  ctx.restore();

  if(dancing){
    ctx.font='700 13px Fredoka,sans-serif'; ctx.textAlign='center'; ctx.fillStyle='#ffcf3d';
    var notes=['♪','♫','♬'];
    for(var i=0;i<3;i++){
      var a=t*3+i*2.1;
      ctx.fillText(notes[i],g.x+Math.cos(a)*30,g.y-52-((t*46+i*20)%40));
    }
  }
  if(g.say>0&&g.txt){
    ctx.font='700 12px Fredoka,sans-serif'; ctx.textAlign='left';
    var words=wrap(g.txt,26);
    var wmax=0; for(var l=0;l<words.length;l++) wmax=Math.max(wmax,ctx.measureText(words[l]).width);
    var bw=wmax+18, bh=words.length*15+12, bx=g.x+26, by=g.y-70;
    ctx.fillStyle='rgba(20,16,31,.9)'; rr(ctx,bx,by,bw,bh,10); ctx.fill();
    ctx.strokeStyle=g.mad>0?'#ff4d5e':'#ffcf3d'; ctx.lineWidth=2; rr(ctx,bx,by,bw,bh,10); ctx.stroke();
    ctx.fillStyle='#fff4e6';
    for(var l2=0;l2<words.length;l2++) ctx.fillText(words[l2],bx+9,by+20+l2*15);
  }
}
function wrap(txt,n){
  var out=[],line='',ws=txt.split(' ');
  for(var i=0;i<ws.length;i++){
    if((line+' '+ws[i]).trim().length>n){ out.push(line.trim()); line=ws[i]; }
    else line+=' '+ws[i];
  }
  if(line.trim()) out.push(line.trim());
  return out;
}

function drawShots(){
  for(var i=0;i<W.shots.length;i++){
    var s=W.shots[i];
    if(s.foe){
      if(s.t==='taser'&&!s.ball){
        /* a crackling bolt with a bright head, instead of a blue dot */
        var an=Math.atan2(s.vy,s.vx), L=17;
        ctx.save(); ctx.translate(s.x,s.y); ctx.rotate(an);
        ctx.strokeStyle='rgba(159,232,255,.55)'; ctx.lineWidth=4.5; ctx.lineCap='round';
        ctx.beginPath(); ctx.moveTo(-L,0);
        for(var z=1;z<=4;z++) ctx.lineTo(-L+z*(L/2),(z%2?1:-1)*3.1);
        ctx.stroke();
        ctx.strokeStyle='#eaffff'; ctx.lineWidth=1.8;
        ctx.beginPath(); ctx.moveTo(-L,0);
        for(var z2=1;z2<=4;z2++) ctx.lineTo(-L+z2*(L/2),(z2%2?1:-1)*3.1);
        ctx.stroke();
        ctx.fillStyle='#fff';
        ctx.beginPath(); ctx.arc(L/2,0,s.r*.62,0,TAU); ctx.fill();
        ctx.restore();
        continue;
      }
      ctx.fillStyle=s.ball?'#fff':'#4bc8ff';
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,TAU); ctx.fill();
      ctx.strokeStyle=s.ball?'#8b5cf6':'#bfeaff'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r+3,0,TAU); ctx.stroke();
      continue;
    }
    if(s.landed&&s.t==='lure'){
      var pu=.5+Math.sin(W.time*6+i)*.5;
      ctx.fillStyle='rgba(255,207,61,'+(.12+pu*.14)+')';
      ctx.beginPath(); ctx.arc(s.x,s.y,22+pu*6,0,TAU); ctx.fill();
      /* The real reach of the smell, drawn so you can see whether you threw it
         close enough -- and so "he ignored it" stops being a mystery. */
      if(PHASE==='home'){
        var rr2=(P.up.wig?300:165)*DIFF.lure;
        ctx.strokeStyle='rgba(140,227,79,'+(.20+pu*.16)+')';
        ctx.lineWidth=2.5; ctx.setLineDash([9,11]);
        ctx.beginPath(); ctx.arc(s.x,s.y,rr2,0,TAU); ctx.stroke();
        ctx.setLineDash([]);
      }
    }
    ctx.save(); ctx.translate(s.x,s.y); ctx.rotate(s.a);
    em(ctx,WEPEMO[s.kind]||'🍬',0,0,s.landed?18:16);
    ctx.restore();
  }
}

function drawStick(){
  if(!IN.touch||!W||!P) return;
  var px=(P.x-CAM.x)*CAM.sc, py=(P.y-CAM.y)*CAM.sc;
  var fx=IN.touch.x, fy=IN.touch.y;
  ctx.save(); ctx.setTransform(DPR,0,0,DPR,0,0);

/* An arrow at the screen edge pointing at whatever you should be doing. */
function drawCompass(){
  var tx=null,ty=null,col='#ffcf3d',lab='';
  if(PHASE==='store'){
    if(P.cart.length&&ORDER){ var ok=false;
      for(var i=0;i<P.cart.length;i++){ for(var j=0;j<ORDER.items.length;j++){
        if(!ORDER.got[j]&&ORDER.items[j]===P.cart[i]) ok=true; } }
      if(ok){ tx=W.gerald.x; ty=W.gerald.y; lab='GERALD'; }
    }
    if(tx===null&&ORDER){
      var best=1e9;
      for(var s=0;s<W.spots.length;s++){ var sp=W.spots[s];
        var want=false;
        for(var k=0;k<ORDER.items.length;k++) if(!ORDER.got[k]&&ORDER.items[k]===sp.id) want=true;
        if(!want) continue;
        var d=dist2(P.x,P.y,sp.x,sp.y); if(d<best){best=d;tx=sp.x;ty=sp.y;lab='ITEM';}
      }
    }
  } else if(PHASE==='home'){
    if(P.followers.length){ tx=W.goal.x+W.goal.w/2; ty=W.goal.y+W.goal.h/2; col='#8ce34f'; lab='GATE'; }
    else { var b2=1e9;
      for(var q=0;q<W.seniors.length;q++){ var se=W.seniors[q]; if(se.st!=='wander') continue;
        var d2=dist2(P.x,P.y,se.x,se.y); if(d2<b2){b2=d2;tx=se.x;ty=se.y;col='#4bc8ff';lab='SENIOR';} }
    }
  } else { tx=W.goal.x; ty=W.goal.y+W.goal.h/2; col='#8ce34f'; lab='EXIT'; }
  if(tx===null) return;
  var vw=CW/CAM.sc, vh=CH/CAM.sc;
  if(tx>CAM.x+30&&tx<CAM.x+vw-30&&ty>CAM.y+30&&ty<CAM.y+vh-30) return;
  var sx=(tx-CAM.x)*CAM.sc, sy=(ty-CAM.y)*CAM.sc;
  var cx=CW/2, cy=CH/2, ang=Math.atan2(sy-cy,sx-cx);
  var m=Math.min(CW,CH)*0.36;
  var px=cx+Math.cos(ang)*m, py=cy+Math.sin(ang)*m;
  ctx.save(); ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.translate(px,py); ctx.rotate(ang);
  ctx.fillStyle=col; ctx.beginPath();
  ctx.moveTo(14,0); ctx.lineTo(-9,-9); ctx.lineTo(-5,0); ctx.lineTo(-9,9); ctx.closePath(); ctx.fill();
  ctx.rotate(-ang);
  ctx.font='700 9px Fredoka,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle=col; ctx.fillText(lab,0,20);
  ctx.restore();
}

function render(){
  resizeIfNeeded();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#2b2340'; ctx.fillRect(0,0,CW,CH);
  if(!W){ return; }
  var sx=CAM.shake?rnd(-CAM.shake,CAM.shake)*.4:0, sy=CAM.shake?rnd(-CAM.shake,CAM.shake)*.4:0;
  ctx.save();
  ctx.setTransform(DPR*CAM.sc,0,0,DPR*CAM.sc,DPR*(-CAM.x*CAM.sc+sx),DPR*(-CAM.y*CAM.sc+sy));
  drawFloor(); drawPuddles(); drawGoal(); drawWalls(); drawDecor(); drawSpots(); drawPickups(); drawBoxes();
  drawHazards();
  if(PHASE==='store') drawGerald();
  /* depth sort so things in front overlap correctly */
  var ents=[];
  for(var i=0;i<W.seniors.length;i++) ents.push({y:W.seniors[i].y,d:W.seniors[i],k:'s'});
  for(var j=0;j<W.foes.length;j++) ents.push({y:W.foes[j].y,d:W.foes[j],k:'f',i:j});
  for(var c=0;c<W.cats.length;c++) ents.push({y:W.cats[c].y,d:W.cats[c],k:'c'});
  ents.push({y:P.y,d:P,k:'p'});
  ents.sort(function(a,b){return a.y-b.y;});
  for(var e=0;e<ents.length;e++){
    var en=ents[e];
    if(en.k==='s') drawSenior(en.d);
    else if(en.k==='f') drawFoe(en.d,en.i);
    else if(en.k==='c'){ var ct=en.d; shadow(ct.x,ct.y,9); em(ctx,'😺',ct.x,ct.y+Math.sin(ct.walk)*2,22); }
    else drawPlayer();
  }
  drawShots(); drawParts();
  ctx.restore();

  ctx.setTransform(DPR,0,0,DPR,0,0);
  drawCompass(); drawStick();
  if(P.buff.rampage>0){
    var f=clamp(P.buff.rampage/1.5,0,1);
    ctx.fillStyle='rgba(140,227,79,'+(0.05+ (P.buff.rampage<3? Math.abs(Math.sin(W.time*9))*0.09 :0.03))+')';
    ctx.fillRect(0,0,CW,CH);
    var bw=Math.min(CW*.6,300), bx=(CW-bw)/2, by=CH-58;
    ctx.fillStyle='rgba(20,16,31,.75)'; rr(ctx,bx-3,by-3,bw+6,14,7); ctx.fill();
    ctx.fillStyle='#8ce34f'; rr(ctx,bx,by,bw*clamp(P.buff.rampage/P.rampMax,0,1),8,4); ctx.fill();
    ctx.fillStyle='#8ce34f'; ctx.font='700 10px Fredoka,sans-serif'; ctx.textAlign='center';
    ctx.fillText('RAMPAGE',CW/2,by-9);
  }
  if(CAM.flash>0){
    ctx.globalAlpha=CAM.flash*.55; ctx.fillStyle=CAM.flashCol; ctx.fillRect(0,0,CW,CH); ctx.globalAlpha=1;
  }
}

function syncHud(){

  var sig=P.hp+'/'+P.maxhp+'/'+P.shield+'/'+cartMax()+'/'+P.cart.join(',')+'/'+
    (ORDER?ORDER.got.join(''):'');
  if(sig===syncHud._sig){ syncHudLight(); return; }
  syncHud._sig=sig;
  var h='';
  for(var i=0;i<P.maxhp;i++) h+='<span class="hp'+(i<P.hp?'':' spent')+'"></span>';
  for(var s=0;s<P.shield;s++) h+='<span class="hp shield"></span>';
  elHearts.innerHTML=h;
  /* cart */
  var c='';

  for(var k=0;k<max;k++){
    var id=P.cart[k];
    var wanted=false;
    if(id&&ORDER) for(var j=0;j<ORDER.items.length;j++) if(!ORDER.got[j]&&ORDER.items[j]===id) wanted=true;
    c+='<div class="slot'+(id?' full':'')+(wanted?' match':'')+'" data-i="'+k+'">'+(id?ITEM[id].e:'')+'</div>';

}
/* The parts that are cheap to touch every tick. */
function syncHudLight(){
  if(!P) return;
  elCoin.textContent=COINS;
  elRound.textContent=ROUND;
  elPhase.textContent=PHASE==='store'?'Grumble-Mart':(PHASE==='home'?'Shady Pines':'The Escape');
  {
  /* weapon button -- shows the snack that will actually leave her hand */
  var w=nextThrow();
  elWep.innerHTML=WEPEMO[w]+'<span class="n">'+P.ammo[w]+'</span>';
  elWep.disabled=false;
  if(elDrop) elDrop.disabled=(P.cart.length===0);
  /* the one mechanic a first-timer has to guess: light the button when it will do something */
  if(elGrab){
    var canDeliver=SCENE==='play'&&PHASE==='store'&&atGerald()&&P.cart.length>0;
    elGrab.classList.toggle('hot',
      SCENE==='play' && PHASE==='store' && (canDeliver || !!nearestSpot()));
    /* It is the only thing that hands the bag to Gerald, so it has to say so.
       Labelled GRAB, standing on his curb tapping it read as him ignoring her. */
    var lbl=canDeliver?'DELIVER':'GRAB';
    if(elGrab.textContent!==lbl) elGrab.textContent=lbl;
    elGrab.classList.toggle('handover',canDeliver);
  }
  var dashEl=$('bDash');
  if(dashEl){ dashEl.classList.toggle('hide',!P.up.dash); dashEl.classList.toggle('cool',P.dashcd>0); }
  /* meter */
  if(PHASE==='store'&&ORDER){
    elMeter.classList.remove('hide');
    elMeterLbl.textContent='Gerald’s patience';
    var f=clamp(PATIENCE/PATMAX,0,1);
    elMeterFl.style.width=(f*100)+'%';
    elMeter.classList.toggle('low',f<.5); elMeter.classList.toggle('crit',f<.22);
  } else if(PHASE==='home'){
    elMeter.classList.remove('hide');
    elMeterLbl.textContent='Left: '+W.left+(P.followers.length?' · towing '+P.followers.length:'');
    var f2=W.left/Math.max(1,seniorsThisRound());
    elMeterFl.style.width=(f2*100)+'%';
    elMeter.classList.remove('low','crit');
  } else if(PHASE==='escape'){
    elMeter.classList.remove('hide');
    elMeterLbl.textContent='Distance to exit';
    elMeterFl.style.width=(clamp(P.x/W.w,0,1)*100)+'%';
    elMeter.classList.remove('low','crit');
  } else elMeter.classList.add('hide');
  }
}

function toast(txt,cls){
  var d=document.createElement('div');

  setTimeout(function(){ d.classList.add('out'); setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); },320); },1900);
}

function owns(k){ return !!P.owned[k]; }
function canBuy(it){
  if(it.need&&!owns(it.need)) return false;
  if(!it.repeat&&owns(it.k)) return false;
  if(it.max&&(P.owned[it.k]||0)>=it.max) return false;
  if(it.k==='d_heal'&&P.hp>=P.maxhp) return false;   /* no paying 30 coins for nothing */
  return COINS>=it.pr;
}
function openShop(){
  SCENE='shop'; elHud.hidden=true; musForScene();
  drawShop('The van pulls over. There is a man in the back with a folding table.');
}
function drawShop(note){
  var html='<h2>\ud83d\uded2 The Back of a Van</h2>'+
    '<div class="tag">'+note+'</div>'+
    '<div class="shophead"><div class="small">Round '+ROUND+' starts when you say so</div>'+
    '<div class="bal">'+COINS+' \ud83e\ude99</div></div>';
  var open=false;
  for(var i=0;i<SHOP.length;i++){
    var it=SHOP[i];
    if(it.sect){
      if(open) html+='</div>';
      html+='<div class="sect">'+it.sect+'</div><div class="shopgrid">';
      open=true; continue;
    }
    var ownedOnce=(!it.repeat&&owns(it.k));
    var locked=!!(it.need&&!owns(it.need));
    var capped=!!(it.max&&(P.owned[it.k]||0)>=it.max);
    var ok=canBuy(it);
    var price=(ownedOnce||capped)?'OWNED':(locked?'LOCKED':(it.pr+' \ud83e\ude99'));
    html+='<button class="item'+((ownedOnce||capped)?' owned':'')+'" id="shop'+i+'"'+(ok?'':' disabled')+'>'+
      '<div class="ttl"><span>'+it.e+'</span>'+it.ttl+'</div>'+
      '<div class="ds">'+(locked?'Locked \u2014 buy the weapon first.':it.ds)+'</div>'+
      '<div class="pr">'+price+'</div></button>';
  }
  if(open) html+='</div>';
  html+='<div class="rowbtns">'+
    '<button class="btn go" id="shopGo">START ROUND '+ROUND+'</button></div>'+
    '<div class="tag" style="margin-top:10px">Coins carry over. Hearts do not heal on their own \u2014 buy the insoles.</div>';
  showVeil(html);
  for(var j=0;j<SHOP.length;j++){
    if(SHOP[j].sect) continue;
    (function(it2,idx){
      var e=$('shop'+idx); if(!e) return;
      e.addEventListener('click',function(ev){
        ev.preventDefault(); auInit();
        if(!canBuy(it2)) return;
        COINS-=it2.pr; it2.give();
        P.owned[it2.k]=(P.owned[it2.k]||0)+1;
        SFX.buy();
        drawShop('\u201c'+pick(['Pleasure doing business.','No refunds. No receipts. No eye contact.',
          'It fell off a truck. A different truck.','Do not tell the ducks.'])+'\u201d');
      });
    })(SHOP[j],j);
  }
  on('shopGo',function(){ hideVeil(); SCENE='play'; elHud.hidden=false; startPhase('store'); });
}

/* ============================================================================
   MAIN LOOP
   ==========================================================================*/
var last=0;
var framesDrawn=0;
function step(ts){
  framesDrawn++;
  var dt=(ts-last)/1000; last=ts;
  if(!(dt>0)||dt>.25) dt=1/60;
  try{
    musTick();
    if(SCENE==='play'&&!paused&&W) simulate(dt);
    else if(W) updateCamera(dt);
    render();
  }catch(e){
    /* A bad frame must not be a dead game: log once, keep the loop alive. */
    if(!window.__cmErr){ window.__cmErr=(e&&e.message)||'error'; if(window.console) console.error(e); }
  }
  if(!window.__cmDrive) raf(step);
}
/* One tick of the world. Split out from step() so it can be driven headlessly. */
function simulate(dt){
  {
    W.time+=dt;
    if(W.gerald){ if(W.gerald.mad>0) W.gerald.mad-=dt;
                  if(W.gerald.swing>0) W.gerald.swing-=dt;
                  if(W.gerald.say>0) W.gerald.say-=dt;
                  if(W.gerald.dance>0) W.gerald.dance-=dt; }
    if(P.buff.rampage>0&&P.buff.rampage-dt<=0){ P.rampChain=0; toast('back to normal. run.','bad'); }
    updatePlayer(dt);
    updateFoes(dt); updateCats(dt); updateShots(dt); updateParts(dt); updateHazards(dt);
    if(PHASE==='home') updateSeniors(dt);
    for(var s=0;s<W.spots.length;s++) if(W.spots[s].cool>0) W.spots[s].cool-=dt;
    /* Gerald's patience */
    if(PHASE==='store'&&ORDER){
      PATIENCE-=dt*(atGerald()?.35:1);
      if(PATIENCE<=0){
        PATIENCE=PATMAX*.8; W.gerald.mad=1; W.gerald.swing=SWING_T; SFX.cane(); shake(10);
        geraldSays(pick(HURRY_LINES)); hurtPlayer(1,'TOO SLOW. THE CANE FINDS YOU ANYWAY.');
      }
    }
    if(PHASE==='escape'&&W.goal&&inRect(P.x,P.y,W.goal)&&!W.done){
      addCoins(30+ROUND*6); toast('ESCAPED! +'+(30+ROUND*6),'good'); SFX.free(); finishPhase();
    }
    updateCamera(dt);
    syncHudThrottled(dt);
  }
}
var hudT=0;
function syncHudThrottled(dt){ hudT+=dt; if(hudT>.12){ hudT=0; syncHud(); } }

/* rAF with a timer fallback for iOS Low Power Mode */
var raf=(function(){
  var r=window.requestAnimationFrame||window.webkitRequestAnimationFrame;
  if(r) return function(fn){ return r.call(window,fn); };
  return function(fn){ return setTimeout(function(){ fn(Date.now()); },1000/60); };
})();

/* ============================================================================
   BOOT
   ==========================================================================*/
document.addEventListener('visibilitychange',function(){
  if(document.hidden&&SCENE==='play'&&!paused) togglePause();
});
['pointerdown','touchstart','keydown'].forEach(function(ev){
  window.addEventListener(ev,function once(){ auInit(); musForScene();
    window.removeEventListener(ev,once); },{once:true});
});
$('bMute').textContent=AU.on?'♪':'✖';
menu();
last=(window.performance&&performance.now)?performance.now():Date.now();
raf(step);
/* iOS Low Power Mode (and some embedded webviews) suspend requestAnimationFrame
   outright -- the function still exists, so the "is rAF missing?" fallback above
   never fires. If not one frame lands while the page is visible, drive from a timer. */
window.__cmDrive=false;
setTimeout(function(){
  if(framesDrawn>0 || document.visibilityState!=='visible') return;
  window.__cmDrive=true;
  setInterval(function(){
    if(document.visibilityState==='visible')
      step((window.performance&&performance.now)?performance.now():Date.now());
  },33);
},900);
