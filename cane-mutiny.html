<script>
/* The host may own <head>, so establish the mobile viewport before first layout. */
(function(){
  function meta(n,c){var m=document.querySelector('meta[name="'+n+'"]');
    if(!m){m=document.createElement('meta');m.setAttribute('name',n);
      (document.head||document.documentElement).appendChild(m);}
    m.setAttribute('content',c);}
  if(!document.querySelector('meta[charset]')){
    var mc=document.createElement('meta'); mc.setAttribute('charset','utf-8');
    (document.head||document.documentElement).insertBefore(mc,(document.head||document.documentElement).firstChild);
  }
  meta('viewport','width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover');
  meta('apple-mobile-web-app-capable','yes');
  meta('mobile-web-app-capable','yes');
  meta('apple-mobile-web-app-status-bar-style','black-translucent');
  meta('apple-mobile-web-app-title','Cane Mutiny');
  meta('theme-color','#14101f');
  meta('color-scheme','dark');
})();
</script>
<script>
/* Safari throws on localStorage inside cross-site iframes. Everything goes
   through this shim, which silently falls back to memory. */
var LS=(function(){
  var ok=false, mem={};
  try{ window.localStorage.setItem('__cm','1'); window.localStorage.removeItem('__cm'); ok=true; }catch(e){ ok=false; }
  return {
    blocked:!ok,
    get:function(k){ try{ return ok?window.localStorage.getItem(k):(k in mem?mem[k]:null); }
                     catch(e){ return (k in mem)?mem[k]:null; } },
    set:function(k,v){ try{ if(ok) window.localStorage.setItem(k,String(v)); else mem[k]=String(v); }
                       catch(e){ mem[k]=String(v); } },
    del:function(k){ try{ if(ok) window.localStorage.removeItem(k); else delete mem[k]; }
                     catch(e){ delete mem[k]; } }
  };
})();
/* Registered before any other script so even a boot-time failure is visible. */
window.__cmErr=null;
window.addEventListener('error',function(ev){
  if(window.__cmErr) return;
  window.__cmErr=(ev.message||'error')+' @line '+(ev.lineno||'?');
  try{
    var v=document.getElementById('veil'), c=document.getElementById('veilCard');
    if(!v||!c) return;
    c.innerHTML='<h2>Something broke</h2>'+
      '<p class="small">Screenshot this and send it to Dad:</p>'+
      '<div class="scroll" style="word-break:break-word;font-family:monospace;font-size:11px">'+
      String(window.__cmErr).replace(/</g,'&lt;')+'</div>';
    v.hidden=false;
  }catch(_){}
});
</script>

<style>
:root{
  --void:#14101f; --void2:#1e1730; --panel:#241c3c; --edge:#3d3163;
  --chalk:#fff4e6; --dim:#a99cc9;
  --pop:#ff5c8a; --lime:#8ce34f; --sun:#ffcf3d; --sky:#4bc8ff; --grape:#a78bfa;
  --hot:#ff4d5e; --good:#5fe39a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:var(--void); color:var(--chalk);
  font-family:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none;
  overscroll-behavior:none; touch-action:none;
}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;background:#2b2340;touch-action:none}

/* ---------------- HUD ---------------- */
.hud{position:fixed;inset:0;pointer-events:none;z-index:2;
  padding:calc(8px + env(safe-area-inset-top,0px)) calc(10px + env(safe-area-inset-right,0px))
          calc(8px + env(safe-area-inset-bottom,0px)) calc(10px + env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;justify-content:space-between}
.hud-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
/* The play area is a light supermarket floor; without a plate behind them the
   coin counter and the little labels sit at about 1.2:1 contrast, i.e. invisible. */
.plate{background:rgba(20,16,31,.66);border:1.5px solid rgba(61,49,99,.7);border-radius:15px;
  padding:7px 10px;-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px)}
.hud-bot{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}

.hearts{display:flex;gap:3px;align-items:center;flex-wrap:wrap;max-width:52vw}
.hp{width:17px;height:16px;background:var(--pop);
  -webkit-clip-path:polygon(50% 100%,0 38%,8% 12%,28% 4%,50% 20%,72% 4%,92% 12%,100% 38%);
  clip-path:polygon(50% 100%,0 38%,8% 12%,28% 4%,50% 20%,72% 4%,92% 12%,100% 38%);
  filter:drop-shadow(0 0 4px var(--pop))}
.hp.spent{background:var(--edge);filter:none;opacity:.55}
.hp.shield{background:var(--sky);filter:drop-shadow(0 0 5px var(--sky));
  -webkit-clip-path:polygon(50% 0,100% 22%,100% 62%,50% 100%,0 62%,0 22%);
  clip-path:polygon(50% 0,100% 22%,100% 62%,50% 100%,0 62%,0 22%)}
.coins{font-family:'Roboto Mono',monospace;font-variant-numeric:tabular-nums;
  font-size:clamp(17px,5vw,23px);font-weight:700;line-height:1;color:var(--sun);
  margin-top:6px;text-shadow:0 2px 8px rgba(0,0,0,.9)}
.coins small{font-family:'Fredoka',sans-serif;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:#c5bade;display:block;margin-bottom:2px}

.rt{text-align:right;display:flex;flex-direction:column;align-items:flex-end;
  max-width:36vw;overflow-wrap:anywhere}
.roundnum{font-family:'Luckiest Guy',cursive;font-size:clamp(14px,4.2vw,18px);line-height:1.15;
  text-shadow:0 2px 8px rgba(0,0,0,.9)}
.roundlbl{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#c5bade}
.btns{display:flex;gap:6px;margin-top:7px;pointer-events:auto}
.ibtn{position:relative;width:40px;height:40px;border-radius:12px;border:1.5px solid var(--edge);
  background:rgba(20,16,31,.85);color:var(--dim);font-size:15px;font-family:inherit;
  cursor:pointer;display:grid;place-items:center;transition:.15s;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);touch-action:manipulation}
.ibtn:hover,.ibtn:focus-visible{color:var(--chalk);border-color:var(--sun);outline:none}
.ibtn:active{transform:scale(.93)}

/* patience / objective meter */
.meter{width:clamp(110px,34vw,190px);margin-top:8px}
.meter .lb{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#c5bade;
  margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter .trk{height:9px;background:rgba(6,4,14,.85);border:1.5px solid var(--edge);border-radius:99px;overflow:hidden}
.meter .fl{height:100%;width:100%;border-radius:99px;transition:width .18s;
  background:linear-gradient(90deg,var(--good),var(--sky))}
.meter.low .fl{background:linear-gradient(90deg,var(--sun),#ff9d3d)}
.meter.crit .fl{background:linear-gradient(90deg,var(--hot),var(--pop));animation:crit .6s ease-in-out infinite}
@keyframes crit{0%,100%{opacity:1}50%{opacity:.35}}

/* order card */
.order{pointer-events:none;max-width:min(52vw,300px);
  background:linear-gradient(180deg,rgba(36,28,60,.94),rgba(20,16,31,.94));
  border:1.5px solid var(--edge);border-radius:14px;padding:8px 10px;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  box-shadow:0 8px 24px rgba(0,0,0,.5)}
.order .who{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--sun);margin-bottom:4px}
.order .rant{font-size:clamp(11px,3.2vw,13px);line-height:1.28;color:var(--chalk);margin-bottom:6px}
.order ul{list-style:none;display:flex;flex-direction:column;gap:3px}
.order li{display:flex;align-items:center;gap:6px;font-size:clamp(11px,3.2vw,13px);line-height:1.1}
.order li .em{font-size:16px;line-height:1}
.order li.done{color:var(--good);text-decoration:line-through;opacity:.75}
/* The card is opt-in: tap the phone to read the order, tap again to put it away.
   It used to sit there permanently, on top of Gerald's curb, so it covered the one
   thing you want to watch -- him caning you, or dancing when you get it right. */
.order{opacity:0;transform:translateY(6px);transition:opacity .16s ease,transform .16s ease}
.order.open{opacity:1;transform:none}
.badge{position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;border-radius:99px;
  background:var(--sun);color:#231a3d;font-size:10px;font-weight:700;
  display:grid;place-items:center;padding:0 3px;font-family:'Roboto Mono',monospace}
.badge:empty{display:none}
/* the difficulty slider on the menu */
.diffbox{margin-top:14px;background:rgba(10,8,18,.5);border:1px solid var(--edge);
  border-radius:14px;padding:12px 14px 11px}
.diffbox input[type=range]{-webkit-appearance:none;appearance:none;width:100%;
  height:26px;background:transparent;touch-action:manipulation;display:block}
.diffbox input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:99px;
  background:linear-gradient(90deg,var(--good),var(--sun),var(--hot))}
.diffbox input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
  width:26px;height:26px;border-radius:50%;background:#fff4e6;border:3px solid var(--void2);
  box-shadow:0 3px 10px rgba(0,0,0,.5);margin-top:-9px}
.diffbox input[type=range]::-moz-range-track{height:8px;border-radius:99px;
  background:linear-gradient(90deg,var(--good),var(--sun),var(--hot))}
.diffbox input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;
  background:#fff4e6;border:3px solid var(--void2)}
.diffends{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);
  text-transform:uppercase;letter-spacing:.09em;margin-top:1px}
.difflbl{text-align:center;font-family:'Luckiest Guy',cursive;letter-spacing:.03em;
  font-size:17px;color:var(--sun);margin-top:8px}
.diffdesc{text-align:center;font-size:12px;line-height:1.3;color:var(--dim);margin-top:3px}
/* the order as it arrives, in the popup */
.olist{list-style:none;display:flex;flex-direction:column;gap:7px;margin:11px 0 3px;
  background:rgba(10,8,18,.5);border:1px solid var(--edge);border-radius:12px;padding:11px 13px}
.olist li{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--chalk)}
.olist .em{font-size:23px;line-height:1}

/* cart */
.cart{display:flex;gap:5px;pointer-events:none;justify-content:flex-end;flex-wrap:wrap;
  max-width:min(58vw,220px)}
.slot{width:38px;height:38px;border-radius:11px;border:1.5px dashed var(--edge);
  background:rgba(20,16,31,.75);display:grid;place-items:center;font-size:19px;
  transition:.12s;position:relative}
.slot.full{border-style:solid;border-color:var(--sun);background:rgba(40,32,20,.8)}
.slot.match{border-color:var(--good);box-shadow:0 0 10px rgba(95,227,154,.45)}
.slot:active{transform:scale(.9)}

/* action buttons */
.acts{display:flex;flex-direction:column;gap:7px;align-items:flex-end;pointer-events:none;
  margin-left:auto}
.actrow{display:flex;gap:7px;align-items:flex-end;pointer-events:auto}
.abtn{pointer-events:auto}
.abtn.drop{border-color:var(--pop);color:var(--pop);font-size:10px}
.abtn.dash{border-color:var(--grape);color:var(--grape);font-size:10px}
.abtn.dash.cool{opacity:.45}
.abtn{border-radius:50%;border:2px solid var(--edge);background:rgba(36,28,60,.9);
  color:var(--chalk);font-family:'Luckiest Guy',cursive;cursor:pointer;
  display:grid;place-items:center;line-height:1;transition:.1s;touch-action:manipulation;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);text-align:center}
.abtn.big{width:74px;height:74px;font-size:12px;letter-spacing:.02em}
.abtn.sm{width:56px;height:56px;font-size:11px}
.abtn.grab{border-color:var(--sun);color:var(--sun)}
.abtn.grab.handover{border-color:var(--good);color:var(--good);
  box-shadow:0 0 0 3px rgba(140,227,79,.20),0 8px 20px rgba(0,0,0,.45)}
.abtn.grab.hot{background:var(--sun);color:#2b1d00;box-shadow:0 0 18px rgba(255,207,61,.6)}
.abtn.fire{border-color:var(--sky);color:var(--sky)}
.abtn:active{transform:scale(.9)}
.abtn .n{display:block;font-family:'Roboto Mono',monospace;font-size:11px;opacity:.85}
.abtn[disabled]{opacity:.4}

/* toast */
.toasts{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:5;
  display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;
  width:min(88vw,460px)}
.toast{font-family:'Luckiest Guy',cursive;font-size:clamp(14px,4.2vw,19px);text-align:center;
  padding:7px 14px;border-radius:12px;background:rgba(20,16,31,.92);border:1.5px solid var(--edge);
  box-shadow:0 8px 22px rgba(0,0,0,.55);animation:tin .25s cubic-bezier(.2,1.4,.4,1);line-height:1.2}
.toast.bad{border-color:var(--hot);color:var(--hot)}
.toast.good{border-color:var(--good);color:var(--good)}
.toast.gold{border-color:var(--sun);color:var(--sun)}
@keyframes tin{from{opacity:0;transform:translateY(-10px) scale(.9)}to{opacity:1;transform:none}}
.toast.out{animation:tout .3s forwards}
@keyframes tout{to{opacity:0;transform:translateY(-12px) scale(.95)}}

/* ---------------- veil / screens ---------------- */
#veil{position:fixed;inset:0;z-index:10;display:grid;place-items:center;
  padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px));
  background:radial-gradient(120% 90% at 50% 0%,rgba(60,40,100,.9),rgba(10,8,18,.96));
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);overflow:auto}
#veil[hidden]{display:none}
.hud[hidden]{display:none}
#veil,.card,.scroll{touch-action:pan-y}
.card{width:min(560px,100%);background:linear-gradient(180deg,var(--panel),var(--void2));
  border:2px solid var(--edge);border-radius:20px;padding:18px 16px;
  box-shadow:0 18px 60px rgba(0,0,0,.6);max-height:100%;overflow:auto;
  -webkit-overflow-scrolling:touch}
.card h1{font-family:'Luckiest Guy',cursive;font-size:clamp(28px,9vw,50px);line-height:.95;
  text-align:center;letter-spacing:.5px;
  background:linear-gradient(180deg,var(--sun),var(--pop));-webkit-background-clip:text;
  background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
.card h2{font-family:'Luckiest Guy',cursive;font-size:clamp(20px,6vw,30px);line-height:1.05;
  text-align:center;color:var(--sun);margin-bottom:8px}
.tag{text-align:center;font-size:clamp(11px,3.4vw,14px);color:var(--dim);margin-bottom:14px;
  letter-spacing:.05em;line-height:1.35}
.small{font-size:clamp(11px,3.2vw,13px);line-height:1.45;color:var(--dim)}
.rowbtns{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.btn{font-family:'Luckiest Guy',cursive;font-size:clamp(14px,4.2vw,18px);letter-spacing:.03em;
  padding:12px 20px;min-height:48px;border-radius:14px;border:2px solid var(--edge);
  background:var(--void2);color:var(--chalk);cursor:pointer;transition:.13s;touch-action:manipulation}
.btn:hover,.btn:focus-visible{border-color:var(--sun);outline:none;transform:translateY(-1px)}
.btn:active{transform:scale(.96)}
.btn.go{background:linear-gradient(180deg,var(--sun),#ff9d2b);color:#2b1d00;border-color:#ffe08a}
.btn.ghost{background:transparent}
.speech{display:flex;gap:10px;align-items:flex-start;background:rgba(10,8,18,.5);
  border:1.5px solid var(--edge);border-radius:14px;padding:11px 12px;margin-bottom:12px}
.speech .face{font-size:34px;line-height:1;flex:0 0 auto}
.speech .txt{font-size:clamp(12px,3.5vw,15px);line-height:1.4}
.speech .txt b{color:var(--sun)}
.help{display:grid;gap:7px;margin:10px 0}
.help div{display:flex;gap:9px;align-items:flex-start;font-size:clamp(11px,3.2vw,13.5px);line-height:1.35}
.help .k{flex:0 0 auto;font-family:'Roboto Mono',monospace;font-size:11px;background:var(--void);
  border:1.5px solid var(--edge);border-radius:7px;padding:3px 7px;color:var(--sun);min-width:64px;text-align:center}

/* shop */
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:10px 0}
.item{border:1.5px solid var(--edge);border-radius:14px;padding:9px;background:rgba(10,8,18,.45);
  text-align:left;cursor:pointer;font-family:inherit;color:var(--chalk);transition:.12s;
  display:flex;flex-direction:column;gap:3px;min-height:96px;touch-action:manipulation}
.item:hover:not([disabled]){border-color:var(--sun);transform:translateY(-2px)}
.item:active:not([disabled]){transform:scale(.97)}
.item[disabled]{opacity:.42;cursor:default}
.item .ttl{font-family:'Luckiest Guy',cursive;font-size:14px;line-height:1.1;display:flex;gap:6px;align-items:center}
.item .ds{font-size:11px;color:var(--dim);line-height:1.3;flex:1}
.item .pr{font-family:'Roboto Mono',monospace;font-size:12px;font-weight:700;color:var(--sun)}
.item.owned .pr{color:var(--good)}
.shophead{display:flex;justify-content:space-between;align-items:center;gap:8px;
  border-bottom:1.5px solid var(--edge);padding-bottom:8px;margin-bottom:4px}
.shophead .bal{font-family:'Roboto Mono',monospace;font-size:clamp(15px,4.5vw,20px);color:var(--sun);font-weight:700}
.sect{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-top:10px}
.scroll{max-height:34vh;overflow:auto;-webkit-overflow-scrolling:touch;
  border:1.5px solid var(--edge);border-radius:12px;padding:9px;background:rgba(10,8,18,.45)}
.jail{font-size:clamp(11px,3.3vw,13.5px);line-height:1.5}
.jail b{color:var(--sun)}
.stat{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:3px 0;
  border-bottom:1px dashed rgba(255,255,255,.08)}
.stat b{font-family:'Roboto Mono',monospace;color:var(--sun)}
.hide{display:none!important}
@media (max-height:520px){ .card{padding:12px} .card h1{font-size:clamp(22px,7vw,34px)} .tag{margin-bottom:8px} }
</style>

<script>
"use strict";
/* ============================================================================
   THE CANE MUTINY  —  errands for a very demanding man
   One file. Canvas 2D. Touch + keyboard. No external assets (fonts only).
   ==========================================================================*/

/* ---------- tiny utils ---------- */
var TAU=Math.PI*2;
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,t){return a+(b-a)*t;}
function es(u){return u<0?0:u>1?1:u*u*(3-2*u);}   /* smoothstep, for the cane */
var SWING_T=.52, SW_UP=.30, SW_DN=.56;            /* windup / slam / settle */
function rnd(a,b){return a+Math.random()*(b-a);}
function rndi(a,b){return Math.floor(rnd(a,b+1));}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function dist2(ax,ay,bx,by){var dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;}
function dist(ax,ay,bx,by){return Math.sqrt(dist2(ax,ay,bx,by));}
function aabb(x,y,w,h){return {x:x,y:y,w:w,h:h};}
function inRect(px,py,r){return px>=r.x&&px<=r.x+r.w&&py>=r.y&&py<=r.y+r.h;}
function ease(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}

/* ---------- canvas ---------- */

var CW=0,CH=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2.5);
  CW=Math.max(1,cv.clientWidth||window.innerWidth);
  CH=Math.max(1,cv.clientHeight||window.innerHeight);
  var w=Math.round(CW*DPR), h=Math.round(CH*DPR);
  if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;}
}

/* A resize event is not enough. Loading in a background tab, inside a hidden
   container, or in an iframe that has not been laid out yet gives clientWidth 0 —
   and the canvas then stays 1x1 forever, because no resize event ever fires when
   it finally gets a size. Cheap to just check. */
function resizeIfNeeded(){
  if(cv.clientWidth!==CW||cv.clientHeight!==CH) resize();
}

var AU={ctx:null,on:LS.get('cm_snd')!=='0',ready:false};
function auInit(){
  if(AU.ctx) { if(AU.ctx.state==='suspended'){try{AU.ctx.resume();}catch(e){}} return; }
  try{
    var C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    AU.ctx=new C(); AU.ready=true;
    if(AU.ctx.state==='suspended'){try{AU.ctx.resume();}catch(e){}}
  }catch(e){AU.ctx=null;}
}
function beep(freq,dur,type,vol,slideTo){
  if(!AU.on||!AU.ctx) return;
  try{
    var t=AU.ctx.currentTime, o=AU.ctx.createOscillator(), g=AU.ctx.createGain();
    o.type=type||'square'; o.frequency.setValueAtTime(freq,t);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30,slideTo),t+dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(Math.max(.0002,(vol==null?.16:vol)),t+.012);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(AU.ctx.destination); o.start(t); o.stop(t+dur+.03);
  }catch(e){}
}
function noise(dur,vol){
  if(!AU.on||!AU.ctx) return;
  try{
    var n=Math.floor(AU.ctx.sampleRate*dur), b=AU.ctx.createBuffer(1,n,AU.ctx.sampleRate), d=b.getChannelData(0);
    for(var i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    var s=AU.ctx.createBufferSource(); s.buffer=b;
    var g=AU.ctx.createGain(); g.gain.value=vol==null?.14:vol;
    s.connect(g); g.connect(AU.ctx.destination); s.start();
  }catch(e){}
}

  grab:false, grabEdge:false,
  fire:false, fireEdge:false,

window.addEventListener('keydown',function(e){
  var k=(e.key||'').toLowerCase(); if(!k) return;
  if(['arrowup','arrowdown','arrowleft','arrowright',' ','tab'].indexOf(k)>=0) e.preventDefault();
  if(IN.keys[k]) return; IN.keys[k]=true;
  if(k===' '||k==='e') IN.grabEdge=true;
  if(k==='j'||k==='f'||k==='enter') IN.fireEdge=true;
  if(k==='shift') IN.dashEdge=true;
  if(k==='p'||k==='escape') togglePause();
  if(SCENE==='play'&&P){
    if(k==='q') cycleWeapon();
    if(k>='1'&&k<='6') dropSlot(parseInt(k,10)-1);
  }
  auInit();
});
window.addEventListener('keyup',function(e){ IN.keys[(e.key||'').toLowerCase()]=false; });
window.addEventListener('blur',function(){ IN.keys={}; IN.touch=null; IN.pts={}; IN.ax=IN.ay=0; });

function readKeys(){
  var x=0,y=0,K=IN.keys;
  if(K['a']||K['arrowleft']) x-=1;
  if(K['d']||K['arrowright']) x+=1;
  if(K['w']||K['arrowup']) y-=1;
  if(K['s']||K['arrowdown']) y+=1;
  if(x||y){ var m=Math.hypot(x,y); IN.ax=x/m; IN.ay=y/m; }
  else if(!readSteer()){ IN.ax=0; IN.ay=0; }
  IN.grab=!!(K[' ']||K['e']);
  IN.fire=!!(K['j']||K['f']||K['enter']);
}

/* Steering: the character walks toward your finger, from anywhere on the screen.
   This replaces a floating thumbstick confined to the left 45%, which was
   invisible until you already had a thumb on it -- you had to know it was there.
   Same "it just goes where I point" feel as Star Wrecker's ship. The direction is
   recomputed every frame in readSteer(), because the character and the camera both
   keep moving under a finger that is holding perfectly still. */
var STEER_FULL=72;   /* finger this far from her = full speed */
var STEER_DEAD=13;   /* this close = stand still, so a tap does not jitter her */
cv.addEventListener('pointerdown',function(e){
  auInit();
  /* Capture is a nicety -- it keeps a finger that slides off the canvas still
     steering. It must never be able to take movement down with it, so it goes
     after the state it would otherwise skip, in its own try. */
  IN.pts[e.pointerId]={x:e.clientX,y:e.clientY};
  IN.touch={id:e.pointerId,x:e.clientX,y:e.clientY};
  try{ cv.setPointerCapture&&cv.setPointerCapture(e.pointerId); }catch(err){}
  e.preventDefault();
},{passive:false});
cv.addEventListener('pointermove',function(e){
  var pt=IN.pts[e.pointerId]; if(!pt) return;
  pt.x=e.clientX; pt.y=e.clientY;
  if(IN.touch&&IN.touch.id===e.pointerId){ IN.touch.x=e.clientX; IN.touch.y=e.clientY; }
  e.preventDefault();
},{passive:false});
/* Every finger on the glass is tracked, not just the newest. A kid steering with
   her thumb and missing the GRAB button with her other hand used to orphan the
   thumb that was actually driving -- she froze mid-chase with her finger still
   down, which reads as the game hanging. Steering hands back to whichever finger
   is still there. */
function endStick(e){
  delete IN.pts[e.pointerId];
  if(IN.touch&&IN.touch.id===e.pointerId){
    IN.touch=null;
    for(var id in IN.pts){ IN.touch={id:+id,x:IN.pts[id].x,y:IN.pts[id].y}; break; }
    if(!IN.touch){ IN.ax=0; IN.ay=0; }
  }
}
cv.addEventListener('pointerup',endStick);
cv.addEventListener('pointercancel',endStick);
/* Screen space, not world space, so it matches exactly what she sees. The render
   transform is (world - CAM) * CAM.sc, so that inverts to this. */
function readSteer(){
  if(!IN.touch||!W||!P) return false;
  var px=(P.x-CAM.x)*CAM.sc, py=(P.y-CAM.y)*CAM.sc;
  var dx=IN.touch.x-px, dy=IN.touch.y-py, m=Math.hypot(dx,dy);
  if(!(m>STEER_DEAD)){ IN.ax=0; IN.ay=0; return true; }
  var t=Math.min(1,(m-STEER_DEAD)/(STEER_FULL-STEER_DEAD));
  IN.ax=(dx/m)*t; IN.ay=(dy/m)*t;
  return true;
}
cv.addEventListener('contextmenu',function(e){e.preventDefault();});

function bindBtn(el,down,up){
  if(!el) return;
  el.addEventListener('pointerdown',function(e){e.preventDefault();auInit();down&&down();},{passive:false});
  el.addEventListener('pointerup',function(e){e.preventDefault();up&&up();},{passive:false});
  el.addEventListener('pointercancel',function(){up&&up();});
  el.addEventListener('pointerleave',function(){up&&up();});
}

/* ============================================================================
   WORLD BUILDING
   ==========================================================================*/
function blankWorld(w,h){
  return {w:w,h:h,walls:[],decor:[],shelves:[],spots:[],foes:[],seniors:[],shots:[],
    pickups:[],boxes:[],hazards:[],cats:[],puddles:[],parts:[],
    gerald:null,goal:null,time:0,done:false,scroll:0};
}

/* How many of each item any single order can ask for. Orders like "two lemons"
   are unfillable if the shelves are stocked at random, so stock deliberately:
   every item at least once, and the doubles at least twice, before any filler. */
var NEEDMAX=(function(){
  var m={};
  for(var o=0;o<ORDERS.length;o++){
    var c={};
    for(var i=0;i<ORDERS[o].i.length;i++){ var id=ORDERS[o].i[i]; c[id]=(c[id]||0)+1; }
    for(var k in c) if(!m[k]||c[k]>m[k]) m[k]=c[k];
  }
  return m;
})();
function stockList(slots){
  var out=[];
  for(var i=0;i<ITEMS.length;i++){
    var id=ITEMS[i].id, n=Math.max(1,NEEDMAX[id]||0);
    for(var j=0;j<n;j++) out.push(id);
  }
  /* whatever room is left goes to extra copies of things Gerald actually wants,
     so the aisles feel stocked and you are not sprinting the whole map */
  var wanted=Object.keys(NEEDMAX);
  while(out.length<slots) out.push(wanted.length?pick(wanted):pick(ITEMS).id);
  if(out.length>slots) out.length=slots;
  return shuffle(out);
}

/* ---- SUPERMARKET ---------------------------------------------------------*/
function buildStore(){
  var w=1240,h=960, W2=blankWorld(w,h);
  var T=26;
  W2.walls.push(aabb(0,0,w,T),aabb(0,h-T,w,T),aabb(0,0,T,h),aabb(w-T,0,T,h));

  /* Gerald waits at the curb: a bright zone across the bottom-left. */
  W2.gerald={x:150,y:h-92,r:20,bob:0,mad:0};
  /* Roomy on purpose: this is where a 10-year-old stands to hand over a bag. */
  W2.goal=aabb(52,h-176,268,142);

  /* Aisles: 4 columns x 2 blocks. Each shelf carries item spots on both faces. */
  var cols=4, rows=2, perShelf=8;
  var sw=54, sh=300;
  var x0=250, y0=110, gx=(w-x0-90)/cols, gy=360;
  var pool=stockList(cols*rows*perShelf);
  var si=0;
  for(var c=0;c<cols;c++){
    for(var r=0;r<rows;r++){
      var sx=x0+c*gx, sy=y0+r*gy;
      var sr=aabb(sx,sy,sw,sh);
      W2.walls.push(sr); W2.shelves.push(sr);
      /* eight item spots, four per side */
      for(var k=0;k<perShelf;k++){
        var side=k<4?-1:1;
        var it=ITEM[pool[si++]];
        W2.spots.push({
          x:sx+(side<0?-16:sw+16), y:sy+34+ (k%4)*((sh-68)/3),
          id:it.id, e:it.e, n:it.n, cool:0, side:side
        });
      }
    }
  }
  /* Mystery boxes tucked in the corners and dead ends. */
  var spotsB=[[w-90,80],[w-90,h-90],[90,80],[x0-60,h-90],[w/2,h-70],[w-140,h/2]];
  shuffle(spotsB);
  for(var b=0;b<4;b++) W2.boxes.push({x:spotsB[b][0],y:spotsB[b][1],r:16,open:false,t:0});

  /* Two treats, parked in opposite corners like power pellets should be. */
  var pel=[[w-90,120],[110,140],[w-110,h-150],[w/2,h-80]];
  shuffle(pel);
  for(var pI=0;pI<2;pI++){
    var tr=pick(TREATS);
    W2.pickups.push({t:'pellet',x:pel[pI][0],y:pel[pI][1],r:20,bob:rnd(0,6),e:tr.e,cry:tr.cry});
  }

  /* decor: freezer humming at the top, checkout lanes at the bottom */
  W2.decor.push({t:'sign',x:w/2,y:56,txt:'GRUMBLE-MART'});
  return W2;
}

/* ---- ESCAPE CORRIDOR -----------------------------------------------------*/
function buildEscape(){
  /* Tall enough that a phone screen is not letterboxed top and bottom. */
  var len=2300+ROUND*260, h=900, W2=blankWorld(len,h);
  var T=26;
  W2.walls.push(aabb(0,0,len,T),aabb(0,h-T,len,T),aabb(0,0,T,h));
  W2.goal=aabb(len-120,T,94,h-T*2);
  W2.decor.push({t:'exit',r:W2.goal});

  /* Blocks to weave around, plus timed hazards. Density rises with the round. */
  var x=300;
  var n=0;
  while(x<len-320){
    var kind=rndi(0,4);
    if(kind===0){ /* pillars */
      var py=rndi(90,h-150);
      var r=aabb(x,py,44,120); W2.walls.push(r); W2.decor.push({t:'crate',r:r});
      var r2=aabb(x,py>h/2?60:h-200,44,120); W2.walls.push(r2); W2.decor.push({t:'crate',r:r2});
    } else if(kind===1){ /* runaway shopping cart sliding vertically */
      W2.hazards.push({t:'cart',x:x+20,y:rnd(90,h-90),vy:rnd(90,140)*(Math.random()<.5?-1:1),r:20,dmg:1});
    } else if(kind===2){ /* sprinkler columns on a timer */
      W2.hazards.push({t:'jet',x:x+20,y:h/2,ph:rnd(0,2),per:2.4-Math.min(.9,ROUND*.07),on:false,r:22,dmg:1});
    } else if(kind===3){ /* mop-slick: no damage, just no grip */
      W2.puddles.push({x:x+40,y:rnd(120,h-120),r:rnd(48,74),t:999,slip:true});
    } else { /* bingo cannon */
      W2.hazards.push({t:'cannon',x:x+20,y:rnd(90,h-90),cd:rnd(0,1.4),per:Math.max(.85,1.8-ROUND*.09),r:14,dmg:1});
    }
    /* coins to make the greedy line differ from the safe line */
    for(var c=0;c<3;c++) W2.pickups.push({t:'coin',x:x+rnd(-40,90),y:rnd(70,h-70),r:11,v:rndi(3,7),bob:rnd(0,6)});
    x+=rndi(230,330); n++;
  }
  /* a couple of shambling cops so standing still is never the answer */
  var ncop=Math.min(5,1+Math.floor(ROUND/2));
  for(var i2=0;i2<ncop;i2++) W2.foes.push(makeFoe('zomcop',rnd(500,len-400),rnd(90,h-90)));
  return W2;
}

function makeFoe(t,x,y){
  var f={t:t,x:x,y:y,vx:0,vy:0,r:15,stun:0,hp:1,ang:rnd(0,TAU),walk:0,
         see:0,cd:0,wp:null,target:null,hitcd:0};
  if(t==='zomcop'){ f.spd=52; f.r=16; }
  if(t==='guard'){ f.spd=74; f.r=16; f.vis=210; f.cone=0.85; f.cd=rnd(.4,1.4); }
  if(t==='nurse'){ f.spd=96; f.r=15; f.vis=180; f.cone=1.0; f.cd=rnd(.6,1.6); }
  f.spd*=DIFF.foeSpd; f.cd*=DIFF.foeCd;
  return f;
}
function patrolFor(f,world){
  f.wp={x:clamp(f.x+rnd(-320,320),60,world.w-60), y:clamp(f.y+rnd(-320,320),60,world.h-60)};
}

function musPlay(name){
  if(MUS.name===name) return;
  MUS.name=name; MUS.trk=TRACKS[name]||null; MUS.step=0;
  MUS.next=(AU.ctx?AU.ctx.currentTime:0)+.05;
}
function musStop(){ MUS.name=''; MUS.trk=null; }
function musTick(){
  if(!AU.ctx||!MUS.trk) return;
  var bus=musBus(); if(!bus) return;
  var target=(MUS.on&&AU.on)?1:0;
  try{ bus.gain.setTargetAtTime(target,AU.ctx.currentTime,.08); }catch(e){ bus.gain.value=target; }
  if(!target){ MUS.next=AU.ctx.currentTime+.05; return; }
  var t=MUS.trk, spb=60/t.bpm/t.div;
  var now=AU.ctx.currentTime, horizon=now+.18;
  var guard=0;
  if(MUS.next<now) MUS.next=now;
  while(MUS.next<horizon && guard++<48){
    var s=MUS.step%t.len, when=MUS.next;
    for(var v=0;v<t.voices.length;v++){
      var vo=t.voices[v], n=vo.notes[s];
      if(!n||n<0) continue;
      musNote(bus,mtof(n),when,spb*(vo.hold||3.2),vo.type,vo.vol,vo.detune||0);
    }
    if(t.drum){ musDrum(bus,t.drum.charAt(s),when); }
    MUS.step++; MUS.next+=spb;
  }
}
function musNote(bus,f,when,dur,type,vol,det){
  try{
    var o=AU.ctx.createOscillator(), g=AU.ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(f,when);
    if(det) o.detune.setValueAtTime(det,when);
    g.gain.setValueAtTime(.0001,when);
    g.gain.exponentialRampToValueAtTime(vol,when+.02);
    g.gain.exponentialRampToValueAtTime(.0001,when+dur);
    o.connect(g); g.connect(bus); o.start(when); o.stop(when+dur+.05);
  }catch(e){}
}
function musDrum(bus,ch,when){
  if(ch==='.'||!ch) return;
  try{
    if(ch==='k'){
      var o=AU.ctx.createOscillator(), g=AU.ctx.createGain();
      o.type='sine'; o.frequency.setValueAtTime(150,when);
      o.frequency.exponentialRampToValueAtTime(45,when+.11);
      g.gain.setValueAtTime(.22,when); g.gain.exponentialRampToValueAtTime(.0001,when+.14);
      o.connect(g); g.connect(bus); o.start(when); o.stop(when+.18);
    } else {
      var dur=(ch==='s')?.10:.035, vol=(ch==='s')?.10:.045;
      var n=Math.floor(AU.ctx.sampleRate*dur), b=AU.ctx.createBuffer(1,n,AU.ctx.sampleRate), d=b.getChannelData(0);
      for(var i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
      var src=AU.ctx.createBufferSource(); src.buffer=b;
      var hp=AU.ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=(ch==='s')?1200:6000;
      var gg=AU.ctx.createGain(); gg.gain.value=vol;
      src.connect(hp); hp.connect(gg); gg.connect(bus); src.start(when);
    }
  }catch(e){}
}
function musForScene(){
  if(!AU.ctx) return;
  if(SCENE==='play') musPlay(PHASE==='store'?'store':(PHASE==='home'?'home':'escape'));
  else if(SCENE==='shop') musPlay('shop');
  else if(SCENE==='over') musPlay('jail');
  else musPlay('menu');
}

/* ============================================================================
   PHASE SETUP
   ==========================================================================*/
var ORDER=null;   /* {items:[ids], got:[bool], rant:'', idx:n, total:n} */
var PATIENCE=1, PATMAX=1;

function ordersThisRound(){ return Math.min(5,1+Math.ceil(ROUND/1.6)); }
/* Round 1 is somebody's first 60 seconds with this game: it still needs a guard to
   dodge and a pellet worth grabbing, or there is nothing to come back for. */
function copsThisRound(){ return Math.max(1,Math.min(4,Math.floor(ROUND/2)+1)); }
function guardsThisRound(){ return Math.max(1,Math.min(3,Math.floor((ROUND-1)/2)+1)); }
function seniorsThisRound(){ return Math.min(8,2+Math.floor(ROUND*.9)); }

/* True while Gerald's order is on screen and the world is held still, so the
   pause key cannot fight it for the veil. */
var ORDER_MODAL=false;
function orderPopup(){
  if(!ORDER) return;
  ORDER_MODAL=true; paused=true;
  SFX.ping();
  var li='';
  for(var i=0;i<ORDER.items.length;i++){
    var it=ITEM[ORDER.items[i]];
    li+='<li><span class="em">'+it.e+'</span>'+it.n+'</li>';
  }
  showVeil('<h2>&#128241; New order</h2>'+
    '<div class="speech"><div class="face">&#128116;</div><div class="txt"><b>GERALD:</b> &ldquo;'+
    ORDER.rant+'&rdquo;</div></div>'+
    '<ul class="olist">'+li+'</ul>'+
    '<p class="small">Tap &#128241; up top any time you forget.</p>'+
    '<div class="rowbtns"><button class="btn go" id="oOk">GOT IT</button></div>');
  on('oOk',function(){
    ORDER_MODAL=false; hideVeil(); paused=false;
    elOrder.classList.remove('open');   /* she just read it; leave Gerald in the clear */
  });
}
function toggleList(){
  if(PHASE!=='store'||!ORDER) return;
  elOrder.classList.toggle('open');
}
function syncListBadge(){
  var b=$('listN'); if(!b) return;
  if(PHASE!=='store'||!ORDER){ b.textContent=''; return; }
  var left=0;
  for(var i=0;i<ORDER.got.length;i++) if(!ORDER.got[i]) left++;
  b.textContent=left?String(left):'';
}
function newOrder(){
  /* Weight toward short orders early, longer ones later. */
  var maxLen = ROUND<4?2:3;
  var pool=ORDERS.filter(function(o){return o.i.length<=maxLen;});
  if(!pool.length) pool=ORDERS;
  var o=pick(pool);
  ORDER={items:o.i.slice(),got:o.i.map(function(){return false;}),rant:o.r};
  PATMAX=Math.max(24, 46 - ROUND*2.2 + o.i.length*11)*DIFF.patience;
  PATIENCE=PATMAX;
  renderOrder();
  orderPopup();
}

function startPhase(ph){
  PHASE=ph; paused=false; GEN++;
  if(ph==='store'){ W=buildStore(); P.x=190; P.y=W.h-105; W.left=ordersThisRound(); newOrder();
    var nz=copsThisRound();
    for(var i=0;i<nz;i++) W.foes.push(makeFoe('zomcop',rnd(500,W.w-120),rnd(120,W.h-220)));
    var ng=guardsThisRound();
    for(var g=0;g<ng;g++){ var f=makeFoe('guard',rnd(600,W.w-120),rnd(120,W.h-160)); patrolFor(f,W); W.foes.push(f); }
  }
  if(ph==='home'){ W=buildHome(); P.x=140; P.y=W.h-140;
    var ns=seniorsThisRound();
    /* Gerald packs you a bag. Without this you can arrive with no lures and no
       way to earn any, and the phase simply never ends. */
    P.ammo.candy=Math.max(P.ammo.candy,ns+3);
    P.ammo.cake=Math.max(P.ammo.cake,ns+3);
    for(var s=0;s<ns;s++) W.seniors.push(makeSenior(W));
    W.left=ns;
    var ng2=Math.max(1,Math.round(Math.min(5,2+Math.floor(ROUND*.7))*DIFF.foes));
    for(var g2=0;g2<ng2;g2++){ var f2=makeFoe(Math.random()<.35?'nurse':'guard',rnd(300,W.w-200),rnd(120,W.h-160)); patrolFor(f2,W); W.foes.push(f2); }
  }
  if(ph==='escape'){ W=buildEscape(); P.x=90; P.y=W.h/2; W.left=1; }
  P.vx=P.vy=0; P.followers=[]; P.trail=[]; P.iframe=1.2;
  CAM.sc=viewScale();
  CAM.x=clamp(P.x-CW/CAM.sc/2,0,Math.max(0,W.w-CW/CAM.sc));
  CAM.y=clamp(P.y-CH/CAM.sc/2,0,Math.max(0,W.h-CH/CAM.sc));
  if(P.up.lid) P.shield=Math.max(P.shield,1);
  syncHud(); renderOrder(); musForScene();
}

function makeSenior(world){
  /* Sorting out WHICH snack each resident wants is a second puzzle on top of
     steering a conga line, and it is the one that stops a beginner cold. Below
     the top two levels, everyone simply wants candy. The variety is what the
     slider buys you. */
  var opts=[];
  if(DIFF.wants==='candy') opts=['candy'];
  else for(var lw in LURES) if(!P||P.wep[lw]) opts.push(lw);
  if(!opts.length) opts=['candy'];
  var s={x:0,y:0,vx:0,vy:0,r:17,st:'wander',name:pick(SENIOR_NAMES),
         want:pick(opts),wp:null,eat:0,say:0,txt:'',
         freed:false,ang:rnd(0,TAU),wob:rnd(0,TAU),lure:null,idx:0,
         /* so no two of them are the same person */
         hair:pick(['bun','bald','wave']), cardi:pick(CARDIS),
         cart:pick(CARTS), specs:Math.random()<.78};
  /* spawn away from the gate and away from walls */
  for(var tries=0;tries<80;tries++){
    s.x=rnd(180,world.w-320); s.y=rnd(120,world.h-120);
    if(!hitsWall(s.x,s.y,s.r+8,world)) break;
  }
  return s;
}

/* ============================================================================
   COLLISION
   ==========================================================================*/
function hitsWall(x,y,r,world){
  for(var i=0;i<world.walls.length;i++){
    var w=world.walls[i];
    var cx=clamp(x,w.x,w.x+w.w), cy=clamp(y,w.y,w.y+w.h);
    if(dist2(x,y,cx,cy)<r*r) return w;
  }
  return null;
}
/* Move with axis separation so sliding along a shelf feels right. */
function moveEnt(e,dx,dy,world){
  var nx=e.x+dx;
  if(!hitsWall(nx,e.y,e.r,world)) e.x=nx;
  else { /* nudge out */
    var step=dx>0?-1:1;
    for(var i=0;i<6;i++){ if(!hitsWall(e.x,e.y,e.r,world)) break; e.x+=step; }
  }
  var ny=e.y+dy;
  if(!hitsWall(e.x,ny,e.r,world)) e.y=ny;
  else {
    var step2=dy>0?-1:1;
    for(var j=0;j<6;j++){ if(!hitsWall(e.x,e.y,e.r,world)) break; e.y+=step2; }
  }
  e.x=clamp(e.x,e.r,world.w-e.r); e.y=clamp(e.y,e.r,world.h-e.r);
}
/* Line of sight for guards: sample the segment against walls. */
function canSee(ax,ay,bx,by,world){
  var d=dist(ax,ay,bx,by); if(d<1) return true;
  var steps=Math.min(28,Math.ceil(d/26));
  for(var i=1;i<steps;i++){
    var t=i/steps, x=lerp(ax,bx,t), y=lerp(ay,by,t);
    for(var w=0;w<world.walls.length;w++){ if(inRect(x,y,world.walls[w])) return false; }
  }
  return true;
}

/* ============================================================================
   PLAYER
   ==========================================================================*/
function hurtPlayer(n,why){
  if(P.iframe>0) return false;
  if(P.shield>0){ P.shield--; P.iframe=1.0; toast('SHIELD HELD!','good'); SFX.hurt();
    shake(6); syncHud(); return false; }
  P.hp-=n; P.iframe=1.15; shake(11); SFX.hurt(); flash(.5);
  STATS.hits++;
  /* Panic: half the conga line wanders off. */
  if(P.followers.length){
    var lose=Math.ceil(P.followers.length/2);
    for(var i=0;i<lose;i++){ var s=P.followers.pop(); if(s){ s.st='wander'; s.wp=null; s.say=1.6; s.txt='WHAT WAS THAT'; } }
  }
  if(why) toast(why,'bad');
  syncHud();
  if(P.hp<=0){ gameOver(); return true; }
  return true;
}

function updatePlayer(dt){
  readKeys();
  var sp=baseSpeed();
  /* slick floors: you keep your momentum whether you like it or not */
  var slick=false;
  for(var i=0;i<W.puddles.length;i++){
    var pd=W.puddles[i];
    if(dist2(P.x,P.y,pd.x,pd.y)<pd.r*pd.r){ slick=true; break; }
  }
  var tx=IN.ax*sp, ty=IN.ay*sp;
  var acc=slick?3.0:16.0;
  P.vx=lerp(P.vx,tx,Math.min(1,acc*dt));
  P.vy=lerp(P.vy,ty,Math.min(1,acc*dt));

  if(P.dashing>0){
    P.dashing-=dt; P.iframe=Math.max(P.iframe,.08);
    P.vx=P.dvx; P.vy=P.dvy;
  }
  moveEnt(P,P.vx*dt,P.vy*dt,W);

  var mv=Math.hypot(P.vx,P.vy);
  if(mv>16){ P.face=P.vx<-6?-1:(P.vx>6?1:P.face); P.walk+=dt*mv*.045;
    P.aimx=P.vx/mv; P.aimy=P.vy/mv;
  }
  /* Trail for the conga line. Sampled by DISTANCE, not per frame: per frame meant
     the line was twice as long in Low Power Mode and the tail left the screen. */
  var lt=P.trail[P.trail.length-1];
  if(!lt||dist2(lt.x,lt.y,P.x,P.y)>36) P.trail.push({x:P.x,y:P.y});
  if(P.trail.length>300) P.trail.shift();

  if(P.iframe>0) P.iframe-=dt;
  if(P.dashcd>0) P.dashcd-=dt;
  for(var b in P.buff){ if(P.buff[b]>0) P.buff[b]-=dt; }

  /* magnet buff sucks in loose coins */
  if(P.buff.magnet>0){
    for(var q=0;q<W.pickups.length;q++){
      var pu=W.pickups[q], d=dist(P.x,P.y,pu.x,pu.y);
      if(d<200&&d>1){ pu.x+=(P.x-pu.x)/d*260*dt; pu.y+=(P.y-pu.y)/d*260*dt; }
    }
  }
  /* pick up coins */
  for(var c=W.pickups.length-1;c>=0;c--){
    var k=W.pickups[c];
    if(dist2(P.x,P.y,k.x,k.y)<(P.r+k.r)*(P.r+k.r)){
      if(k.t==='coin'){ addCoins(k.v); SFX.coin(); pop(k.x,k.y,'+'+k.v,'#ffcf3d'); }
      else if(k.t==='pellet'){ startRampage(20,k); pop(k.x,k.y,k.e,'#8ce34f'); }
      W.pickups.splice(c,1);
    }
  }
  /* mystery boxes */
  for(var bx=0;bx<W.boxes.length;bx++){
    var bo=W.boxes[bx];
    if(!bo.open&&dist2(P.x,P.y,bo.x,bo.y)<(P.r+bo.r)*(P.r+bo.r)){
      bo.open=true; var pw=pick(BOXES); pw.go(); SFX.power();
      toast(pw.e+' '+pw.t,'gold'); pop(bo.x,bo.y,pw.e,'#8ce34f'); burst(bo.x,bo.y,'#ffcf3d',16);
      STATS.boxes++; syncHud();
    }
  }
  /* actions */
  if(IN.grabEdge){ IN.grabEdge=false; doGrab(); }
  if(IN.fireEdge){ IN.fireEdge=false; doThrow(); }
  if(IN.dashEdge){ IN.dashEdge=false; doDash(); }
}

function doDash(){
  if(!P.up.dash||P.dashcd>0) return;
  var m=Math.hypot(IN.ax,IN.ay);
  var ax=m>.1?IN.ax/m:P.aimx, ay=m>.1?IN.ay/m:P.aimy;
  P.dvx=ax*520; P.dvy=ay*520; P.dashing=.19; P.dashcd=1.1;
  SFX.throw(); burst(P.x,P.y,'#4bc8ff',10);
}

/* ============================================================================
   RAMPAGE — the Pac-Man beat. Grab an expired energy drink and for a while the
   guards are the ones running. Touch one and he is ejected from the premises.
   ==========================================================================*/
function startRampage(sec,treat){
  P.buff.rampage=sec; P.rampMax=sec; P.rampChain=0;
  for(var i=0;i<W.foes.length;i++){ W.foes[i].panic=.35; }
  SFX.power();
  var e=treat?treat.e:'🥤', cry=treat?treat.cry:'SUGAR RUSH!';
  toast(e+' '+cry+' — GET THEM','gold');
  flash(.35,'#8ce34f'); shake(6);
  burst(P.x,P.y,'#8ce34f',20);
}
function ejectFoe(f){
  f.ejected=1; f.ang=rnd(0,TAU);
  var d=Math.max(1,dist(P.x,P.y,f.x,f.y));
  f.evx=(f.x-P.x)/d*640; f.evy=(f.y-P.y)/d*640-260; f.espin=rnd(-14,14);
  P.rampChain=(P.rampChain||0)+1;
  var val=10*Math.pow(2,Math.min(3,P.rampChain-1));
  addCoins(val); STATS.ejected++;
  pop(f.x,f.y,'+'+val,'#8ce34f');
  burst(f.x,f.y,'#4bc8ff',18);
  SFX.free();
  if(P.rampChain>=4) toast('EJECTED x'+P.rampChain+'!','good');
  /* he comes back, eventually, from the far side, and he is upset */
  f.respawn=9;
}

/* ============================================================================
   ENEMIES
   ==========================================================================*/
function updateFoes(dt){
  var slow=(P.buff.slowfoes>0)?.45:1;
  var ramp=P.buff.rampage>0;
  for(var i=W.foes.length-1;i>=0;i--){
    var f=W.foes[i];

    if(f.ejected){
      f.ejected+=dt; f.x+=f.evx*dt; f.y+=f.evy*dt; f.evy+=900*dt; f.ang+=f.espin*dt;
      if(f.ejected>1.3){
        if(f.respawn>0){ /* park him off-grid until his timer is up */ f.parked=(f.parked||0)+dt; }
        if((f.parked||0)>f.respawn){
          f.ejected=0; f.parked=0; f.stun=0;
          f.x=W.w-80; f.y=rnd(80,W.h-80); if(hitsWall(f.x,f.y,f.r,W)){f.x=W.w/2;f.y=60;}
          patrolFor(f,W);
        }
      }
      continue;
    }
    if(f.stun>0){ f.stun-=dt; f.walk+=dt*4; continue; }
    if(f.hitcd>0) f.hitcd-=dt;
    if(f.panic>0) f.panic-=dt;

    var d=dist(f.x,f.y,P.x,P.y);
    var spd=f.spd*slow;

    if(ramp){
      /* run away, badly */
      var ax=f.x-P.x, ay=f.y-P.y, m=Math.max(1,Math.hypot(ax,ay));
      var wob=Math.sin(W.time*7+i)*0.5;
      var dirx=ax/m*Math.cos(wob)-ay/m*Math.sin(wob);
      var diry=ax/m*Math.sin(wob)+ay/m*Math.cos(wob);
      moveEnt(f,dirx*spd*.92*dt,diry*spd*.92*dt,W);
      f.walk+=dt*7;
      if(d<P.r+f.r){ ejectFoe(f); }
      continue;
    }

    if(f.t==='zomcop'){
      /* shambles straight at you, forever, slowly, like a bad mood */
      var m2=Math.max(1,d);
      var wob2=Math.sin(W.time*2.2+i*1.7)*.35;
      var vx=(P.x-f.x)/m2, vy=(P.y-f.y)/m2;
      var rx=vx*Math.cos(wob2)-vy*Math.sin(wob2), ry=vx*Math.sin(wob2)+vy*Math.cos(wob2);
      var ox=f.x, oy=f.y;
      moveEnt(f,rx*spd*dt,ry*spd*dt,W); f.walk+=dt*5;
      f.jam=(dist2(ox,oy,f.x,f.y)<0.4)?(f.jam||0)+dt:0;
      if(f.jam>0.7){ moveEnt(f,-ry*spd*dt*1.6,rx*spd*dt*1.6,W); if(f.jam>2.2) f.jam=0; }
      if(d<P.r+f.r-2&&f.hitcd<=0){ if(hurtPlayer(1,'A ZOMBIE COP TOUCHED YOU. GROSS.')) f.hitcd=1.2; }
    }
    else { /* guard / nurse: patrol, notice, then taser */
      var seeing=false;
      var noticeAt=(P.up.shirt?0.9:0.45);
      if(d<f.vis&&canSee(f.x,f.y,P.x,P.y,W)){
        var ang=Math.atan2(P.y-f.y,P.x-f.x);
        var da=Math.abs(((ang-f.ang+Math.PI*3)%TAU)-Math.PI);
        if(da<f.cone||d<70) seeing=true;
      }
      if(seeing){ f.see=Math.min(1.4,f.see+dt); } else { f.see=Math.max(0,f.see-dt*.7); }

      if(f.see>noticeAt){
        var m3=Math.max(1,d);
        f.ang=Math.atan2(P.y-f.y,P.x-f.x);
        if(d>150) moveEnt(f,(P.x-f.x)/m3*spd*dt,(P.y-f.y)/m3*spd*dt,W);
        else if(d<105) moveEnt(f,-(P.x-f.x)/m3*spd*.5*dt,-(P.y-f.y)/m3*spd*.5*dt,W);
        f.walk+=dt*6;
        f.cd-=dt;
        if(f.cd<=0&&canSee(f.x,f.y,P.x,P.y,W)){
          f.cd=Math.max(.75,1.9-ROUND*.09)*DIFF.foeCd;
          W.shots.push({t:'taser',x:f.x,y:f.y,vx:Math.cos(f.ang)*330,vy:Math.sin(f.ang)*330,r:6,life:1.5,foe:true});
          SFX.taser();
          /* a spark off the muzzle, and he announces himself, because he would */
          burst(f.x+Math.cos(f.ang)*15,f.y+Math.sin(f.ang)*15,'#9fe8ff',5);
          if(Math.random()<.55) pop(f.x,f.y-40,pick(TASER_BARKS),'#9fe8ff');
        }
      } else {
        if(!f.wp||dist2(f.x,f.y,f.wp.x,f.wp.y)<900) patrolFor(f,W);
        var mx=f.wp.x-f.x, my=f.wp.y-f.y, mm=Math.max(1,Math.hypot(mx,my));
        f.ang=lerpAngle(f.ang,Math.atan2(my,mx),Math.min(1,dt*3));
        moveEnt(f,mx/mm*spd*.55*dt,my/mm*spd*.55*dt,W); f.walk+=dt*3.4;
      }
      if(d<P.r+f.r-2&&f.hitcd<=0){ if(hurtPlayer(1,'TASED. SMELLS LIKE PENNIES.')) f.hitcd=1.4; }
    }
  }
}
function lerpAngle(a,b,t){
  var d=((b-a+Math.PI*3)%TAU)-Math.PI;
  return a+d*t;
}

/* the cats summoned by cat food: they pick a guard and become his problem */
function updateCats(dt){
  for(var i=W.cats.length-1;i>=0;i--){
    var c=W.cats[i]; c.life-=dt;
    if(c.life<=0){ W.cats.splice(i,1); continue; }
    if(!c.tgt||c.tgt.ejected||c.tgt.stun>0){
      c.tgt=null; var best=1e9;
      for(var j=0;j<W.foes.length;j++){ var f=W.foes[j]; if(f.ejected) continue;
        var d=dist2(c.x,c.y,f.x,f.y); if(d<best){best=d;c.tgt=f;} }
    }
    if(c.tgt){
      var dx=c.tgt.x-c.x, dy=c.tgt.y-c.y, m=Math.max(1,Math.hypot(dx,dy));
      moveEnt(c,dx/m*150*dt,dy/m*150*dt,W); c.walk=(c.walk||0)+dt*8;
      if(m<c.r+c.tgt.r+2){ c.tgt.stun=Math.max(c.tgt.stun,2.6); c.tgt.see=0;
        pop(c.tgt.x,c.tgt.y,'MRRRP','#ffcf3d'); c.life=Math.min(c.life,.4); }
    }
  }
}

/* ============================================================================
   SENIORS — confused, in golf carts, bribeable with snacks
   ==========================================================================*/
/* He is a mall cop with a taser and a great deal of conviction. */
var TASER_BARKS=['SIR.','STOP RIGHT THERE.','SIR, THE CART.','THAT IS NOT YOURS.',
  'CODE BROWN.','I AM AUTHORISED.','SIR. SIR. SIR.','THIS IS A CITIZEN\u2019S TASE.',
  'DO NOT MAKE ME JOG.','I HAVE A RADIO.'];
var CARDIS=['#7d4aa8','#2f6da8','#a8452c','#3f7a44','#a8811f','#a34878'];
var CARTS=['#ded6c4','#cfd9e2','#e0cdd2','#cfdcc6'];
var LURE_E={candy:'🍬',catfood:'🐈',cake:'🍰'};
function lureAmmoTotal(){ var n=0; for(var k in LURES) n+=P.ammo[k]||0; return n; }
function updateSeniors(dt){
  /* How close a dropped snack has to land before he notices it. 95 was about a
     quarter of a phone screen, with nothing on screen to say so, so a throw that
     looked fine did nothing and the whole phase read as broken. */
  var wigR=(P.up.wig?300:165)*DIFF.lure;
  for(var i=W.seniors.length-1;i>=0;i--){
    var s=W.seniors[i];
    s.wob+=dt*3; if(s.say>0) s.say-=dt;
    if(s.freed) continue;

    /* Nobody may want a snack she cannot produce. makeSenior picks want from
       every lure she OWNS, but only candy and cake get restocked here -- so a
       player who bought the bazooka and ran the cat food dry got residents
       demanding cat food with no way to buy more until after the escape, and
       the phase simply never ended. If her bag is dry of what he wants, he
       changes his mind. */
    if((P.ammo[s.want]||0)<=0){
      var have=[]; for(var lk in LURES) if(P.wep[lk]&&(P.ammo[lk]||0)>0) have.push(lk);
      if(have.length&&have.indexOf(s.want)<0) s.want=pick(have);
    }

    if(s.st==='wander'){
      if(!s.wp||dist2(s.x,s.y,s.wp.x,s.wp.y)<800||s.stuck>1.6){
        s.wp={x:clamp(s.x+rnd(-280,280),70,W.w-260),y:clamp(s.y+rnd(-280,280),70,W.h-70)};
        s.stuck=0;
        if(Math.random()<.35){ s.say=2.2; s.txt=pick(CONFUSED); }
      }
      var dx=s.wp.x-s.x, dy=s.wp.y-s.y, m=Math.max(1,Math.hypot(dx,dy));
      var px=s.x,py=s.y;
      moveEnt(s,dx/m*44*dt,dy/m*44*dt,W);
      if(dist2(px,py,s.x,s.y)<1) s.stuck=(s.stuck||0)+dt; else s.stuck=0;
      s.ang=lerpAngle(s.ang,Math.atan2(dy,dx),Math.min(1,dt*4));
      /* a matching lure on the ground pulls him in */
      for(var l=0;l<W.shots.length;l++){
        var sh=W.shots[l];
        if(sh.t==='lure'&&sh.landed&&sh.kind===s.want&&dist2(s.x,s.y,sh.x,sh.y)<wigR*wigR){
          s.st='toLure'; s.lure=sh; s.say=1.6; s.txt='OOH.'; break;
        }
      }
    }
    else if(s.st==='toLure'){
      var sh2=s.lure;
      if(!sh2||sh2.dead){ s.st='wander'; s.lure=null; continue; }
      var dx2=sh2.x-s.x, dy2=sh2.y-s.y, m2=Math.max(1,Math.hypot(dx2,dy2));
      s.ang=lerpAngle(s.ang,Math.atan2(dy2,dx2),Math.min(1,dt*5));
      if(m2>16) moveEnt(s,dx2/m2*112*dt,dy2/m2*112*dt,W);
      else {
        s.eat+=dt;
        if(s.eat>.55){ sh2.dead=true; s.lure=null; s.eat=0; s.st='follow'; s.idx=P.followers.length;
          P.followers.push(s); s.say=2; s.txt=pick(FREE_LINES); SFX.good();
          pop(s.x,s.y,LURE_E[s.want],'#8ce34f'); }
      }
    }
    else if(s.st==='follow'){
      var slot=P.followers.indexOf(s);
      if(slot<0){ s.st='wander'; continue; }
      /* Short lines look nicely spaced; long ones bunch up bumper-to-bumper so the
         tail cannot trail off a phone screen behind you. */
      var gapN=Math.max(3,7-P.followers.length*0.45);
      var back=Math.floor((slot+1)*gapN);
      var t=P.trail[Math.max(0,P.trail.length-1-back)]||{x:P.x,y:P.y};
      var dx3=t.x-s.x, dy3=t.y-s.y, m3=Math.hypot(dx3,dy3);
      if(m3>6){
        s.ang=lerpAngle(s.ang,Math.atan2(dy3,dx3),Math.min(1,dt*6));
        var sp3=Math.min(m3*7,240)*dt;
        /* They are literally driving where you just drove, so they ignore hedges.
           Collision here only ever wedged them in a corner forever. */
        s.x=clamp(s.x+dx3/m3*sp3,s.r,W.w-s.r);
        s.y=clamp(s.y+dy3/m3*sp3,s.r,W.h-s.r);
        /* A phone only shows ~215 world units behind you, so nobody is allowed to
           trail off the screen where you cannot see them being tased. */
        if(m3>260){ s.x=t.x; s.y=t.y; }
      }
      /* delivered to the gate */
      if(W.goal&&inRect(s.x,s.y,W.goal)){
        s.freed=true; P.followers.splice(slot,1);
        W.left--; STATS.freed++;
        addCoins(22+ROUND*2); SFX.free();
        pop(s.x,s.y,s.name+' IS FREE','#8ce34f'); burst(s.x,s.y,'#8ce34f',14);
        toast(s.name.toUpperCase()+': '+pick(FREE_LINES),'good');
        W.seniors.splice(i,1);
        if(W.left<=0) finishPhase();
      }
    }
  }
}

/* ============================================================================
   PROJECTILES / THROWABLES
   ==========================================================================*/
var WEPS=['candy','cake','catfood','juice','bingo'];
var WEPNAME={candy:'CANDY',cake:'CAKE',catfood:'CATFOOD',juice:'JUICE',bingo:'BINGO'};
var WEPEMO={candy:'🍬',cake:'🍰',catfood:'🐈',juice:'🧃',bingo:'🎱'};
var LURES={candy:1,cake:1,catfood:1};
function ownedWeps(){ return WEPS.filter(function(w){return P.wep[w];}); }
function curWep(){ var o=ownedWeps(); return o[P.wepi%o.length]||'candy'; }
function cycleWeapon(){
  if(!P) return;
  var o=ownedWeps(); if(o.length<2) return;
  P.wepi=(P.wepi+1)%o.length; SFX.grab(); syncHud();
}
/* In Shady Pines the snack picks itself.
   Each resident wants one particular thing and holds it up in a bubble -- but the
   only way to change what you were throwing was a 380ms press-and-hold on the
   weapon button, and a tap on that button throws. So a kid stood there pelting
   candy at a man asking for cake, with the cake already in her bag, and no way to
   find out. The bubble is the instruction; the game should just honour it.
   Only ever swaps between LURES, so choosing an actual weapon still sticks. */
function lureFor(){
  if(PHASE!=='home'||!W||!W.seniors) return null;
  var best=null, bd=1e9, ax=P.aimx||1, ay=P.aimy||0;
  for(var i=0;i<W.seniors.length;i++){
    var s=W.seniors[i];
    if(s.freed||s.st==='follow') continue;
    var dx=s.x-P.x, dy=s.y-P.y, d=Math.max(1,Math.hypot(dx,dy));
    if(d>460) continue;
    var dot=(dx*ax+dy*ay)/d;          /* only ones she is roughly facing */
    if(dot<0.2) continue;
    var score=d*(1.7-dot);
    if(score<bd){ bd=score; best=s; }
  }
  if(!best) return null;
  var w=best.want;
  return (P.wep[w]&&P.ammo[w]>0)?w:null;
}
/* What the next throw will actually be. The button shows this, so it is never a
   surprise -- she sees the cake on the button before she throws the cake. */
function nextThrow(){
  var cur=curWep();
  return (LURES[cur]?lureFor():null)||cur;
}
function doThrow(){
  var w=nextThrow(); if(P.ammo[w]<=0){ toast('OUT OF '+WEPNAME[w],'bad'); beep(180,.12,'square',.1); return; }
  P.ammo[w]--; SFX.throw(); STATS.thrown++;
  var ax=P.aimx||1, ay=P.aimy||0;
  var n=(w==='candy'&&P.up.triple)?3:1;
  for(var i=0;i<n;i++){
    var sp=(n>1)?(i-1)*0.26:0;
    var vx=ax*Math.cos(sp)-ay*Math.sin(sp), vy=ax*Math.sin(sp)+ay*Math.cos(sp);
    var speed=(w==='bingo')?480:390;
    W.shots.push({t:LURES[w]?'lure':w,kind:w,
      x:P.x+vx*16,y:P.y+vy*16,vx:vx*speed,vy:vy*speed,r:9,life:(w==='bingo')?3.2:2.4,
      landed:false,bounce:(w==='bingo')?4:0,spin:rnd(-9,9),a:0});
  }
  syncHud();
}
function updateShots(dt){
  for(var i=W.shots.length-1;i>=0;i--){
    var s=W.shots[i];
    s.life-=dt; s.a+=(s.spin||0)*dt;
    if(s.dead||s.life<=0){ s.dead=true; W.shots.splice(i,1); continue; }

    if(s.foe){ /* taser bolt */
      s.x+=s.vx*dt; s.y+=s.vy*dt;
      if(hitsWall(s.x,s.y,s.r,W)){ W.shots.splice(i,1); burst(s.x,s.y,'#4bc8ff',6); continue; }
      if(dist2(s.x,s.y,P.x,P.y)<(P.r+s.r)*(P.r+s.r)){
        W.shots.splice(i,1); hurtPlayer(1,pick(['ZAP! THAT IS A LAWSUIT.','TASED IN AISLE 4.','ZAPPED. VERY RUDE.']));
        continue;
      }
      continue;
    }

    if(!s.landed){
      var nx=s.x+s.vx*dt, ny=s.y+s.vy*dt;
      var wall=hitsWall(nx,ny,s.r,W);
      if(wall){
        if(s.bounce>0){ s.bounce--;
          if(hitsWall(nx,s.y,s.r,W)) s.vx*=-1; else s.vy*=-1;
          beep(720,.05,'square',.07);
        } else { s.landed=true; s.vx=s.vy=0; }
      } else { s.x=nx; s.y=ny; }
      /* drag: candy and cat food come to rest and become bait */
      if(s.t==='lure'){ s.vx*=Math.pow(.06,dt); s.vy*=Math.pow(.06,dt);
        if(Math.hypot(s.vx,s.vy)<28){ s.landed=true; s.vx=s.vy=0; s.life=Math.max(s.life,7); } }
      if(s.t==='juice'&&Math.hypot(s.vx,s.vy)<40){
        W.puddles.push({x:s.x,y:s.y,r:52,t:9,slip:true}); s.dead=true; beep(300,.2,'sine',.1,120); continue;
      }
      /* hit an enemy */
      for(var f=0;f<W.foes.length;f++){
        var fo=W.foes[f]; if(fo.ejected) continue;
        if(dist2(s.x,s.y,fo.x,fo.y)<(fo.r+s.r+2)*(fo.r+s.r+2)){
          if(s.kind==='catfood'){
            W.cats.push({x:s.x,y:s.y,r:9,life:7,tgt:null,walk:0});
            pop(s.x,s.y,'😺','#ffcf3d');
          } else {
            fo.stun=Math.max(fo.stun,s.kind==='bingo'?2.8:1.6); fo.see=0;
            pop(fo.x,fo.y,s.kind==='bingo'?'BINGO!':'BONK','#ffcf3d');
            burst(fo.x,fo.y,'#ffcf3d',8); beep(520,.07,'square',.11);
            STATS.bonks++;
          }
          if(s.kind!=='bingo'){ s.dead=true; }
          break;
        }
      }
    } else {
      if(s.t==='juice'){ W.puddles.push({x:s.x,y:s.y,r:52,t:9,slip:true}); s.dead=true; }
      if(s.t!=='lure') s.dead=true;
    }
  }
  /* cat food that lands with nobody around still summons a cat, eventually */
  for(var p=W.puddles.length-1;p>=0;p--){
    var pd=W.puddles[p];
    if(pd.t<900){ pd.t-=dt; if(pd.t<=0){ W.puddles.splice(p,1); continue; } }
    for(var g=0;g<W.foes.length;g++){
      var fg=W.foes[g];
      if(!fg.ejected&&fg.stun<=0&&dist2(fg.x,fg.y,pd.x,pd.y)<pd.r*pd.r){
        if(Math.random()<dt*2.2){ fg.stun=Math.max(fg.stun,2.0); pop(fg.x,fg.y,'WHOOP!','#4bc8ff'); }
      }
    }
  }
}

/* ============================================================================
   GRAB / DELIVER — the actual job
   ==========================================================================*/
function nearestSpot(){
  if(PHASE!=='store') return null;
  var best=null,bd=54*54;
  for(var i=0;i<W.spots.length;i++){
    var s=W.spots[i]; if(s.cool>0) continue;
    var d=dist2(P.x,P.y,s.x,s.y);
    if(d<bd){bd=d;best=s;}
  }
  return best;
}
function atGerald(){ return PHASE==='store'&&W.goal&&inRect(P.x,P.y,W.goal); }

function doGrab(){
  if(PHASE==='store'&&atGerald()){ deliver(); return; }
  var sp=nearestSpot();
  if(sp){
    if(P.cart.length>=cartMax()){ toast('CART IS FULL','bad'); beep(180,.12,'square',.1); return; }
    P.cart.push(sp.id); sp.cool=1.1; SFX.grab(); STATS.grabbed++;
    pop(sp.x,sp.y,sp.e,'#ffcf3d'); syncHud(); renderOrder();
    return;
  }
  /* in the other phases GRAB is a shove: knock a nearby foe over */
  var best=null,bd=46*46;
  for(var i=0;i<W.foes.length;i++){ var f=W.foes[i]; if(f.ejected) continue;
    var d=dist2(P.x,P.y,f.x,f.y); if(d<bd){bd=d;best=f;} }
  if(best){ best.stun=Math.max(best.stun,1.0); best.see=0; pop(best.x,best.y,'SHOVE!','#ffcf3d');
    burst(best.x,best.y,'#ff5c8a',8); beep(300,.09,'square',.12); STATS.bonks++; return; }
  beep(200,.06,'sine',.06);
}
function dropSlot(i){
  if(!P||!P.cart||i<0||i>=P.cart.length) return;
  var id=P.cart.splice(i,1)[0];
  var it=ITEM[id];
  if(it){ pop(P.x,P.y-20,it.e,'#a99cc9'); }
  beep(260,.07,'sine',.09); syncHud(); renderOrder();
}

/* One tap bins the most useless thing you are carrying — the thing Gerald did not
   ask for. Tapping individual slots was a trap: they sat right under your moving thumb. */
function dropSmart(){
  if(!P.cart.length){ beep(200,.06,'sine',.06); return; }
  var need={};
  if(ORDER) for(var j=0;j<ORDER.items.length;j++) if(!ORDER.got[j]) need[ORDER.items[j]]=(need[ORDER.items[j]]||0)+1;
  for(var i=P.cart.length-1;i>=0;i--){
    var id=P.cart[i];
    if(need[id]>0){ need[id]--; continue; }
    dropSlot(i); return;                 /* junk first */
  }
  dropSlot(P.cart.length-1);             /* it is all wanted, so drop the newest */
}

function deliver(){
  if(!ORDER) return;
  if(!P.cart.length){ geraldSays(pick(HURRY_LINES)); beep(200,.08,'sine',.07); return; }
  var right=0, wrong=0;
  for(var i=P.cart.length-1;i>=0;i--){
    var id=P.cart[i], used=false;
    for(var j=0;j<ORDER.items.length;j++){
      if(!ORDER.got[j]&&ORDER.items[j]===id){ ORDER.got[j]=true; used=true; break; }
    }
    if(used){ right++; P.cart.splice(i,1); }
    else wrong++;
  }
  if(right){
    addCoins(9*right); SFX.coin(); STATS.right+=right;
    pop(W.gerald.x,W.gerald.y-46,'+'+(9*right),'#ffcf3d');
  }
  if(wrong){
    STATS.wrong+=wrong;
    W.gerald.mad=.9; W.gerald.swing=SWING_T; SFX.cane(); shake(14); flash(.45,'#ff4d5e');
    pop(P.x,P.y-24,'WHACK!','#ff4d5e');
    geraldSays(pick(CANE_LINES));
    /* the cane only lands once per delivery, however wrong you were */
    hurtPlayer(1,null);
    /* and he throws the bad items back at you */
    for(var k=P.cart.length-1;k>=0;k--){
      var bid=P.cart[k];
      W.parts.push({x:W.gerald.x,y:W.gerald.y-20,vx:rnd(90,240),vy:rnd(-320,-160),
        g:820,life:1.6,txt:(ITEM[bid]?ITEM[bid].e:'?'),sz:20,a:rnd(0,TAU),sp:rnd(-8,8)});
    }
    P.cart.length=0;
  }
  var done=ORDER.got.every(function(g){return g;});
  if(done){
    var bonus=Math.round(18+ROUND*4+PATIENCE/PATMAX*26);
    addCoins(bonus); STATS.orders++;
    geraldDance();
    geraldSays(pick(PRAISE_LINES));
    toast('ORDER COMPLETE  +'+bonus,'gold');
    W.left--;
    var g=GEN;
    if(W.left<=0){ setTimeout(function(){ if(g===GEN) finishPhase(); },900); ORDER=null; renderOrder(); }
    else setTimeout(function(){ if(g===GEN&&SCENE==='play'&&PHASE==='store') newOrder(); },900);
  } else if(right&&!wrong){
    geraldSays('Some of it. SOME of it. Keep going.');
  }
  syncHud(); renderOrder();
}
function geraldSays(t){ W.gerald.say=3.0; W.gerald.txt=t; }
/* The good bit: he abandons the walker entirely and gets down. */
function geraldDance(){
  W.gerald.dance=3.4; W.gerald.mad=0;
  SFX.good();
  var seq=[0,90,180,270,360,450];
  for(var i=0;i<seq.length;i++){
    (function(ms,i2){ setTimeout(function(){
      if(!AU.on) return;
      beep([523,659,784,659,880,1046][i2],.1,'square',.13);
    },ms); })(seq[i],i);
  }
  for(var c=0;c<26;c++){
    W.parts.push({x:W.gerald.x+rnd(-24,24),y:W.gerald.y-40,vx:rnd(-220,220),vy:rnd(-420,-180),
      g:760,life:rnd(1.1,2.0),col:pick(['#ffcf3d','#ff5c8a','#8ce34f','#4bc8ff','#a78bfa']),
      sz:rnd(4,9),a:rnd(0,TAU),sp:rnd(-12,12)});
  }
}

/* ============================================================================
   HAZARDS (escape corridor)
   ==========================================================================*/
function updateHazards(dt){
  for(var i=0;i<W.hazards.length;i++){
    var h=W.hazards[i];
    if(h.t==='cart'){
      h.y+=h.vy*dt;
      if(h.y<60||h.y>W.h-60) h.vy*=-1;
      if(dist2(h.x,h.y,P.x,P.y)<(h.r+P.r)*(h.r+P.r)) hurtPlayer(1,'RUNAWAY CART. CLASSIC.');
    }
    else if(h.t==='jet'){
      h.ph+=dt; var c=(h.ph%h.per)/h.per;
      h.on=c>.55; h.warn=c>.40&&c<=.55;
      if(h.on&&Math.abs(P.x-h.x)<26) hurtPlayer(1,'SPRINKLERS. IN A HALLWAY. SURE.');
    }
    else if(h.t==='cannon'){
      h.cd-=dt;
      if(h.cd<=0){ h.cd=h.per;
        var a=Math.atan2(P.y-h.y,P.x-h.x)+rnd(-.28,.28);
        W.shots.push({t:'taser',x:h.x,y:h.y,vx:Math.cos(a)*280,vy:Math.sin(a)*280,r:8,life:3,foe:true,ball:true});
        beep(420,.07,'square',.08);
      }
    }
  }
}

function finishPhase(){
  if(SCENE!=='play'||W.done) return;
  W.done=true;
  if(PHASE==='store'){ brief('home'); }
  else if(PHASE==='home'){ brief('escape'); }
  else { ROUND++; STATS.rounds=Math.max(STATS.rounds,ROUND-1);

         openShop(); }
}

var CAM={x:0,y:0,sc:1,shake:0,flash:0,flashCol:'#fff'};
function shake(n){ CAM.shake=Math.min(26,CAM.shake+n); }
function flash(a,c){ CAM.flash=Math.max(CAM.flash,a); CAM.flashCol=c||'#ffffff'; }
function burst(x,y,col,n){
  for(var i=0;i<n;i++){
    var a=rnd(0,TAU), s=rnd(70,290);
    W.parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:280,life:rnd(.3,.75),
      col:col,sz:rnd(2.5,6),a:0,sp:0});
  }
}
function pop(x,y,txt,col){
  W.parts.push({x:x,y:y,vx:rnd(-24,24),vy:-96,g:120,life:1.0,txt:txt,col:col||'#fff',sz:15,a:0,sp:0,ui:true});
}
function updateParts(dt){
  for(var i=W.parts.length-1;i>=0;i--){
    var p=W.parts[i]; p.life-=dt;
    if(p.life<=0){ W.parts.splice(i,1); continue; }
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=(p.g||0)*dt; p.a+=(p.sp||0)*dt;
    p.vx*=Math.pow(.35,dt);
  }
}
function rr(c,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  c.beginPath();
  c.moveTo(x+r,y); c.lineTo(x+w-r,y); c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r); c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  c.lineTo(x+r,y+h); c.quadraticCurveTo(x,y+h,x,y+h-r);
  c.lineTo(x,y+r); c.quadraticCurveTo(x,y,x+r,y); c.closePath();
}
function em(c,ch,x,y,size){
  c.font=size+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  c.textAlign='center'; c.textBaseline='middle';
  c.fillText(ch,x,y);
}

/* ============================================================================
   RENDER
   ==========================================================================*/
function viewScale(){
  return clamp(Math.min(CW/430,CH/500),0.78,2.2);
}
function updateCamera(dt){
  CAM.sc=viewScale();
  var vw=CW/CAM.sc, vh=CH/CAM.sc;
  var tx=P.x-vw/2, ty=P.y-vh/2;
  if(W.w<vw) tx=(W.w-vw)/2; else tx=clamp(tx,0,W.w-vw);
  if(W.h<vh) ty=(W.h-vh)/2; else ty=clamp(ty,0,W.h-vh);
  var k=Math.min(1,dt*9);
  CAM.x=lerp(CAM.x,tx,k); CAM.y=lerp(CAM.y,ty,k);
  if(CAM.shake>0) CAM.shake=Math.max(0,CAM.shake-dt*46);
  if(CAM.flash>0) CAM.flash=Math.max(0,CAM.flash-dt*2.2);
}

function drawFloor(){
  var bg = PHASE==='store'?'#f0e7d6' : (PHASE==='home'?'#cfe6bb':'#e2dcef');
  var ln = PHASE==='store'?'#e2d6bf' : (PHASE==='home'?'#bcd9a6':'#d0c8e2');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W.w,W.h);
  ctx.strokeStyle=ln; ctx.lineWidth=2;
  var g=PHASE==='home'?90:64;
  var x0=Math.floor(CAM.x/g)*g, y0=Math.floor(CAM.y/g)*g;
  var vw=CW/CAM.sc+g, vh=CH/CAM.sc+g;
  ctx.beginPath();
  for(var x=x0;x<x0+vw;x+=g){ ctx.moveTo(x,CAM.y-g); ctx.lineTo(x,CAM.y+vh); }
  for(var y=y0;y<y0+vh;y+=g){ ctx.moveTo(CAM.x-g,y); ctx.lineTo(CAM.x+vw,y); }
  ctx.stroke();
}
function drawGoal(){
  if(!W.goal) return;
  var g=W.goal, t=W.time;
  ctx.save();
  var pulse=.18+Math.sin(t*3)*.07;
  if(PHASE==='store'){
    ctx.fillStyle='rgba(255,207,61,'+pulse+')'; ctx.fillRect(g.x,g.y,g.w,g.h);
    ctx.strokeStyle='#ffcf3d'; ctx.lineWidth=3; ctx.setLineDash([12,8]);
    ctx.strokeRect(g.x,g.y,g.w,g.h); ctx.setLineDash([]);

function drawWalls(){
  for(var i=0;i<W.walls.length;i++){
    var w=W.walls[i];

      ctx.fillStyle='#5f9a45'; rr(ctx,w.x,w.y,w.w,w.h,10); ctx.fill();

      ctx.fillStyle='#7d6ea8'; rr(ctx,w.x,w.y,w.w,w.h,6); ctx.fill();
      ctx.fillStyle='rgba(0,0,0,.12)'; rr(ctx,w.x+5,w.y+5,w.w-10,w.h-10,4); ctx.fill();
    }
  }
}
/* Decor is painted over the wall boxes, so the fountain stops looking like a hedge. */
function drawDecor(){
  for(var i=0;i<W.decor.length;i++){
    var d=W.decor[i];
    if(d.t==='sign'){
      ctx.fillStyle='rgba(20,16,31,.85)'; rr(ctx,d.x-132,d.y-21,264,42,12); ctx.fill();
      ctx.strokeStyle='#ffcf3d'; ctx.lineWidth=2.5; rr(ctx,d.x-132,d.y-21,264,42,12); ctx.stroke();
      ctx.fillStyle='#ffcf3d'; ctx.font='700 21px "Luckiest Guy",Fredoka,sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(d.txt,d.x,d.y+1);
    } else if(d.t==='fountain'){
      ctx.fillStyle='#9aa3c0'; ctx.beginPath(); ctx.arc(d.x,d.y,d.r,0,TAU); ctx.fill();
      ctx.fillStyle='#6fc8ef'; ctx.beginPath(); ctx.arc(d.x,d.y,d.r-9,0,TAU); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.55)';
      for(var j=0;j<6;j++){
        var a=W.time*1.6+j*TAU/6, rr2=(d.r-16)*(0.45+0.4*Math.abs(Math.sin(W.time*2+j)));
        ctx.beginPath(); ctx.arc(d.x+Math.cos(a)*rr2,d.y+Math.sin(a)*rr2,3.4,0,TAU); ctx.fill();
      }
    } else if(d.t==='bldg'){
      var r=d.r;
      ctx.fillStyle='#c9b79a'; rr(ctx,r.x,r.y,r.w,r.h,8); ctx.fill();
      ctx.fillStyle='#8d7a5e'; rr(ctx,r.x,r.y,r.w,26,8); ctx.fill();
      ctx.fillStyle='#6fc8ef';
      for(var wy=r.y+44;wy<r.y+r.h-30;wy+=58)
        for(var wx=r.x+22;wx<r.x+r.w-30;wx+=52){ rr(ctx,wx,wy,30,34,4); ctx.fill(); }
      ctx.fillStyle='#fff4e6'; ctx.font='700 12px Fredoka,sans-serif'; ctx.textAlign='center';
      ctx.fillText('SHADY PINES',r.x+r.w/2,r.y+17);
    }
  }
}
function drawSpots(){
  var need={};
  if(ORDER) for(var i=0;i<ORDER.items.length;i++) if(!ORDER.got[i]) need[ORDER.items[i]]=true;
  for(var s=0;s<W.spots.length;s++){
    var sp=W.spots[s];
    if(sp.x<CAM.x-60||sp.x>CAM.x+CW/CAM.sc+60||sp.y<CAM.y-60||sp.y>CAM.y+CH/CAM.sc+60) continue;
    if(sp.cool>0){ ctx.globalAlpha=.25; }
    var wanted=need[sp.id];
    if(wanted){
      var pu=.5+Math.sin(W.time*5+s)*.5;
      ctx.fillStyle='rgba(255,207,61,'+(.22+pu*.24)+')';
      ctx.beginPath(); ctx.arc(sp.x,sp.y,20+pu*4,0,TAU); ctx.fill();
    }
    ctx.fillStyle='rgba(255,255,255,.75)';
    rr(ctx,sp.x-13,sp.y-13,26,26,7); ctx.fill();
    ctx.strokeStyle=wanted?'#ffcf3d':'rgba(90,70,140,.35)'; ctx.lineWidth=wanted?2.5:1.5;
    rr(ctx,sp.x-13,sp.y-13,26,26,7); ctx.stroke();
    em(ctx,sp.e,sp.x,sp.y+1,19);
    ctx.globalAlpha=1;
  }
}
function drawBoxes(){
  for(var i=0;i<W.boxes.length;i++){
    var b=W.boxes[i]; if(b.open) continue;
    var bob=Math.sin(W.time*3+i)*3;
    ctx.fillStyle='rgba(0,0,0,.16)'; ctx.beginPath(); ctx.ellipse(b.x,b.y+16,15,6,0,0,TAU); ctx.fill();
    em(ctx,'📦',b.x,b.y+bob,32);
    ctx.fillStyle='rgba(255,207,61,'+(.2+Math.sin(W.time*4+i)*.14)+')';
    ctx.beginPath(); ctx.arc(b.x,b.y+bob,26,0,TAU); ctx.fill();
  }
}
function drawPickups(){

    if(k.t==='coin'){

      ctx.fillStyle='#ffcf3d'; ctx.beginPath(); ctx.arc(k.x,k.y+bob,8,0,TAU); ctx.fill();
      ctx.fillStyle='#c99a00'; ctx.beginPath(); ctx.arc(k.x,k.y+bob,4.6,0,TAU); ctx.fill();

function drawPuddles(){

    ctx.beginPath(); ctx.ellipse(p.x,p.y,p.r,p.r*.62,0,0,TAU); ctx.fill();
    ctx.strokeStyle='rgba(80,160,255,'+(.5*a)+')'; ctx.lineWidth=2;

  }
